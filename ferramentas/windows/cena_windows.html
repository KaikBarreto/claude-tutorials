     de verdade do EcoTray (PNGs do capturar_ecotray.py). Tudo é função do tempo: window.setup(cfg) e window.R(t).
     O cursor NÃO é desenhado aqui (é o cursor da skill, desenhado na edição a partir da telemetria exportada). -->

  #sino { padding: 0 10px; }
  #mostrar { width: 8px; height: 40px; border-left: 1px solid rgba(0,0,0,.18); margin-left: 4px; }

  /* ícones ocultos (^), menu da bandeja (nativo do Windows 11, tema claro) e dica */
  #ocultos { padding: 8px; background: rgba(243,244,247,.94); border-radius: 8px; backdrop-filter: blur(28px);
             box-shadow: 0 0 0 1px rgba(0,0,0,.10), 0 8px 24px rgba(0,0,0,.20); display: grid; grid-template-columns: repeat(4, 40px); gap: 0; }
  #ocultos .bj { width: 40px; height: 40px; }
  #menu { background: #f9f9f9; border-radius: 8px; padding: 4px 0; font-size: 12px; min-width: 210px;

  #menu .mi.padrao { font-weight: 700; }
  #menu .mi.inativo { color: #8b8b8b; }

          box-shadow: 0 0 0 1px rgba(0,0,0,.12), 0 4px 10px rgba(0,0,0,.14); white-space: nowrap; }
  /* empilhamento: janelas do programa (100+, topmost) < balão/SmartScreen < barra de tarefas < menus e dica */
  #down, #down-menu, #smart { z-index: 950; }

  #mira { width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 7px; border: 2px solid #ff2d55; background: rgba(255,45,85,.25); }
</style>

<body>
<div id="tela"></div>
<script>
'use strict';
// ───────────────────────────── ícones (traço simples, genéricos) ─────────────────────────────
const P = {

const ic = (n, px, cor, sw) => `<svg width="${px}" height="${px}" viewBox="0 0 24 24" fill="none" stroke="${cor || 'currentColor'}" stroke-width="${sw || 1.6}" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
// ícones coloridos da barra de tarefas (genéricos: pasta e globo, sem marca de ninguém)
const IC_INICIAR = `<svg width="22" height="22" viewBox="0 0 22 22">${[0, 1, 2].map(i => [0, 1, 2].map(j => `<circle cx="${4 + j * 7}" cy="${4 + i * 7}" r="2.5" fill="#2f6fd6"/>`).join('')).join('')}</svg>`;
const IC_PASTA = `<svg width="24" height="24" viewBox="0 0 24 24"><path d="M2.5 6.2c0-.9.7-1.7 1.7-1.7h5.1l2.1 2.2h8.4c.9 0 1.7.8 1.7 1.7v9.4c0 .9-.8 1.7-1.7 1.7H4.2c-1 0-1.7-.8-1.7-1.7z" fill="#e8a93a"/><path d="M2.5 9.2h19v8.6c0 .9-.8 1.7-1.7 1.7H4.2c-1 0-1.7-.8-1.7-1.7z" fill="#f6c552"/></svg>`;
const IC_GLOBO = `<svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="#2f7be6"/><path d="M2.6 12h18.8M12 2.5c2.6 2.8 3.9 6 3.9 9.5S14.6 18.7 12 21.5M12 2.5C9.4 5.3 8.1 8.5 8.1 12s1.3 6.7 3.9 9.5" stroke="#dbeaff" stroke-width="1.3" fill="none"/></svg>`;

// ───────────────────────────── utilidades ─────────────────────────────
const $ = s => document.querySelector(s);
const el = (html, pai) => { const t = document.createElement('template'); t.innerHTML = html.trim(); const n = [...t.content.childNodes]; n.forEach(x => (pai || TELA).appendChild(x)); return n[0]; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const suave = u => { u = clamp(u, 0, 1); return u * u * u * (u * (u * 6 - 15) + 10); }; // mínimo solavanco (5ª ordem)
const fade = (t, t0, d) => clamp((t - t0) / d, 0, 1);
let TELA, CFG, SPEC, Q, W, H, DSF, EV = [], INI, SEG = [], CLIQUES = [], ARRASTOS = [], ACOES = [], ROBO = null;

// ───────────────────────────── estado ─────────────────────────────
function estadoInicial() {
  const n = SPEC.navegador || {};
  const b = SPEC.bandeja || {};
  return {
    nav: { visivel: n.visivel !== false, modo: n.modo || 'maximizado', rect: n.rect || null, url: n.url || 'ecosistematecnologia.com.br',
           aba: n.aba || 'EcoSistema | Sistema para Reciclagens', downIcone: false, desde: -9 },

    jan: {},  // janelas do programa por "vaga" (painel, instalador, config, dialogo, lista...): {q, desde, pos, arr}

    menu: { vis: false, x: 0, y: 0, desde: -9 }, ocultos: { vis: false, desde: -9 }, dica: { vis: false, texto: '', alvo: '', desde: -9 },
    smart: { estado: null, desde: -9 }, down: { estado: null, desde: -9, pct: 0, aberto: false },

}
const ESTADOS_DOWN = ['baixando', 'aviso', 'opcoes', 'concluido'];
function aplicaPasso(s, p, t) {
  const o = p.o || p.do;
  switch (p.do) {
    case 'painel': case 'instalador': case 'janela': {  // troca a captura mostrada na vaga (null = a janela some)
      const v = p.do === 'janela' ? (p.slot || p.janela || 'janela') : p.do, a = s.jan[v] || { q: null, desde: -9, pos: null, arr: null };
      s.jan[v] = p.quadro ? { ...a, q: p.quadro, desde: a.q ? a.desde : t, pos: p.pos || a.pos } : { ...a, q: null, desde: t };
      break;
    }
    case 'arrastar': {  // a janela vai até "para" (canto de cima à esquerda) em "dur" s, presa ao cursor
      const v = p.janela || 'painel', a = s.jan[v]; if (!a || !a.q) break;
      const de = posJanela(a, t, s.jan), dur = p.dur || 0.9;
      s.jan[v] = { ...a, pos: p.para.slice(), arr: { t0: t, t1: t + dur, de, para: p.para.slice() } };
      break;
    }
    case 'bandeja': if ('icone' in p) s.bandeja.q = p.icone; if ('fixado' in p) s.bandeja.fixado = !!p.fixado; break;
    case 'campo': s.campos[p.id] = String(p.texto); break;
    case 'navegador': Object.assign(s.nav, Object.fromEntries(Object.entries(p).filter(([k]) => !['at', 'do'].includes(k)))); break;
    case 'smartscreen': s.smart = { estado: p.estado || null, desde: s.smart.estado && p.estado ? s.smart.desde : t }; break;
    case 'download': s.down = { ...s.down, estado: p.estado || null, desde: s.down.estado && p.estado ? s.down.desde : t,

  const passos = (SPEC.passos || []).map((p, i) => ({ ...p, i })).sort((a, b) => a.at - b.at || a.i - b.i);
  let pos = (SPEC.cursor || {}).inicio || [W * 0.42, H * 0.5], livre = 0; const r = rng(SPEC.semente || 7);
  for (const p of passos) {
    if (p.do === 'arrastar') {  // pega a janela pelo alvo (padrão: o meio do topo dela), arrasta junto e solta
      if (ROBO) { const q = posRobo(p.at - 0.9); if (q) pos = q; }
      irPara(p.at - 0.001); const v = p.janela || 'painel', j = CUR_JAN[v];
      if (!j || !j.q) { ERROS.push(`arrastar: a janela "${v}" não está aberta em ${p.at} s`); continue; }
      const de = posJanela(j, p.at), q = Q[j.q], top = q.tipo === 'toplevel';
      const a = p.alvo ? alvoRectAtual(p.alvo) : [de[0] + q.janela[2] * 0.3, de[1] + (top ? 8 : 12), 2, 2, 'arrow'];
      if (!a) { ERROS.push(`alvo não achado: ${p.alvo} (passo em ${p.at} s)`); continue; }
      const g = [a[0] + a[2] / 2, a[1] + a[3] / 2], dur = p.dur || 0.9, d = Math.hypot(g[0] - pos[0], g[1] - pos[1]);
      const ida = clamp(0.38 + d / 2600, 0.38, 1.05), t0 = Math.max(livre, p.at - 0.12 - ida);
      if (d > 0.5) SEG.push({ t0, t1: p.at - 0.12, p0: pos.slice(), p1: g, curva: (r() - 0.5) * 0.16 * d, tipo: 'arrow' });
      const fim = [g[0] + p.para[0] - de[0], g[1] + p.para[1] - de[1]];
      SEG.push({ t0: p.at, t1: p.at + dur, p0: g, p1: fim, curva: 0, tipo: 'arrow' });
      ARRASTOS.push({ td: p.at, tu: p.at + dur, p0: g, p1: fim });
      if (p.label) ACOES.push({ i: ACOES.length, do: 'drag', label: p.label, at: p.at, tStart: t0, tEnd: p.at + dur + 0.2, tAct: p.at,
                                rect: [Math.min(g[0], fim[0]) - 4, Math.min(g[1], fim[1]) - 4, Math.abs(fim[0] - g[0]) + 8, Math.abs(fim[1] - g[1]) + 8], point: fim, ok: true });
      pos = fim; livre = p.at + dur + 0.05; continue;
    }
    if (!['mover', 'clicar', 'duplo'].includes(p.do)) continue;
    if (ROBO) { const q = posRobo(p.at - (p.dur || 0.7) - 0.2); if (q) pos = q; }
    irPara(p.at - 0.001);
    const a = alvoRectAtual(p.alvo);
    if (!a) { console.warn(`alvo não achado: ${p.alvo} em ${p.at}s`); ERROS.push(`alvo não achado: ${p.alvo} (passo em ${p.at} s)`); continue; }
    const f = p.ponto || [0.5, 0.5], alvo = [a[0] + a[2] * f[0], a[1] + a[3] * f[1]];
    const pousa = p.do === 'mover' ? p.at : p.at - (p.do === 'duplo' ? 0.42 : 0.16);
    const dist = Math.hypot(alvo[0] - pos[0], alvo[1] - pos[1]);
    const dur = p.dur || clamp(0.38 + dist / 2600, 0.38, 1.05);
    const t0 = Math.max(livre, pousa - dur);
    if (dist > 0.5) SEG.push({ t0, t1: Math.max(t0 + 0.05, pousa), p0: pos.slice(), p1: alvo, curva: (r() - 0.5) * 0.16 * dist, tipo: a[4] || 'arrow' });
    if (p.do !== 'mover') {
      const bot = p.botao === 'direito' ? 2 : 0;
      const ups = p.do === 'duplo' ? [p.at - 0.2, p.at] : [p.at];
      for (const tu of ups) CLIQUES.push({ td: tu - 0.08, tu, x: alvo[0], y: alvo[1], botao: bot, rect: a.slice(0, 4), alvo: p.alvo });
      // o menu da bandeja abre onde o botão soltou (pystray: TPM_RIGHTALIGN | TPM_BOTTOMALIGN no ponto do cursor)
      for (const e of EV) if (e.p.do === 'mostrar' && e.p.o === 'menu' && e.p.x == null && e.t >= p.at - 1e-6 && e.t <= p.at + 1.5) { e.p.x = alvo[0]; e.p.y = alvo[1]; }
    }
    if (p.label) ACOES.push({ i: ACOES.length, do: p.do === 'mover' ? 'move' : (p.do === 'duplo' ? 'dblclick' : 'click'), label: p.label, at: p.at,
                              tStart: t0, tEnd: p.at + 0.3, tAct: p.at, rect: a.slice(0, 4), point: alvo, ok: true, alvo: p.alvo });

}
function curvaPonto(s, u) {
  const e = suave(u), dx = s.p1[0] - s.p0[0], dy = s.p1[1] - s.p0[1], L = Math.hypot(dx, dy) || 1, nx = -dy / L, ny = dx / L;
  const b = 4 * e * (1 - e) * s.curva; // desvio lateral máximo no meio do caminho
  return [s.p0[0] + dx * e + nx * b, s.p0[1] + dy * e + ny * b];
}
function cursorEm(t) {
  let pos = (SPEC.cursor || {}).inicio || [W * 0.42, H * 0.5], tipo = 'arrow';
  for (const s of SEG) {
    if (t < s.t0) break;
    if (t <= s.t1) { pos = curvaPonto(s, (t - s.t0) / (s.t1 - s.t0)); tipo = (t - s.t0) / (s.t1 - s.t0) > 0.85 ? s.tipo : 'arrow'; return { pos, tipo, mov: true }; }
    pos = s.p1; tipo = s.tipo;
  }
  if (ROBO) { const q = posRobo(t, true); if (q) return { pos: q, tipo: 'arrow', mov: false, robo: true }; }
  return { pos, tipo, mov: false };
}

// ───────────────────────────── gravação do robô na área da página ─────────────────────────────
// Mapeia a telemetria/ações do robô (px do vídeo dele) para a tela da cena (px CSS): x = página.x + x/dsf * escala.
function mapaRobo() {
  const g = SPEC.navegador.pagina.gravacao; const p = $('#pagina').getBoundingClientRect();
  const vw = CFG.gravacao.viewport[0], esc = p.width / vw;
  return { de: g.de || 0, ini: g.inicio || 0, ate: g.ate ?? 1e9, dsf: CFG.gravacao.dsf, esc, x0: p.left, y0: p.top };
}
function posRobo(t, soDentro) {
  if (!ROBO || !CFG.gravacao.amostras) return null; const M = ROBO;
  const tr = t - M.de + M.ini; if (soDentro && (t < M.de || tr > M.ate)) return null;
  const A = CFG.gravacao.amostras; let q = null;
  for (const s of A) { if (s.t > tr) break; if (s.x != null && !(s.x === 0 && s.y === 0)) q = s; }
  return q ? [M.x0 + q.x / M.dsf * M.esc, M.y0 + q.y / M.dsf * M.esc] : null;
}

// ───────────────────────────── API para o renderizador ─────────────────────────────
let ERROS = [];
window.setup = async (cfg) => {
  CFG = cfg; SPEC = cfg.spec; Q = cfg.quadros; [W, H] = SPEC.tela || cfg.tela || [1920, 1200]; DSF = cfg.dsf;
  if (cfg.fonte_ui) { const f = new FontFace('UI', `url(${cfg.fonte_ui})`, { weight: '100 900' }); document.fonts.add(await f.load()); }
  for (const [fam, url, peso] of cfg.fontes_extra || []) { const f = new FontFace(fam, `url(${url})`, { weight: String(peso) }); document.fonts.add(await f.load()); }
  TELA = $('#tela'); Object.assign(TELA.style, { width: W + 'px', height: H + 'px' });
  if (cfg.pagina_img) { const im = new Image(); im.src = cfg.pagina_img; await im.decode(); CFG.pagina_img_w = im.naturalWidth; CFG.pagina_img_h = im.naturalHeight; }
  INI = estadoInicial();
  EV = (SPEC.passos || []).map((p, i) => ({ t: p.at + (p.atraso || 0), p, i })).flatMap(e => {
    const out = [e];
    const extra = (k, mostrar) => [].concat(e.p[k] || []).forEach(x => out.push({ t: e.t + (x.atraso ?? 0.06), p: typeof x === 'string' ? { do: mostrar ? 'mostrar' : 'esconder', o: x } : { do: mostrar ? 'mostrar' : 'esconder', ...x }, i: e.i + 0.5 }));
    extra('mostra', true); extra('esconde', false);
    if (e.p.do === 'sequencia') return (e.p.quadros || []).map(([dt, q], k) => ({ t: e.t + dt, p: { do: 'janela', slot: e.p.janela || 'painel', quadro: q }, i: e.i + k / 100 }));
    if (e.p.do === 'campos') return (e.p.valores || []).map(([dt, v], k) => ({ t: e.t + dt, p: { do: 'campo', id: e.p.id, texto: v }, i: e.i + k / 100 }));
    return out;
  }).sort((a, b) => a.t - b.t || a.i - b.i);
  montar();
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  if (SPEC.navegador && SPEC.navegador.pagina && SPEC.navegador.pagina.gravacao) {
    irPara(0); ROBO = mapaRobo();
    const g = $('#grav'); g.style.width = (CFG.gravacao.viewport[0] * ROBO.esc) + 'px'; g.style.height = (CFG.gravacao.viewport[1] * ROBO.esc) + 'px';
  }
  planejarCursor();
  return { erros: ERROS, dur: SPEC.duracao };
};

window.R = (t) => {
  const s = irPara(t); const c = cursorEm(t);
  // hover e pressionado: elementos marcados com data-hv sob o cursor
  for (const e of document.querySelectorAll('[data-hv]')) {
    const v = visivel(e); if (!v) { e.classList.remove('hv-on', 'pressed'); continue; }
    const r = e.getBoundingClientRect(); const dentro = c.pos[0] >= r.left && c.pos[0] <= r.right && c.pos[1] >= r.top && c.pos[1] <= r.bottom;
    e.classList.toggle('hv-on', dentro);
    e.classList.toggle('pressed', dentro && CLIQUES.some(k => t >= k.td && t <= k.tu + 0.05));
  }
  const mira = $('#mira'); mostra(mira, !!CFG.mira); if (CFG.mira) Object.assign(mira.style, { left: c.pos[0] + 'px', top: c.pos[1] + 'px' });
  let quadroGrav = null;
  if (ROBO && t >= ROBO.de - 1e-6) quadroGrav = Math.max(0, Math.round((Math.min(t - ROBO.de + ROBO.ini, ROBO.ate)) * (CFG.gravacao.fps || 30)));
  else if (ROBO) quadroGrav = Math.round(ROBO.ini * (CFG.gravacao.fps || 30));
  return { quadroGrav };
};

window.exportar = (fps) => {
  // telemetria no formato do robô (rec/README.md), em px do vídeo (CSS x dsf)
  const k = DSF, S = [], passo = 1 / 60;
  const r4 = v => Math.round(v * 1000) / 1000, px = v => Math.round(v * k * 10) / 10;
  for (const s of SEG) for (let t = s.t0; t <= s.t1 + 1e-9; t += passo) { const c = cursorEm(t); S.push({ t: r4(t), x: px(c.pos[0]), y: px(c.pos[1]), type: 'move', cursor: c.tipo }); }
  const rect = a => ({ x: px(a[0]), y: px(a[1]), w: px(a[2]), h: px(a[3]) });
  for (const c of CLIQUES) {
    const tgt = { tag: 'cena', text: c.alvo };
    S.push({ t: r4(c.td), x: px(c.x), y: px(c.y), type: 'down', button: c.botao, rect: rect(c.rect), target: tgt });
    S.push({ t: r4(c.tu), x: px(c.x), y: px(c.y), type: 'up', button: c.botao, rect: rect(c.rect), target: tgt });
    S.push({ t: r4(c.tu), x: px(c.x), y: px(c.y), type: 'click', button: c.botao, rect: rect(c.rect), target: tgt });
  }
  for (const d of ARRASTOS) {  // arrastar: botão preso do começo ao fim, sem "click" (sem anel nem quique)
    S.push({ t: r4(d.td), x: px(d.p0[0]), y: px(d.p0[1]), type: 'down', button: 0 });
    S.push({ t: r4(d.tu), x: px(d.p1[0]), y: px(d.p1[1]), type: 'up', button: 0 });
  }
  const A = ACOES.map(a => ({ ...a, rect: rect(a.rect), point: { x: px(a.point[0]), y: px(a.point[1]) } }));
  // gravação do robô: as amostras e ações dele, deslocadas no tempo e na tela
  if (ROBO) {
    const M = ROBO, mx = x => (M.x0 + x / M.dsf * M.esc) * k, my = y => (M.y0 + y / M.dsf * M.esc) * k, ms = v => v / M.dsf * M.esc * k;
    const dt = M.de - M.ini, dentro = t => t >= M.ini && t <= M.ate;
    for (const s of CFG.gravacao.amostras || []) {
      if (!dentro(s.t)) continue; const n = { ...s, t: r4(s.t + dt) };
      if (s.x != null && !(s.x === 0 && s.y === 0)) { n.x = Math.round(mx(s.x) * 10) / 10; n.y = Math.round(my(s.y) * 10) / 10; }
      if (s.rect) n.rect = { x: mx(s.rect.x), y: my(s.rect.y), w: ms(s.rect.w), h: ms(s.rect.h) };
      S.push(n);
    }
    for (const a of CFG.gravacao.acoes || []) {
      if (!dentro(a.tAct ?? a.tStart ?? 0)) continue;
      const n = { ...a, i: A.length, origem: 'robo' }; for (const kk of ['at', 'tStart', 'tEnd', 'tAct']) if (a[kk] != null) n[kk] = r4(a[kk] + dt);
      if (a.rect) n.rect = { x: mx(a.rect.x), y: my(a.rect.y), w: ms(a.rect.w), h: ms(a.rect.h) };
      if (a.point) n.point = { x: mx(a.point.x), y: my(a.point.y) };
      A.push(n);
    }
  }
  S.sort((a, b) => a.t - b.t);
  return { samples: S, actions: A, erros: ERROS };
};
