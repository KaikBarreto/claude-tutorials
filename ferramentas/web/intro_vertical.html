<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Vinheta vertical</title>
<!-- Vinheta de abertura e cartela do formato vertical 9:16 (1080x1920): a mesma identidade, o mesmo som e a mesma duração
     do web/intro.html (16:9, congelado), recompostos na vertical. É página nova: o intro.html não foi tocado.
     Estilo "dominex-capacete" (perfil Domiflix): as 3 peças do capacete se encaixam, brilho metálico, o capacete sobe e o
     DOMINEX sai de trás dele PARA BAIXO (no 16:9 sai para a direita); depois o logo da série (todo branco, quando vem em
     ?serie_logo=; senão o rótulo "▶ SÉRIE" do 16:9), o fio e o título, tudo empilhado e centrado em x=540.
     A linha do tempo T e os CUES são os do intro.html, número por número (o som sai idêntico bit a bit:
     testes/vertical_9x16.sh confere). Geometria (px do vídeo, Kaik 31/10): capacete y 520 a 830, DOMINEX y 880, logo da
     série 420 px de largura em y 1060, título em até 2 linhas de 88 px (72 px na cartela) a partir de y 1210; tudo entre
     y 180 e 1740 e x 72 a 1008. O bloco inteiro fica centrado na altura.
     Parâmetros: ?title=...&sub=...&mode=outro&fps=30&marca=_marca/<hash>/marca.json&serie_logo=assets/<logo branco>.png -->
<style>
@font-face{font-family:Montserrat;font-weight:500;src:url(fonts/montserrat-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:Montserrat;font-weight:600;src:url(fonts/montserrat-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:Montserrat;font-weight:700;src:url(fonts/montserrat-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:Montserrat;font-weight:800;src:url(fonts/montserrat-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:Montserrat;font-weight:500;src:url(fonts/montserrat-latin-ext-500-normal.woff2) format('woff2');unicode-range:U+0100-024F}
@font-face{font-family:Montserrat;font-weight:700;src:url(fonts/montserrat-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-024F}
/* cores da marca: o script troca pelas de ?marca=<json> (kit/ui.py --web); estes valores são o padrão neutro */
:root{--acc:#3B82F6;--acc-rgb:59,130,246;--acc-txt:#3B82F6;--acc-txt-rgb:59,130,246;--light:#F3F4F6;--light-rgb:243,244,246;
  --bg0:#08080A;--bg1:#111316;--bg2:#0B0B0D;--bg3:#050506;--W:1080px;--H:1920px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:var(--W);height:var(--H);overflow:hidden;background:#000}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--bg0)}
#bg{position:absolute;inset:-10%;background:
  radial-gradient(ellipse 760px 820px at 50% 41%, rgba(var(--acc-rgb),.10), rgba(var(--acc-rgb),0) 70%),
  radial-gradient(ellipse 90% 80% at 50% 50%, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%)}
#glow{position:absolute;left:50%;top:44%;width:1000px;height:1000px;margin:-500px 0 0 -500px;border-radius:50%;
  background:radial-gradient(closest-side, rgba(var(--acc-rgb),.50), rgba(var(--acc-rgb),.16) 45%, rgba(var(--acc-rgb),.04) 75%, rgba(var(--acc-rgb),0))}
#content{position:absolute;inset:0;transform-origin:50% 50%}
#helm{position:absolute;left:0;top:0;width:957px;height:1000px;transform-origin:0 0}
.pc,#sheen{position:absolute;inset:0;-webkit-mask-size:100% 100%;mask-size:100% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.pc{background:linear-gradient(158deg,#3BF0C2 0%,#11D6A6 26%,#00C597 52%,#00A47E 82%,#008A6A 100%);transform-origin:50% 55%}
#p0{-webkit-mask-image:url(assets/piece_0_h.png);mask-image:url(assets/piece_0_h.png)}
#p1{-webkit-mask-image:url(assets/piece_1_h.png);mask-image:url(assets/piece_1_h.png)}
#p2{-webkit-mask-image:url(assets/piece_2_h.png);mask-image:url(assets/piece_2_h.png)}
.hglow{position:absolute;left:-160px;top:-160px;width:1277px;height:1320px;background:url(assets/helmet_glow.png) 0 0/100% 100% no-repeat}
#sheen{-webkit-mask-image:url(assets/helmet_green_h.png);mask-image:url(assets/helmet_green_h.png);
  background:linear-gradient(112deg,rgba(255,255,255,0) 0%,rgba(255,255,255,0) 42%,rgba(255,255,255,.75) 50%,rgba(255,255,255,0) 58%,rgba(255,255,255,0) 100%);
  background-size:300% 100%;mix-blend-mode:screen}
#word{position:absolute;left:0;top:0;transform-origin:0 0}
#word img{display:block;width:100%;height:100%}
#title{position:absolute;left:72px;right:72px;text-align:center;font-family:Montserrat,sans-serif;color:var(--light)}
#sl{display:none;margin:0 auto;width:420px;height:auto}
#lbl{display:inline-flex;align-items:center;gap:20px;font-weight:700;font-size:44px;letter-spacing:.30em;color:var(--acc-txt);text-indent:.30em}
#lbl svg{width:34px;height:34px;margin-right:2px}
#rule{height:3px;margin:30px auto 34px;background:linear-gradient(90deg,rgba(var(--acc-txt-rgb),0),var(--acc-txt),rgba(var(--acc-txt-rgb),0))}
#ttl{font-weight:700;font-size:88px;letter-spacing:-.01em;line-height:1.1}
#ttl .sub{display:block;margin-top:20px;font-weight:500;font-size:48px;letter-spacing:0;line-height:1.15;color:rgba(var(--light-rgb),.62)}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse 75% 75% at 50% 50%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
#black{position:absolute;inset:0;background:#000}
</style>
</head>
<body>
<div id="stage">
  <div id="bg"></div>
  <div id="glow"></div>
  <div id="content">
    <div id="helm">
      <div class="hglow"></div>
      <div class="pc" id="p1"></div>
      <div class="pc" id="p0"></div>
      <div class="pc" id="p2"></div>
      <div id="sheen"></div>
    </div>
    <div id="word"><img src="assets/wordmark_light.png" alt=""></div>
    <div id="title">
      <img id="sl" alt="">
      <div id="lbl"><svg viewBox="0 0 18 18"><path d="M4 2.2v13.6c0 .7.8 1.1 1.4.7l10-6.8c.5-.4.5-1.1 0-1.4l-10-6.8C4.8 1.1 4 1.5 4 2.2z" fill="currentColor"/></svg><span id="serie"></span></div>
      <div id="rule"></div>
      <div id="ttl"></div>
    </div>
  </div>
  <div id="vig"></div>
  <div id="black" style="opacity:0"></div>
</div>
<script>
const Q = new URLSearchParams(location.search);
const FPS = +(Q.get('fps') || 30);
const TITLE = Q.get('title') || 'Título da aula';
const SUB = Q.get('sub') || '';
const OUTRO = Q.get('mode') === 'outro';
const SERIE_LOGO = Q.get('serie_logo') || '';   // logo da série todo branco (ex.: DomiFlix, capacete e texto)

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, [a, b]) => clamp((t - a) / (b - a));
const E = {
  outExpo: p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p),
  outCubic: p => 1 - Math.pow(1 - p, 3),
  outQuint: p => 1 - Math.pow(1 - p, 5),
  inOut: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2,
  inCubic: p => p * p * p,
};
const lerp = (a, b, p) => a + (b - a) * p;
const $ = id => document.getElementById(id);

function aplicarMarca(M) {
  const c = M.cores, r = document.documentElement.style;
  r.setProperty('--acc', c.acento); r.setProperty('--acc-rgb', c.acento_rgb);
  r.setProperty('--acc-txt', c.acento_texto); r.setProperty('--acc-txt-rgb', c.acento_texto_rgb);
  r.setProperty('--light', c.claro); r.setProperty('--light-rgb', c.claro_rgb);
  c.fundo.forEach((v, i) => r.setProperty('--bg' + i, v));
  $('ttl').innerHTML = TITLE.replace(/&/g, '&amp;').replace(/</g, '&lt;') + (SUB ? `<span class="sub">${SUB.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</span>` : '');
  if (SERIE_LOGO) { $('lbl').style.display = 'none'; $('sl').style.display = 'block'; }
  else if (M.serie) $('serie').textContent = M.serie.toUpperCase(); else $('lbl').style.display = 'none';
}

async function carregarFontes(M) {
  await Promise.all([document.fonts.load('700 88px Montserrat', TITLE), document.fonts.load('700 44px Montserrat', M.serie || 'A'),
                     SUB ? document.fonts.load('500 48px Montserrat', SUB) : null]);
  await document.fonts.ready;
}

// título: o maior tamanho (88 px na abertura, 72 px na cartela) que cabe em até 2 linhas na largura segura (936 px); nunca abaixo de 44 px
function ajustarTitulo() {
  const t = $('ttl'), base = OUTRO ? 72 : 88;
  for (const s of [base, 80, 72, 64, 56, 48, 44].filter(s => s <= base)) {
    t.style.fontSize = s + 'px';
    const linhas = Math.round((t.getBoundingClientRect().height - (SUB ? t.querySelector('.sub').getBoundingClientRect().height + 20 : 0)) / (s * 1.1));
    if (linhas <= 2) return s;
  }
  return 44;
}

// ------------------------------------------------------------------ estilo "dominex-capacete" (igual ao T3, empilhado)
function capacete() {
  // Linha do tempo (s): IDÊNTICA à do intro.html (mesmos números alimentam os SFX, window.CUES)
  const T = OUTRO
    ? {fadeIn: [-1, -.5], p0: [.55, 1.05], p1: [.62, 1.12], p2: [.72, 1.20], clank: 1.20, sheen: [1.30, 2.05],
       move: [-2, -1], word: [1.05, 1.75], lbl: [1.55, 2.0], rule: [1.6, 2.1], ttl: [1.68, 2.2], exit: [3.3, 3.85], end: 3.85}
    : {fadeIn: [0, .35], p0: [.18, .80], p1: [.30, .92], p2: [.46, 1.02], clank: 1.02, sheen: [1.08, 1.85],
       move: [1.62, 2.34], word: [1.80, 2.62], lbl: [2.40, 2.88], rule: [2.46, 3.06], ttl: [2.56, 3.14],
       exit: [3.80, 4.30], end: 4.42};
  window.DURATION = T.end;
  window.CUES = OUTRO
    ? [{t: T.p0[0], id: 'whoosh', pan: 0}, {t: T.clank, id: 'clank'}, {t: T.sheen[0] + .08, id: 'shine'},
       {t: T.word[0], id: 'swoosh'}, {t: T.ttl[0], id: 'pop'}]
    : [{t: 0.02, id: 'swell'}, {t: T.p0[0], id: 'whoosh', pan: 0}, {t: T.p1[0], id: 'whoosh', pan: -0.5},
       {t: T.p2[0], id: 'whoosh', pan: 0.5}, {t: T.clank, id: 'clank'}, {t: T.sheen[0] + .08, id: 'shine'},
       {t: T.move[0] + .05, id: 'swoosh'}, {t: T.ttl[0], id: 'pop'}, {t: T.exit[0] - .1, id: 'out'}];

  // geometria (px do vídeo 1080x1920)
  const HW = 957, HH = 1000;                 // canvas do capacete
  const CX = 540;
  const SMALL_H = 310;                       // capacete final: y 520 a 830
  const SMALL = {s: SMALL_H / HH};
  const BIG = {s: 470 / HH};                 // montagem: capacete grande (470 px de altura)
  const WORD = {w: 620, h: 620 * 324 / 1519};  // o mesmo recorte do DOMINEX do 16:9 (LOGO.word), em 620 px de largura
  const SL_H = SERIE_LOGO ? 420 * $('sl').naturalHeight / $('sl').naturalWidth : 44;  // altura do logo da série (ou do rótulo)
  const GAP_W = 50, GAP_L = 48;              // capacete -> DOMINEX -> logo da série
  const TT = $('title'); $('ttl').style.fontSize = ajustarTitulo() + 'px';
  $('sl').style.width = '420px';
  const BLOCO = SMALL_H + GAP_W + WORD.h + GAP_L + SL_H + 30 + 3 + 34 + $('ttl').getBoundingClientRect().height;  // altura do bloco todo
  const Y0 = Math.round((1920 - BLOCO) / 2);                                       // topo do capacete final: bloco centrado na altura
  const SM = {x: CX - HW * SMALL.s / 2, y: Y0};
  const BG = {cx: CX, cy: Y0 + SMALL_H / 2 + 165};                                   // montagem: um pouco abaixo do lugar final
  const W_Y = Y0 + SMALL_H + GAP_W;
  $('word').style.width = WORD.w + 'px'; $('word').style.height = WORD.h + 'px';
  TT.style.top = (W_Y + WORD.h + GAP_L) + 'px';

  function piece(id, t, span, from) {
    const p = seg(t, span), e = E.outQuint(p);
    const el = $(id);
    el.style.opacity = clamp(p * 3);
    el.style.transform = `translate(${lerp(from.dx, 0, e)}px, ${lerp(from.dy, 0, e)}px) rotate(${lerp(from.rot || 0, 0, e)}deg) scale(${lerp(from.s || 1, 1, e)})`;
    el.style.filter = p < 1 ? `blur(${lerp(from.blur || 0, 0, E.outCubic(p))}px)` : 'none';
  }

  window.renderFrame = function (n) {
    const t = n / FPS;
    if (!OUTRO) $('black').style.opacity = 1 - E.outCubic(seg(t, T.fadeIn));

    // peças (deslocamentos em px do canvas do capacete)
    const K = (OUTRO ? 1.9 : 1) * HH / 2000;
    piece('p0', t, T.p0, {dx: 0, dy: 420 * K, s: .9, blur: 60 * K});
    piece('p1', t, T.p1, {dx: -520 * K, dy: -300 * K, rot: -9, s: 1.04, blur: 60 * K});
    piece('p2', t, T.p2, {dx: 640 * K, dy: 60 * K, rot: 7, s: 1.02, blur: 60 * K});

    // encaixe: soco de escala + flash do brilho
    const k = t - T.clank;
    const punch = k > 0 ? Math.exp(-k * 7) * Math.sin(Math.min(k * 22, Math.PI)) * 0.022 : 0;
    const mv = OUTRO ? 1 : E.inOut(seg(t, T.move));
    const s0 = lerp(BIG.s, SMALL.s, mv), s = s0 * (1 + punch);
    const bigX = BG.cx - HW * BIG.s / 2, bigY = BG.cy - HH * BIG.s / 2;
    const x = lerp(bigX, SM.x, mv) - HW * (s - s0) / 2;
    const y = lerp(bigY, SM.y, mv) - HH * (s - s0) / 2;
    $('helm').style.transform = `translate(${x}px, ${y}px) scale(${s})`;
    const flash = k > 0 ? Math.exp(-k * 3.2) : 0;
    document.querySelector('.hglow').style.opacity = clamp(.16 + .55 * flash) * clamp(seg(t, [T.p0[0], T.p2[1]]) * 1.2);
    // brilho de fundo: segue o capacete (mesma lógica do 16:9, na vertical)
    const gcy = OUTRO ? SM.y + SMALL_H / 2 : lerp(BG.cy, SM.y + SMALL_H / 2, mv);
    $('glow').style.opacity = (.35 + .45 * flash) * E.outCubic(seg(t, [0, .9]));
    $('glow').style.transform = `translate(0px, ${gcy - 1920 * .44}px) scale(${lerp(.75, 1, mv) + .08 * flash})`;
    const sp = seg(t, T.sheen);
    $('sheen').style.opacity = sp > 0 && sp < 1 ? 1 : 0;
    $('sheen').style.backgroundPosition = `${lerp(100, 0, E.inOut(sp))}% 0`;

    // DOMINEX sai de trás do capacete PARA BAIXO: só aparece abaixo da borda de baixo atual do capacete
    const wp = E.outCubic(seg(t, T.word));
    const wy = W_Y + lerp(-110, 0, wp);
    const edge = y + HH * s + 14;
    $('word').style.transform = `translate(${CX - WORD.w / 2}px, ${wy}px)`;
    $('word').style.clipPath = `inset(${clamp(edge - wy, 0, WORD.h)}px 0 -10% 0)`;
    $('word').style.opacity = clamp(seg(t, T.word) * 2.2);

    titulo(t, T);
    saida(t, T);
    return true;
  };
}

// ------------------------------------------------------------------ comum: logo da série (ou rótulo) + fio + título e saída
function titulo(t, T) {
  const lp = E.outCubic(seg(t, T.lbl)), rp = E.inOut(seg(t, T.rule)), tp = E.outCubic(seg(t, T.ttl));
  for (const id of ['lbl', 'sl']) { $(id).style.opacity = lp; $(id).style.transform = `translateY(${lerp(20, 0, lp)}px)`; }
  $('rule').style.width = lerp(0, 300, rp) + 'px'; $('rule').style.opacity = rp;
  $('ttl').style.opacity = tp; $('ttl').style.transform = `translateY(${lerp(28, 0, tp)}px)`;
}

function saida(t, T) {  // leve avanço + escurece (a cartela termina preta)
  const xp = E.inCubic(seg(t, T.exit));
  $('content').style.transform = `scale(${1 + .05 * xp})`;
  $('content').style.opacity = 1 - xp;
  if (OUTRO) $('black').style.opacity = xp;
  $('glow').style.opacity = parseFloat($('glow').style.opacity) * (1 - xp);
}

(async () => {
  let M = null;
  if (!Q.get('marca')) throw new Error('falta ?marca= (kit/ui.py --web); a vinheta vertical só existe para o estilo dominex-capacete');
  const r = await fetch(Q.get('marca'));
  if (!r.ok) throw new Error(`não achei ${Q.get('marca')} (${r.status})`);
  M = await r.json();
  if (M.estilo !== 'dominex-capacete') throw new Error(`estilo "${M.estilo}": a vinheta vertical só existe para o estilo dominex-capacete (perfil Domiflix)`);
  aplicarMarca(M);
  await carregarFontes(M);
  if (SERIE_LOGO) { $('sl').src = SERIE_LOGO; await $('sl').decode(); }
  capacete(); window.renderFrame(0); window.READY = true;
})().catch(e => console.error('vinheta vertical: ' + (e && e.message || e)));
</script>
</body>
</html>
