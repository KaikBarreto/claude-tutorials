<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- Cenas ilustradas do T0 "Boas-vindas à Dominex" (sem tela de sistema). 1280x800 CSS, renderizadas quadro a quadro
     por render_cenas.cjs (window.setup(dados) + window.R(t)). Tudo é função do tempo: nada de transição CSS.
     Rótulos reais do app/Guia Técnico 1.38.6 (ver planejamento/domiflix/T00/plano.md); nenhum valor em R$; sem logo de terceiros. -->
<style>
@font-face{font-family:M;font-weight:500;src:url(../../../web/fonts/montserrat-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:600;src:url(../../../web/fonts/montserrat-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:700;src:url(../../../web/fonts/montserrat-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:800;src:url(../../../web/fonts/montserrat-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:500;src:url(../../../web/fonts/montserrat-latin-ext-500-normal.woff2) format('woff2');unicode-range:U+0100-024F}
@font-face{font-family:M;font-weight:700;src:url(../../../web/fonts/montserrat-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-024F}
:root{--v:#00C597;--ve:#00A27D;--vc:#E6F9F4;--t:#18181B;--c:#71717A;--l:#E4E7EC;--e:#1E1E1E;--am:#FFF0A8}
*{box-sizing:border-box;margin:0;padding:0;transition:none!important;animation:none!important}
html,body{width:1280px;height:800px;overflow:hidden;background:#fff}
body{font-family:M,sans-serif;color:var(--t);-webkit-font-smoothing:antialiased}
#st{position:absolute;inset:0;overflow:hidden;background:
  radial-gradient(1100px 650px at 92% -12%,rgba(0,197,151,.075),transparent 62%),
  radial-gradient(900px 600px at -12% 112%,rgba(0,197,151,.05),transparent 60%),#fff}
.g{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:640px 400px}
.ab{position:absolute}
.card{position:absolute;background:#fff;border:1px solid #E8ECEA;border-radius:18px;
  box-shadow:0 18px 40px rgba(16,24,40,.10),0 3px 8px rgba(16,24,40,.06)}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:100%;height:100%}
.kick{font-weight:700;font-size:14px;letter-spacing:.3em;color:var(--v);text-transform:uppercase}
.bar{background:#E9ECEF;border-radius:6px}
.pill{display:inline-flex;align-items:center;gap:8px;border-radius:999px;font-weight:700}
.row{display:flex;align-items:center}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.rip{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:3px solid var(--v);opacity:0}
/* trilha */
.st{position:absolute;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;background:#fff;border:3px solid #DCE1E6;
  display:flex;align-items:center;justify-content:center;color:#A1A1AA}
.st .fill{position:absolute;inset:-3px;border-radius:50%;background:var(--v);opacity:0}
.st .ic{position:relative;width:32px;height:32px}
.stl{position:absolute;width:230px;margin-left:-115px;text-align:center;font-weight:700;font-size:17px;line-height:1.25;color:#A1A1AA}
/* menu da conta */
.mi{position:relative;height:48px;display:flex;align-items:center;gap:14px;padding:0 16px;border-radius:12px;font-weight:600;font-size:16px}
.mi .hl{position:absolute;inset:0;border-radius:12px;background:var(--v);opacity:0}
.mi .ic,.mi span{position:relative}
/* capítulos */
.chl{position:relative;height:33px;display:flex;align-items:center;gap:12px;padding:0 12px;border-radius:9px;font-weight:600;font-size:15px;color:#3F3F46}
.chl .hl{position:absolute;inset:0;border-radius:9px;background:var(--vc);opacity:0}
.chl .dot{position:relative;width:9px;height:9px;border-radius:50%;background:#D4D4D8}
.chl span{position:relative}
mark{background:var(--am);color:inherit;padding:0 2px;border-radius:3px}
</style></head>
<body><div id="st"></div>
<script>
// ------------------------------------------------------------------ utilidades
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const pr=(t,a,d=.45)=>cl((t-a)/d);
const $=s=>document.querySelector(s);
const ST=document.getElementById('st');
function el(html,parent=ST){const d=document.createElement('div');d.innerHTML=html.trim();let f=null;for(const n of [...d.childNodes]){parent.appendChild(n);if(!f&&n.nodeType===1)f=n}return f}
function grupo(){return el('<div class="g"></div>')}
function ic(n,px,cor){const s=(window.ICONS||{})[n]||'';return `<span class="ic" style="width:${px}px;height:${px}px;${cor?'color:'+cor:''}">${s}</span>`}
function hex(c){c=c.replace('#','');return[0,2,4].map(i=>parseInt(c.substr(i,2),16))}
function mix(a,b,p){const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*cl(p))).join(',')})`}
// aparece em a, some em b (opacidade + leve subida + escala)
function vis(e,t,a,b=1e9,o={}){
  const din=o.din??.5,dout=o.dout??.4,dy=o.dy??16,dx=o.dx??0,sc=o.sc??.985;
  const p=eo(pr(t,a,din)),q=1-eo(pr(t,b,dout)),op=Math.min(p,q);
  e.style.opacity=op.toFixed(4);e.style.visibility=op<=.001?'hidden':'visible';
  const s=sc+(1-sc)*p - (1-q)*(1-sc);
  e.style.transform=`translate(${((1-p)*dx).toFixed(2)}px,${((1-p)*dy-(1-q)*dy*.5).toFixed(2)}px) scale(${s.toFixed(4)})`;
  return op;
}
function ripple(r,t,a){const p=pr(t,a,.7);r.style.opacity=(p>0&&p<1)?(.6*(1-p)).toFixed(3):0;r.style.transform=`scale(${(.4+2.0*eo(p)).toFixed(3)})`}
function pulse(e,t,a,amp=.045,dur=.9){const p=pr(t,a,dur);e.style.scale=(p>0&&p<1)?(1+amp*Math.sin(Math.PI*p)).toFixed(4):''}
function digita(e,txt,t,a,b){const p=cl((t-a)/Math.max(.05,b-a));const n=Math.round(p*txt.length);
  const car=(p>0&&p<1)||(Math.floor(t*2.2)%2===0&&p<1.2&&t>=a)?'<span style="color:var(--v);font-weight:500">|</span>':'';
  e.innerHTML=(txt.slice(0,n)||'')+(t>=a&&t<b+.8?car:'');}

// ------------------------------------------------------------------ tempos da fala (capNN.json do proc.py)
let D=null;
const norm=w=>w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9%./-]+/g,'');
function W(linha,palavra,n=1,campo='s'){
  const alvo=norm(palavra);let k=0;
  for(const w of D.words){if(w.linha===linha&&norm(w.w).replace(/[.,]$/,'')===alvo){k++;if(k===n)return w[campo]}}
  for(const w of D.words){if(w.linha===linha&&norm(w.w).startsWith(alvo)){k++;if(k>=n)return w[campo]}}
  console.warn('palavra não achada',linha,palavra);return L(linha);
}
const L=i=>(D.linhas[i]||{s:0}).s, LE=i=>(D.linhas[i]||{e:D.dur}).e;

// ------------------------------------------------------------------ componentes
const CAP_T3=['A tela de Clientes','Cliente empresa pelo CNPJ','Cliente pessoa física pelo CEP','Origens','A ficha do cliente',
  'Formulário de captação','Fornecedores','Preparando os equipamentos','Cadastrando um equipamento','QR Code e etiqueta','Recapitulando'];
function aula(x,y,escala=1){ // cartão de uma aula: player + capítulos (títulos reais do T3)
  const g=el(`<div class="ab" style="left:${x}px;top:${y}px;width:${1000*escala}px;height:${500*escala}px"></div>`);
  const inn=el(`<div class="ab" style="left:0;top:0;width:1000px;height:500px;transform-origin:0 0;transform:scale(${escala})"></div>`,g);
  const c=el(`<div class="card" style="left:0;top:0;width:1000px;height:500px"></div>`,inn);
  const pl=el(`<div class="ab" style="left:30px;top:87px;width:580px;height:326px;border-radius:14px;overflow:hidden;
     background:radial-gradient(420px 260px at 78% 18%,rgba(0,197,151,.28),transparent 70%),#1E1E1E"></div>`,c);
  el(`<div class="ab" style="left:30px;top:30px;width:420px">
       <div class="row" style="gap:10px"><img src="../../../marca/assets/helmet_green.png" style="width:30px"><span class="kick" style="font-size:12px">▶ Domiflix</span></div>
       <div style="margin-top:18px;color:#fff;font-weight:800;font-size:30px;line-height:1.18">Clientes, Fornecedores e Equipamentos</div></div>`,pl);
  el(`<div class="ab" style="left:30px;top:262px;width:42px;height:42px;border-radius:50%;background:var(--v);display:flex;align-items:center;justify-content:center;color:#fff">${ic('play',20,'#fff')}</div>`,pl);
  const trilho=el(`<div class="ab" style="left:90px;top:280px;width:460px;height:6px;border-radius:3px;background:rgba(255,255,255,.22)"></div>`,pl);
  const prog=el(`<div class="ab" style="left:0;top:0;height:6px;width:0;border-radius:3px;background:var(--v)"></div>`,trilho);
  const ticks=[];for(let i=0;i<CAP_T3.length;i++){ticks.push(el(`<div class="ab" style="left:${(i/(CAP_T3.length))*460}px;top:-3px;width:3px;height:12px;border-radius:2px;background:rgba(255,255,255,.55)"></div>`,trilho))}
  const cab=el(`<div class="ab" style="left:640px;top:30px;font-weight:800;font-size:19px">Capítulos</div>`,c);
  const lst=el(`<div class="ab" style="left:630px;top:66px;width:345px"></div>`,c);
  const itens=CAP_T3.map(n=>el(`<div class="chl"><div class="hl"></div><div class="dot"></div><span>${n}</span></div>`,lst));
  return {g,c,pl,prog,itens,ticks};
}
function aulaR(A,t,{lista=0,marca=-1,em=1e9}){ // lista: instante em que a lista entra; marca: capítulo destacado em "em"
  A.itens.forEach((it,i)=>vis(it,t,lista+i*.07,1e9,{dy:8,din:.35,sc:1}));
  const p=eo(pr(t,em,.5));
  A.itens.forEach((it,i)=>{const on=i===marca?p:0;it.querySelector('.hl').style.opacity=on;it.querySelector('.dot').style.background=mix('#D4D4D8','#00C597',on);
    it.style.color=mix('#3F3F46','#00805F',on)});
  const alvo=marca>=0?(marca/CAP_T3.length)*460:0;A.prog.style.width=(16+(alvo-16)*p).toFixed(1)+'px';
}
const FASES=[['settings','Deixar o sistema de pé'],['users','Os cadastros que sustentam tudo'],['clipboard-list','A operação rodando'],
  ['trending-up','Vender'],['file-signature','Contratos, PMOC e o cliente'],['wallet','O dinheiro e o fiscal'],['chart-column','Gente e crescimento']];
const PX=[[200,300],[493,300],[787,300],[1080,300],[1080,560],[787,560],[493,560]];
const PL=[0,293.3,586.7,880,1288.4,1581.4,1875.4];
function trilha(par){ // as 7 fases (nomes do sumário do Guia Técnico), caminho em S
  const g=el('<div class="g"></div>',par);
  const k=el(`<div class="ab" style="left:0;top:118px;width:1280px;text-align:center"><span class="kick">▶ Trilha Domiflix</span></div>`,g);
  const svg=el(`<svg class="ab" width="1280" height="800" viewBox="0 0 1280 800" style="left:0;top:0">
     <path d="M200,300 H1080 A130,130 0 0 1 1080,560 H493" fill="none" stroke="#E4E7EC" stroke-width="10" stroke-linecap="round"/>
     <path class="vp" d="M200,300 H1080 A130,130 0 0 1 1080,560 H493" fill="none" stroke="#00C597" stroke-width="10" stroke-linecap="round"/></svg>`,g);
  const vp=svg.querySelector('.vp');const LT=vp.getTotalLength();vp.style.strokeDasharray=LT;vp.style.strokeDashoffset=LT;
  const sts=FASES.map(([i,n],k)=>{const [x,y]=PX[k];
    const s=el(`<div class="st" style="left:${x}px;top:${y}px"><div class="fill"></div>${ic(i,32)}</div>`,g);
    const l=el(`<div class="stl" style="left:${x}px;top:${y+50}px">${n}</div>`,g);return {s,l}});
  return {g,vp,LT,sts,k};
}
function trilhaR(T,t,acende){ // acende: instantes em que cada fase acende (Infinity = apagada)
  let comp=0;
  T.sts.forEach((o,k)=>{const a=acende[k]??Infinity;const p=eo(pr(t,a,.4));
    o.s.querySelector('.fill').style.opacity=p;o.s.style.color=mix('#A1A1AA','#FFFFFF',p);o.s.style.borderColor=mix('#DCE1E6','#00C597',p);
    o.l.style.color=mix('#A1A1AA','#18181B',p);const sp=pr(t,a,.5);o.s.style.transform=`scale(${(1+.12*Math.sin(Math.PI*sp)).toFixed(3)})`;
    if(t>=a){const ant=k?PL[k-1]:0;comp=Math.max(comp,ant+(PL[k]-ant)*eo(pr(t,a-.25,.5)))}});
  T.vp.style.strokeDashoffset=(T.LT-comp).toFixed(1);
}
const MENU=[['user','Perfil'],['credit-card','Assinatura'],['sun','Tema'],['video','Tutoriais | Domiflix'],['circle-help','Central de Ajuda'],['message-circle','Falar com o Suporte']];
function lateral(x,y){ // barra lateral esquemática + cartão do perfil no rodapé (de onde o menu da conta abre)
  const g=el(`<div class="ab" style="left:${x}px;top:${y}px"></div>`);
  const c=el(`<div class="card" style="left:0;top:0;width:280px;height:600px;border-radius:20px"></div>`,g);
  el(`<div class="ab row" style="left:24px;top:26px;gap:10px"><img src="../../../marca/assets/helmet_green.png" style="width:30px"><div class="bar" style="width:110px;height:14px"></div></div>`,c);
  for(let i=0;i<7;i++)el(`<div class="ab row" style="left:24px;top:${92+i*52}px;gap:14px"><div style="width:22px;height:22px;border-radius:7px;background:#E9ECEF"></div><div class="bar" style="width:${[120,150,100,140,90,130,110][i]}px;height:12px"></div></div>`,c);
  const pf=el(`<div class="ab row" style="left:14px;top:516px;width:252px;height:68px;border-radius:14px;background:#F6F7F8;gap:12px;padding:0 14px">
      <div style="width:40px;height:40px;border-radius:50%;background:var(--vc);display:flex;align-items:center;justify-content:center">${ic('user',22,'#00A27D')}</div>
      <div><div class="bar" style="width:110px;height:11px;background:#DDE1E5"></div><div class="bar" style="width:80px;height:9px;margin-top:8px"></div></div>
      <div style="margin-left:auto;color:#A1A1AA">${ic('chevron-up',18)}</div></div>`,c);
  const ring=el(`<div class="ab" style="left:10px;top:512px;width:260px;height:76px;border-radius:17px;border:3px solid var(--v);opacity:0"></div>`,c);
  return {g,pf,ring};
}
function menu(x,y){ // menu da conta (rótulos e ordem reais: shell.ts 79-86)
  const g=el(`<div class="card" style="left:${x}px;top:${y}px;width:330px;padding:12px"></div>`);
  el(`<div class="row" style="gap:12px;padding:8px 8px 14px;border-bottom:1px solid #EEF0F2;margin-bottom:8px">
     <div style="width:38px;height:38px;border-radius:50%;background:var(--vc);display:flex;align-items:center;justify-content:center">${ic('user',20,'#00A27D')}</div>
     <div><div class="bar" style="width:130px;height:11px;background:#DDE1E5"></div><div class="bar" style="width:170px;height:9px;margin-top:8px"></div></div></div>`,g);
  const its=MENU.map(([i,n],k)=>{if(k===3)el('<div style="height:1px;background:#EEF0F2;margin:6px 8px"></div>',g);
    return el(`<div class="mi"><div class="hl"></div>${ic(i,20)}<span>${n}</span></div>`,g)});
  const rip=el('<div class="rip"></div>',g);
  return {g,its,rip};
}
function menuR(M,t,k,a){ // destaca o item k em a, com o toque
  M.its.forEach((it,i)=>{const p=i===k?eo(pr(t,a,.25)):0;it.querySelector('.hl').style.opacity=p;it.style.color=mix('#27272A','#FFFFFF',p)});
  const it=M.its[k];M.rip.style.left=(it.offsetLeft+60)+'px';M.rip.style.top=(it.offsetTop+24)+'px';ripple(M.rip,t,a);
}
function celular(x,y){ // aparelho genérico, conversa sem texto (sem logo)
  const g=el(`<div class="ab" style="left:${x}px;top:${y}px;width:290px;height:580px;border-radius:44px;background:#1E1E1E;
       box-shadow:0 24px 50px rgba(16,24,40,.22)"></div>`);
  const s=el(`<div class="ab" style="left:11px;top:11px;width:268px;height:558px;border-radius:34px;background:#fff;overflow:hidden"></div>`,g);
  el(`<div class="ab" style="left:117px;top:12px;width:34px;height:10px;border-radius:5px;background:#1E1E1E"></div>`,s);
  el(`<div class="ab row" style="left:0;top:38px;width:268px;height:62px;gap:12px;padding:0 18px;border-bottom:1px solid #EEF0F2">
     <div style="width:38px;height:38px;border-radius:50%;background:var(--v);display:flex;align-items:center;justify-content:center">${ic('headset',20,'#fff')}</div>
     <div style="font-weight:700;font-size:16px">Suporte</div></div>`,s);
  const bolhas=[[0,118,150],[1,186,170],[0,262,120],[1,322,190],[0,404,160],[1,466,140]].map(([lado,top,w])=>el(`<div class="ab" style="${lado?'right:16px':'left:16px'};top:${top}px;width:${w}px;
     padding:12px 14px;border-radius:16px;${lado?'border-bottom-right-radius:5px;background:#D8F5EC':'border-bottom-left-radius:5px;background:#F1F3F5'}">
     <div class="bar" style="height:8px;width:${w-40}px;background:${lado?'#A8E6D2':'#DDE1E5'}"></div>
     <div class="bar" style="height:8px;width:${(w-40)*.6}px;margin-top:7px;background:${lado?'#A8E6D2':'#DDE1E5'}"></div></div>`,s));
  return {g,bolhas};
}

// ------------------------------------------------------------------ capítulos
const CAPS={};
CAPS[0]=()=>{ // Boas-vindas: o ciclo do trabalho com a Dominex no centro
  const g=grupo();
  const tit=el(`<div class="ab" style="left:0;top:64px;width:1280px;text-align:center">
     <div class="kick">▶ Domiflix</div>
     <div style="margin-top:14px;font-weight:800;font-size:54px;letter-spacing:-.01em">Boas-vindas à <span style="color:var(--v)">Dominex</span></div></div>`,g);
  const sub=el(`<div class="ab" style="left:0;top:178px;width:1280px;text-align:center;font-weight:600;font-size:21px;color:var(--c)">Como a gente vai caminhar junto</div>`,g);
  const cx=640,cy=490,R=208;
  const svg=el(`<svg class="ab" width="1280" height="800" style="left:0;top:0"><circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#EEF1F3" stroke-width="8"/>
     <circle class="arc" cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#00C597" stroke-width="8" stroke-linecap="round" transform="rotate(-90 ${cx} ${cy})"/></svg>`,g);
  const arc=svg.querySelector('.arc');const C=2*Math.PI*R;arc.style.strokeDasharray=C;arc.style.strokeDashoffset=C;
  const logo=el(`<div class="ab" style="left:${cx-62}px;top:${cy-66}px;width:124px;height:132px;display:flex;align-items:center;justify-content:center">
     <img src="../../../marca/assets/helmet_green.png" style="width:118px"></div>`,g);
  const E=[['phone-call','Chamado do cliente',0],['clipboard-list','Ordem de serviço',90],['hard-hat','Técnico em campo',180],['banknote','Dinheiro na conta',270]]
    .map(([i,n,ang])=>{const a=(ang-90)*Math.PI/180,x=cx+R*Math.cos(a),y=cy+R*Math.sin(a);
      return el(`<div class="card row" style="left:${x-136}px;top:${y-36}px;width:272px;height:72px;white-space:nowrap;gap:12px;padding:0 16px;border-radius:16px">
        <div style="width:44px;height:44px;border-radius:12px;background:var(--vc);display:flex;align-items:center;justify-content:center">${ic(i,24,'#00A27D')}</div>
        <div style="font-weight:700;font-size:17px">${n}</div></div>`,g)});
  return t=>{
    vis(tit,t,W(0,'Boas-vindas')-.25,1e9,{dy:22});
    vis(sub,t,W(0,'Neste'),1e9,{dy:10});
    vis(logo,t,W(0,'lugar'),1e9,{sc:.8});
    const a0=W(0,'chamado'),a3=W(0,'dinheiro');const at=[a0,a0+(a3-a0)*.38,a0+(a3-a0)*.7,a3];
    E.forEach((e,i)=>vis(e,t,at[i],1e9,{sc:.9,dy:10}));
    const p=eo(pr(t,a0,(a3-a0)+.9));arc.style.strokeDashoffset=(C*(1-p)).toFixed(1);
    const fim=W(0,'caminhar');pulse(logo,t,fim,.06,1.1);
  };
};
CAPS[1]=()=>{
  const A=aula(140,150);
  const T=trilha();
  const lat=lateral(315,100),M=menu(635,300);
