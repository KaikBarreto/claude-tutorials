<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- T16 "Notas fiscais" · cenas 3D (kit perfis/ecoflix/cenas3d/kit3d.js). As cenas 2D da ../cenas/cenas.html ficam de reserva.
     Uma por capítulo (ilustracoes.json, chave "3d"). A nota é um papel genérico (objetos/folha.js) com os rótulos da 2D, nunca
     a imagem de uma nota real:
       cap00 o pátio carrega o cobre (fio e tubo) no caminhão e a carga só sai pela cancela com a nota, rumo à fundição;
       cap07 a placa (FJR3B27) sai do caminhão e pousa no quadro Transporte da nota;
       cap10 a balança marca o bruto (506 kg), a tara e a impureza (6 kg) saem, o líquido (500 kg) vai para a nota
             (Cobre mel, R$ 47,90/kg, Total R$ 23.950,00); o ticket (bruto) não é a nota (líquido);
       cap14 a nota autorizada tem dois arquivos: o DANFE vai com a carga no caminhão e o XML vai para a pasta do contador.
     Objetos novos em perfis/ecoflix/cenas3d/objetos/: cancela, fundicao, pasta, placa, cabo (T05). Âncoras W(linha,'palavra')
     das falas do narracao/tts_textos.py; textos e números da cena 2D.
     Render: node ferramentas/edit/cenas/render_cenas.cjs <cap> <capNN.json> saida.mp4 --html planejamento/ecoflix/T16/cenas3d/cena3d.html --de <início> --ate <fim> -->
<style>
.row{display:flex;align-items:center}
.ico{display:flex;align-items:center;justify-content:center;flex:none;border-radius:12px;background:var(--vs);color:#fff}
.okc{display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--vs);color:#fff;border:3px solid #fff;box-shadow:0 6px 14px rgba(16,24,40,.14)}
.lbl{font-weight:600;font-size:16px;color:#4B5563;white-space:nowrap}
</style>
</head><body>
<script type="module">
import { THREE, PI, eo, eio, pr, lerp, cl, W, LE, el, ic, vis, ripple, pulse, kg, conta, posTitulo, titulo, mostrador,
  CENA, GL, camera, ancora, tela, mundo, M, grupo, poe, rbox, mancha, cresce, domo, peca, monte, chaoPatio, balancaPatio, caminhao, anda, COR, cena } from '../../../../perfis/ecoflix/cenas3d/kit3d.js';
import { folha } from '../../../../perfis/ecoflix/cenas3d/objetos/folha.js';
import { galpao } from '../../../../perfis/ecoflix/cenas3d/objetos/galpao.js';
import { cancela, ergue } from '../../../../perfis/ecoflix/cenas3d/objetos/cancela.js';
import { fundicao } from '../../../../perfis/ecoflix/cenas3d/objetos/fundicao.js';
import { placa } from '../../../../perfis/ecoflix/cenas3d/objetos/placa.js';
import { pasta } from '../../../../perfis/ecoflix/cenas3d/objetos/pasta.js';

const PLACA = { antiga: 'FJR3B27' };                                  // as mesmas constantes da cena 2D
const VENDA10 = { bruto: 506, desconto: 6, liquido: 500, preco: 47.9, total: 23950 };
const brl = v => 'R$ ' + v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const CAPS = {};
const visto = px => `<div class="okc" style="width:${px}px;height:${px}px">${ic('check', Math.round(px * .6))}</div>`;
const tagv = (txt, cls = 'v') => el(`<div class="tag ${cls} ab">${txt}</div>`);
const bolinhas = (g, a, b, n, y = .06) => Array.from({ length: n }, (_, i) => { const u = (i + 1) / (n + 1), m = new THREE.Mesh(new THREE.SphereGeometry(.09, 10, 8), M('#B7BEC6'));
  m.position.set(lerp(a[0], b[0], u), y, lerp(a[1], b[1], u)); m.castShadow = true; g.add(m); return m; });

// ------------------------------------------------------------------ CAPS[0] · Carga e nota (L0-L1)
// 0 "Oi! Neste tutorial a gente vai do certificado digital até a nota fiscal autorizada, na Recicla Vale Metais."
// 1 "A Fundição Bandeira do Vale compra cobre dela toda semana. E a carga só sai do pátio com a nota fiscal de mercadoria, a NF-e."
CAPS[0] = () => {
  const g = grupo(CENA), X0 = -1.0, XC = 3.8, XEND = 8.4, PIL = [-6.4, .4];
  chaoPatio(CENA, [2, 0, 0], { c: 32, l: 12, passo: 2.6, faixa: [2.7] });
  const gal = galpao(CENA, [-7.2, 0, -3.6], { c: 3.8, l: 3.0, h: 1.7 });
  const T = caminhao(CENA, [X0, 0, 0], {}), u = T.userData;
  const cn = cancela(CENA, [XC, 0, -1.7], { l: 3.3 });
  const fu = fundicao(CENA, [11.2, 0, -3.5], { c: 4.6, l: 3.8, h: 2.2 }); fu.userData.s = 1;
  // o monte de cobre (fio e tubo) e as peças que vão pra caçamba, cada uma no seu tempo
  const N = 60, mP = mancha(CENA, 3.0, 2.5, .3, [PIL[0], 0, PIL[1]]);
  const src = domo(N, 1.25, 1.0, .95, 0, .35).map(p => [p[0] + PIL[0], p[1], p[2] + PIL[1]]);
  const dst = domo(N, u.bau.cb / 2 - .35, u.bau.Wd / 2 - .25, .7, .5, .4).map(p => [u.x0 + u.bau.cb / 2 + p[0], u.yb + .14 + p[1], p[2]]);
  const pcs = src.map(p => peca(g, 'cobre', p, 1.7));
  const tit = titulo('Fiscal', 'Carga e nota');
  const cRV = tagv('Recicla Vale Metais', 'e'), cF = tagv('Fundição', 'e');
  const tSem = tagv(`${ic('calendar-days', 20)}cobre toda semana`, 'a');
  const rota = bolinhas(g, [X0 - .5, 2.6], [XEND + 2, 2.6], 26);
  const nf = folha(CENA, [0, 0, 0], { cor: COR.verde, w: .95, h: 1.25, linhas: 4 }); nf.userData.s = 1;
  const nfC = tagv('NF-e', 'v'), nfOk = el(`<div class="ab">${visto(40)}</div>`);
  camera([[0, { x: -2.4, y: 1.5, z: 0, d: 22.5, az: .1, el: .3, oy: -30 }], [9.0, { x: -2.4, y: 1.5, z: 0, d: 22.5, az: .1, el: .3, oy: -30 }, 'lin'],
          [10.6, { x: 2.3, y: 1.5, z: 0, d: 29, az: .08, el: .3, oy: -30 }, 'eio'], [60, { x: 2.3, y: 1.5, z: 0, d: 29, az: .08, el: .3, oy: -30 }, 'lin']]);
  return t => {
    const A = W(0, 'Oi') - .3, tFim = A + .55, tAut = W(0, 'autorizada'), tRec = W(0, 'Recicla'), tFun = W(1, 'Fundição'), tCom = W(1, 'compra'), tCob = W(1, 'cobre'),
          tCar = W(1, 'carga'), tNot = W(1, 'nota'), tMer = W(1, 'mercadoria'), tNfe = W(1, 'NF-e');
    GL.style.opacity = eo(pr(t, tFim - .1, .6)).toFixed(3);
    posTitulo(tit, t, A - .6, tFim - .1);
    // sai do pátio: a cancela sobe e o caminhão vai até a fundição
    const tPar = tMer + .3, X = lerp(X0, XEND, eio(pr(t, tPar, 1.9)));
    anda(T, X); ergue(cn, eio(pr(t, tMer, .6)));
    // carrega: cada pedaço salta do monte para a caçamba (e segue com o caminhão)
    pcs.forEach((o, i) => { const q = eio(pr(t, tFim + .45 + i * .05, .75)), d = dst[i], B = [d[0] + X - X0 + (X0 - X0), d[1], d[2]];
      B[0] = d[0] + X; o.position.set(lerp(src[i][0], B[0], q), lerp(src[i][1], B[1], q) + 2.3 * Math.sin(PI * q), lerp(src[i][2], B[2], q)); o.visible = t > tFim - .05; });
    mP.material.opacity = .3 * (1 - eo(pr(t, tFim + .45 + N * .05, .8)));
    vis(cRV, t, tRec - .15, 1e9, { dy: 10 }); ancora(cRV, mundo(gal, gal.userData.topo), .5, 1, 0, -8);
    cresce(fu, t, tFun - .1, .8, .2); vis(cF, t, tFun + .1, 1e9, { dy: 10 }); ancora(cF, mundo(fu, fu.userData.topo), .5, 1, 0, -10);
    rota.forEach((m, i) => { const q = eio(pr(t, tCom - .1 + i * .03, .4)); m.visible = q > .01; m.scale.setScalar(Math.max(.01, q)); });
    vis(tSem, t, tCob, 1e9, { dy: 10 }); ancora(tSem, [XC, .06, 2.6], .5, 1, 0, -14);
    // a nota: aparece sobre a cabine (autorizada) e, em "nota", pousa na lateral da carga e segue com o caminhão
    const P1 = [X0 + 1.3, 3.9, 1.0], P2 = [X + u.x0 + u.bau.cb / 2, u.yb + 1.0, u.bau.Wd / 2 + .06], q = eio(pr(t, tNot, .8));
    nf.position.set(lerp(P1[0] + X - X0, P2[0], q), lerp(P1[1], P2[1], q) + 1.6 * Math.sin(PI * q), lerp(P1[2], P2[2], q));
    nf.scale.setScalar(lerp(1.15, .62, q)); nf.rotation.y = 0; const pn = eo(pr(t, tAut - .1, .5)); nf.visible = pn > .01;
    if (t < tAut - .1) nf.scale.setScalar(.001); else if (t < tNot) nf.scale.setScalar(1.15 * (.9 + .1 * pn));
    nf.updateWorldMatrix(true, true);
    vis(nfC, t, tAut - .1, 1e9, { dy: 10, sc: .9 }); ancora(nfC, mundo(nf, nf.userData.topo), .5, 1, 0, -6); pulse(nfC, t, tNfe, .1, .8);
    vis(nfOk, t, tAut + .05, 1e9, { dy: 0, sc: .5 }); ancora(nfOk, mundo(nf, [.2, -.45 * nf.scale.x * 0 - .3, .02]), .5, .5);
  };
};

// ------------------------------------------------------------------ CAPS[7] · O caminhão na nota (L2)
// 2 "No bloco Veículo vai a placa do caminhão que costuma fazer a entrega."
CAPS[7] = () => {
  const g = grupo(CENA), XP = 0, NR = -.75;
  chaoPatio(CENA, [-3, 0, 0], { c: 30, l: 12, passo: 2.6, faixa: [2.9] });
  const T = caminhao(CENA, [XP, 0, 0], {}), u = T.userData;
  const nf = folha(CENA, [-6.9, 2.0, 2.6], { cor: COR.verde, w: 1.5, h: 2.0, linhas: 3 }); nf.rotation.y = NR; nf.userData.s = 1.2;
  poe(rbox(.1, .72, .08, .03, 1), M(COR.cinzaC), nf, [0, -1.32, -.06]); poe(rbox(.7, .06, .5, .03, 1), M(COR.cinzaE), nf, [0, -1.64, -.06]); mancha(nf, 1.4, .9, .26, [0, -1.66, 0]);
  // o quadro Transporte (moldura âmbar que fica verde) e o lugar da placa
  const quadro = grupo(nf, [0, -.38, .02]); const fm = [M('#DCE3DF'), M(COR.verde)];
  const bars = [[1.3, .035, 0, .39], [1.3, .035, 0, -.39], [.035, .8, -.65, 0], [.035, .8, .65, 0]].map(([w, h, x, y]) => poe(rbox(w, h, .012, .006, 1), fm[0], quadro, [x, y, 0]));
  const slot = grupo(quadro, [0, -.05, .01]);
  const pl = placa(g, [0, 0, 0], PLACA.antiga, { w: .62 }); pl.userData.s = 1;
  poe(rbox(.68, .26, .006, .01, 1), M('#C7CFD7'), slot);
  const tit = titulo('Transportadora', 'O caminhão na nota');
  const cNf = tagv('NF-e', 'v'), cTr = el(`<div class="row ab" style="gap:8px;font-weight:800;font-size:20px;white-space:nowrap">${ic('truck', 26)}Transporte</div>`), okB = el(`<div class="ab">${visto(46)}</div>`);
  camera([[0, { x: -3.0, y: 1.4, z: 1.0, d: 19.5, az: -.62, el: .26, oy: -30 }], [60, { x: -3.0, y: 1.4, z: 1.0, d: 18.8, az: -.62, el: .26, oy: -30 }, 'lin']]);
  return t => {
    const A = W(2, 'Veículo') - .3, tVe = W(2, 'Veículo'), tPl = W(2, 'placa'), tCa = W(2, 'caminhão'), tEn = W(2, 'entrega');
    GL.style.opacity = eo(pr(t, tVe - .35, .5)).toFixed(3);
    posTitulo(tit, t, A - .6, tVe - .1);
    const X = lerp(-16, XP, eo(pr(t, tVe - .25, 1.15))); anda(T, X); T.visible = t > tVe - .3;
    cresce(nf, t, tVe + .3, .6, 0); nf.rotation.y = NR;
    vis(cNf, t, tVe + .4, 1e9, { dy: 10 }); ancora(cNf, mundo(nf, nf.userData.topo), .5, 1, 0, -6);
    vis(cTr, t, tVe + .5, 1e9, { dy: 8 }); ancora(cTr, mundo(nf, [-.6, -.0, .03]), 0, .5, 0, 0);
    // a placa sai da traseira do caminhão e pousa no quadro
    nf.updateWorldMatrix(true, true); T.updateWorldMatrix(true, true);
    const p0 = mundo(T, [-3.32, .78, 0]), d0 = mundo(slot, [0, 0, .012]), q = eio(pr(t, tCa, .9));
    pl.position.set(lerp(p0[0], d0[0], q), lerp(p0[1], d0[1], q) + 2.6 * Math.sin(PI * q), lerp(p0[2], d0[2], q));
    pl.rotation.y = lerp(-PI / 2, NR, q); pl.visible = t > tVe + .25;
    const vp = eo(pr(t, tPl, .4)); pl.scale.setScalar(lerp(1.0, .98, q) * (1 + .15 * Math.sin(PI * pr(t, tPl, .7))));
    const ok = eo(pr(t, tEn - .1, .45)); bars.forEach(b => { b.material = ok > .5 ? fm[1] : fm[0]; });
    vis(okB, t, tEn, 1e9, { dy: 0, sc: .5 }); ancora(okB, mundo(quadro, [.72, .46, .02]), .5, .5);
  };
};

// ------------------------------------------------------------------ CAPS[10] · Peso líquido na nota (L4-L5)
// 4 "...A nota leva sempre o peso líquido, já sem a tara e a impureza. Quinhentos quilos de cobre mel, a quarenta e sete e noventa: vinte e três mil novecentos e cinquenta reais."
// 5 "Uma dica: quando o cliente disser que o peso da nota não bate com o ticket, quase sempre ele está comparando o bruto com o líquido."
CAPS[10] = () => {
  const g = grupo(CENA), SX = -2.3;
  chaoPatio(CENA, [2, 0, 0], { c: 28, l: 11, passo: 2.6, faixa: [3.0] });
  const bal = balancaPatio(CENA, [SX, 0, 0], { c: 4.2, l: 2.6, rampa: 1.0, poste: [2.3, -1.6], hp: 2.2, rp: .07 }), TOPO = mundo(bal, bal.userData.topo);
  const heap = monte(CENA, [SX - .2, .172, 0], { metais: ['cobre'], n: 64, rx: 1.35, rz: 1.05, h: .95, mancha: false });
  const imp = []; for (const c of ['terra', 'terra', 'borracha', 'borracha', 'plastico', 'plastico', 'terra']) { const p = domo(1, 1.1, .85, .98, .172, .9)[0], o = peca(CENA, c, [SX - .2 + p[0], p[1], p[2]], 1.3); o.userData.p0 = [SX - .2 + p[0], p[1], p[2]]; imp.push(o); }
  const nf = folha(CENA, [4.5, 2.0, -.3], { cor: COR.verde, w: 2.0, h: 2.6, linhas: 0 }); nf.rotation.y = -.12; nf.userData.s = 1;
  poe(rbox(.12, .72, .08, .03, 1), M(COR.cinzaC), nf, [0, -1.64, -.06]); poe(rbox(.9, .06, .6, .03, 1), M(COR.cinzaE), nf, [0, -1.98, -.06]);
  const tit = titulo('Emissão', 'Peso líquido na nota');
  const most = mostrador('Peso bruto', 'Peso líquido', 270); most.mn.textContent = kg(VENDA10.bruto);
  const tara = el(`<div class="tag a ab">Tara e impureza<span class="num" style="margin-left:6px">${kg(VENDA10.desconto)}</span></div>`);
  const cNf = tagv('NF-e', 'v');
  const itn = el('<div class="ab" style="font-weight:800;font-size:22px;white-space:nowrap">Cobre mel</div>'), pu = el(`<div class="ab lbl" style="font-size:17px">${brl(VENDA10.preco)}/kg</div>`);
  const tt = el(`<div class="ab"><div class="lbl">Total</div><div class="num" style="font-size:30px;color:var(--ve);margin-top:2px">${brl(VENDA10.total)}</div></div>`);
  const chipL = el(`<div class="tag v ab" style="font-size:22px">${kg(VENDA10.liquido)}</div>`);
  const tick = el(`<div class="card" style="width:250px;height:136px;padding:16px 20px;border-radius:12px;border:1.5px solid #D5DCE2;left:0;top:0">
    <div class="row" style="gap:8px;font-weight:800;font-size:16px;white-space:nowrap">${ic('receipt-text', 22)}Ticket de pesagem</div><div class="lbl" style="margin-top:10px">Peso bruto</div>
    <div class="num tb" style="margin-top:2px;font-size:32px;color:var(--ae);display:inline-block;padding:0 8px;border-radius:10px;margin-left:-8px">${kg(VENDA10.bruto)}</div></div>`);
  const tb = tick.querySelector('.tb');
  const dif = el(`<div class="ab okc" style="width:60px;height:60px;background:#4B5563;border:3px solid #4B5563;font-weight:800;font-size:34px">≠</div>`);
  camera([[0, { x: .6, y: 1.7, z: .4, d: 18.5, az: .1, el: .3, oy: -40 }], [60, { x: .6, y: 1.7, z: .4, d: 18.0, az: .1, el: .3, oy: -40 }, 'lin']]);
  return t => {
    const A = W(4, 'peso') - .3, tPe = W(4, 'peso'), tLi = W(4, 'líquido'), tTa = W(4, 'tara'), tIm = W(4, 'impureza'), tCb = W(4, 'cobre'), tMe = W(4, 'mel', 1, 'e'), tRe = W(4, 'reais'),
          tNo = W(5, 'nota'), tTk = W(5, 'ticket'), tCm = W(5, 'comparando'), tBr = W(5, 'bruto'), tLq = W(5, 'líquido');
    GL.style.opacity = eo(pr(t, tPe - .3, .6)).toFixed(3);
    posTitulo(tit, t, A - .6, tPe - .15);
    vis(most, t, tPe, 1e9, { dy: 12 }); ancora(most, TOPO, .5, 1, 0, -6);
    // a tara e a impureza saem do monte; o mostrador passa do bruto ao líquido
    const q = eio(pr(t, tTa - .1, 1.1));
    imp.forEach((o, i) => { const p0 = o.userData.p0, qi = eio(pr(t, tTa - .1 + i * .08, 1.0)); o.position.set(lerp(p0[0], SX - 1.3 + (i % 4) * .5, qi), lerp(p0[1], .2, qi) + 1.8 * Math.sin(PI * qi), lerp(p0[2], 2.5 + (i % 3) * .35, qi)); });
    vis(tara, t, tTa - .15, 1e9, { dy: 0, sc: .7 }); ancora(tara, [SX - .3, .55, 2.7], .5, 1, 0, -6);
    conta(most.mn, t, tIm, .9, VENDA10.bruto, VENDA10.liquido); most.troca(t, tIm);
    // a nota entra com o líquido
    cresce(nf, t, tLi + .05, .7, .0); nf.rotation.y = -.12; nf.updateWorldMatrix(true, true);
    vis(cNf, t, tLi + .2, 1e9, { dy: 10 }); ancora(cNf, mundo(nf, nf.userData.topo), .5, 1, 0, -6); pulse(cNf, t, tNo, .1, .8);
    const NFp = (x, y) => mundo(nf, [x, y, .02]);
    vis(itn, t, tCb - .1, 1e9, { dy: 8 }); ancora(itn, NFp(-.8, .15), 0, .5);
    vis(pu, t, tMe + .35, 1e9, { dy: 8 }); ancora(pu, NFp(-.8, -.2), 0, .5);
    vis(tt, t, Math.max(tMe + 1.1, tRe - 2.0), 1e9, { dy: 8 }); ancora(tt, NFp(-.8, -.75), 0, .5);
    const qc = eio(pr(t, tCb - .2, .85)), [cx0, cy0] = tela([SX, 2.7, 0]), [cx1, cy1] = tela(NFp(.45, .85));
    chipL.style.left = (lerp(cx0, cx1, qc) - 50).toFixed(1) + 'px'; chipL.style.top = (lerp(cy0, cy1, qc) - 20 - 90 * 4 * qc * (1 - qc)).toFixed(1) + 'px';
    chipL.style.opacity = t >= tCb - .2 ? 1 : 0; chipL.style.visibility = t >= tCb - .2 ? 'visible' : 'hidden';
    const hl = eo(pr(t, tLq - .1, .4)); chipL.style.boxShadow = `0 0 0 ${(4 * hl).toFixed(2)}px #F2B63D`; if (t >= tLq - .1) pulse(chipL, t, tLq, .08, .7);
    // a dica: o ticket (bruto) × a nota (líquido)
    vis(tick, t, tTk - .2, 1e9, { dy: -100, din: .7 }); tick.style.left = '50px'; tick.style.top = '140px';
    vis(dif, t, tCm - .15, 1e9, { dy: 0, sc: .5 }); dif.style.left = '330px'; dif.style.top = '170px';
    const hb = eo(pr(t, tBr - .1, .4)); tb.style.boxShadow = `0 0 0 ${(4 * hb).toFixed(2)}px #F2B63D`; tb.style.background = hb > .5 ? '#FFF5DF' : '#fff'; pulse(tb, t, tBr, .08, .7);
  };
};

// ------------------------------------------------------------------ CAPS[14] · DANFE e XML (L0-L1)
// 0 "Agora, os arquivos da nota. Toda nota autorizada tem dois: o DANFE e o XML."
// 1 "O DANFE é a folha impressa que acompanha a carga no caminhão. O XML é o arquivo oficial da nota, que o contador guarda."
CAPS[14] = () => {
  const g = grupo(CENA), XT = -4.0, XPA = 4.5, NX = .3;
  chaoPatio(CENA, [0, 0, 0], { c: 30, l: 11, passo: 2.6, faixa: [3.0] });
  const T = caminhao(CENA, [XT, 0, 0], { c: 5.2, l: 2.1, R: .42, eixos: 2, cc: 1.7, hc: 1.55 }), u = T.userData;
