<script type="module">
import { PI, cl, lerp, pr, eo, eio, eo5, eis, passa, golpe, W, el, ic, vis, foco, pulso, ondaEm, conta, titulo, posTitulo, selo,
  htmlChip, htmlCartao, htmlOp, htmlFluxo, fluxo, CENA, GL, THREE, mat, caixa, malha, grupo, mundo, mancha, piso, anel, destaque, U, camera, posCam,
  lugar, plano, clima, cena, estilo, enquadraRet }
  from '../../../../perfis/ecoflix/cenas_v3/motor.js';
import { ceuClaro, mundoEscuro } from '../../../../perfis/ecoflix/cenas_v3/fundo.js';
import { htmlFluxoCartoes, fluxoCartoes, parte } from '../../../../perfis/ecoflix/cenas_v3/dados/fluxoCartoes.js';
import { reais } from '../../../../perfis/ecoflix/cenas_v3/dados/base.js';
import { cofre } from '../../../../perfis/ecoflix/cenas_v3/objetos/cofre.js';
import { registradora } from '../../../../perfis/ecoflix/cenas_v3/objetos/registradora.js';
import { banco } from '../../../../perfis/ecoflix/cenas_v3/objetos/banco.js';

// =====================================================================================================================
// comuns
const NUNCA = 1e9, EE = .0112, ROTC = [-.2, .08, 0];
const cores = () => estilo('t14-cor', `.chip.am{background:linear-gradient(150deg,#F7CB68,#E59A22);color:#3A2A06;border-color:rgba(255,255,255,.4);box-shadow:0 12px 22px -8px rgba(229,154,34,.6)}
.selo.vm{background:linear-gradient(150deg,#FF9A8C,#E5564A);box-shadow:0 10px 18px -6px rgba(229,86,74,.6),inset 0 1px 0 rgba(255,255,255,.45)}`);
const cartaoP = (icone, rot, sub, cls, cw = 190) => htmlFluxoCartoes({ cartoes: [[icone, rot, sub, cls]], cw });   // cartão pequeno (selo + rótulo + legenda)
const subK = (p, i, t, a) => { const s = parte(p.e, i).querySelector('.d-s'); if (s) s.style.opacity = eo(pr(t, a, .3)).toFixed(3); };   // a legenda do cartão i entra na palavra que a diz
const subDe = (p, t, a) => { const s = p.e.querySelector('.sub'); if (s) s.style.opacity = eo(pr(t, a, .3)).toFixed(3); };   // idem, para o degrau
const poeTxt = (e, s) => { if (e && e.textContent !== s) e.textContent = s; };
// o lugar do número até a fala dizer o valor (tracejado), como na T06 e na T08
const vaga = (c, w = 236, cor = 'rgba(255,255,255,.3)') => el(`<div class="ab" style="left:22px;bottom:20px;width:${w}px;height:44px;border-radius:12px;border:2px dashed ${cor}"></div>`, c.e);
const chega = (c, v, t, a) => { const k = eo(pr(t, a, .3)); c.e.querySelector('.num').style.opacity = k.toFixed(3); v.style.opacity = (1 - k).toFixed(3); };
const some = (o, k) => { o.visible = k > .002; if (o.visible) o.scale.setScalar(k); };   // objeto 3D que entra crescendo (k passa de 1 e volta)
// degrau: cartão baixo de uma linha (selo + nome + legenda opcional)
const degrau = (icone, rot, sub, o = {}) => `<div class="cartao ${o.cc ?? ''}" style="position:relative;width:${o.w ?? 360}px;height:${o.h ?? 84}px;padding:0 20px;display:flex;align-items:center;gap:13px;white-space:nowrap">
  ${selo(icone, o.cls ?? 'n', o.selo ?? 46)}<div><div class="rot">${rot}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>${o.res ? '<div class="onda"></div>' : ''}</div>`;
// um lugar do mundo escuro: posições em px do desenho (y para baixo)
function escuro() {
  const EIXO = lugar([0, 0, 0]), E = mundoEscuro(EIXO, 0, EE);
  return { EIXO, X: (html, x, y, o = {}) => E(html, x * EE, -y * EE, 0, o), ret: (a, b, c, d) => [a * EE, -d * EE, c * EE, -b * EE], fundo: (cx, cy, o) => E.fundo(cx * EE, -cy * EE, o) };
}
const aqui = (p, x, y) => { p.pos[0] = x * EE; p.pos[1] = -y * EE; };
const STAND = (t, tit, t0, sai) => { clima(1); GL.style.visibility = 'hidden'; posTitulo(tit, t, t0 - .9, t0 - .45, sai); };

// =====================================================================================================================
// CENA "bancoSistema" · cap00, linhas 0 e 1 · clima escuro (extrato do banco, sistema, diferença)
// 0 "Oi! Neste tutorial a gente vai fazer o extrato do banco bater com o sistema da Recicla Vale Metais, linha por linha, até a diferença zerar."
// 1 "Sabe quando o banco mostra um saldo, o sistema mostra outro, e ninguém sabe de onde vem a diferença? É isso que a gente resolve aqui."
// Extrato do banco menos Sistema igual Diferença. Na linha 0 a meta: linha por linha, a diferença zera (R$ 0,00). Na linha 1 o problema:
// os dois saldos aparecem diferentes e a diferença vira uma pergunta.
function bancoSistema() {
  const t0 = .4, tex = W(0, 'extrato'), tsi = W(0, 'sistema'), tli = W(0, 'linha'), tdf = W(0, 'diferenca'), tze = W(0, 'zerar'),
    tba = W(1, 'banco'), tsa = W(1, 'saldo'), ts2 = W(1, 'sistema'), tou = W(1, 'outro'), tni = W(1, 'ninguem'), ton = W(1, 'onde'), td2 = W(1, 'diferenca'), tfim = W(1, 'aqui', 1, 'e');
  cores();
  const { EIXO, X, ret, fundo } = escuro(), CW = 330, PIT = CW + 92, Y = 0;
  const cBan = X(htmlCartao('landmark', 'Extrato do banco', 'Saldo', 'R$ 44.933,47', { w: CW, h: 132 }), -PIT, Y);
  const cSis = X(htmlCartao('monitor', 'Sistema', 'Saldo', 'R$ 45.236,97', { w: CW, h: 132 }), 0, Y);
  const cDif = X(htmlCartao('scale', 'Diferença', 'até zerar', 'R$ 0,00', { w: CW, h: 132, res: true }), PIT, Y);
  const opM = X(htmlOp('−'), -PIT / 2, Y, { z: 40 }), opI = X(htmlOp('='), PIT / 2, Y, { z: 40 });
  const chL = X(htmlChip(`${ic('list', 18)}linha por linha`, 'n'), 0, 118, { anc: [.5, 0], z: 40 });
  const vB = vaga(cBan, 236), vS = vaga(cSis, 236), vD = vaga(cDif, 236, 'rgba(108,240,168,.5)');
  const nB = cBan.e.querySelector('.num'), nS = cSis.e.querySelector('.num'), nD = cDif.e.querySelector('.num'), sD = cDif.e.querySelector('.sub'), onD = cDif.e.querySelector('.onda');
  fundo(0, 0, { aneis: false });
  const tit = titulo('Conciliação', 'Extrato e sistema', 'escuro');
  const S1 = enquadraRet(EIXO, ret(-PIT - CW / 2 - 8, -66 - 14, PIT + CW / 2 + 8, 118 + 50), { az: -.03, max: 1.4 / EE });
  camera([[t0 - 3, S1], [tfim + 2.5, { ...S1, az: .03, d: S1.d * .985 }, 'lin']]);
  return t => {
    STAND(t, tit, t0);
    vis(cBan.e, t, tex - .1, NUNCA, { dy: 18 }); vis(opM.e, t, tsi - .3, NUNCA, { dy: 10, sc: .8 }); vis(cSis.e, t, tsi - .1, NUNCA, { dy: 18 });
    vis(chL.e, t, tli - .1, NUNCA, { dy: 10, sc: .8 });
    vis(opI.e, t, tdf - .3, NUNCA, { dy: 10, sc: .8 }); vis(cDif.e, t, tdf - .1, NUNCA, { dy: 18 });
    // a meta: a diferença zera; depois o problema: os saldos diferem e a diferença vira pergunta
    chega(cBan, vB, t, tsa - .05); conta(nB, t, tsa - .05, 1.1, 0, 44933.47, reais); pulso(cBan.e, t, tba, .03, .8);
    chega(cSis, vS, t, tou - .05); conta(nS, t, tou - .05, 1.1, 0, 45236.97, reais); pulso(cSis.e, t, ts2, .03, .8);
    chega(cDif, vD, t, tze - .05); ondaEm(onD, t, tze + .05); pulso(cDif.e, t, tze + .05, .04, .8);
    const q = t > tni - .05; poeTxt(nD, q ? '?' : 'R$ 0,00'); poeTxt(sD, q ? 'de onde vem' : 'até zerar'); nD.style.color = q ? 'var(--am)' : ''; sD.style.opacity = t > tze - .05 || q ? 1 : 0;
    if (q) pulso(cDif.e, t, td2, .05, .8);
    const a = eo(pr(t, tni - .05, .3)); void a; void ton;
  };
}

// =====================================================================================================================
// CENA "cofreBanco" · cap04, linha 0 · clima claro (o dinheiro vivo e o dinheiro nas contas)
// 0 "Agora o cofre. Ele é todo o dinheiro vivo da empresa: o que está guardado e o que está nos caixas abertos. O banco é o dinheiro
//    nas contas. Os dois juntos dão o total da empresa."
// O cofre abre (guardado); a registradora aparece com a gaveta aberta (caixas abertos): juntos são o cofre. O banco entra (as contas).
// Na conta da frente: Cofre mais Banco igual Total da empresa.
function cofreBanco() {
  const t0 = W(0, 'agora'), tco = W(0, 'cofre'), ttd = W(0, 'todo'), tgu = W(0, 'guardado'), tcx = W(0, 'caixas'), tab = W(0, 'abertos'),
    tba = W(0, 'banco'), tct = W(0, 'contas'), tju = W(0, 'juntos'), tto = W(0, 'total'), tem = W(0, 'empresa', 2), tfim = W(0, 'empresa', 2, 'e');
  cores();
  piso({ r: 26, x: 0, z: 0, passo: 1.3 }); U.uNevoa.value.set(.955, .975, .965, .8); ceuClaro({ halo: [-.2, 3.2, -12] });
  const SX = -2.6, RX = -.9, BX = 1.3;
  const COF = cofre(CENA, [SX, 0, 0], { s: 1.25 }); COF.rotation.y = .16;
  const REG = registradora(CENA, [RX, 0, .15], { s: 2.4, cupom: false }), BA = banco(CENA, [BX, 0, -1.8], { s: .34 });
  const FX = [-3.0, .3, 3.6], FY = .52, FZ = 5.6, EC = .0062, CWD = 322;
  const cart = (i, ...a) => plano(htmlCartao(...a), { pos: [FX[i], FY, FZ], rot: ROTC, esc: EC });
  const c1 = cart(0, 'vault', 'DINHEIRO (COFRE)', 'todo o dinheiro vivo', '', { w: CWD, h: 108 }), c2 = cart(1, 'landmark', 'Banco', 'o dinheiro nas contas', '', { w: CWD, h: 108 }),
    c3 = cart(2, 'sigma', 'Total da empresa', 'os dois juntos', '', { w: CWD, h: 108, res: true });
  const oM = plano(htmlOp('+'), { pos: [(FX[0] + FX[1]) / 2, FY, FZ + .03], rot: ROTC, esc: EC }), oI = plano(htmlOp('='), { pos: [(FX[1] + FX[2]) / 2, FY, FZ + .03], rot: ROTC, esc: EC });
  const on3 = c3.e.querySelector('.onda'), sC = FX.map(x => mancha(2.0, .8, [x, 0, FZ - .1], { op: 0 }));
  const chip = (txt, x, y) => plano(htmlChip(txt, 'n'), { pos: [x, y, 0], rot: ROTC, esc: .0098, anc: [.5, 1] });
  const chG = chip(`${ic('lock', 18)}guardado`, SX - .45, 2.42), chA = chip(`${ic('wallet', 18)}nos caixas abertos`, RX + .5, 2.42), chC = chip(`${ic('landmark', 18)}nas contas`, BX, 2.95);
  const tit = titulo('Cofre', 'O cofre e o banco');
  const P1 = { x: -.7, y: 1.45, z: 2.4, d: 13.4, az: .1, el: .2 }, P2 = { x: -.1, y: 1.5, z: 2.4, d: 14.2, az: .06, el: .2 }, P3 = { x: .3, y: 1.55, z: 2.4, d: 15.0, az: .03, el: .2 };
  camera([[t0 - 3, P1], [tba - .9, { ...P1, d: 13.2, az: .09 }, 'lin'], [tba + .6, P2], [tju - .4, { ...P2, d: 14.4, az: .05 }, 'lin'], [tju + .8, P3], [tfim + 2.5, { ...P3, d: 15.2, az: .02 }, 'lin']]);
  return t => {
    GL.style.opacity = eo(pr(t, t0 + .08, .5)).toFixed(3); posTitulo(tit, t, t0 - .9, t0 - .45);
    // o cofre: abre em "todo o dinheiro vivo"; a registradora é um caixa aberto
    COF.userData.abre(eio(pr(t, ttd - .25, .95)));
    some(REG, passa(pr(t, tcx - .2, .6), 1.3)); REG.userData.abre(eio(pr(t, tab - .1, .55)));
    some(BA, passa(pr(t, tba - .2, .6), 1.3));
    vis(chG.e, t, tgu - .1, NUNCA, { dy: 10, sc: .8 }); vis(chA.e, t, tcx - .1, NUNCA, { dy: 10, sc: .8 }); vis(chC.e, t, tct - .1, NUNCA, { dy: 10, sc: .8 });
    // a conta da frente
    vis(c1.e, t, tco - .1, NUNCA, { dy: 22 }); vis(oM.e, t, tba - .3, NUNCA, { sc: .6, dy: 0 }); vis(c2.e, t, tba - .1, NUNCA, { dy: 22 });
    vis(oI.e, t, tju - .1, NUNCA, { sc: .6, dy: 0 }); vis(c3.e, t, tto - .1, NUNCA, { dy: 22, sc: .94 }); pulso(c3.e, t, tem, .04, .8); ondaEm(on3, t, tem);
    [c1, c2, c3].forEach((c, i) => { sC[i].material.uniforms.uOp.value = .55 * Math.min(1, +c.e.style.opacity || 0); });
  };
}

// =====================================================================================================================
// CENA "soMuda" · cap05, linha 5 · clima escuro (o dinheiro só troca de pote)
// 5 "Uma dica: transferência entre contas suas, saque e depósito só mudam o dinheiro de lugar. A empresa não fica mais rica nem mais pobre,
//    então nada disso entra na DRE."
// Conta Secundária, Conta Principal e o cofre numa fileira; a transferência e o saque são as setas entre eles; o dinheiro só muda de lugar;
// o Total da empresa não muda e fica fora da DRE.
function soMuda() {
  const t0 = W(5, 'uma'), ttr = W(5, 'transferencia'), tct = W(5, 'contas'), tsa = W(5, 'saque'), tso = W(5, 'so'), tlu = W(5, 'lugar'),
    tem = W(5, 'empresa'), tna = W(5, 'nao'), tpo = W(5, 'pobre'), tnd = W(5, 'nada'), tdr = W(5, 'dre'), tfim = W(5, 'dre', 1, 'e');
  cores();
  const { EIXO, X, ret, fundo } = escuro(), YR = -60, YT = 150;
  const fl = X(htmlFluxoCartoes({ cartoes: [['landmark', 'Conta Secundária', '', 'n'], ['landmark', 'Conta Principal', '', 'n'], ['vault', 'DINHEIRO (COFRE)', '', 'n']], cw: 230, vao: 150 }), 0, YR);
  const VAO = 150, CWR = (fl.w - 2 * VAO) / 3, x1 = -fl.w / 2 + CWR + VAO / 2, x2 = -fl.w / 2 + 2 * CWR + 1.5 * VAO, YC = YR - fl.h / 2 - 14;
  const chTr = X(htmlChip(`${ic('arrow-left-right', 18)}Transferência`, 'n'), x1, YC, { anc: [.5, 1], z: 40 }), chSa = X(htmlChip(`${ic('landmark', 18)}Saque`, 'n'), x2, YC, { anc: [.5, 1], z: 40 });
  const chLu = X(htmlChip('só muda de lugar', 'am'), 0, 36, { anc: [.5, 0], z: 40 });
  const tot = X(htmlCartao('sigma', 'Total da empresa', 'Não muda', '', { w: 330, h: 96, mt: 0 }), -90, YT);
  const chDr = X(htmlChip(`${ic('ban', 18)}Fora da DRE`, 'am'), -90 + 165 + 34, YT, { anc: [0, .5], z: 40 }); chDr.e.style.transformOrigin = '0 50%';
  fundo(0, 40, { aneis: false });
  const tit = titulo('Movimentações', 'Só muda de lugar', 'escuro');
  const XR = Math.max(fl.w / 2, -90 + 165 + 34 + chDr.w);
  const S1 = enquadraRet(EIXO, ret(-Math.max(fl.w / 2, 255) - 8, YC - 46, XR + 8, YT + 48 + 6), { az: -.03, max: 1.4 / EE });
  camera([[t0 - 3, S1], [tfim + 2.5, { ...S1, az: .03, d: S1.d * .985 }, 'lin']]);
  return t => {
    STAND(t, tit, t0);
    fluxoCartoes(fl.e, t, ttr - .1, NUNCA, { tempos: [ttr - .05, tct - .05, tsa - .05] });
    vis(chTr.e, t, ttr, NUNCA, { dy: 10, sc: .8 }); vis(chSa.e, t, tsa, NUNCA, { dy: 10, sc: .8 });
    vis(chLu.e, t, tso - .05, NUNCA, { dy: 10, sc: .8 }); pulso(chLu.e, t, tlu, .05, .8);
    vis(tot.e, t, tem - .1, NUNCA, { dy: 18 }); { const s = tot.e.querySelector('.sub'); s.style.opacity = eo(pr(t, tna - .1, .3)).toFixed(3); } pulso(tot.e, t, tpo, .03, .8);
    vis(chDr.e, t, tdr - .15, NUNCA, { dy: 10, sc: .8 }); pulso(chDr.e, t, tdr + .05, .05, .8); void tnd;
  };
}

// =====================================================================================================================
// CENA "conciliar" · cap07, linhas 0 a 2 · clima escuro (cada linha do extrato com seu par)
// 0 "Com as contas em dia, a conciliação. Conciliar é conferir cada linha do extrato do banco com um lançamento do sistema."
// 1 "Quando toda linha tem par, a diferença entre o saldo do banco e o do sistema chega a zero."
// 2 "E a linha que sobra mostra o que ficou sem lançar, como uma tarifa que ninguém viu. É isso que deixa o fechamento do mês certo."
// Duas colunas: o extrato do banco (quatro linhas) e os lançamentos do sistema, ligados par a par; com todas pareadas a Diferença é R$ 0,00;
// aparece uma linha a mais (TARIFA PACOTE SERVICOS, R$ 64,90) sem par: é o que ficou sem lançar.
function conciliar() {
  const t0 = W(0, 'com'), tex = W(0, 'extrato'), tli = W(0, 'linha'), tlc = W(0, 'lancamento'), tsi = W(0, 'sistema'),
    tpa = W(1, 'par'), tdf = W(1, 'diferenca'), tze = W(1, 'zero'),
    tso = W(2, 'sobra'), tse = W(2, 'sem'), tni = W(2, 'ninguem'), tfe = W(2, 'fechamento'), tce = W(2, 'certo'), tfim = W(2, 'certo', 1, 'e');
