<html lang="pt-BR"><head><meta charset="utf-8">
<!-- EcoFlix T14 "Bancos, cofre e conciliação bancária": ilustrações de conceito. Cópia do kit perfis/ecoflix/cenas/cenas_ecoflix.html
     (estilo, utilidades e desenhos genéricos iguais; os dois exemplos do kit saíram) com as cenas da aula:
       CAPS[0] O banco e o sistema · CAPS[3] O cofre e o banco · CAPS[4] O dinheiro muda de lugar · CAPS[5] Cada linha com um par
       CAPS[6] O extrato em OFX · CAPS[10] Data e centavos · CAPS[11] Ignorar o par / Ignorar com cuidado (duas janelas)
       CAPS[12] Dois Pix iguais · CAPS[14] Os três números
     Cada cena vive na janela das âncoras do ANC (o mesmo do ilustracoes.json): de W(de) - 0,3 s até W(ate, fim) + cauda.
     Tempos estimados em tempos/capNN.json (tempos_estimados.py --tts ../narracao/tts_textos.py --cap N); quando a voz
     chegar, as cenas se ajustam às palavras. Renderizar só o trecho:
       node render_cenas.cjs <n> <capNN.json> <saida.mp4> --html cenas.html --de <W(de) - 0,3> --ate <W(ate, fim) + cauda>
     Extras desta aula (fora do kit, os mesmos da T13): WS (W com a ocorrência exata), jan, cores de status do app (vermelho
     de saída e "Vencida", violeta do "Saldo", cinza de "Pendente"/"Ignorada"). Rótulos do app conferidos no T14/inventario.md;
     contas sem banco nem logo (ícone genérico), como o mundo pede. -->
<style>
@font-face{font-family:M;font-weight:500;src:url(../../../web/fonts/montserrat-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:600;src:url(../../../web/fonts/montserrat-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:700;src:url(../../../web/fonts/montserrat-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:800;src:url(../../../web/fonts/montserrat-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:500;src:url(../../../web/fonts/montserrat-latin-ext-500-normal.woff2) format('woff2');unicode-range:U+0100-024F}

/* ---------------------------------------------------------------- paleta EcoFlix (marca: acento #50D088, escuro #121212)
   --v  acento: preenchimentos, barras, contornos de destaque (nunca texto sobre branco: contraste baixo)
   --ve verde escuro: texto e ícone verde sobre branco (contraste 5,0)   --vc verde claro: fundo de ícone/resultado
   --a  âmbar: o SEGUNDO conceito da cena (ex.: competência x caixa)     --ae texto âmbar (5,9)   --ac âmbar claro
   --t  texto (o escuro da marca)   --c texto secundário (4,8)   --l linhas   --e painel escuro (mostrador) */
:root{--v:#50D088;--ve:#2E7D57;--vc:#EAF8F0;--vm:#A9E9C6;--a:#F2B63D;--ae:#8A5A00;--ac:#FFF5DF;
  --t:#121212;--c:#6B7280;--l:#E6E9EE;--e:#121212}
*{box-sizing:border-box;margin:0;padding:0;transition:none!important;animation:none!important}
html,body{width:1280px;height:800px;overflow:hidden;background:#fff}
body{font-family:M,sans-serif;color:var(--t);-webkit-font-smoothing:antialiased}
#st{position:absolute;inset:0;overflow:hidden;background:
  radial-gradient(1100px 650px at 92% -12%,rgba(80,208,136,.09),transparent 62%),
  radial-gradient(900px 600px at -12% 112%,rgba(80,208,136,.06),transparent 60%),#fff}
.g{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:640px 400px}
.ab{position:absolute}
.row{display:flex;align-items:center}
/* título da cena: área (kicker) + conceito; sozinho fica grande no centro e sobe quando o desenho entra */
.kick{font-weight:700;font-size:15px;letter-spacing:.3em;color:var(--ve);text-transform:uppercase}
.h{font-weight:800;font-size:46px;letter-spacing:-.01em;line-height:1.1}
/* cartão, chip, etiqueta, ícone */
.card{position:absolute;background:#fff;border:1px solid #E1E8E4;border-radius:18px;
  box-shadow:0 18px 40px rgba(16,24,40,.10),0 3px 8px rgba(16,24,40,.06)}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:100%;height:100%}
.ico{display:flex;align-items:center;justify-content:center;flex:none;border-radius:14px;background:var(--vc);color:var(--ve)}
.ico.a{background:var(--ac);color:var(--ae)}
.tag{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;font-weight:800;font-size:20px;white-space:nowrap}
.tag.v{background:var(--vc);color:var(--ve)} .tag.a{background:var(--ac);color:var(--ae)}
.lbl{font-weight:700;font-size:17px;color:var(--c)}
.num{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.op{position:absolute;width:60px;height:60px;border-radius:50%;background:#F2F4F7;color:var(--t);display:flex;
  align-items:center;justify-content:center;font-weight:800;font-size:34px;line-height:1}
/* mostrador da balança (painel escuro, número no acento) */
.most{background:var(--e);border-radius:16px;padding:16px 22px 18px;box-shadow:0 16px 34px rgba(16,24,40,.22)}
.most .ml{position:relative;height:20px;font-weight:700;font-size:15px;letter-spacing:.22em;color:#A9E9C6;text-transform:uppercase}
.most .ml span{position:absolute;left:0;top:0;white-space:nowrap}
.most .mn{margin-top:6px;font-weight:800;font-size:44px;color:var(--v);font-variant-numeric:tabular-nums;white-space:nowrap}
.rip{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:3px solid var(--v);opacity:0}
</style>
<style>
/* ---------------------------------------------------------------- T14 (como na T13): cores de status do app, no tom do kit (texto >= 4,5)
   --r  vermelho de "A Pagar" e "Vencida" (texto 6,6 no branco)   --rc fundo claro   --rm contorno
   --p  violeta do chip "Saldo" (7,1)   --pc fundo claro   --pm contorno     --g cinza de "Pendente" (7,6)   --gc fundo
   Classe do cinza: .cz (o .g do kit é o grupo da cena, absoluto em 1280x800: não usar "g" em chip ou ícone). */
:root{--r:#B42318;--rc:#FDECEA;--rm:#F2A49C;--p:#6D28D9;--pc:#F1EAFE;--pm:#C4B1F5;--g:#4B5563;--gc:#EEF1F4}
.tag.r{background:var(--rc);color:var(--r)} .tag.p{background:var(--pc);color:var(--p)} .tag.cz{background:var(--gc);color:var(--g)}

.ico.r{background:var(--rc);color:var(--r)} .ico.cz{background:var(--gc);color:var(--g)} .ico.p{background:var(--pc);color:var(--p)}
.card.b2{border-width:2px}
.num{white-space:nowrap}                     /* valor nunca quebra em duas linhas */
.bdg{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.cel{position:absolute;display:flex;align-items:center;justify-content:center}
.hd{position:absolute;text-align:center;font-weight:700;font-size:17px;color:var(--ve)}
</style>

<script>
// ------------------------------------------------------------------ utilidades (as do cenas_modelo.html + as da EcoFlix)
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const pr=(t,a,d=.45)=>cl((t-a)/d);
const lerp=(a,b,p)=>a+(b-a)*p;
const $=s=>document.querySelector(s);
const ST=document.getElementById('st');
function el(html,parent=ST){const d=document.createElement('div');d.innerHTML=html.trim();let f=null;for(const n of [...d.childNodes]){parent.appendChild(n);if(!f&&n.nodeType===1)f=n}return f}
function grupo(){return el('<div class="g"></div>')}
function ic(n,px,cor){const s=(window.ICONS||{})[n]||'';return `<span class="ic" style="width:${px}px;height:${px}px;${cor?'color:'+cor:''}">${s}</span>`}
function hex(c){c=c.replace('#','');return[0,2,4].map(i=>parseInt(c.substr(i,2),16))}
function mix(a,b,p){const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*cl(p))).join(',')})`}
// aparece em a, some em b (opacidade + leve subida + escala): a entrada e a saída suaves de tudo
function vis(e,t,a,b=1e9,o={}){
  const din=o.din??.5,dout=o.dout??.4,dy=o.dy??16,dx=o.dx??0,sc=o.sc??.985;
  const p=eo(pr(t,a,din)),q=1-eo(pr(t,b,dout)),op=Math.min(p,q);
  e.style.opacity=op.toFixed(4);e.style.visibility=op<=.001?'hidden':'visible';
  const s=sc+(1-sc)*p - (1-q)*(1-sc);
  e.style.transform=`translate(${((1-p)*dx).toFixed(2)}px,${((1-p)*dy-(1-q)*dy*.5).toFixed(2)}px) scale(${s.toFixed(4)})`;
  return op;
}
function ripple(r,t,a){const p=pr(t,a,.7);r.style.opacity=(p>0&&p<1)?(.6*(1-p)).toFixed(3):0;r.style.transform=`scale(${(.4+2.0*eo(p)).toFixed(3)})`}
function pulse(e,t,a,amp=.045,dur=.9){const p=pr(t,a,dur);e.style.scale=(p>0&&p<1)?(1+amp*Math.sin(Math.PI*p)).toFixed(4):''}
function digita(e,txt,t,a,b){const p=cl((t-a)/Math.max(.05,b-a));const n=Math.round(p*txt.length);
  const car=(p>0&&p<1)||(Math.floor(t*2.2)%2===0&&p<1.2&&t>=a)?'<span style="color:var(--v);font-weight:500">|</span>':'';
  e.innerHTML=(txt.slice(0,n)||'')+(t>=a&&t<b+.8?car:'');}
// EcoFlix: números e dinheiro no jeito brasileiro; contagem suave de um número; traço que se desenha; arco; contorno
const NF=new Intl.NumberFormat('pt-BR');
const kg=v=>NF.format(Math.round(v))+' kg';
const brl=v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function conta(e,t,a,d,v0,v1,fmt=kg){const p=eo(pr(t,a,d));const s=fmt(lerp(v0,v1,p));if(e.textContent!==s)e.textContent=s;return p}
function traco(p,t,a,d=.8){if(!p._L){p._L=p.getTotalLength();p.style.strokeDasharray=p._L}const q=eio(pr(t,a,d));p.style.strokeDashoffset=(p._L*(1-q)).toFixed(2);p.style.opacity=q>0?1:0;return q}
function arco(e,t,a,d,x0,y0,x1,y1,h=-80,rot=0){const p=eio(pr(t,a,d));const x=lerp(x0,x1,p),y=lerp(y0,y1,p)+h*4*p*(1-p);
  e.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${(rot*p).toFixed(2)}deg)`;return p}
function contorno(e,t,a,de,para,d=.45){e.style.borderColor=mix(de,para,eo(pr(t,a,d)))}
// título padrão da cena: grande no centro enquanto está sozinho, sobe para o alto quando o desenho entra (em "sobe")
function titulo(g,kick,txt){return el(`<div class="ab" style="left:0;top:0;width:1280px;text-align:center">
  <div class="kick">${kick}</div><div class="h" style="margin-top:12px">${txt}</div></div>`,g)}
function posTitulo(e,t,a,sobe,sai=1e9){vis(e,t,a,sai,{dy:14});const p=eio(pr(t,sobe,.7));
  e.style.top=lerp(318,46,p).toFixed(2)+'px';e.style.scale=lerp(1.12,1,p).toFixed(4)}

// ------------------------------------------------------------------ tempos da fala (capNN.json do proc.py ou estimado)
let D=null;
const norm=w=>w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9%./-]+/g,'');
function W(linha,palavra,n=1,campo='s'){
  const alvo=norm(palavra);let k=0;
  for(const w of D.words){if(w.linha===linha&&norm(w.w).replace(/[.,]$/,'')===alvo){k++;if(k===n)return w[campo]}}
  for(const w of D.words){if(w.linha===linha&&norm(w.w).startsWith(alvo)){k++;if(k>=n)return w[campo]}}
  console.warn('palavra não achada',linha,palavra);return L(linha);
}
const L=i=>(D.linhas[i]||{s:0}).s, LE=i=>(D.linhas[i]||{e:D.dur}).e;

// ------------------------------------------------------------------ desenhos genéricos (sem marca)
// caminhão de lado (frente para a direita), com a carga de sucata em pedaços (.pd) que podem ser descarregados
function caminhao(){
  const pd=[ // [forma, cor, centro da peça, destino no monte atrás do caminhão (deslocamento do centro e giro)]
    ['<polygon points="28,90 44,52 88,42 100,90"/>','#8C5A3C',[64,66],[-224,148,6]],
    ['<polygon points="82,90 102,36 146,48 154,90"/>','#6F7983',[118,63],[-318,122,12]],
    ['<rect x="118" y="44" width="112" height="16" rx="8" transform="rotate(-8 174 52)"/>','#9AA3AD',[174,52],[-334,98,-18]],
    ['<polygon points="148,90 170,54 212,44 232,90"/>','#A0694A',[190,67],[-425,148,-8]],
    ['<polygon points="210,90 232,40 276,54 286,90"/>','#4F5861',[248,65],[-373,120,-10]],
    ['<polygon points="258,90 282,60 308,66 312,90"/>','#8A949E',[285,75],[-375,148,4]],
    ['<g><circle cx="192" cy="64" r="19"/><circle cx="192" cy="64" r="7" fill="#8A949E"/></g>','#5E6670',[192,64],[-242,155,200]],
    ['<polygon points="40,70 60,50 84,64 64,86"/>','#B07A55',[62,68],[-307,100,30]]];
  const pecas=pd.map(([f,c,[cx,cy],[dx,dy,r]])=>`<g class="pd" data-cx="${cx}" data-cy="${cy}" data-dx="${dx}" data-dy="${dy}" data-r="${r}" fill="${c}">${f}</g>`).join('');
  const roda=x=>`<g class="roda" data-x="${x}" transform="translate(${x},196)"><circle r="26" fill="#1B1F24"/><circle r="12" fill="#9AA3AD"/>
    <rect x="-2.5" y="-23" width="5" height="10" rx="2" fill="#5B636C"/><rect x="-2.5" y="13" width="5" height="10" rx="2" fill="#5B636C"/></g>`;
  return `<svg viewBox="0 0 500 230" width="500" height="230" style="overflow:visible">
    <g class="carga">${pecas}</g>
    <rect x="18" y="86" width="304" height="88" rx="6" fill="#7E8994"/>
    <rect x="16" y="82" width="308" height="11" rx="4" fill="#68727D"/>
    <g stroke="#707A85" stroke-width="3">${[78,138,198,258].map(x=>`<line x1="${x}" y1="98" x2="${x}" y2="168"/>`).join('')}</g>
    <path d="M334,176 L334,76 Q334,64 346,64 L412,64 L462,116 L472,121 Q480,124 480,134 L480,176 Z" fill="#2F3640"/>
    <path d="M348,78 L406,78 L444,116 L348,116 Z" fill="#D7E5ED"/>
    <rect x="470" y="142" width="10" height="11" rx="2" fill="#F2B63D"/>
    <rect x="12" y="170" width="472" height="15" rx="4" fill="#23282E"/>
    ${roda(92)}${roda(158)}${roda(416)}
  </svg>`;
}

// ------------------------------------------------------------------ T14: extras desta aula (fora do kit; os mesmos da T13)
// WS: o W do kit exigindo a ocorrência exata (o W cai para "começa com" e pode pegar outra palavra sem avisar)
function WS(linha,palavra,n=1,campo='s'){const alvo=norm(palavra);let k=0;
  for(const w of D.words){if(w.linha===linha&&norm(w.w).replace(/[.,]$/,'')===alvo){k++;if(k===n)return w[campo]}}
  console.warn('palavra não achada',linha,palavra,n);return W(linha,palavra,n,campo)}
// âncoras de cada cena (o ilustracoes.json sai daqui): a janela é [W(de) - 0,3 s, W(ate, fim) + cauda]
const ANC=/*ANC*/{
"0":[{"id":"ilu00_banco_sistema","de":[0,"Oi",1],"ate":[1,"aqui",1],"cauda":0.6,
      "resumo":"o extrato do banco e o sistema mostram saldos diferentes; conferindo linha por linha, a diferença zera",
      "mostra":["Extrato do banco","Sistema","Saldo","R$ 44.933,47","R$ 46.382,57","Diferença","R$ 0,00"]}],
"3":[{"id":"ilu03_cofre_banco","de":[0,"Agora",1],"ate":[0,"empresa",2],"cauda":0.6,
      "resumo":"o cofre é o dinheiro vivo (guardado e nos caixas abertos), o banco é o dinheiro nas contas; os dois juntos dão o total da empresa",
      "mostra":["DINHEIRO (COFRE)","Disponível no cofre","Caixa de Marcos Antunes","Banco","Conta Principal","Conta Secundária","Conta Cooperativa","Total da empresa"]}],
"4":[{"id":"ilu04_lugar","de":[4,"Uma",1],"ate":[4,"DRE",1],"cauda":0.6,
      "resumo":"transferência e saque só mudam o dinheiro de pote: o total da empresa não muda e nada entra na DRE",
      "mostra":["Conta Secundária","Conta Principal","DINHEIRO (COFRE)","Total da empresa","Transferência · R$ 8.000,00","Saque · R$ 2.000,00","Não muda","Fora da DRE"]}],
"5":[{"id":"ilu05_conciliar","de":[0,"Com",1],"ate":[2,"certo",1],"cauda":0.6,
      "resumo":"conciliar é dar a cada linha do extrato um par no sistema; com tudo pareado a diferença é zero; a linha que sobra (a tarifa) vira lançamento",
      "mostra":["Extrato do banco","Lançamentos do sistema","03/11","05/11","09/11","10/11","−R$ 2.250,00","−R$ 6.800,00","−R$ 180,00","−R$ 1.874,30","Diferença","R$ 0,00","−R$ 11.104,30","TARIFA PACOTE SERVICOS","−R$ 64,90","Tarifas"]}],
"6":[{"id":"ilu06_ofx","de":[0,"extrato",1],"ate":[0,"OFX",2],"cauda":0.6,
      "resumo":"no site ou app do banco: Extrato, Período, Exportar em OFX (o PDF é só pra ler); o arquivo vai para Downloads",
      "mostra":["Extrato","Período","01/11 a 10/11","Exportar","OFX","PDF","Pra ler","Pra conciliar","Extrato_20261101_20261110.ofx","Downloads"]}],
"10":[{"id":"ilu10_centavos","de":[1,"venda",1],"ate":[1,"fora",1],"cauda":0.6,
      "resumo":"a venda foi registrada no dia 3 por R$ 4.815,20; o Pix caiu no dia 9 sem os centavos: data e valor diferentes",
      "mostra":["Extrato do banco","09/11","PIX RECEBIDO SERRA FINA ALUMINIO","+R$ 4.815,00","Venda","Serra Fina Alumínio Reciclagem","03/11","463 kg de alumínio perfil × R$ 10,40","R$ 4.815,20","Pagou depois","dif. −R$ 0,20"]}],
"11":[{"id":"ilu11_ignorar","de":[1,"Nenhuma",1],"ate":[1,"nada",1],"cauda":0.6,
      "resumo":"a tarifa e o estorno se anulam (R$ 0,00): Ignorar tira as duas da fila sem criar lançamento",
      "mostra":["Extrato do banco","09/11","TARIFA AVULSA","−R$ 12,00","ESTORNO TARIFA AVULSA","+R$ 12,00","R$ 0,00","Ignorada","Lançamentos do sistema","Nada criado"]},
     {"id":"ilu11_tarifa","de":[4,"Uma",1],"ate":[4,"libera",1],"cauda":0.6,
      "resumo":"ignorar conta como resolvido: o par que se anula pode; uma tarifa de verdade ignorada deixa a diferença aberta e não libera o fechamento",
      "mostra":["Pode ignorar","TARIFA AVULSA","ESTORNO TARIFA AVULSA","−R$ 12,00","+R$ 12,00","Ignorada","Tarifa de verdade","TARIFA PACOTE SERVICOS","−R$ 64,90","Diferença","Finalizar conciliação"]}],
"12":[{"id":"ilu12_repetidos","de":[1,"Aqui",1],"ate":[1,"sempre",1],"cauda":0.6,
      "resumo":"dois Pix de R$ 380,00 no mesmo dia podem casar com duas compras; casar com a errada deixa a outra pendente",
      "mostra":["Extrato do banco","Lançamentos do sistema","06/11","PIX ENVIADO COOPERATIVA RECOMECO","PIX ENVIADO AUTO PECAS VALE FORTE","−R$ 380,00","Cooperativa Recomeço","Auto Peças Vale Forte","Compra · 200 kg de plástico PET","Compra · 400 kg de ferro pesado","Pendente"]}],
"14":[{"id":"ilu14_tres_numeros","de":[1,"Diferença",1],"ate":[1,"pendente",1],"cauda":0.6,
      "resumo":"a Diferença é a distância entre o Saldo do banco e o Saldo conciliado; com as linhas resolvidas a balança nivela e a diferença fica zero, em verde",
      "mostra":["Saldo do banco","Saldo conciliado","Diferença","R$ 0,00","Nenhuma pendente"]}]
}/*FIM*/;
function jan(cap,id){const a=ANC[cap].find(x=>x.id===id);return[WS(a.de[0],a.de[1],a.de[2])-.3,WS(a.ate[0],a.ate[1],a.ate[2],'e')+a.cauda]}
// posição absoluta por transform (o elemento fica em left:0;top:0); opacidade direta; destaque de borda + anel de luz
function pos(e,x,y,s=1,r=0){e.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${r.toFixed(2)}deg) scale(${s.toFixed(4)})`}
function op(e,v){v=cl(v);e.style.opacity=v.toFixed(4);e.style.visibility=v<=.001?'hidden':'visible';return v}
const VERDE=['#50D088','rgba(80,208,136,.24)'], AMBAR=['#F2B63D','rgba(242,182,61,.28)'], VERM=['#E5484D','rgba(229,72,77,.20)'], BASE='#E1E8E4';
function anel(e,p,cor=VERDE,de=BASE,px=5,sombra=true){p=cl(p);e.style.borderColor=mix(de,cor[0],p);
  e.style.boxShadow=`0 0 0 ${(px*p).toFixed(2)}px ${cor[1]}`+(sombra?',0 18px 40px rgba(16,24,40,.10),0 3px 8px rgba(16,24,40,.06)':'')}
const sobe=(t,a,b)=>eo(pr(t,a,.4))*(1-eo(pr(t,b,.4)));   // vai a 1 em a e volta a 0 em b
// título: já inteiro no 1º quadro da janela (entra 0,6 s antes) e só sobe depois dele (nunca antes de ini + 0,15 s)
function posT(e,t,ini,sobe){posTitulo(e,t,ini-.6,Math.max(ini+.15,sobe))}
const sinal=v=>(v<0?'−':'+')+brl(Math.abs(v));            // valor com sinal, como a tabela da conciliação (verde +, vermelho −)
const corSinal=v=>v<0?'var(--r)':'var(--ve)';
// barras cinza no lugar do texto (linha sem descrição na cena)
const risco=(w,h=10,c='#E6E9EE')=>`<div style="width:${w}px;height:${h}px;border-radius:${h/2}px;background:${c};flex:none"></div>`;

const CAPS={};
// ------------------------------------------------------------------ CAPS[0] · O banco e o sistema (abertura)
// fala 0 "Oi! Neste tutorial a gente vai fazer o extrato do banco bater com o sistema da Recicla Vale Metais, linha por
// linha, até a diferença zerar." 1 "Sabe quando o banco mostra um saldo, o sistema mostra outro, e ninguém sabe de onde vem
// a diferença? É isso que a gente resolve aqui." Saldos do rodapé logo depois do import (T14/plano.md): banco R$ 44.933,47,
// sistema R$ 46.382,57; no fim os dois batem (o conciliado chega ao do banco) e a Diferença fica R$ 0,00.
CAPS[0]=()=>{
  const [INI]=jan(0,'ilu00_banco_sistema');
  const BANCO=44933.47, SISTEMA=46382.57;                 // números do mundo (junção T4 × T13: conferir antes do render)
  const g=grupo(); const tit=titulo(g,'Conciliação','O banco e o sistema');
  const LW=[[190,70],[150,90],[210,60],[130,80],[170,70]];
  const doc=(x,icn,cls,nome)=>el(`<div class="card b2" style="left:${x}px;top:196px;width:400px;height:410px;padding:26px 28px">
      <div class="row" style="gap:14px"><div class="ico ${cls}" style="width:52px;height:52px">${ic(icn,28)}</div><div style="font-weight:800;font-size:24px">${nome}</div></div>
      ${LW.map((l,i)=>`<div class="ab row" style="left:16px;top:${102+i*34}px;width:364px;height:30px;padding:0 12px;border-radius:8px;justify-content:space-between">${risco(l[0])}${risco(l[1])}</div>`).join('')}
      <div class="ab" style="left:28px;top:290px"><div class="lbl">Saldo</div><div class="num" style="font-size:36px;margin-top:4px">${brl(BANCO)}</div></div></div>`,g);
  const banco=doc(90,'landmark','cz','Extrato do banco'), sist=doc(790,'monitor','','Sistema');
  const linB=[...banco.querySelectorAll('.row.ab')], linS=[...sist.querySelectorAll('.row.ab')];
  const vB=banco.lastElementChild, vS=sist.lastElementChild, numS=vS.querySelector('.num');
  const liga=el(`<svg class="ab" style="left:0;top:0;overflow:visible" width="1280" height="800"><path d="M490 400 L790 400" fill="none" stroke="var(--v)" stroke-width="4" stroke-linecap="round"/></svg>`,g).querySelector('path');
  const q=el(`<div class="bdg" style="left:595px;top:355px;width:90px;height:90px;background:var(--ac);border:3px solid #F2B63D;color:var(--ae);font-weight:800;font-size:50px">?</div>`,g);
  const dif=el(`<div class="ab" style="left:500px;top:374px;width:280px;text-align:center"><div class="tag v" style="border:2px solid var(--v)">Diferença ${brl(0)}</div></div>`,g);

  return t=>{
    const tEx=WS(0,'extrato'), tSi=WS(0,'sistema'), tLi=WS(0,'linha',1), tDi=WS(0,'diferenca'), tSa=WS(1,'saldo'), tOu=WS(1,'outro'),
          tNi=WS(1,'ninguem'), tDi2=WS(1,'diferenca'), tRe=WS(1,'resolve');
    posT(tit,t,INI,tEx-.6);
    vis(banco,t,tEx-.1,1e9,{dx:-16,dy:0}); vis(sist,t,tSi-.1,1e9,{dx:16,dy:0});
    // linha por linha: as linhas dos dois lados acendem juntas, uma de cada vez
    [linB,linS].forEach(L=>L.forEach((e,i)=>{const p=sobe(t,tLi+i*.24,tLi+i*.24+.3);e.style.background=`rgba(80,208,136,${(.16*p).toFixed(3)})`}));
    // o banco mostra um saldo, o sistema mostra outro
    vis(vB,t,tSa-.1,1e9,{dy:10}); vis(vS,t,tOu-.1,1e9,{dy:10});
    // a diferença: o ponto de interrogação aparece, cresce em "ninguém sabe" e vira "Diferença R$ 0,00" quando resolve
    const fim=eo(pr(t,tRe,.5));
    const vq=vis(q,t,tDi-.05,1e9,{sc:.6,dy:0}); op(q,vq*(1-fim));
    const bate=a=>(t>a&&t<a+.8)?.08*Math.sin(Math.PI*pr(t,a,.8)):0;
    q.style.scale=((1+.22*eo(pr(t,tNi,.5)))*(1+bate(tDi))*(1+bate(tDi2))).toFixed(4);
    traco(liga,t,tRe-.2,.6); conta(numS,t,tRe-.2,.7,SISTEMA,BANCO,brl);   // o conciliado chega ao saldo do banco e só então a diferença é zero
    vis(dif,t,tRe+.45,1e9,{sc:.85,dy:0}); anel(banco,fim); anel(sist,fim);
  };
};

// ------------------------------------------------------------------ CAPS[3] · O cofre e o banco
// fala 0 "Agora o cofre. Ele é todo o dinheiro vivo da empresa: o que está guardado e o que está nos caixas abertos. O banco é
// o dinheiro nas contas. Os dois juntos dão o total da empresa." Rótulos do app: "DINHEIRO (COFRE)", "Disponível no cofre",

  const g=grupo(); const tit=titulo(g,'Cofre','O cofre e o banco');

      <div class="ico" style="width:46px;height:46px;background:#fff">${ic('banknote',26)}</div><div style="font-weight:800;font-size:20px;color:var(--ve)">Disponível no cofre</div></div>`,cofre);
  const cxa=el(`<div class="ab row" style="left:26px;top:212px;width:464px;height:92px;padding:0 20px;gap:14px;border-radius:14px;border:2px dashed #CBD2D9">
      <div class="ico cz" style="width:46px;height:46px">${ic('wallet',24)}</div><div style="font-weight:800;font-size:20px;color:#4B5563">Caixa de Marcos Antunes</div></div>`,cofre);
  const banco=el(`<div class="card b2" style="left:690px;top:170px;width:520px;height:340px;padding:24px 26px">
      <div class="row" style="gap:14px"><div class="ico a" style="width:52px;height:52px">${ic('landmark',28)}</div><div style="font-weight:800;font-size:22px">Banco</div></div></div>`,g);
  const CT=[['Conta Principal','#3B82F6'],['Conta Secundária','#8B5CF6'],['Conta Cooperativa','#14B8A6']];

  const rot=el('<div class="ab" style="left:70px;top:548px;font-weight:800;font-size:20px">Total da empresa</div>',g);
  const bar=el('<div class="ab" style="left:70px;top:586px;width:1140px;height:44px;border-radius:14px;background:#F2F4F7"></div>',g);
  const sC=el(`<div class="ab" style="left:70px;top:586px;width:${W1.toFixed(1)}px;height:44px;border-radius:14px 0 0 14px;background:var(--v)"></div>`,g);
  const sB=el(`<div class="ab" style="left:${(70+W1).toFixed(1)}px;top:586px;width:${(1140-W1).toFixed(1)}px;height:44px;border-radius:0 14px 14px 0;background:var(--a)"></div>`,g);

  return t=>{
    const tCo=WS(0,'cofre'), tVi=WS(0,'vivo'), tGu=WS(0,'guardado'), tCx=WS(0,'caixas'), tBa=WS(0,'banco'), tCt=WS(0,'contas'),
          tJu=WS(0,'juntos'), tTo=WS(0,'total');
    posT(tit,t,INI,tCo-.6);
    vis(cofre,t,tCo-.05,1e9,{dy:16}); anel(cofre,eo(pr(t,tVi-.1,.45)));
    vis(disp,t,tGu-.1,1e9,{dx:-10,dy:0}); vis(cxa,t,tCx-.1,1e9,{dx:-10,dy:0});
    vis(banco,t,tBa-.1,1e9,{dy:16}); anel(banco,eo(pr(t,tBa,.45)),AMBAR);
    contas.forEach((e,i)=>vis(e,t,tCt-.15+i*.12,1e9,{dx:-10,dy:0}));
    // os dois juntos: as duas partes descem para a barra do total
    vis(bar,t,tJu-.2,1e9,{dy:0,sc:.99}); vis(sC,t,tJu,1e9,{dy:-40,sc:1}); vis(sB,t,tJu+.15,1e9,{dy:-40,sc:1});
    vis(rot,t,tTo-.1,1e9,{dx:-10,dy:0}); pulse(bar,t,tTo+.1,.015,.8); pulse(sC,t,tTo+.1,.015,.8); pulse(sB,t,tTo+.1,.015,.8);
  };
};

// ------------------------------------------------------------------ CAPS[4] · O dinheiro muda de lugar
// fala 4 "Uma dica: transferência entre contas suas, saque e depósito só mudam o dinheiro de lugar. A empresa não fica mais
// rica nem mais pobre, então nada disso entra na DRE." As duas que a aula faz: transferência de R$ 8.000,00 da Conta
// Secundária para a Conta Principal e saque de R$ 2.000,00 da Conta Principal para o cofre. Potes e total sem número
// (proporcionais: Secundária R$ 25.000,00; Principal R$ 39.243,47 depois do combustível; cofre R$ 18.560,00). A tarifa do
// saque (R$ 6,50) fica de fora: a fala desta linha não a cita e ela é despesa (o roteiro pedia a moeda saindo).
CAPS[4]=()=>{
  const [INI]=jan(4,'ilu04_lugar');
  const TR=8000, SQ=2000, S0=[25000,39243.47,18560], MAX=50000;
  const g=grupo(); const tit=titulo(g,'Movimentações','O dinheiro muda de lugar');
  const COR=['#8B5CF6','#3B82F6','#50D088'], NOME=['Conta Secundária','Conta Principal','DINHEIRO (COFRE)'], PX=[140,510,880], PW=260, PY=214;
  const potes=NOME.map((n,i)=>el(`<div class="card b2" style="left:${PX[i]}px;top:${PY}px;width:${PW}px;height:310px;padding:20px 20px">
      <div class="ab" style="left:20px;top:20px;width:${PW-44}px;height:224px;border-radius:16px;background:#F7F8FA;border:2px solid #E6E9EE;overflow:hidden">
        <div class="ab" style="left:0;bottom:0;width:100%;background:${COR[i]};opacity:.85"></div></div>
      <div class="ab" style="left:0;top:262px;width:${PW-4}px;text-align:center;font-weight:800;font-size:19px">${n}</div></div>`,g));
  const nivel=potes.map(p=>p.firstElementChild.firstElementChild);
  // o total da empresa, embaixo: as três partes mudam de tamanho, o comprimento não
  const rot=el('<div class="ab" style="left:140px;top:578px;font-weight:800;font-size:20px">Total da empresa</div>',g);
  const nm=el(`<div class="ab" style="left:900px;top:572px;width:240px;text-align:right"><div class="tag v sm">${ic('equal',16)}Não muda</div></div>`,g);
  const barra=el('<div class="ab" style="left:140px;top:612px;width:1000px;height:44px;border-radius:14px;overflow:hidden;background:#F2F4F7"></div>',g);
  const seg=COR.map(c=>el(`<div class="ab" style="left:0;top:0;height:44px;background:${c}"></div>`,barra));
  const dre=el(`<div class="ab" style="left:0;top:684px;width:1280px;text-align:center"><div class="tag a">${ic('ban',20)}Fora da DRE</div></div>`,g);
  // as fichas (o que muda de lugar) levam o nome da operação
  const ficha=(txt,v)=>el(`<div class="ab" style="left:0;top:0"><div class="tag" style="background:#fff;border:2px solid #121212;color:#121212;font-size:17px;padding:7px 14px">${txt} · ${brl(v)}</div></div>`,g);
  const fT=ficha('Transferência',TR), fS=ficha('Saque',SQ);
  const wT=fT.firstElementChild.offsetWidth, wS=fS.firstElementChild.offsetWidth;

  return t=>{
    const tUm=WS(4,'Uma'), tTr=WS(4,'transferencia'), tSq=WS(4,'saque'), tLu=WS(4,'lugar'), tRi=WS(4,'rica'), tPo=WS(4,'pobre'), tDR=WS(4,'DRE');
    posT(tit,t,INI,tUm-.1);
    const ent=Math.max(tUm+.3,INI+.75);                             // os potes ficam no caminho do título: entram depois que ele subiu
    potes.forEach((p,i)=>vis(p,t,ent+i*.1,1e9,{dy:18}));
    vis(rot,t,ent+.2,1e9,{dx:-10,dy:0}); vis(barra,t,ent+.25,1e9,{dy:0,sc:.99});
    // a transferência: sai da Secundária e afunda na Principal; o saque: da Principal para o cofre
    const pT=eio(pr(t,tTr,1.0)), pS=eio(pr(t,tSq,1.0));
    const cx=(i,w)=>PX[i]+PW/2-w/2, y0=PY+6;
    const voa=(f,w,a,i,j,p)=>{const k=eio(pr(t,a+1.0,.45)); arco(f,t,a,1.0,cx(i,w),y0,cx(j,w),y0,-44);
      if(k>0) f.style.transform=`translate(${cx(j,w).toFixed(2)}px,${(y0+60*k).toFixed(2)}px) scale(${(1-.4*k).toFixed(4)})`; op(f,p>0?Math.min(1,p*5)*(1-k):0)};
    voa(fT,wT,tTr,0,1,pT); voa(fS,wS,tSq,1,2,pS);
    const a=eo(cl((pT-.75)/.25)), b=eo(cl((pS-.75)/.25)), s0=eo(cl(pT/.25)), s1=eo(cl(pS/.25));
    const v=[S0[0]-TR*s0, S0[1]+TR*a-SQ*s1, S0[2]+SQ*b], tot=S0[0]+S0[1]+S0[2];
    nivel.forEach((e,i)=>{e.style.height=(224*v[i]/MAX).toFixed(1)+'px'});
    let x=0; seg.forEach((e,i)=>{const w=1000*v[i]/tot; e.style.left=x.toFixed(1)+'px'; e.style.width=w.toFixed(1)+'px'; x+=w;});
    // a empresa não fica mais rica nem mais pobre: o total não muda; nada disso entra na DRE
    pulse(barra,t,tLu,.02,.8); vis(nm,t,tRi-.1,1e9,{sc:.85,dy:0}); pulse(barra,t,tPo,.02,.8); vis(dre,t,tDR-.15,1e9,{dy:10});
  };
};

// ------------------------------------------------------------------ CAPS[5] · Cada linha com um par
// fala 0 "Com as contas em dia, a conciliação. Conciliar é conferir cada linha do extrato do banco com um lançamento do
// sistema." 1 "Quando toda linha tem par, a diferença entre o saldo do banco e o do sistema chega a zero." 2 "E a linha que
// sobra mostra o que ficou sem lançar, como uma tarifa que ninguém viu. É isso que deixa o fechamento do mês certo."
// Linhas reais do extrato da aula (T14/plano.md: 1, 2, 7 e 11) e os lançamentos que já existem; a quinta, "TARIFA PACOTE
// SERVICOS" (−R$ 64,90), entra na hora em que a fala diz "a linha que sobra" (assim o zero da linha 1 é verdadeiro) e ganha o
// lançamento novo na categoria "Tarifas". A Diferença é a soma das linhas ainda sem par (como o rodapé do app).
CAPS[5]=()=>{
  const [INI]=jan(5,'ilu05_conciliar');
  const LIN=[['03/11',-2250],['05/11',-6800],['09/11',-180],['10/11',-1874.30]], TAR=['09/11',-64.90];
  const g=grupo(); const tit=titulo(g,'Conciliação','Cada linha com um par');
  const cart=(x,icn,cls,nome)=>el(`<div class="card b2" style="left:${x}px;top:150px;width:470px;height:420px;padding:22px 24px">
      <div class="row" style="gap:12px"><div class="ico ${cls}" style="width:44px;height:44px">${ic(icn,24)}</div><div style="font-weight:800;font-size:21px">${nome}</div></div></div>`,g);
  const cB=cart(90,'landmark','cz','Extrato do banco'), cS=cart(720,'monitor','','Lançamentos do sistema');
  const linha=(pai,d,v,meio)=>el(`<div class="ab row" style="left:20px;top:0;width:426px;height:56px;padding:0 14px;gap:12px;border-radius:12px;background:#FAFBFC;border:2px solid #EEF1F4">
      <div class="tag cz sm">${d}</div>${meio}<div class="num" style="margin-left:auto;font-size:18px;white-space:nowrap;color:${corSinal(v)}">${sinal(v)}</div></div>`,pai);
  const Y=i=>88+i*64;
  const lB=LIN.map(([d,v],i)=>{const e=linha(cB,d,v,risco(120+(i%2)*40));e.style.top=Y(i)+'px';return e});
  const lS=LIN.map(([d,v],i)=>{const e=linha(cS,d,v,risco(150-(i%2)*30));e.style.top=Y(i)+'px';return e});
  const tB=linha(cB,TAR[0],TAR[1],'<div style="font-weight:800;font-size:14px;white-space:nowrap">TARIFA PACOTE SERVICOS</div>'); tB.style.top=Y(4)+'px';
  const vaga=el(`<div class="ab" style="left:20px;top:${Y(4)}px;width:426px;height:56px;border-radius:12px;border:2px dashed #CBD2D9"></div>`,cS);
  const tS=linha(cS,TAR[0],TAR[1],'<div class="tag a sm">Tarifas</div>'); tS.style.top=Y(4)+'px';
  const fios=el(`<svg class="ab" style="left:0;top:0;overflow:visible" width="1280" height="800">${[0,1,2,3,4].map(i=>`<path d="M560 ${150+Y(i)+28} L720 ${150+Y(i)+28}"
      fill="none" stroke="var(--v)" stroke-width="4" stroke-linecap="round"/>`).join('')}</svg>`,g);
  const fio=[...fios.querySelectorAll('path')];
  const plac=el(`<div class="card b2" style="left:420px;top:604px;width:440px;height:96px;padding:0 28px;display:flex;align-items:center;justify-content:space-between">
      <div style="font-weight:800;font-size:20px">Diferença</div><div class="num" style="font-size:28px;white-space:nowrap">${brl(0)}</div></div>`,g);
  const pv=plac.lastElementChild, TOT=LIN.reduce((s,l)=>s+l[1],0);

  return t=>{
    const tCo=WS(0,'conciliacao'), tLi=WS(0,'linha'), tLa=WS(0,'lancamento'), tQu=WS(1,'Quando'), tZe=WS(1,'zero'),
          tSo=WS(2,'sobra'), tSl=WS(2,'lancar'), tTa=WS(2,'tarifa'), tDx=WS(2,'deixa'), tCe=WS(2,'certo');
    posT(tit,t,INI,tCo-.6);
    vis(cB,t,tCo-.05,1e9,{dx:-14,dy:0}); vis(cS,t,tCo+.1,1e9,{dx:14,dy:0});
    lB.forEach((e,i)=>vis(e,t,tLi+i*.15,1e9,{dx:-10,dy:0})); lS.forEach((e,i)=>vis(e,t,tLa+i*.15,1e9,{dx:10,dy:0}));
    // quando toda linha tem par, a diferença chega a zero: cada traço desconta a linha do placar
    const tl=i=>tQu+.3+i*.9; let dif=TOT;
    LIN.forEach(([d,v],i)=>{const p=traco(fio[i],t,tl(i),.5); dif-=v*eo(cl(p)); anel(lB[i],p,VERDE,'#EEF1F4',3,false); anel(lS[i],p,VERDE,'#EEF1F4',3,false);});
    vis(plac,t,tQu,1e9,{dy:14});
    // a linha que sobra: a tarifa entra sem par; o lançamento novo (Tarifas) fecha a conta
    vis(tB,t,tSo-.15,1e9,{dx:-10,dy:0}); const pt=eo(pr(t,tSo-.15,.5)); dif+=TAR[1]*pt; anel(tB,pt*(1-eo(pr(t,tDx+.6,.4))),AMBAR,'#EEF1F4',3,false);
    pulse(tB,t,tTa,.04,.8); vis(vaga,t,tSl-.1,1e9,{dy:0,sc:.95});
    vis(tS,t,tDx-.1,1e9,{dx:10,dy:0}); const pf=traco(fio[4],t,tDx+.3,.5); dif-=TAR[1]*eo(cl(pf));
    anel(tS,pf,VERDE,'#EEF1F4',3,false); if(pf>0) anel(tB,pf,VERDE,'#EEF1F4',3,false);

    F[1].style.stroke=mix('#F2B63D','#E5484D',pr2); F[1].style.strokeWidth=(3+2*pr2).toFixed(2); F[1].style.strokeDasharray=pr2>.5?'none':'7 9';
    vis(xis,t,tEr+.1,1e9,{sc:.7,dy:0});

  };
};

// ------------------------------------------------------------------ CAPS[14] · Os três números
// fala 1 "A Diferença é a distância entre os dois. Agora ela está em zero, em verde, e não sobrou nenhuma linha pendente."
// Balança de dois pratos: "Saldo do banco" e "Saldo conciliado" (rótulos do rodapé do app); a Diferença é o desnível entre
// os pratos; as linhas resolvidas pousam no prato do sistema e ela nivela; "Diferença" R$ 0,00 em verde. Sem os saldos em
// número (a fala não diz e eles dependem da junção do mundo).
CAPS[14]=()=>{
  const [INI]=jan(14,'ilu14_tres_numeros');
  const g=grupo(); const tit=titulo(g,'Fechamento','Os três números');
  const CX=640, CY=286, BR=300, PW=280;                          // pivô, meio braço e largura do prato

      <g id="t14b"><rect x="${CX-BR}" y="${CY-7}" width="${2*BR}" height="14" rx="7" fill="#7E8994"/><circle cx="${CX}" cy="${CY}" r="14" fill="#5B636C"/></g></svg>`,g);
  const braco=bal.querySelector('#t14b');

      <path id="t14r" d="" fill="none" stroke="#F2B63D" stroke-width="4" stroke-linecap="round"/></svg>`,g);
  const [guia,regua]=[des.querySelector('#t14g'),des.querySelector('#t14r')];
  const prato=(nome,cls,cor)=>el(`<div class="ab" style="left:0;top:0;width:${PW}px">
      <svg class="ab" style="left:0;top:0;overflow:visible" width="${PW}" height="110"><path d="M${PW/2} 0 L40 92 M${PW/2} 0 L${PW-40} 92" stroke="#9AA3AD" stroke-width="3" stroke-linecap="round"/></svg>
      <div class="ab" style="left:0;top:90px;width:${PW}px;height:26px;border-radius:0 0 140px 140px;background:${cor};opacity:.9"></div>
      <div class="ab" style="left:0;top:132px;width:${PW}px;text-align:center"><div class="tag ${cls}">${nome}</div></div></div>`,g);
  const pB=prato('Saldo do banco','v','#50D088'), pS=prato('Saldo conciliado','a','#F2B63D');
  const fichas=[0,1,2].map(()=>el(`<div class="ab row" style="left:0;top:0;width:96px;height:24px;border-radius:7px;background:var(--vc);border:2px solid var(--v);padding:0 6px;gap:6px">
      <div class="ic" style="width:14px;height:14px;color:var(--ve)">${ic('check',14)}</div>${risco(56,6,'#A9E9C6')}</div>`,g));   // linha resolvida
  const gap=el('<div class="ab" style="left:0;top:0"><div class="tag a sm">Diferença</div></div>',g);
  const plac=el(`<div class="card b2" style="left:470px;top:650px;width:340px;height:84px;padding:0 26px;display:flex;align-items:center;justify-content:space-between">
      <div style="font-weight:800;font-size:20px">Diferença</div><div class="num" style="font-size:28px">${brl(0)}</div></div>`,g);
  const pv=plac.lastElementChild;
  const nen=el(`<div class="ab" style="left:850px;top:672px"><div class="tag v sm">${ic('circle-check',16)}Nenhuma pendente</div></div>`,g);

  return t=>{
    const tDf=WS(1,'Diferenca'), tDs=WS(1,'distancia'), tAg=WS(1,'Agora'), tZe=WS(1,'zero'), tVe=WS(1,'verde'), tNe=WS(1,'nenhuma');
    posT(tit,t,INI,tDf-.2);
    const ent=Math.max(tDf,INI+.75);                                // a balança fica no caminho do título: entra depois que ele subiu
    vis(bal,t,ent,1e9,{dy:14});
    // a balança torta (a diferença) nivela quando as linhas resolvidas pousam no prato do sistema
    const nv=eio(pr(t,tAg+.35,Math.max(.8,tZe-tAg-.2))), ang=-7*(1-nv), rad=ang*Math.PI/180;
    braco.setAttribute('transform',`rotate(${ang.toFixed(3)} ${CX} ${CY})`);
    const ex=[CX-BR*Math.cos(rad),CX+BR*Math.cos(rad)], ey=[CY-BR*Math.sin(rad),CY+BR*Math.sin(rad)];
    [pB,pS].forEach((p,i)=>{const o=vis(p,t,ent+.1+i*.1,1e9,{dy:14}); pos(p,ex[i]-PW/2,ey[i]+(1-o)*14);});
    fichas.forEach((f,i)=>{const p=eio(pr(t,tAg+i*.25,.6)), x1=ex[1]-48+(i-1)*44, y1=ey[1]+64-i*4;
      pos(f,lerp(x1+60,x1,p),lerp(y1-110,y1,p)); op(f,p>0?Math.min(1,p*3):0);});
    // a diferença é a distância entre os dois pratos
    const yL=ey[0]+103, yR=ey[1]+103, xr=ex[1]-PW/2-24, pg=eo(pr(t,tDs-.1,.45))*(1-eo(pr(t,tZe-.15,.4)));
