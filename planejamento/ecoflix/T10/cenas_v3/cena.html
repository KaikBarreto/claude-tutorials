       cap03 · separacao   (claro)   ilu03_separacao  "Separação no pátio"       linhas 0 e 1 (do "Ontem"): o Marcos tira 320 kg do ferro misto para o ferro pesado; o peso é o mesmo
       cap09 · liquido     (claro)   ilu09_liquido    "Tara e peso líquido"      linha 2: a Dona Cida pôs 86 kg na balança, saco e sujeira 6 kg, entraram 80 kg
       cap10 · pilha       (claro)   ilu10_pilha      "A pilha não tem dono"     linha 1: o cobre do Siqueira e o do Valdir vão para a mesma pilha; a Fundição compra e ninguém sabe de quem era cada quilo

       ilu04_corrente        (cap04, linha 5)  a tela está com a compra e a transferência lado a lado, e o robô dá zoom no Estoque Final e no Inicial das duas
       ilu05_tipos           (cap05, linhas 2 a 4) a tela mostra o filtro com os sete tipos e a linha de cada um com a sua cor; sete desenhos taparia a lista
       ilu08_projecao        (cap08, linha 7) o cartão da Projeção de Lucro está aberto na tela, com a própria explicação escrita
       ilu08_estoque_relatorio (cap08, linha 9) a lista dos seis lançamentos que mexem no saldo já vem na ilu02_saldo; a fala só repete
       ilu09_margem          (cap09, linha 4) a tela está na linha do Cobre mel, com o balão da conta (vendido menos comprado) ao passar o mouse

     Só textos e números da fala e da tela (6.420, 2.180, 6.100 e 2.500 kg são os da lista de Estoque e do Kardex, ditos na mesma aula).

<script type="module">
import { PI, cl, lerp, pr, eo, eio, eo5, eis, passa, golpe, W, el, ic, vis, foco, pulso, ondaEm, kg, conta, pesa, titulo, posTitulo, selo,
  htmlChip, htmlCartao, htmlOp, htmlVisor, ligaVisor, htmlFluxo, fluxo, CENA, GL, THREE, mat, caixa, malha, grupo, mundo, mancha, piso, anel, destaque, U, camera, posCam,
  lugar, lugarDeFrente, plano, clima, cena, estilo, enquadraRet }
  from '../../../../perfis/ecoflix/cenas_v3/motor.js';
import { ceuClaro, mundoEscuro } from '../../../../perfis/ecoflix/cenas_v3/fundo.js';
import { caminhao } from '../../../../perfis/ecoflix/cenas_v3/objetos/caminhao.js';
import { carroca } from '../../../../perfis/ecoflix/cenas_v3/objetos/carroca.js';
import { pessoa } from '../../../../perfis/ecoflix/cenas_v3/objetos/pessoa.js';
import { baia } from '../../../../perfis/ecoflix/cenas_v3/objetos/baia.js';
import { fundicao } from '../../../../perfis/ecoflix/cenas_v3/objetos/fundicao.js';
import { saco } from '../../../../perfis/ecoflix/cenas_v3/objetos/saco.js';
import { balancaPlataforma } from '../../../../perfis/ecoflix/cenas_v3/objetos/balancaPlataforma.js';
import { monte, pecas, pontosMonte } from '../../../../perfis/ecoflix/cenas_v3/objetos/monte.js';
import { htmlFluxoCartoes, fluxoCartoes, parte } from '../../../../perfis/ecoflix/cenas_v3/dados/fluxoCartoes.js';

// =====================================================================================================================
// comuns
const NUNCA = 1e9, EE = .0112;
const arco = (a, b, p, alt) => [lerp(a[0], b[0], p), lerp(a[1], b[1], p) + alt * 4 * p * (1 - p), lerp(a[2], b[2], p)];
const some = (o, k, s = 1) => { o.visible = k > .002; if (o.visible) o.scale.setScalar(k * s); };   // objeto 3D que entra crescendo
const cores = () => estilo('t10-cor', `.chip.am{background:linear-gradient(150deg,#F7CB68,#E59A22);color:#3A2A06;border-color:rgba(255,255,255,.4);box-shadow:0 12px 22px -8px rgba(229,154,34,.6)}`);
const cartaoP = (icone, rot, sub, cls, cw = 190) => htmlFluxoCartoes({ cartoes: [[icone, rot, sub, cls]], cw });   // cartão pequeno (selo + rótulo + legenda)
const subEm = (p, t, a) => { const s = parte(p.e, 0).querySelector('.d-s'); if (s) s.style.opacity = eo(pr(t, a, .3)).toFixed(3); };   // a legenda entra na palavra que a diz
// o lugar do número até a fala dizer o valor (contorno liso: tracejado cintila com a câmera em deriva)
const vaga = (c, w = 190, cor = 'rgba(47,178,113,.55)') => el(`<div class="ab" style="left:22px;bottom:20px;width:${w}px;height:44px;border-radius:12px;border:1.5px solid ${cor};background:rgba(255,255,255,.04)"></div>`, c.e);
const chega = (c, v, t, a) => { const k = eo(pr(t, a, .3)); c.e.querySelector('.num').style.opacity = k.toFixed(3); v.style.opacity = (1 - k).toFixed(3); };
// degrau: cartão baixo de uma linha (selo + nome + legenda opcional)
const degrau = (icone, rot, sub, o = {}) => `<div class="cartao ${o.cc ?? ''}" style="position:relative;width:${o.w ?? 360}px;height:${o.h ?? 84}px;padding:0 20px;display:flex;align-items:center;gap:13px;white-space:nowrap">
  ${selo(icone, o.cls ?? 'n', o.selo ?? 46)}<div><div class="rot">${rot}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>${o.res ? '<div class="onda"></div>' : ''}</div>`;
// um lugar do mundo escuro: posições em px do desenho (y para baixo)
function escuro() {
  const EIXO = lugar([0, 0, 0]), E = mundoEscuro(EIXO, 0, EE);
  return { EIXO, X: (html, x, y, o = {}) => E(html, x * EE, -y * EE, 0, o), ret: (a, b, c, d) => [a * EE, -d * EE, c * EE, -b * EE], fundo: (cx, cy, o) => E.fundo(cx * EE, -cy * EE, o), L: E.lista };
}
// itens lado a lado, centrados em xc (p.w vem da medida real)
const fileira = (P, xc, vao = 10) => { let x = xc - (P.reduce((s, p) => s + p.w, 0) + vao * (P.length - 1)) / 2; for (const p of P) { p.pos[0] = (x + p.w / 2) * EE; x += p.w + vao; } };
// fios que saem de um cartão (em cima, centro em x = 0) e descem até cartões na fileira de baixo (dx = centro de cada um); 10 px de respiro nas duas pontas
function garfoPara(X, dxs, yTopo, FH) {
  const FW = 2 * Math.max(...dxs.map(Math.abs)) + 40, XM = FW / 2, r = 14, ym = Math.round(FH / 2);
  const d = dx => { const s = Math.sign(dx); return s ? `M${XM} 0V${ym - r}Q${XM} ${ym} ${XM + s * r} ${ym}H${XM + dx - s * r}Q${XM + dx} ${ym} ${XM + dx} ${ym + r}V${FH}` : `M${XM} 0V${FH}`; };
  return X(htmlFluxo(FW, FH, dxs.map(d)), 0, yTopo, { anc: [.5, 0], z: -40 });
}

// =====================================================================================================================
// CENA "perguntas" · cap00, linhas 0 e 1 (do "responder") · clima escuro (as três perguntas do contador)
// 0 "Oi! Neste tutorial a gente vai responder as três perguntas que o contador da Recicla Vale Metais faz todo fim de mês."
// 1 "Quanto material tem hoje no pátio, de onde ele veio e quanto tinha no dia trinta e um."
// Em cima, o contador, a Recicla Vale Metais e o fim de mês; a câmera abre e de lá saem as três perguntas, uma por frase.
function perguntas() {
  const t0 = W(0, 'responder'), tpe = W(0, 'perguntas'), tco = W(0, 'contador'), trv = W(0, 'recicla'), tfm = W(0, 'fim'),
    tq1 = W(1, 'quanto'), tho = W(1, 'hoje'), tde = W(1, 'de'), tve = W(1, 'veio'), tq2 = W(1, 'quanto', 2), tdi = W(1, 'dia'), tum = W(1, 'um'), tfim = W(1, 'um', 1, 'e');
  cores();
  const { EIXO, X, ret, fundo } = escuro(), YS = -120, YQ = 60, VAO = 28;
  const src = X(degrau('calculator', 'Contador', '', { w: 250, h: 84, cls: '' }), 0, YS);
  const chR = X(htmlChip(`${ic('map-pin', 18)}Recicla Vale Metais`, 'n'), -(src.w / 2 + 14), YS, { anc: [1, .5], z: 40 }), chF = X(htmlChip(`${ic('calendar-days', 18)}todo fim de mês`, 'am'), src.w / 2 + 14, YS, { anc: [0, .5], z: 40 });
  chR.e.style.transformOrigin = '100% 50%'; chF.e.style.transformOrigin = '0 50%';
  const Q = [X(cartaoP('package', 'Quanto tem hoje?', 'no pátio', 'n', 268), 0, YQ), X(cartaoP('truck', 'De onde veio?', 'o material', 'n', 268), 0, YQ), X(cartaoP('calendar-days', 'Quanto tinha?', 'no dia 31', 'a', 268), 0, YQ)];
  const QW = Q[0].w, QH = Q[0].h; Q.forEach((q, i) => { q.pos[0] = (i - 1) * (QW + VAO) * EE; });
  const FY0 = YS + 42 + 10, FH = Math.round(YQ - QH / 2 - 10 - FY0), fi = garfoPara(X, [-(QW + VAO), 0, QW + VAO], FY0, FH);
  fundo(0, 0);
  const tit = titulo('Fim de mês', 'As três perguntas', 'escuro');
  const XL = chR.w + 14 + src.w / 2, XR = src.w / 2 + 14 + chF.w, TOPO = YS - 42, BASE = YQ + QH / 2;
  const S1 = enquadraRet(EIXO, ret(-XL, TOPO, XR, YS + 42), { az: -.03, max: 1.4 / EE }), S2 = enquadraRet(EIXO, ret(-Math.max(XL, QW * 1.5 + VAO), TOPO, Math.max(XR, QW * 1.5 + VAO), BASE), { az: .0, max: 1.4 / EE });
  camera([[t0 - 3, S1], [tq1 - .55, { ...S1, az: -.012, d: S1.d * .985 }, 'lin'], [tq1 + .7, S2], [tfim + 2.5, { ...S2, az: .03, d: S2.d * .98 }, 'lin']]);
  const T = [tq1 - .1, tde - .1, tq2 - .1];
  return t => {
    clima(1); GL.style.visibility = 'hidden'; posTitulo(tit, t, t0 - .9, t0 - .45);
    vis(src.e, t, tco - .1, NUNCA, { dy: 18 }); vis(chR.e, t, trv - .1, NUNCA, { dy: 10, sc: .8 }); vis(chF.e, t, tfm - .1, NUNCA, { dy: 10, sc: .8 }); pulso(src.e, t, tpe, .04, .8);
    fi.e.style.opacity = eo(pr(t, tq1 - .35, .3)).toFixed(3);
    Q.forEach((q, i) => { vis(q.e, t, T[i], NUNCA, { dy: 18 }); fluxo(fi.e, i, t, T[i] - .3, .55, { fica: .75, luz: [T[i] - .3, .75] }); });
    subEm(Q[0], t, tho - .05); subEm(Q[1], t, tve - .1); subEm(Q[2], t, tdi - .05); pulso(Q[2].e, t, tum, .04, .8);
  };
}

// =====================================================================================================================
// CENA "portas" · cap01, linhas 2 e 3 · clima escuro (a Posição vira botão; as quatro portas)
// 2 "Se a sua empresa usa uma tabela de preço só, essa coluna não aparece. Aí a Posição de Estoque é um botão no alto da tela."
// 3 "O Estoque mostra quanto tem agora. O Histórico conta cada entrada e cada saída. O Relatório soma o que você comprou e
//    vendeu num período. E a Posição mostra quanto tinha numa data."
// Estação 1: a tela Estoque, a coluna das tabelas (com a Posição dentro); com uma tabela só a coluna some e a Posição sobe
// para o alto como botão. Estação 2: a câmera abre e as quatro portas entram, uma por frase, cada uma com a sua pergunta.
function portas() {
  const t0 = W(2, 'se'), tuma = W(2, 'uma'), tso = W(2, 'so'), tco = W(2, 'coluna'), tna = W(2, 'nao'), tap = W(2, 'aparece'), tpo = W(2, 'posicao'), tbo = W(2, 'botao'), tal = W(2, 'alto'), tte = W(2, 'tela'),
    tes = W(3, 'estoque'), tag = W(3, 'agora'), thi = W(3, 'historico'), ten = W(3, 'entrada'), tsa = W(3, 'saida'), tre = W(3, 'relatorio'), tcm = W(3, 'comprou'), tve = W(3, 'vendeu'),
    tpr = W(3, 'periodo'), tp2 = W(3, 'posicao'), tda = W(3, 'data'), tfim = W(3, 'data', 1, 'e'), tq = W(3, 'o');
  cores();
  const { EIXO, X, ret, fundo } = escuro(), Y1 = -190, Y2 = -66, Y3 = 20, Y4 = 120, CW = 252, VAO = 18;
  const hdr = X(degrau('package', 'Estoque', 'a tela', { w: 330, h: 84, cls: '' }), 0, Y1);
  const colc = X(degrau('table-properties', 'Tabelas de Preço', 'a coluna', { w: 330, h: 84 }), 0, Y2);
  const pos = X(htmlChip(`${ic('calendar-clock', 18)}Posição de Estoque`, ''), 0, Y3, { z: 40 });
  const chU = X(htmlChip('uma tabela só', 'am'), hdr.w / 2 + 14, Y2, { anc: [0, .5], z: 40 }); chU.e.style.transformOrigin = '0 50%';
  const chB = X(htmlChip('botão no alto da tela', 'n'), -(hdr.w / 2 + 14), Y1, { anc: [1, .5], z: 40 }); chB.e.style.transformOrigin = '100% 50%';
  const posX1 = hdr.w / 2 + 14 + pos.w / 2;   // onde o botão pousa: ao lado direito do título da tela
  const D = [['package', 'Estoque', 'quanto tem agora', 'n'], ['history', 'Histórico', 'entradas e saídas', 'n'], ['chart-column', 'Relatório', 'comprado e vendido', 'n'], ['calendar-clock', 'Posição de Estoque', 'saldo numa data', 'res']]
    .map(c => X(cartaoP(...c, CW), 0, Y4));
  const DW = Math.max(...D.map(q => q.w)), DH = D[0].h; D.forEach((q, i) => { q.pos[0] = (i - 1.5) * (DW + VAO) * EE; });
  fundo(0, 40, { aneis: false });
  const tit = titulo('Materiais', 'As quatro portas', 'escuro');
  const XL = hdr.w / 2 + 14 + chB.w, XR = posX1 + pos.w / 2, TOPO = Y1 - 42, DL = 2 * DW + 1.5 * VAO;
  const S1 = enquadraRet(EIXO, ret(-XL, TOPO, XR, Y3 + 24), { az: -.03, max: 1.4 / EE }), S2 = enquadraRet(EIXO, ret(-Math.max(XL, DL) - 8, TOPO, Math.max(XR, DL) + 8, Y4 + DH / 2), { az: .0, max: 1.4 / EE });
  camera([[t0 - 3, S1], [tq - .6, { ...S1, az: -.012, d: S1.d * .985 }, 'lin'], [tq + .7, S2], [tfim + 2.5, { ...S2, az: .03, d: S2.d * .995 }, 'lin']]);
  const TD = [tes - .1, thi - .1, tre - .1, tp2 - .1], SUB = [tag - .05, ten - .1, tcm - .1, tda - .1];
  return t => {
    clima(1); GL.style.visibility = 'hidden'; posTitulo(tit, t, t0 - .9, t0 - .45);
    vis(hdr.e, t, t0 - .05, NUNCA, { dy: 18 }); vis(colc.e, t, tco - .15, NUNCA, { dy: 18 }); vis(pos.e, t, tco + .05, NUNCA, { dy: 12, sc: .9 });
    vis(chU.e, t, tuma - .1, NUNCA, { dy: 10, sc: .8 }); pulso(chU.e, t, tso, .05, .8);
    // com uma tabela só a coluna apaga; a Posição sobe e vira botão do alto da tela
    colc.op = 1 - eo(pr(t, tap + .1, .45)); chU.op = colc.op;
    const k = eio(pr(t, tpo - .15, .95)); pos.pos[0] = lerp(0, posX1, k) * EE; pos.pos[1] = -lerp(Y3, Y1, k) * EE; pulso(pos.e, t, tbo + .1, .05, .8);
    vis(chB.e, t, tal - .1, NUNCA, { dy: 10, sc: .8 });
    // as quatro portas
    D.forEach((q, i) => { vis(q.e, t, TD[i], NUNCA, { dy: 18 }); subEm(q, t, SUB[i]); });
    pulso(parte(D[3].e, 0), t, tda + .1, .04, .8);
    const rec = lerp(1, .55, eo(pr(t, tq + .1, .5))); hdr.op = rec; pos.op = rec; chB.op = rec;
  };
}

// =====================================================================================================================
// CENA "saldo" · cap02, linhas 5 e 6 · clima escuro (o triângulo amarelo; o que mexe no saldo)
// 5 "Uma dica: quando o material tem saldo e nenhuma compra lançada, aparece um triângulo amarelo. O sistema usa o preço do
//    cadastro, e o valor pode não ser o que você pagou."
// 6 "O Estoque Atual é o saldo de verdade. Ele muda com tudo o que entra e sai: compra, venda, transferência, ajuste manual,
//    exclusão e produção."
// Estação 1: material com saldo, sem compra, o triângulo e o preço do cadastro. A câmera desce: o Estoque Atual embaixo, e
// os seis lançamentos descem até ele, um por palavra.
function saldo() {
  const t0 = W(5, 'uma'), tma = W(5, 'material'), tsa = W(5, 'saldo'), tnh = W(5, 'nenhuma'), tcp = W(5, 'compra'), ttr = W(5, 'triangulo'), tpc = W(5, 'preco'), tca = W(5, 'cadastro'), tvl = W(5, 'valor'), tpg = W(5, 'pagou'),
    tes = W(6, 'estoque'), tat = W(6, 'atual'), tsd = W(6, 'saldo'), tvd = W(6, 'verdade'), ttd = W(6, 'tudo'), ten = W(6, 'entra'), tsi = W(6, 'sai'), tc6 = W(6, 'compra'), tv6 = W(6, 'venda'), tt6 = W(6, 'transferencia'),
    taj = W(6, 'ajuste'), tex = W(6, 'exclusao'), tpd = W(6, 'producao'), tfim = W(6, 'producao', 1, 'e'), tq = W(6, 'o');
  cores();
  const { EIXO, X, ret, fundo } = escuro(), Y1 = -120, OY = 330, YL = OY - 70, YC = OY, YH = OY + 140;
  const fA = X(htmlFluxoCartoes({ cartoes: [['package', 'Material', 'com saldo', 'n'], ['shopping-cart', 'Compra', 'nenhuma lançada', 'a'], ['triangle-alert', 'Triângulo amarelo', 'usa o preço do cadastro', 'a']], cw: 250, vao: 80 }), 0, Y1);
  const chV = X(htmlChip('o valor pode não ser o que você pagou', 'n'), fA.w / 2, Y1 + fA.h / 2 + 14, { anc: [1, 0], z: 40 }); chV.e.style.transformOrigin = '100% 50%';
  // estação 2
  const hub = X(degrau('package', 'Estoque Atual', 'o saldo de verdade', { w: 440, h: 96, cls: '', cc: 'res', res: true }), 0, YH);
  const L = [['shopping-cart', 'Compra'], ['receipt', 'Venda'], ['arrow-left-right', 'Transferência'], ['pencil', 'Ajuste manual'], ['trash-2', 'Exclusão'], ['factory', 'Produção']].map(([i, n]) => X(htmlChip(`${ic(i, 18)}${n}`, 'n'), 0, YC, { z: 40 }));
  fileira(L, 0, 14);
  const chT = X(htmlChip('tudo o que entra e sai', 'am'), 0, YL, { anc: [.5, 1], z: 40 });
  const dxs = L.map(p => p.pos[0] / EE), FY0 = YC + 19 + 10, FH = Math.round(YH - 48 - 10 - FY0), fi = garfoPara(X, dxs, FY0, FH);
  fundo(0, 140, { aneis: false });
  const tit = titulo('Estoque', 'O que mexe no saldo', 'escuro');
  const LW = L.reduce((s, p) => s + p.w, 0) + 14 * 5, TOPO1 = Y1 - fA.h / 2, TOPO2 = YL - 38;
  const S1 = enquadraRet(EIXO, ret(-fA.w / 2, TOPO1, fA.w / 2, Y1 + fA.h / 2 + 14 + 38 + 14), { az: -.03, max: 1.4 / EE }), S2 = enquadraRet(EIXO, ret(-LW / 2 - 26, TOPO2, LW / 2 + 26, YH + 48), { az: .0, max: 1.4 / EE });
  camera([[t0 - 3, S1], [tq - .2, { ...S1, az: -.012, d: S1.d * .985 }, 'lin'], [tq + .95, S2], [tfim + 2.5, { ...S2, az: .03, d: S2.d * .98 }, 'lin']]);
  const TL = [tc6, tv6, tt6, taj, tex, tpd], SAI1 = tpg + .25;
