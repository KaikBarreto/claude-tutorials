<script type="module">
import { PI, cl, lerp, pr, eo, eio, eo5, eis, passa, golpe, W, el, ic, vis, foco, pulso, ondaEm, titulo, posTitulo, selo,
  htmlChip, htmlCartao, htmlFluxo, fluxo, CENA, GL, THREE, mat, caixa, malha, grupo, mundo, mancha, piso, anel, destaque, U, camera, posCam,
  lugar, lugarDeFrente, plano, clima, cena, estilo, enquadraRet }
  from '../../../../perfis/ecoflix/cenas_v3/motor.js';
import { ceuClaro, mundoEscuro } from '../../../../perfis/ecoflix/cenas_v3/fundo.js';
import { htmlFluxoCartoes, fluxoCartoes, parte } from '../../../../perfis/ecoflix/cenas_v3/dados/fluxoCartoes.js';

// =====================================================================================================================
// comuns
const NUNCA = 1e9, EE = .0112;
const cores = () => estilo('t13-cor', `.chip.am{background:linear-gradient(150deg,#F7CB68,#E59A22);color:#3A2A06;border-color:rgba(255,255,255,.4);box-shadow:0 12px 22px -8px rgba(229,154,34,.6)}
.chip.vm{background:linear-gradient(150deg,#FF9A8C,#E5564A);color:#3A0A06;border-color:rgba(255,255,255,.4);box-shadow:0 12px 22px -8px rgba(229,86,74,.6)}
.selo.vm{background:linear-gradient(150deg,#FF9A8C,#E5564A);box-shadow:0 10px 18px -6px rgba(229,86,74,.6),inset 0 1px 0 rgba(255,255,255,.45)}`);
const cartaoP = (icone, rot, sub, cls, cw = 190) => htmlFluxoCartoes({ cartoes: [[icone, rot, sub, cls]], cw });   // cartão pequeno (selo + rótulo + legenda)
const subEm = (p, t, a) => { const s = parte(p.e, 0).querySelector('.d-s'); if (s) s.style.opacity = eo(pr(t, a, .3)).toFixed(3); };   // a legenda entra na palavra que a diz
const subDe = (p, t, a) => { const s = p.e.querySelector('.sub'); if (s) s.style.opacity = eo(pr(t, a, .3)).toFixed(3); };   // idem, para o degrau
const poeTxt = (e, s) => { if (e && e.textContent !== s) e.textContent = s; };
// degrau: cartão baixo de uma linha (selo + nome + legenda opcional)
const degrau = (icone, rot, sub, o = {}) => `<div class="cartao ${o.cc ?? ''}" style="position:relative;width:${o.w ?? 360}px;height:${o.h ?? 84}px;padding:0 20px;display:flex;align-items:center;gap:13px;white-space:nowrap">
  ${selo(icone, o.cls ?? 'n', o.selo ?? 46)}<div><div class="rot">${rot}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>${o.res ? '<div class="onda"></div>' : ''}</div>`;
// mês: cartão baixo, só o nome e a data
const mes = (rot, sub, w = 150, h = 72) => `<div class="cartao" style="position:relative;width:${w}px;height:${h}px;display:flex;flex-direction:column;align-items:center;justify-content:center;white-space:nowrap"><div class="rot">${rot}</div><div class="sub">${sub}</div></div>`;
// um lugar do mundo escuro: posições em px do desenho (y para baixo)
function escuro() {
  const EIXO = lugar([0, 0, 0]), E = mundoEscuro(EIXO, 0, EE);
  return { EIXO, X: (html, x, y, o = {}) => E(html, x * EE, -y * EE, 0, o), ret: (a, b, c, d) => [a * EE, -d * EE, c * EE, -b * EE], fundo: (cx, cy, o) => E.fundo(cx * EE, -cy * EE, o), L: E.lista };
}
const aqui = (p, x, y) => { p.pos[0] = x * EE; p.pos[1] = -y * EE; };
// fios que saem de um cartão (em cima, centro em x = 0) e descem até cartões na fileira de baixo (dx = centro de cada um); 10 px de respiro nas duas pontas
function garfoPara(X, dxs, yTopo, FH) {
  const FW = 2 * Math.max(...dxs.map(Math.abs)) + 40, XM = FW / 2, r = 14, ym = Math.round(FH / 2);
  const d = dx => { const s = Math.sign(dx); return s ? `M${XM} 0V${ym - r}Q${XM} ${ym} ${XM + s * r} ${ym}H${XM + dx - s * r}Q${XM + dx} ${ym} ${XM + dx} ${ym + r}V${FH}` : `M${XM} 0V${FH}`; };
  return X(htmlFluxo(FW, FH, dxs.map(d)), 0, yTopo, { anc: [.5, 0], z: -40 });
}
// o inverso: de cartões na fileira de cima (centro em dx) para um cartão embaixo (centro em x = 0)
function juntaDe(X, dxs, yTopo, FH) {
  const FW = 2 * Math.max(...dxs.map(Math.abs)) + 40, XM = FW / 2, r = 14, ym = Math.round(FH / 2);
  const d = dx => { const s = Math.sign(dx); return s ? `M${XM + dx} 0V${ym - r}Q${XM + dx} ${ym} ${XM + dx - s * r} ${ym}H${XM + s * r}Q${XM} ${ym} ${XM} ${ym + r}V${FH}` : `M${XM} 0V${FH}`; };
  return X(htmlFluxo(FW, FH, dxs.map(d)), 0, yTopo, { anc: [.5, 0], z: -40 });
}
const STAND = (t, tit, t0, sai) => { clima(1); GL.style.visibility = 'hidden'; posTitulo(tit, t, t0 - .9, t0 - .45, sai); };

// =====================================================================================================================
// CENA "contas" · cap00, linhas 0 a 2 · clima escuro (a lista de contas)
// 0 "Oi! Neste tutorial a gente vai organizar o que a Recicla Vale Metais tem pra pagar e pra receber."
// 1 "Sabe a conta de luz que só aparece no dia do vencimento? E o cliente que levou a prazo, e ninguém lembra quando paga?"
// 2 "Aqui, tudo entra com data, categoria e de quem é. O que a empresa paga e o que ela recebe, numa tela só."
// A Recicla Vale Metais e as duas colunas (A Pagar, A Receber); a conta de luz e o fiado chegam soltos, fora de lugar; na linha 2
// eles se encaixam nas colunas e ganham data, categoria e de quem é.
function contas() {
  const t0 = .4, tre = W(0, 'recicla'), tpa = W(0, 'pagar'), trc = W(0, 'receber'),
    tlz = W(1, 'luz'), tve = W(1, 'vencimento'), tcl = W(1, 'cliente'), tpz = W(1, 'prazo'),
    tag = W(2, 'aqui'), tda = W(2, 'data'), tca = W(2, 'categoria'), tqu = W(2, 'quem'), tpg = W(2, 'paga'), trb = W(2, 'recebe'), tnu = W(2, 'numa'), tso = W(2, 'so'), tfim = W(2, 'so', 1, 'e');
  cores();
  const { EIXO, X, ret, fundo } = escuro(), CX = 200, YC = -120, YL = -10, YF = 110, YN = 215, CW = 360;
  const emp = X(htmlChip(`${ic('map-pin', 18)}Recicla Vale Metais`, 'n'), 0, -220, { z: 40 });
  const pag = X(degrau('arrow-up-right', 'A Pagar', '', { w: CW, cls: 'vm' }), -CX, YC), rec = X(degrau('arrow-down-left', 'A Receber', '', { w: CW, cls: '' }), CX, YC);
  const en = X(degrau('zap', 'Energia', 'Vence hoje', { w: CW, cls: 'a' }), -CX, YL), fi = X(degrau('user-round', 'Fundição Bandeira do Vale', 'Fiado', { w: CW, cls: 'n' }), CX, YL);
  const S0 = { en: [-300, 205], fi: [300, 155] };   // onde chegam, soltos
  const F = [['calendar-days', 'Data', tda, -175], ['tag', 'Categoria', tca, 0], ['user-round', 'De quem', tqu, 175]].map(([i, n, ti, x]) => ({ ti, p: X(htmlChip(`${ic(i, 18)}${n}`, 'n'), x, YF, { z: 40 }) }));
  const chN = X(htmlChip('numa tela só', 'am'), 0, YN, { z: 40 });
  fundo(0, 0);
  const tit = titulo('Contas', 'Pagar e receber', 'escuro');
  const S1 = enquadraRet(EIXO, ret(-CX - CW / 2 - 100, -222 - 20, CX + CW / 2 + 100, 237), { az: -.03, max: 1.4 / EE }), S2 = enquadraRet(EIXO, ret(-CX - CW / 2 - 10, -242, CX + CW / 2 + 10, YN + 22), { az: .0, max: 1.4 / EE });
  camera([[t0 - 3, S1], [tag - .4, { ...S1, az: -.012, d: S1.d * .985 }, 'lin'], [tag + .9, S2], [tfim + 2.5, { ...S2, az: .03, d: S2.d * .98 }, 'lin']]);
  return t => {
    STAND(t, tit, t0);
    vis(emp.e, t, tre - .1, NUNCA, { dy: 10, sc: .8 }); vis(pag.e, t, tpa - .1, NUNCA, { dy: 18 }); vis(rec.e, t, trc - .1, NUNCA, { dy: 18 });
    vis(en.e, t, tlz - .1, NUNCA, { dy: 18 }); subDe(en, t, tve - .05); vis(fi.e, t, tcl - .1, NUNCA, { dy: 18 }); subDe(fi, t, tpz - .05);
    const k = eio(pr(t, tag - .05, 1.0));   // as duas contas soltas se encaixam nas colunas
    aqui(en, lerp(S0.en[0], -CX, k), lerp(S0.en[1], YL, k)); aqui(fi, lerp(S0.fi[0], CX, k), lerp(S0.fi[1], YL, k));
    for (const f of F) vis(f.p.e, t, f.ti - .1, NUNCA, { dy: 10, sc: .8 });
    vis(chN.e, t, tnu - .1, NUNCA, { dy: 10, sc: .8 }); pulso(chN.e, t, tso, .05, .8); pulso(pag.e, t, tpg, .04, .8); pulso(rec.e, t, trb, .04, .8);
  };
}

// =====================================================================================================================
// CENA "vencidas" · cap02, linha 2 · clima escuro (a faixa do tempo)
// 2 "Vencidas é o que passou do vencimento e não foi pago, como a água. Vence em 7 dias é o que vence de hoje até daqui a sete dias, como a energia."
// Uma faixa só, dividida em hoje: à esquerda o que já passou (Vencidas, a água); à direita o que vem (Vence em 7 dias, a energia).
function vencidas() {
  const t0 = W(2, 'vencidas'), tpa = W(2, 'passou'), tvc = W(2, 'vence'), tho = W(2, 'hoje'), tse = W(2, 'sete'), tc1 = W(2, 'como', 1), tc2 = W(2, 'como', 2), tfim = W(2, 'energia', 1, 'e');
  cores();
  const { EIXO, X, ret, fundo } = escuro(), BW = 900, BH = 96, YB = 60;
  const meia = (icone, cls, rot, sub, fundoCss, dm) => `<div data-m="${dm}" style="flex:1;display:flex;align-items:center;gap:14px;padding:0 26px;background:${fundoCss};opacity:0;white-space:nowrap">${selo(icone, cls, 46)}<div><div class="rot">${rot}</div><div class="sub">${sub}</div></div></div>`;
  const faixa = X(`<div class="cartao" style="position:relative;width:${BW}px;height:${BH}px;display:flex;padding:0;overflow:hidden">
    ${meia('triangle-alert', 'vm', 'Vencidas', 'passou do vencimento', 'linear-gradient(90deg,rgba(255,141,126,.24),rgba(255,141,126,.05))', 'v')}<i style="width:2px;background:var(--tr)"></i>
    ${meia('calendar-clock', 'a', 'Vence em 7 dias', 'de hoje até daqui a sete dias', 'linear-gradient(90deg,rgba(247,197,90,.05),rgba(247,197,90,.24))', 'a')}</div>`, 0, YB);
  const ag = X(htmlChip(`${ic('droplets', 18)}Água`, 'vm'), -BW / 4, YB - BH / 2 - 14, { anc: [.5, 1], z: 40 }), en = X(htmlChip(`${ic('zap', 18)}Energia`, 'am'), BW / 4, YB - BH / 2 - 14, { anc: [.5, 1], z: 40 });
  const hj = X(htmlChip('Hoje', 'n'), 0, YB + BH / 2 + 14, { anc: [.5, 0], z: 40 }), d7 = X(htmlChip('7 dias', 'n'), BW / 2, YB + BH / 2 + 14, { anc: [1, 0], z: 40 });
  fundo(0, YB, { aneis: false });
  const tit = titulo('Cartões', 'Vencidas e Vence em 7 dias', 'escuro');
  const S1 = enquadraRet(EIXO, ret(-BW / 2 - 12, YB - BH / 2 - 14 - 44, BW / 2 + 12, YB + BH / 2 + 14 + 44), { az: -.03, max: 1.4 / EE });
  camera([[t0 - 3, S1], [tfim + 2.5, { ...S1, az: .03, d: S1.d * .985 }, 'lin']]);
  const mv = faixa.e.querySelector('[data-m=v]'), ma = faixa.e.querySelector('[data-m=a]');
  return t => {
    STAND(t, tit, t0);
    vis(faixa.e, t, t0 - .05, NUNCA, { dy: 18 }); mv.style.opacity = eo(pr(t, t0 - .05, .4)).toFixed(3); ma.style.opacity = eo(pr(t, tvc - .1, .4)).toFixed(3);
    pulso(mv, t, tpa, .03, .8);
    vis(ag.e, t, tc1 - .05, NUNCA, { dy: 10, sc: .8 });
    vis(hj.e, t, tho - .1, NUNCA, { dy: -10, sc: .8 }); vis(d7.e, t, tse - .1, NUNCA, { dy: -10, sc: .8 });
    vis(en.e, t, tc2 - .05, NUNCA, { dy: 10, sc: .8 });
  };
}

// =====================================================================================================================
// CENA "parcelas" · cap07, linhas 7 e 8 · clima escuro (a compra vira três contas; parcelar ou repetir)
// 7 "Cada parcela vira uma conta separada. Dá pra pagar uma sem mexer nas outras."
// 8 "Parcelar é pra dívida com fim, como esses pneus. Pro gasto que volta todo mês, é o Repetir, que vem agora."
// Estação 1: a compra dos pneus (7.080) se abre em três contas; a primeira é paga e as outras seguem Pendente.
// Estação 2 (a câmera desce): Parcelar acaba em três meses; Repetir volta todo mês.
function parcelas() {
  const t0 = W(7, 'cada'), tvi = W(7, 'vira'), tum = W(7, 'uma'), tco = W(7, 'conta'), tse = W(7, 'separada'), tpg = W(7, 'pagar'), tou = W(7, 'outras'),
    tpa = W(8, 'parcelar'), tdv = W(8, 'divida'), tfm = W(8, 'fim'), tpn = W(8, 'pneus'), tga = W(8, 'gasto'), tvo = W(8, 'volta'), tmz = W(8, 'mes'), tre = W(8, 'repetir'), tfim = W(8, 'agora', 1, 'e');
  cores();
  const { EIXO, X, ret, fundo } = escuro(), YS = -150, YP = 40, OY = 410, PW = 200, VAO = 24;
  const src = X(htmlCartao('truck', 'Pneus do caminhão truck', 'Auto Peças Vale Forte', 'R$ 7.080,00', { w: 400, h: 132 }), 0, YS);
  const P = [['23/11', -(PW + VAO)], ['23/12', 0], ['23/01', PW + VAO]].map(([d, x]) => X(cartaoP('receipt', d, 'R$ 2.360,00', 'n', PW), x, YP));
  const PH = P[0].h, YCH = YP + PH / 2 + 14;
  const pend = P.map((p, i) => X(htmlChip('Pendente', 'am'), p.pos[0] / EE, YCH, { anc: [.5, 0], z: 40 })), paga = X(htmlChip('Paga', ''), P[0].pos[0] / EE, YCH, { anc: [.5, 0], z: 45 });
  const FY0 = YS + 66 + 10, FH = Math.round(YP - PH / 2 - 10 - FY0), fi = garfoPara(X, P.map(p => p.pos[0] / EE), FY0, FH);
  // estação 2
  const LW = 250, CP = 150, X0 = -512, XC = i => X0 + LW + 24 + 75 + CP * i, YR1 = OY - 60, YR2 = OY + 60;
  const lP = X(degrau('calendar-days', 'Parcelar', 'Dívida com fim', { w: LW, cls: '' }), X0 + LW / 2, YR1), lR = X(degrau('repeat', 'Repetir', 'Volta todo mês', { w: LW, cls: 'a' }), X0 + LW / 2, YR2);
  const M = ['Novembro', 'Dezembro', 'Janeiro', 'Fevereiro', 'Março'], mP = [0, 1, 2].map(i => X(htmlChip(M[i], ''), XC(i), YR1, { z: 40 })), mR = M.map((m, i) => X(htmlChip(m, ''), XC(i), YR2, { z: 40 }));
  const fimC = X(htmlChip(`${ic('flag', 18)}Fim`, 'n'), XC(3), YR1, { z: 40 });
  fundo(0, 140, { aneis: false });
  const tit = titulo('Parcelas', 'Parcelar ou repetir', 'escuro');
  const S1 = enquadraRet(EIXO, ret(-PW - VAO - PW / 2 - 6, YS - 66, PW + VAO + PW / 2 + 6, YCH + 46), { az: -.03, max: 1.4 / EE }), S2 = enquadraRet(EIXO, ret(X0 - 6, YR1 - 42, X0 + 1024 + 6, YR2 + 42), { az: .0, max: 1.4 / EE });
  camera([[t0 - 3, S1], [tpa - .45, { ...S1, az: -.012, d: S1.d * .99 }, 'lin'], [tpa + .65, S2], [tfim + 2.5, { ...S2, az: .03, d: S2.d * .98 }, 'lin']]);
  const T = [tvi - .05, tum - .05, tco - .05], SAI1 = tpa - .3;
  return t => {
    STAND(t, tit, t0);
    vis(src.e, t, t0 - .05, SAI1, { dy: 18 }); fi.e.style.opacity = (eo(pr(t, tvi - .3, .3)) * (1 - eo(pr(t, SAI1, .3)))).toFixed(3);
    P.forEach((p, i) => { vis(p.e, t, T[i], SAI1, { dy: 18 }); fluxo(fi.e, i, t, T[i] - .3, .55, { fica: .75, luz: [T[i] - .3, .75] }); subEm(p, t, T[i] + .15); });
    // a primeira é paga; as outras seguem pendentes
    pend.forEach((c, i) => { vis(c.e, t, T[i] + .45, SAI1, { dy: 8, sc: .85 }); if (i === 0) c.e.style.opacity = ((+c.e.style.opacity || 0) * (1 - eo(pr(t, tpg, .3)))).toFixed(3); });
    vis(paga.e, t, tpg, SAI1, { dy: 8, sc: .85 }); pulso(paga.e, t, tpg + .1, .06, .8); pulso(pend[1].e, t, tou, .04, .6); pulso(pend[2].e, t, tou + .12, .04, .6);
    // estação 2
    vis(lP.e, t, tpa - .1, NUNCA, { dy: 18 }); subDe(lP, t, tdv - .05);
    mP.forEach((m, i) => vis(m.e, t, tdv + .1 + .24 * i, NUNCA, { dy: 10, sc: .85 })); vis(fimC.e, t, tfm - .05, NUNCA, { dy: 10, sc: .85 }); pulso(lP.e, t, tpn, .03, .8);
    vis(lR.e, t, tga - .1, NUNCA, { dy: 18 }); subDe(lR, t, tvo - .05);
    mR.forEach((m, i) => vis(m.e, t, tvo + .12 + .2 * i, NUNCA, { dy: 10, sc: .85 })); pulso(lR.e, t, tre, .04, .8);
  };
}

// =====================================================================================================================
// CENA "molde" · cap08, linha 6 · clima escuro (o molde da conta e os meses)
// 6 "O sistema guarda um molde da conta. Com data de parar, ele já cria todas até ela. Sem data, ele mantém sempre os próximos
//    três meses na lista e cria a seguinte sozinho, conforme o tempo passa."
// O molde do aluguel em cima; com data de parar os seis meses saem dele de uma vez (12/11 a 12/04); sem data, só os três primeiros
// ficam acesos (Hoje, Próximos 3 meses) e, com o tempo, a faixa anda e a seguinte acende.
function molde() {
