<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- T00 "Bem-vindo ao EcoSistema": cenas de conceito, no kit da EcoFlix (perfis/ecoflix/cenas/cenas_ecoflix.html, com as
     mesmas utilidades e sem os dois exemplos; o caminhao() do kit ficou). 1280x800 CSS, renderizado quadro a quadro por
     render_cenas.cjs (window.setup(dados) + window.R(t)); tudo é função do tempo; cada mudança presa a uma palavra com
     W(linha, 'palavra'). As janelas de cada cena (de, ate, cauda) são as do ilustracoes.json, copiadas em ILUS.
     Capítulos só de ilustração (sem gravação de tela): cap00 e cap05, do primeiro ao último quadro (cenas encostadas).
     Cenas encostadas no mesmo trecho (cap10, cap11): as janelas se sobrepõem e a troca acontece no respiro entre as falas;
     renderizar o trecho inteiro de uma vez. Dados: Recicla Vale Metais (MUNDO_FICTICIO.md); rótulos do app só os do
     T00/inventario.md (código 1.59.154); sem tela do app, sem marca de terceiros, sem preço de plano. -->
<style>
@font-face{font-family:M;font-weight:500;src:url(../../../web/fonts/montserrat-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:600;src:url(../../../web/fonts/montserrat-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:700;src:url(../../../web/fonts/montserrat-latin-700-normal.woff2) format('woff2')}

@font-face{font-family:M;font-weight:500;src:url(../../../web/fonts/montserrat-latin-ext-500-normal.woff2) format('woff2');unicode-range:U+0100-024F}
@font-face{font-family:M;font-weight:700;src:url(../../../web/fonts/montserrat-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-024F}
/* ---------------------------------------------------------------- paleta EcoFlix (marca: acento #50D088, escuro #121212)
   --v  acento: preenchimentos, barras, contornos de destaque (nunca texto sobre branco: contraste baixo)
   --ve verde escuro: texto e ícone verde sobre branco (contraste 5,0)   --vc verde claro: fundo de ícone/resultado
   --a  âmbar: o SEGUNDO conceito da cena (ex.: competência x caixa)     --ae texto âmbar (5,9)   --ac âmbar claro
   --t  texto (o escuro da marca)   --c texto secundário (4,8)   --l linhas   --e painel escuro (mostrador) */
:root{--v:#50D088;--ve:#2E7D57;--vc:#EAF8F0;--vm:#A9E9C6;--a:#F2B63D;--ae:#8A5A00;--ac:#FFF5DF;
  --t:#121212;--c:#6B7280;--l:#E6E9EE;--e:#121212}
*{box-sizing:border-box;margin:0;padding:0;transition:none!important;animation:none!important}
html,body{width:1280px;height:800px;overflow:hidden;background:#fff}
body{font-family:M,sans-serif;color:var(--t);-webkit-font-smoothing:antialiased}
#st{position:absolute;inset:0;overflow:hidden;background:
  radial-gradient(1100px 650px at 92% -12%,rgba(80,208,136,.09),transparent 62%),
  radial-gradient(900px 600px at -12% 112%,rgba(80,208,136,.06),transparent 60%),#fff}
.g{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:640px 400px}
.ab{position:absolute}
.row{display:flex;align-items:center}
/* título da cena: área (kicker) + conceito; sozinho fica grande no centro e sobe quando o desenho entra */
.kick{font-weight:700;font-size:15px;letter-spacing:.3em;color:var(--ve);text-transform:uppercase}
.h{font-weight:800;font-size:46px;letter-spacing:-.01em;line-height:1.1}
/* cartão, chip, etiqueta, ícone */
.card{position:absolute;background:#fff;border:1px solid #E1E8E4;border-radius:18px;
  box-shadow:0 18px 40px rgba(16,24,40,.10),0 3px 8px rgba(16,24,40,.06)}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:100%;height:100%}
.ico{display:flex;align-items:center;justify-content:center;flex:none;border-radius:14px;background:var(--vc);color:var(--ve)}
.ico.a{background:var(--ac);color:var(--ae)}
.tag{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;font-weight:800;font-size:20px;white-space:nowrap}
.tag.v{background:var(--vc);color:var(--ve)} .tag.a{background:var(--ac);color:var(--ae)}
.lbl{font-weight:700;font-size:17px;color:var(--c)}
.num{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.op{position:absolute;width:60px;height:60px;border-radius:50%;background:#F2F4F7;color:var(--t);display:flex;
  align-items:center;justify-content:center;font-weight:800;font-size:34px;line-height:1}
/* mostrador da balança (painel escuro, número no acento) */
.most{background:var(--e);border-radius:16px;padding:16px 22px 18px;box-shadow:0 16px 34px rgba(16,24,40,.22)}
.most .ml{position:relative;height:20px;font-weight:700;font-size:15px;letter-spacing:.22em;color:#A9E9C6;text-transform:uppercase}
.most .ml span{position:absolute;left:0;top:0;white-space:nowrap}
.most .mn{margin-top:6px;font-weight:800;font-size:44px;color:var(--v);font-variant-numeric:tabular-nums;white-space:nowrap}
.rip{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:3px solid var(--v);opacity:0}
/* ---------------------------------------------------------------- T00 */
.tag.s{font-size:17px;padding:7px 14px;gap:7px}
.tag.n{background:#4B5563;color:#fff}
/* estações do caminho do pátio */
.est{position:absolute;width:96px;height:96px;border-radius:50%;background:#fff;border:3px solid #D5DCD8;display:flex;
  align-items:center;justify-content:center;color:#9AA3AD}
.est .fill{position:absolute;inset:-3px;border-radius:50%;background:var(--vs);opacity:0}
.est .ic{position:relative}
.estl{position:absolute;width:172px;text-align:center;font-weight:700;font-size:22px;line-height:1.2;color:#6B7280}
.aula{position:absolute;width:38px;height:38px;border-radius:50%;background:var(--vs);color:#fff;display:flex;
  align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(16,24,40,.22);border:3px solid #fff}
.aula svg{fill:currentColor}
/* faixas de tempo (teste x assinatura) */
.zona{border-radius:26px;background:#F7F8F9;border:1px solid #EDF0F2}
.zona.v{background:#F2FAF5;border-color:#DDF2E6}
/* vídeo genérico (miniatura de player, sem marca) */
.vid{position:absolute;width:240px;height:134px;border-radius:16px;background:#1B1F24;box-shadow:0 14px 30px rgba(16,24,40,.18)}
.vid .pl{position:absolute;left:92px;top:28px;width:56px;height:56px;border-radius:50%;background:var(--vs);display:flex;
  align-items:center;justify-content:center;color:#fff}
.vid .pl svg{fill:currentColor}
.vid .tr{position:absolute;left:20px;top:106px;width:200px;height:7px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden}
.vid .pg{height:7px;width:0;border-radius:4px;background:var(--v)}
.vid .bd{position:absolute;right:-15px;top:-15px;width:42px;height:42px;border-radius:50%;background:var(--vs);border:3px solid #fff;
  color:#fff;display:flex;align-items:center;justify-content:center}
.vid .bd.a{background:var(--as);border-color:#fff;color:#fff}
.vid.off{background:#F1F3F5;box-shadow:none;border:2px dashed #C9D0D6;display:flex;align-items:center;justify-content:center;color:#8A949E}
.selo{display:inline-flex;align-items:center;gap:10px;padding:11px 20px;border-radius:999px;background:var(--vs);color:#fff;
  border:2.5px solid var(--v);font-weight:800;font-size:19px;white-space:nowrap;box-shadow:0 10px 22px rgba(46,125,87,.18)}
/* barra da trilha */
.barra{border-radius:18px;background:#F4F6F8;border:2px solid #E1E8E4}
.bl{position:absolute;border-radius:6px}
/* mensagem pronta */
.ln{font-size:24px;font-weight:500;color:#1F2933;white-space:nowrap;line-height:1.3}
.ln b{font-weight:800}
/* ladrilho de módulo */
.mod{position:absolute;width:128px;height:96px;border-radius:16px;background:#fff;border:2px solid #E1E8E4;display:flex;
  align-items:center;justify-content:center;color:#9AA3AD}
.mod .fill{position:absolute;inset:-2px;border-radius:16px;background:var(--vs);opacity:0}
.mod .ic{position:relative}
/* linhas de mês (formas de pagamento) */
.mes{height:58px;border-radius:14px;background:#F7F8F9;display:flex;align-items:center;gap:12px;padding:0 12px 0 16px;
  font-weight:700;font-size:19px;color:#374151;position:relative}
.mes .st{margin-left:auto;width:40px;height:40px;border-radius:50%;position:relative;flex:none}
.mes .st>div{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center}
.sw{width:56px;height:32px;border-radius:16px;background:#D5DCD8;position:relative;flex:none}
.sw i{position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2)}
/* glossário */
.gl{position:absolute;left:190px;top:170px;width:900px;height:476px}
.glh{position:absolute;left:36px;top:30px;display:flex;align-items:center;gap:18px}
.glh .w{font-weight:800;font-size:40px;letter-spacing:-.01em}
.mini{position:absolute;width:250px;height:150px;text-align:center;padding-top:26px}
.papel{position:absolute;background:#fff;border:1px solid #E1E6EA;border-radius:14px;box-shadow:0 10px 24px rgba(16,24,40,.08)}
.lin{display:flex;align-items:baseline;justify-content:space-between;gap:16px;padding:11px 0;border-top:1px solid var(--l);font-size:19px}
.lin span:first-child{font-weight:700;color:var(--c);font-size:17px}
.lin span:last-child{font-weight:800}
</style><style id="saturado">/* estilo saturado (Kaik, 11/11): selo, chip, etiqueta, quadrado de ícone e círculo de etapa
   com fundo cheio e ícone/texto branco; nunca fundo claro com conteúdo colorido, nunca ícone escuro sobre o verde */
:root{--vs:#50D088;--as:#F2B63D;--rs:#EF4444}
.ico{background:var(--vs);color:#fff}.ico.a{background:var(--as);color:#fff}
.tag.v{background:var(--vs);color:#fff}.tag.a{background:var(--as);color:#fff}
</style></head>
<body><div id="st"></div>
<script>
// ------------------------------------------------------------------ utilidades (as do kit EcoFlix)
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const pr=(t,a,d=.45)=>cl((t-a)/d);
const lerp=(a,b,p)=>a+(b-a)*p;
const $=s=>document.querySelector(s);
const ST=document.getElementById('st');
function el(html,parent=ST){const d=document.createElement('div');d.innerHTML=html.trim();let f=null;for(const n of [...d.childNodes]){parent.appendChild(n);if(!f&&n.nodeType===1)f=n}return f}
function grupo(){return el('<div class="g"></div>')}
function ic(n,px,cor){const s=(window.ICONS||{})[n]||'';return `<span class="ic" style="width:${px}px;height:${px}px;${cor?'color:'+cor:''}">${s}</span>`}
function hex(c){c=c.replace('#','');return[0,2,4].map(i=>parseInt(c.substr(i,2),16))}
function mix(a,b,p){const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*cl(p))).join(',')})`}
function vis(e,t,a,b=1e9,o={}){
  const din=o.din??.5,dout=o.dout??.4,dy=o.dy??16,dx=o.dx??0,sc=o.sc??.985;
  const p=eo(pr(t,a,din)),q=1-eo(pr(t,b,dout)),op=Math.min(p,q);
  e.style.opacity=op.toFixed(4);e.style.visibility=op<=.001?'hidden':'visible';
  const s=sc+(1-sc)*p - (1-q)*(1-sc);
  e.style.transform=`translate(${((1-p)*dx).toFixed(2)}px,${((1-p)*dy-(1-q)*dy*.5).toFixed(2)}px) scale(${s.toFixed(4)})`;
  return op;
}
function ripple(r,t,a){const p=pr(t,a,.7);r.style.opacity=(p>0&&p<1)?(.6*(1-p)).toFixed(3):0;r.style.transform=`scale(${(.4+2.0*eo(p)).toFixed(3)})`}
function pulse(e,t,a,amp=.045,dur=.9){const p=pr(t,a,dur);e.style.scale=(p>0&&p<1)?(1+amp*Math.sin(Math.PI*p)).toFixed(4):''}
const NF=new Intl.NumberFormat('pt-BR');
const kg=v=>NF.format(Math.round(v))+' kg';
const brl=v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function conta(e,t,a,d,v0,v1,fmt=kg){const p=eo(pr(t,a,d));const s=fmt(lerp(v0,v1,p));if(e.textContent!==s)e.textContent=s;return p}
function traco(p,t,a,d=.8){if(!p._L){p._L=p.getTotalLength();p.style.strokeDasharray=p._L}const q=eio(pr(t,a,d));p.style.strokeDashoffset=(p._L*(1-q)).toFixed(2);p.style.opacity=q>0?1:0;return q}
function arco(e,t,a,d,x0,y0,x1,y1,h=-80,rot=0){const p=eio(pr(t,a,d));const x=lerp(x0,x1,p),y=lerp(y0,y1,p)+h*4*p*(1-p);
  e.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${(rot*p).toFixed(2)}deg)`;return p}
function contorno(e,t,a,de,para,d=.45){e.style.borderColor=mix(de,para,eo(pr(t,a,d)))}
function titulo(g,kick,txt){return el(`<div class="ab" style="left:0;top:0;width:1280px;text-align:center">
  <div class="kick">${kick}</div><div class="h" style="margin-top:12px">${txt}</div></div>`,g)}
function posTitulo(e,t,a,sobe,sai=1e9){vis(e,t,a,sai,{dy:14});const p=eio(pr(t,sobe,.7));
  e.style.top=lerp(318,46,p).toFixed(2)+'px';e.style.scale=lerp(1.12,1,p).toFixed(4)}

// ------------------------------------------------------------------ tempos da fala (capNN.json do proc.py ou estimado)
let D=null;
const norm=w=>w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9%./-]+/g,'');
function W(linha,palavra,n=1,campo='s'){
  const alvo=norm(palavra);let k=0;
  for(const w of D.words){if(w.linha===linha&&norm(w.w).replace(/[.,]$/,'')===alvo){k++;if(k===n)return w[campo]}}
  for(const w of D.words){if(w.linha===linha&&norm(w.w).startsWith(alvo)){k++;if(k>=n)return w[campo]}}
  console.warn('palavra não achada',linha,palavra);return L(linha);
}
const L=i=>(D.linhas[i]||{s:0}).s, LE=i=>(D.linhas[i]||{e:D.dur}).e;

// ------------------------------------------------------------------ desenhos genéricos do kit (sem marca)
function caminhao(){
  const pd=[
    ['<polygon points="28,90 44,52 88,42 100,90"/>','#8C5A3C',[64,66],[-224,148,6]],
    ['<polygon points="82,90 102,36 146,48 154,90"/>','#6F7983',[118,63],[-318,122,12]],
    ['<rect x="118" y="44" width="112" height="16" rx="8" transform="rotate(-8 174 52)"/>','#9AA3AD',[174,52],[-334,98,-18]],
    ['<polygon points="148,90 170,54 212,44 232,90"/>','#A0694A',[190,67],[-425,148,-8]],
    ['<polygon points="210,90 232,40 276,54 286,90"/>','#4F5861',[248,65],[-373,120,-10]],
    ['<polygon points="258,90 282,60 308,66 312,90"/>','#8A949E',[285,75],[-375,148,4]],
    ['<g><circle cx="192" cy="64" r="19"/><circle cx="192" cy="64" r="7" fill="#8A949E"/></g>','#5E6670',[192,64],[-242,155,200]],
    ['<polygon points="40,70 60,50 84,64 64,86"/>','#B07A55',[62,68],[-307,100,30]]];
  const pecas=pd.map(([f,c,[cx,cy],[dx,dy,r]])=>`<g class="pd" data-cx="${cx}" data-cy="${cy}" data-dx="${dx}" data-dy="${dy}" data-r="${r}" fill="${c}">${f}</g>`).join('');
  const roda=x=>`<g class="roda" data-x="${x}" transform="translate(${x},196)"><circle r="26" fill="#1B1F24"/><circle r="12" fill="#9AA3AD"/>
    <rect x="-2.5" y="-23" width="5" height="10" rx="2" fill="#5B636C"/><rect x="-2.5" y="13" width="5" height="10" rx="2" fill="#5B636C"/></g>`;
  return `<svg viewBox="0 0 500 230" width="500" height="230" style="overflow:visible">
    <g class="carga">${pecas}</g>
    <rect x="18" y="86" width="304" height="88" rx="6" fill="#7E8994"/>
    <rect x="16" y="82" width="308" height="11" rx="4" fill="#68727D"/>
    <g stroke="#707A85" stroke-width="3">${[78,138,198,258].map(x=>`<line x1="${x}" y1="98" x2="${x}" y2="168"/>`).join('')}</g>
    <path d="M334,176 L334,76 Q334,64 346,64 L412,64 L462,116 L472,121 Q480,124 480,134 L480,176 Z" fill="#2F3640"/>
    <path d="M348,78 L406,78 L444,116 L348,116 Z" fill="#D7E5ED"/>
    <rect x="470" y="142" width="10" height="11" rx="2" fill="#F2B63D"/>
    <rect x="12" y="170" width="472" height="15" rx="4" fill="#23282E"/>
    ${roda(92)}${roda(158)}${roda(416)}
  </svg>`;
}

// ------------------------------------------------------------------ T00: janelas das cenas (cópia do ilustracoes.json)
const ILUS=/*ILU*/[
 {"cap":0,"id":"ilu00_caminho","de":[0,"Oi!",1],"ate":[0,"conta",1],"cauda":0.6},
 {"cap":0,"id":"ilu00_partes","de":[1,"Neste",1],"ate":[2,"aulas",1],"cauda":0.3},
 {"cap":0,"id":"ilu00_empresa","de":[2,"empresa",1],"ate":[3,"combinados",1],"cauda":1.95},
 {"cap":1,"id":"ilu01_teste","de":[4,"Uma",1],"ate":[4,"obrigatória",1],"cauda":0.8},
 {"cap":3,"id":"ilu03_progresso","de":[3,"essas",1],"ate":[3,"plano",1],"cauda":0.8},
 {"cap":4,"id":"ilu04_mensagem","de":[1,"Ele",1],"ate":[1,"enviar",1],"cauda":0.6},
 {"cap":5,"id":"ilu05_portao","de":[0,"Bom",1],"ate":[0,"latinha",1],"cauda":0.6},
 {"cap":5,"id":"ilu05_balanca","de":[1,"balança",1],"ate":[1,"quilos",1],"cauda":0.6},
 {"cap":5,"id":"ilu05_caixa","de":[2,"caixa",1],"ate":[2,"hora",1],"cauda":0.6},
 {"cap":5,"id":"ilu05_estoque","de":[3,"material",1],"ate":[3,"estoque",1],"cauda":0.6},
 {"cap":5,"id":"ilu05_venda","de":[4,"Depois",1],"ate":[4,"fiscal",1],"cauda":0.6},
 {"cap":5,"id":"ilu05_conta","de":[5,"dinheiro",1],"ate":[5,"mês",1],"cauda":0.6},
 {"cap":5,"id":"ilu05_aulas","de":[6,"Cada",1],"ate":[6,"trilha",1],"cauda":1.95},
 {"cap":8,"id":"ilu08_cliente","de":[0,"Antes",1],"ate":[0,"depósito",1],"cauda":0.6},
 {"cap":8,"id":"ilu08_glossario","de":[2,"Pedido",1],"ate":[9,"dizer",1],"cauda":0.8},
 {"cap":10,"id":"ilu10_motivos","de":[1,"Se",1],"ate":[2,"Permissões",1],"cauda":0.6},
 {"cap":10,"id":"ilu10_teste","de":[3,"Uma",1],"ate":[3,"módulo",1],"cauda":0.8},
 {"cap":11,"id":"ilu11_diferenca","de":[1,"Mudou",1],"ate":[2,"confirma",1],"cauda":0.6},
 {"cap":11,"id":"ilu11_aparelhos","de":[3,"Uma",1],"ate":[3,"celular",1],"cauda":0.6},
 {"cap":11,"id":"ilu11_equipe","de":[4,"Bateu",1],"ate":[4,"Personalizado",1],"cauda":0.8},
 {"cap":12,"id":"ilu12_formas","de":[2,"boleto",1],"ate":[3,"rápido",1],"cauda":0.6}
]/*FIM_ILU*/;
const ILU=Object.fromEntries(ILUS.map(c=>[c.id,c]));
// janela da cena: abre 0,3 s antes da palavra "de" e fecha "cauda" s depois do fim da palavra "ate"
function J(id){const c=ILU[id];return {a:W(c.de[0],c.de[1],c.de[2])-.3,b:W(c.ate[0],c.ate[1],c.ate[2],'e')+c.cauda}}
// troca entre duas cenas encostadas: no respiro entre a linha i e a seguinte
const troca=i=>(LE(i)+L(i+1))/2-.15;
// só a opacidade (para o que se move com transform próprio)
function op(e,t,a,b=1e9,din=.45,dout=.4){const o=Math.min(eo(pr(t,a,din)),1-eo(pr(t,b,dout)));e.style.opacity=o.toFixed(4);
  e.style.visibility=o<=.001?'hidden':'visible';return o}
// desenho com escala própria: invólucro (que a animação move) + miolo escalado
function escala(html,w,h,s,x,y,par){return el(`<div class="ab" style="left:${x}px;top:${y}px;width:${(w*s).toFixed(1)}px;height:${(h*s).toFixed(1)}px">

// ------------------------------------------------------------------ T00: o caminho do pátio (cap00 e cap05)
const EST=[['fence','Portão'],['weight','Balança'],['wallet','Caixa'],['warehouse','Estoque'],['handshake','Venda'],['landmark','Dinheiro<br>na conta']];
const EX=k=>215+176*k, EY=440, ELEN=EX(5)-EX(0);
function caminho(par){
  const g=el('<div class="ab" style="left:0;top:0;width:1280px;height:800px;transform-origin:640px 400px"></div>',par);
  const svg=el(`<svg class="ab" style="left:0;top:0;overflow:visible" width="1280" height="800">
     <line x1="${EX(0)}" y1="${EY}" x2="${EX(5)}" y2="${EY}" stroke="#E3E8E5" stroke-width="8" stroke-linecap="round"/>
     <line class="lv" x1="${EX(0)}" y1="${EY}" x2="${EX(5)}" y2="${EY}" stroke="#50D088" stroke-width="8" stroke-linecap="round"
       style="stroke-dasharray:${ELEN};stroke-dashoffset:${ELEN}"/></svg>`,g);
  const st=EST.map(([i,n],k)=>{
    const c=el(`<div class="est" style="left:${EX(k)-48}px;top:${EY-48}px"><div class="fill"></div>${ic(i,42)}</div>`,g);
    const l=el(`<div class="estl" style="left:${EX(k)-86}px;top:${EY+62}px">${n}</div>`,g);
    const b=el(`<div class="aula" style="left:${EX(k)+26}px;top:${EY-70}px;opacity:0;visibility:hidden">${ic('play',16)}</div>`,g);
    return {c,l,b,fill:c.querySelector('.fill')};});
  return {g,svg,lv:svg.querySelector('.lv'),st};
}
function acende(o,p){o.fill.style.opacity=p.toFixed(3);o.c.style.borderColor=mix('#D5DCD8','#50D088',p);
  o.c.style.color=mix('#9AA3AD','#FFFFFF',p);o.l.style.color=mix('#6B7280','#121212',p)}
function caminhoEntra(E,t,a,b=1e9){vis(E.svg,t,a,b,{dy:0,sc:1});
  E.st.forEach((o,k)=>{vis(o.c,t,a+.08*k,b,{sc:.7,dy:8});vis(o.l,t,a+.08*k+.06,b,{dy:8,sc:1})})}
// a linha verde corre de uma estação à outra; ts[k] = instante em que a estação k acende (a linha chega nela).
// Trechos curtos (menos de 0,6 s entre estações) andam em velocidade constante, sem tranco; os longos, com suavização.
function caminhoAte(E,t,ts){
  let x=EX(0);for(let k=1;k<6;k++){const d=Math.min(.6,ts[k]-ts[k-1]);
    if(t>=ts[k]-d)x=lerp(EX(k-1),EX(k),d<.6?cl((t-ts[k]+d)/d):eio(pr(t,ts[k]-d,d)))}
  E.lv.style.strokeDashoffset=(ELEN-(x-EX(0))).toFixed(1);E.lv.style.opacity=t>=ts[0]?1:0;
  E.st.forEach((o,k)=>acende(o,eo(pr(t,ts[k],.35))));
}
function caminhoAulas(E,t,ts){E.st.forEach((o,k)=>vis(o.b,t,ts[k],1e9,{sc:.4,dy:0,din:.45}))}

CAPS[12]=()=>{
  const g=grupo();
  const tit=titulo(g,'Assinatura','Cartão, Pix ou boleto');
  const MES=['Dezembro','Janeiro','Fevereiro'];
  const col=(x,icone,nome,auto,alto)=>{const c=el(`<div class="card" style="left:${x}px;top:172px;width:330px;height:${alto}px;padding:24px 20px"></div>`,g);
    el(`<div class="row" style="gap:14px;padding-left:4px"><div class="ico" style="width:52px;height:52px">${ic(icone,28)}</div><div style="font-weight:800;font-size:27px">${nome}</div></div>`,c);
    const tg=el(`<div style="margin-top:18px;height:38px;position:relative"><span class="tag v s ta" style="position:absolute;left:0;top:0">${ic('repeat',18)}Repete sozinha</span>
      <span class="tag a s tm" style="position:absolute;left:0;top:0">${ic('hand',18)}Cada mês</span></div>`,c);
    const ms=MES.map((m,k)=>{const r=el(`<div class="mes" style="margin-top:${k?10:20}px">${ic('calendar-days',22,'#6B7280')}${m}
      <div class="st"><div class="sa" style="background:var(--vs);color:#fff">${ic('repeat',20)}</div><div class="sm" style="background:var(--as);color:#fff">${ic('hand',20)}</div></div></div>`,c);

  const cC=col(90,'credit-card','Cartão',1,420), cP=col(475,'qr-code','Pix',0,520), cB=col(860,'barcode','Boleto',0,420);

    const pl=eio(pr(t,tli,.45)),pa=k=>eo(pr(t,tre+k*.18,.4));

    vis(nb,t,tba-.1,1e9,{dy:6,sc:1});

    vis(qr,t,tqr-.1,1e9,{dy:8});

    cB.c.style.boxShadow=`0 0 0 ${(5*eo(pr(t,tb3,.45))).toFixed(2)}px rgba(80,208,136,.22),0 18px 40px rgba(16,24,40,.10)`;
    pulse(cB.c,t,tb3+.1,.03,.8);vis(rap,t,tra-.15,1e9,{dy:8});

};
