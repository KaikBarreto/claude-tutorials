<script type="module">
import { PI, cl, lerp, pr, eo, eio, eo5, eis, golpe, W, el, ic, vis, foco, pulso, ondaEm, conta, pesa, kg, titulo, posTitulo, selo,
  htmlChip, htmlCartao, htmlOp, htmlVisor, ligaVisor, htmlFluxo, fluxo, CENA, GL, mundo, piso, U, camera, pose, posCam, olho, mergulho, lugar, lugarDeFrente,
  plano, clima, cena, estilo, enquadraRet, uneRet }
  from '../../../../perfis/ecoflix/cenas_v3/motor.js';
import { ceuClaro, mundoEscuro } from '../../../../perfis/ecoflix/cenas_v3/fundo.js';
import { base } from '../../../../perfis/ecoflix/cenas_v3/dados/base.js';
import { htmlFluxoCartoes, fluxoCartoes, parte, seta } from '../../../../perfis/ecoflix/cenas_v3/dados/fluxoCartoes.js';
import { htmlDocumento, documento } from '../../../../perfis/ecoflix/cenas_v3/dados/documento.js';
import { pessoa } from '../../../../perfis/ecoflix/cenas_v3/objetos/pessoa.js';
import { saco } from '../../../../perfis/ecoflix/cenas_v3/objetos/saco.js';
import { balancaPlataforma } from '../../../../perfis/ecoflix/cenas_v3/objetos/balancaPlataforma.js';

// comuns
const NUNCA = 1e9, EE = .0112, ROT = [-.2, .1, 0];
const cores = () => { base(); estilo('t00-cor', `.chip.am{background:linear-gradient(150deg,#F7CB68,#E59A22);color:#3A2A06;border-color:rgba(255,255,255,.4);box-shadow:0 12px 22px -8px rgba(229,154,34,.6)}
.chip.vm{background:linear-gradient(150deg,#FF9A8C,#E5564A);color:#3A0A06;border-color:rgba(255,255,255,.4);box-shadow:0 12px 22px -8px rgba(229,86,74,.6)}
.selo.vm{background:linear-gradient(150deg,#FF9A8C,#E5564A);box-shadow:0 10px 18px -6px rgba(229,86,74,.6),inset 0 1px 0 rgba(255,255,255,.45)}
.chip.sl{height:auto;padding:9px 12px;white-space:normal;text-align:center;justify-content:center;line-height:1.25;font-size:14.5px}`); };
const cartaoP = (icone, rot, sub, cls, cw = 190) => htmlFluxoCartoes({ cartoes: [[icone, rot, sub, cls]], cw });   // cartão pequeno (selo + rótulo + legenda)
const subDe = (p, t, a, sel = '.sub') => { const s = p.e.querySelector(sel); if (s) s.style.opacity = eo(pr(t, a, .3)).toFixed(3); };   // a legenda entra na palavra que a diz
// degrau: cartão baixo de uma linha (selo + nome + legenda opcional)
const degrau = (icone, rot, sub, o = {}) => `<div class="cartao ${o.cc ?? ''}" style="position:relative;width:${o.w ?? 360}px;height:${o.h ?? 84}px;padding:0 20px;display:flex;align-items:center;gap:13px;white-space:nowrap">
  ${selo(icone, o.cls ?? 'n', o.selo ?? 46)}<div><div class="rot">${rot}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>${o.res ? '<div class="onda"></div>' : ''}</div>`;
// um lugar do mundo escuro: posições em px do desenho (y para baixo)
function escuro() {
  const EIXO = lugar([0, 0, 0]), E = mundoEscuro(EIXO, 0, EE);
  return { EIXO, X: (html, x, y, o = {}) => E(html, x * EE, -y * EE, 0, o), ret: (a, b, c, d) => [a * EE, -d * EE, c * EE, -b * EE], fundo: (cx, cy, o) => E.fundo(cx * EE, -cy * EE, o), L: E.lista };
}
const aqui = (p, x, y) => { p.pos[0] = x * EE; p.pos[1] = -y * EE; };
const STAND = (t, tit, t0, sai) => { clima(1); GL.style.visibility = 'hidden'; posTitulo(tit, t, t0 - .9, t0 - .45, sai); };
const apaga = (e, t, b, c, k = .32) => { e.style.opacity = ((+e.style.opacity || 0) * (1 - k * eo(pr(t, b, .4)) + k * eo(pr(t, c, .5)))).toFixed(4); };

// CENA "abertura" · cap00, linhas 0 a 3 · clima escuro (o caminho do sistema)
// 0 "Oi! Boas-vindas ao EcoSistema. A partir de agora, a sua empresa tem um lugar só pra organizar tudo, da sucata que entra no portão até o dinheiro na conta."
// 1 "Neste tutorial, a gente firma os combinados da nossa parceria, dá uma volta pelo sistema e vê o seu plano."
// 2 "Em todas as aulas, a empresa de exemplo é a Recicla Vale Metais, um ferro-velho de Taubaté, com dados inventados."
// 3 "Esta é a primeira aula, então é só seguir daqui. Vamos aos combinados."
// O título grande no meio sobe quando o caminho vai entrar; o caminho do portão à conta acende estação por estação; ele sobe e abre
// espaço para os três assuntos da aula; os dois saem e fica, até o fim, o cartão da empresa de exemplo.
function abertura() {
  const t0 = .4, tOr = W(0, 'organizar'), tSu = W(0, 'sucata'), tPo = W(0, 'portao'), tDi = W(0, 'dinheiro'), tCo = W(0, 'conta'),
    tNe = W(1, 'neste'), tCb = W(1, 'combinados'), tSi = W(1, 'sistema'), tPl = W(1, 'plano'),
    tEm = W(2, 'empresa'), tRe = W(2, 'recicla'), tFe = W(2, 'ferro-velho'), tDa = W(2, 'dados'), tFim = W(3, 'combinados', 1, 'e');
  cores();
  const { EIXO, X, ret, fundo } = escuro();
  const est = [['door-open', 'Portão', ''], ['scale', 'Balança', ''], ['wallet', 'Caixa', ''], ['package', 'Estoque', ''], ['file-text', 'Venda', ''], ['landmark', 'Dinheiro na conta', '', 'res']];
  const row = X(htmlFluxoCartoes({ cartoes: est, cw: 200, vao: 64 }), 0, -70), RW = row.w, RH = row.h;
  const YC = -70 + RH / 2 + 118, CWD = 300;   // os três assuntos, numa fileira embaixo do caminho
  const cb = X(degrau('handshake', 'Os combinados', '', { w: CWD, cls: '' }), -CWD - 36, YC), si = X(degrau('layout-dashboard', 'O sistema por cima', '', { w: CWD, cls: 'n' }), 0, YC), pl = X(degrau('clipboard-list', 'O seu plano', '', { w: CWD, cls: 'a' }), CWD + 36, YC);
  const chE = X(htmlChip(`${ic('map-pin', 18)}Empresa de exemplo`, 'n'), 0, -118, { anc: [.5, 1], z: 40 });
  const card = X(htmlCartao('building-2', 'Recicla Vale Metais', 'Ferro-velho em Taubaté, SP', 'Dados inventados', { w: 560, h: 150, fn: 28, selo: 46 }), 0, 0);
  const nC = card.e.querySelector('.num');
  fundo(0, 0, { aneis: false });
  const tit = titulo('Primeira aula', 'Bem-vindo ao EcoSistema', 'escuro');
  const S1 = enquadraRet(EIXO, ret(-RW / 2, -70 - RH / 2, RW / 2, -70 + RH / 2), { az: -.03 }),
        S2 = enquadraRet(EIXO, ret(-RW / 2, -70 - RH / 2, RW / 2, YC + 42), { az: .02 }),
        S3 = enquadraRet(EIXO, ret(-290, -118 - 44, 290, 82), { az: .02, max: 1.4 / EE });
  camera([[t0 - 3, S1], [tNe - .3, { ...S1, az: -.012, d: S1.d * .985 }, 'lin'], [tNe + 1.2, S2], [tEm - .3, { ...S2, az: .0, d: S2.d * .985 }, 'lin'], [tEm + 1.1, S3], [tFim + 2.5, { ...S3, az: .035, d: S3.d * .985 }, 'lin']]);
  const sai = tEm - .15;
  return t => {
    STAND(t, tit, t0); posTitulo(tit, t, t0 - .9, tOr - .1);
    fluxoCartoes(row.e, t, tSu - .35, sai, { tempos: [tSu, tPo + .05, tPo + .4, tDi - .2, tDi + .15, tCo - .05] }); row.op = 1;
    pulso(parte(row.e, 5), t, tCo + .3, .05, .8);
    vis(cb.e, t, tCb - .1, sai, { dy: 18 }); vis(si.e, t, tSi - .1, sai, { dy: 18 }); vis(pl.e, t, tPl - .1, sai, { dy: 18 });
    vis(chE.e, t, tEm + .05, NUNCA, { dy: 10, sc: .8 });
    vis(card.e, t, tRe - .1, NUNCA, { dy: 22, sc: .95 }); subDe(card, t, tFe - .05); nC.style.opacity = eo(pr(t, tDa - .05, .3)).toFixed(3); pulso(card.e, t, tDa + .1, .03, .8);
  };
}

// =====================================================================================================================
// CENA "mensagem" · cap04, linha 4 · clima escuro (a mensagem pronta; o WhatsApp não aparece na gravação)
// 4 "Ele abre o WhatsApp do suporte com a mensagem pronta: o seu e-mail, a sua empresa, a trilha e a aula. É só escrever a dúvida e enviar."
// Um cartão de conversa genérico (sem marca): cada item da mensagem entra na palavra que o nomeia; no fim, "Minha dúvida:" com o cursor.
function mensagem() {
  const t0 = W(4, 'ele'), tSu = W(4, 'suporte'), tMs = W(4, 'mensagem'), tEm = W(4, 'e-mail'), tEp = W(4, 'empresa'), tTr = W(4, 'trilha'), tAu = W(4, 'aula'), tDu = W(4, 'duvida'), tFim = W(4, 'enviar', 1, 'e');
  cores();
  const { EIXO, X, ret, fundo } = escuro();
  const lin = (k, v, id) => `<div data-m="${id}" style="display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:baseline;opacity:0;white-space:nowrap"><span class="d-s">${k}</span><span class="d-v">${v}</span></div>`;
  const msg = X(`<div class="cartao" style="position:relative;width:720px;padding:24px 30px 30px">
    <div data-m="cab" style="display:flex;align-items:center;gap:14px;opacity:0">${selo('message-circle', '', 48)}<div><div class="d-t">Suporte</div><div class="d-s">Mensagem pronta</div></div></div>
    <div style="margin-top:18px;padding-top:20px;border-top:1px solid var(--ln);display:grid;gap:15px">
      ${lin('E-mail do usuário:', 'rafael@reciclavalemetais.example', 'e')}${lin('Empresa:', 'Recicla Vale Metais Ltda', 'p')}${lin('Trilha:', 'Tutoriais do sistema', 't')}${lin('Módulo:', 'Sua conta e sua empresa', 'a')}
      ${lin('Minha dúvida:', '<i class="cur" style="display:inline-block;vertical-align:middle;width:3px;height:24px;border-radius:2px;background:var(--ac)"></i>', 'd')}</div></div>`, 0, 0);
  const m = id => msg.e.querySelector(`[data-m=${id}]`);
  fundo(0, 0, { aneis: false });
  const tit = titulo('Ajuda', 'Mensagem pronta para o suporte', 'escuro');
  const S1 = enquadraRet(EIXO, msg.ret(), { az: -.03, max: 1.5 / EE });
  camera([[t0 - 3, S1], [tFim + 2.5, { ...S1, az: .035, d: S1.d * .985 }, 'lin']]);
  const ent = (e, t, a) => { const p = eo5(pr(t, a, .6)); e.style.opacity = eo(pr(t, a, .3)).toFixed(3); e.style.transform = `translateY(${((1 - p) * 12).toFixed(2)}px)`; };
  return t => {
    STAND(t, tit, t0);
    vis(msg.e, t, tSu - .1, NUNCA, { dy: 22, sc: .96 }); msg.e.style.opacity = (+msg.e.style.opacity).toFixed(3);
    ent(m('cab'), t, tSu - .05); ent(m('e'), t, tEm - .1); ent(m('p'), t, tEp - .1); ent(m('t'), t, tTr - .1); ent(m('a'), t, tAu - .1); ent(m('d'), t, tDu - .15);
    msg.e.querySelector('.cur').style.opacity = t < tDu ? 0 : (Math.sin((t - tDu) * 7) > -.3 ? 1 : 0);
  };
}

// =====================================================================================================================
// CENA "caminho" · cap05, linhas 0 a 6 · claro (o pátio) → escuro (os dados)
// 0 "Bom, o que o EcoSistema resolve? Pensa num dia comum na Recicla Vale. A Dona Cida chega com latinha."   1 "A balança marca trinta e oito quilos."
// 2 "No caixa, isso vira um pedido de compra: a seis reais e vinte o quilo, dá duzentos e trinta e cinco reais e sessenta, pagos na hora."
// 3 "O material entra no estoque."   4 "Depois, a latinha juntada é vendida pra Serra Fina Alumínio Reciclagem, com a nota fiscal."
// 5 "E o dinheiro cai na conta. Tudo isso vira os números do dia e do mês."   6 "Cada parte desse caminho tem a sua aula na trilha."
// Claro: a Dona Cida chega pelo portão com o saco de latinha e o põe na balança; o visor (a porta dos dados) marca 38 kg e a câmera mergulha nele.
// Escuro: o caminho do sistema (Portão, Balança, Caixa, Estoque, Venda, Dinheiro na conta); cada estação ganha o seu detalhe na palavra que a nomeia;
// no fim a câmera abre para o caminho inteiro e cada estação ganha o nome da sua aula.
function caminho() {
  const t0 = .4, tRe = W(0, 'recicla'), tDo = W(0, 'dona'), tCi = W(0, 'cida'), tLa = W(0, 'latinha'),
    tB = W(1, 'balanca'), tMa = W(1, 'marca'), tQu = W(1, 'quilos'),
    tCx = W(2, 'caixa'), tPe = W(2, 'pedido'), tSe = W(2, 'seis'), tDz = W(2, 'duzentos'), tPg = W(2, 'pagos'),
    tMt = W(3, 'material'), tEn = W(3, 'entra'), tVe = W(4, 'vendida'), tSf = W(4, 'serra'), tNo = W(4, 'nota'), tCo = W(5, 'dinheiro'), tCc = W(5, 'conta'), tNu = W(5, 'numeros'), tDi = W(5, 'dia'), tMe = W(5, 'mes'),
    tAu = W(6, 'cada'), tFim = W(6, 'trilha', 1, 'e');
  cores();
  // ================================================================ CLIMA CLARO · o pátio
  piso({ r: 30, x: 0, z: -2, passo: 1.3 }); U.uNevoa.value.set(.955, .975, .965, .8);
  const ceu = ceuClaro({ halo: [1.2, 3.2, -14] });
  const PORT = portao(CENA, [-6.4, 0, -2.2], { h: 3.4, placa: '' });
  const SX = -.45, B = balancaPlataforma(CENA, [SX, 0, 1.1], { c: 1.3, l: 1.1 }); B.scale.setScalar(1.6);
  const SUP = B.userData.sup * 1.6 + .02;
  const DC = pessoa(CENA, [-6.4, 0, -2.2], { camisa: '#C8664A', coque: true });
  const SAC = saco(CENA, [0, 0, 0], { aberto: true, carga: 'latinha', s: .8 });
  const chRe = plano(htmlChip(`${ic('map-pin', 18)}Recicla Vale Metais`, 'n'), { pos: [-6.4, 3.0, -1.9], rot: ROT, esc: .0135, anc: [.5, .5] });
  const chDo = plano(htmlChip(`${ic('user-round', 18)}Dona Cida`), { pos: [0, 2.3, 1.1], rot: ROT, esc: .0135, anc: [.5, 1] });
  const chLa = plano(htmlChip(`${ic('package', 18)}Latinha`, 'n'), { pos: [0, 1.5, 1.1], rot: ROT, esc: .0135, anc: [.5, 1] });
  // o visor: a tela do indicador da balança, de frente para onde a câmera vai mergulhar (a única superfície escura do mundo claro)
  const VP = mundo(B, B.userData.tela), P4 = { x: VP[0] + .4, y: VP[1] - .5, z: VP[2], d: 6.6, az: .1, el: .16, oy: 6 }, EIXO = lugarDeFrente(VP, posCam(P4));
  const visor = plano(htmlVisor(['Peso']), { em: EIXO, pos: [0, 0, 0], esc: .0028, anc: [.5, .5] }); ligaVisor(visor.e);
  const tit1 = titulo('O sistema', 'Do portão até a conta');
  const CLAROS = [...ceu, chRe, chDo, chLa];
  // ================================================================ CLIMA ESCURO · o caminho do sistema (do outro lado do visor)
  const ZD = -18, E = mundoEscuro(EIXO, ZD, EE), X = (html, x, y, o = {}) => E(html, x * EE, -y * EE, 0, o), ret = (a, b, c, d) => [a * EE, -d * EE, c * EE, -b * EE];
  const est = [['door-open', 'Portão', ''], ['scale', 'Balança', ''], ['wallet', 'Caixa', ''], ['package', 'Estoque', ''], ['file-text', 'Venda', ''], ['landmark', 'Dinheiro na conta', '', 'res']];
  const row = X(htmlFluxoCartoes({ cartoes: est, cw: 200, vao: 64 }), 0, 0), RW = row.w, RH = row.h;
  const cx = i => parte(row.e, i).offsetLeft + parte(row.e, i).offsetWidth / 2 - RW / 2, CWD = parte(row.e, 0).offsetWidth, YB = -(RH / 2 + 30);   // YB: a base dos detalhes, acima do caminho
  const doc = X(htmlDocumento({ icone: 'receipt', tipo: 'Pedido de compra', numero: 'Dona Cida', campos: [], itens: [['Alumínio latinha', '38 kg × R$ 6,20', 'R$ 235,60']], total: ['Total', 'R$ 235,60'], status: 'Pago na hora', w: 440, chave: false }), cx(2), YB, { anc: [.5, 1] });
  const dEs = X(htmlCartao('package', 'Alumínio latinha', 'entra no estoque', '+0 kg', { res: true, w: 300 }), cx(3), YB, { anc: [.5, 1] }), nEs = dEs.e.querySelector('.num'), oEs = dEs.e.querySelector('.onda');
  const dVe = X(htmlCartao('building-2', 'Serra Fina Alumínio Reciclagem', 'Cliente', 'Nota fiscal', { w: 430, fn: 30 }), cx(4), YB, { anc: [.5, 1] }), nVe = dVe.e.querySelector('.num');
  const dDi = X(degrau('calendar-days', 'Dia', '', { w: 190 }), cx(5) - 105, YB, { anc: [.5, 1] }), dMe = X(degrau('calendar-range', 'Mês', '', { w: 190 }), cx(5) + 105, YB, { anc: [.5, 1] });
  const dNu = X(htmlChip(`${ic('flag', 18)}Números do dia e do mês`, ''), cx(5), YB - 84 - 16, { anc: [.5, 1], z: 40 });
  const AUL = ['Comprar e vender sucata', 'Balança e impressora: o EcoTray', 'Caixa: abrir, fechar e o cofre', 'Estoque: saldo, histórico e posição', 'Nota Fiscal de mercadoria (NF-e)', 'Bancos, cofre e conciliação bancária'];
  const lab = AUL.map((s, i) => X(`<div class="chip n sl" style="position:relative;width:${CWD}px">${s}</div>`, cx(i), RH / 2 + 14, { anc: [.5, 0] }));
  const ZERO = cx(0);
  E.fundo(0, 0, { aneis: false });
  const tit2 = titulo('O sistema', 'Do portão até a conta', 'escuro');
  const cartaoR = i => [cx(i) - CWD / 2, -RH / 2, cx(i) + CWD / 2, RH / 2];
  const rr = (p, i) => uneRet(p.ret(), ret(...cartaoR(i)));

// 5 "Uma dica: no teste, todos os módulos ficam liberados. Com a assinatura ativa, ficam os que você contratou. Pra ter de volta uma tela do teste, é só ligar o módulo."
// Estação 1: os dois motivos, lado a lado; cada um acende na sua frase. Estação 2 (a câmera desce): teste (tudo aceso) → assinatura (só os contratados); ligar o módulo traz a tela de volta.
function modulos() {
  const t0 = W(3, 'se'), tTe = W(3, 'tela'), tMo = W(3, 'motivos'), tOu1 = W(3, 'ou'), tMd = W(3, 'modulo', 1), tFz = W(3, 'faz'), tAt = W(3, 'ativar'),
    tOu2 = W(4, 'ou'), tPm = W(4, 'permissao'), tLi = W(4, 'libera'), tAd = W(4, 'administrador'), tUP = W(4, 'usuarios'),
    tNt = W(5, 'teste'), tTo = W(5, 'todos'), tAs = W(5, 'assinatura'), tCo = W(5, 'contratou'), tVo = W(5, 'volta'), tLg = W(5, 'ligar'), tFim = W(5, 'modulo', 2, 'e');
  cores();

    <div style="display:flex;align-items:center;gap:13px">${selo(icone, cls, 48)}<div class="rot">${rot}</div></div><div data-m="${id}" style="margin-top:16px;display:flex;flex-wrap:wrap;gap:10px"></div></div>`;
  const c1 = X(card('lock', 'Módulo fora do plano', 'a', 'x'), -DX, Y1), c2 = X(card('user-x', 'Usuário sem permissão', 'n', 'y'), DX, Y1);
  const pill = (i, s, cls = 'n') => `<span class="chip ${cls}" style="position:relative;opacity:0;height:34px">${i ? ic(i, 16) : ''}${s}</span>`;
  c1.e.querySelector('[data-m=x]').innerHTML = pill('', 'O que faz') + pill('', 'Como ativar');
  c2.e.querySelector('[data-m=y]').innerHTML = pill('shield-check', 'Quem libera') + pill('user-round', 'Administrador') + pill('', 'Usuários e Permissões');
  const pc = (e, i) => e.querySelectorAll('.chip')[i], hide = (e, k, v) => e.querySelectorAll('.chip')[k].style.opacity = v;
  // estação 2: do teste à assinatura
  const grupoMod = (tit, cls, id) => `<div class="cartao" style="position:relative;width:480px;height:236px;padding:18px 22px;white-space:nowrap" data-g="${id}"><div style="display:flex;align-items:center;gap:12px">${selo(cls === 'a' ? 'package' : 'circle-check', cls, 44)}<div class="rot">${tit}</div></div>
    <div style="margin-top:18px;display:grid;gap:12px;justify-items:start">${['Notas fiscais', 'Coletas', 'Gerencial'].map((s, i) => `<span class="chip ${cls === 'a' ? 'n' : ''}" data-i="${i}" style="position:relative;opacity:.3;height:36px">${ic('package', 17)}${s}</span>`).join('')}</div></div>`;
  const gT = X(grupoMod('Período de teste', 'a', 't'), -DX - 20, Y2), gA = X(grupoMod('Assinatura ativa', '', 'a'), DX + 20, Y2);
  const seta = X(htmlFluxo(70, 40, ['M5 20H65']), 0, Y2);
  const chL = X(htmlChip(`${ic('plug-zap', 18)}Módulo ligado`), DX + 20, Y2 - 118 - 14, { anc: [.5, 1], z: 40 });
  const mi = (g, i) => g.e.querySelector(`[data-i="${i}"]`);
  fundo(0, 210, { aneis: false });

  const S1 = enquadraRet(EIXO, ret(-DX - CWD / 2 - 10, Y1 - 98 - 30, DX + CWD / 2 + 10, Y1 + 98 + 20), { az: -.03, max: 1.4 / EE }),
        S2 = enquadraRet(EIXO, ret(-DX - 20 - 250, Y2 - 118 - 70, DX + 20 + 250, Y2 + 118 + 20), { az: .03, max: 1.4 / EE });
  camera([[t0 - 3, S1], [tNt - .6, { ...S1, az: .0, d: S1.d * .985 }, 'lin'], [tNt + .7, S2], [tFim + 2.5, { ...S2, az: .0, d: S2.d * .985 }, 'lin']]);

    pulso(c1.e, t, tMd, .03, .8); pulso(c2.e, t, tPm, .03, .8);
    // estação 2
    vis(gT.e, t, tNt - .1, NUNCA, { dy: 18 }); vis(gA.e, t, tAs - .1, NUNCA, { dy: 18 }); seta.e.style.opacity = eo(pr(t, tAs - .5, .5)).toFixed(3); fluxo(seta.e, 0, t, tAs - .5, .5, {});
    for (let i = 0; i < 3; i++) { mi(gT, i).style.opacity = (.3 + .7 * eo(pr(t, tTo + .1 + i * .2, .35))).toFixed(3); }

    mi(gA, 2).style.opacity = (.3 + .7 * eo(pr(t, tLg, .4))).toFixed(3); vis(chL.e, t, tLg + .15, NUNCA, { dy: 10, sc: .8 }); pulso(gA.e, t, tLg + .1, .03, .8);
  };
}

// =====================================================================================================================
// CENA "mudanca" · cap13, linhas 0 a 3 · clima escuro (a diferença do mês, um usuário em dois aparelhos, a equipe que cresce)
// 0 "Mudou o plano no meio do mês? ... Quando tem cobrança na hora, é só a diferença, pelos dias que faltam até o vencimento."   1 "E o plano novo libera assim que o pagamento confirma."
// 2 "Uma dica: o limite de usuários é de cadastros, não de gente conectada ao mesmo tempo. O mesmo usuário entra do computador e do celular."
// 3 "Bateu o limite? Ao criar mais um usuário, o sistema abre o aviso Sua equipe cresceu!, mostra a nova mensalidade, e o plano passa a se chamar Personalizado."
// Três estações, uma embaixo da outra, a câmera descendo: a régua do mês (sem valores em R$), o contador de usuários com os dois aparelhos, o aviso.
function mudanca() {
  const t0 = W(0, 'mudou'), tMe = W(0, 'mes'), tPl = W(0, 'plano'), tMi = W(0, 'meio'), tCb = W(0, 'cobranca'), tDf = W(0, 'diferenca'), tPe = W(0, 'pelos'), tDs = W(0, 'dias'), tVc = W(0, 'vencimento'),
    tNv = W(1, 'novo'), tPg = W(1, 'pagamento'), tCf = W(1, 'confirma'),
    tLi = W(2, 'limite'), tCd = W(2, 'cadastros'), tMu = W(2, 'usuario', 1), tCp = W(2, 'computador'), tCe = W(2, 'celular'),
    tBa = W(3, 'bateu'), tCr = W(3, 'criar'), tAv = W(3, 'aviso'), tSe = W(3, 'sua'), tNm = W(3, 'nova'), tPz = W(3, 'personalizado'), tFim = W(3, 'personalizado', 1, 'e');
  cores();
  const { EIXO, X, ret, fundo } = escuro(), BW = 900, XH = 330, Y1 = 0, Y2 = 440, Y3 = 880;
  // ---- estação 1: a régua do mês (05/11 último pagamento · hoje · 05/12 vencimento)
  const regua = X(`<div style="position:relative;width:${BW}px;height:30px;border-radius:15px;overflow:hidden;background:var(--fx);border:1px solid var(--ln)">
    <i data-m="f" style="position:absolute;left:${XH}px;top:0;bottom:0;width:${BW - XH}px;background:linear-gradient(90deg,#2FB271,#6CF0A8);transform-origin:0 50%;transform:scaleX(0)"></i></div>`, 0, Y1);
  const fx0 = -BW / 2, fm = regua.e.querySelector('[data-m=f]');
  const m1 = X(htmlChip(`${ic('calendar-days', 18)}05/11 · Último pagamento`, 'n'), fx0, Y1 + 15 + 26, { anc: [0, 0], z: 40 }), mH = X(htmlChip(`${ic('flag', 18)}Hoje`, 'am'), fx0 + XH, Y1 - 15 - 26, { anc: [.5, 1], z: 40 }),
        m2 = X(htmlChip(`${ic('calendar-days', 18)}05/12 · Vencimento`, 'n'), fx0 + BW, Y1 + 15 + 26, { anc: [1, 0], z: 40 });
  const cDif = X(htmlCartao('hand-coins', 'Só a diferença', 'pelos dias que faltam', 'Pagamento proporcional', { w: 420, h: 128, fn: 21, selo: 44, res: true }), fx0 + XH + (BW - XH) / 2, Y1 - 15 - 26 - 28, { anc: [.5, 1] });
  const nDif = cDif.e.querySelector('.num'), oDif = cDif.e.querySelector('.onda'); nDif.style.opacity = 0;
  const cMod = X(degrau('package-plus', 'Módulo novo', '', { w: 250, cls: 'n' }), fx0 + BW - 125 - 10, Y1 + 15 + 26 + 38 + 78, { anc: [.5, .5] }), cPg = X(htmlChip(`${ic('circle-check', 18)}Pagamento confirmado`), fx0 + XH, Y1 + 15 + 26 + 38 + 78, { anc: [.5, .5], z: 40 });
  // ---- estação 2: um usuário, dois aparelhos, o contador
  const cCont = X(htmlCartao('users', 'Usuários', 'Conta os cadastros', '1 / 3', { w: 330, h: 150, fn: 40, selo: 46 }), -330, Y2), nCont = cCont.e.querySelector('.num');
  const cUsu = X(degrau('user-round', 'Rafael Nogueira', 'um usuário', { w: 360, cls: '' }), 220, Y2 - 80), cPc = X(htmlChip(`${ic('monitor', 18)}Computador`, 'n'), 220 - 100, Y2 + 90, { anc: [.5, .5], z: 40 }), cCe = X(htmlChip(`${ic('smartphone', 18)}Celular`, 'n'), 220 + 100, Y2 + 90, { anc: [.5, .5], z: 40 });
  const fi = X(htmlFluxo(300, 72, ['M150 4V30Q150 36 144 36H76Q70 36 70 42V66', 'M150 4V30Q150 36 156 36H224Q230 36 230 42V66']), 220 - 150, Y2 - 80 + 42 + 10, { anc: [0, 0], z: -40 });
  // ---- estação 3: o aviso
  const cCo3 = X(htmlCartao('users', 'Usuários', 'o limite', '3 / 3', { w: 330, h: 150, fn: 40, selo: 46, cls: 'a' }), -330, Y3), nC3 = cCo3.e.querySelector('.num');
  const cAv = X(`<div class="cartao" style="position:relative;width:520px;height:210px;padding:20px 24px;white-space:nowrap"><div style="display:flex;align-items:center;gap:13px">${selo('party-popper', '', 50)}<div class="rot" style="font-size:25px">Sua equipe cresceu!</div></div>
    <div data-m="m" style="margin-top:22px;display:flex;align-items:center;justify-content:space-between;opacity:0"><span class="d-s" style="font-size:16px">Nova mensalidade (estimada):</span><i style="display:block;width:132px;height:30px;border-radius:9px;border:2px dashed var(--tr)"></i></div>
    <div data-m="p" style="margin-top:22px;opacity:0"><span class="chip" style="position:relative">${ic('sparkles', 18)}Plano Personalizado</span></div></div>`, 190, Y3);
  const aM = cAv.e.querySelector('[data-m=m]'), aP = cAv.e.querySelector('[data-m=p]');
  for (const y of [Y1, Y2, Y3]) fundo(0, y, { aneis: false });
  const tit = titulo('Assinatura', 'Mudança de plano e usuários', 'escuro');
  const S1 = enquadraRet(EIXO, ret(-BW / 2 - 14, Y1 - 15 - 26 - 28 - 128 - 12, BW / 2 + 14, Y1 + 15 + 26 + 38 + 78 + 40), { az: -.03, max: 1.4 / EE }),
        S2 = enquadraRet(EIXO, ret(-330 - 165 - 14, Y2 - 80 - 42 - 20, 220 + 180 + 14, Y2 + 90 + 36), { az: .02, max: 1.4 / EE }),
        S3 = enquadraRet(EIXO, ret(-330 - 165 - 14, Y3 - 105 - 20, 190 + 260 + 14, Y3 + 105 + 20), { az: -.02, max: 1.4 / EE });
  camera([[t0 - 3, S1], [tNv - .3, { ...S1, az: .0, d: S1.d * .985 }, 'lin'], [tLi - .6, { ...S1, az: .01, d: S1.d * .99 }, 'lin'], [tLi + .6, S2], [tBa - .5, { ...S2, az: .0, d: S2.d * .985 }, 'lin'], [tBa + .8, S3], [tFim + 2.5, { ...S3, az: .02, d: S3.d * .985 }, 'lin']]);
  return t => {
    STAND(t, tit, t0);
    // as estações já lidas saem de cena quando a câmera desce (nada cortado na borda)
    for (const p of [regua, m1, mH, m2, cDif, cMod, cPg]) p.op = 1 - eo(pr(t, tLi - 1.0, .45));
    for (const p of [cCont, cUsu, cPc, cCe, fi]) p.op = 1 - eo(pr(t, tBa - .1, .4));

    vis(cDif.e, t, tCb - .1, NUNCA, { dy: 18, sc: .95 }); subDe(cDif, t, tPe - .05); fm.style.transform = `scaleX(${eio(pr(t, tDf - .1, 1.2)).toFixed(4)})`; nDif.style.opacity = eo(pr(t, tDf, .3)).toFixed(3); ondaEm(oDif, t, tDf + .3);
    vis(cMod.e, t, tNv - .1, NUNCA, { dy: 14 }); foco(cMod.e, t, tCf - .1, 1e9, { min: .5, d: .5 }); vis(cPg.e, t, tPg - .1, NUNCA, { dy: 10, sc: .85 }); pulso(cMod.e, t, tCf + .1, .05, .8);
    // aparelhos
    vis(cCont.e, t, tLi - .15, NUNCA, { dy: 20 }); subDe(cCont, t, tCd - .05); vis(cUsu.e, t, tMu - .1, NUNCA, { dy: 16 }); fi.e.style.opacity = eo(pr(t, tCp - .5, .4)).toFixed(3);
    fluxo(fi.e, 0, t, tCp - .45, .5, { luz: [tCp - .45, .55], fica: .5 }); fluxo(fi.e, 1, t, tCe - .45, .5, { luz: [tCe - .45, .55], fica: .5 });
    vis(cPc.e, t, tCp - .1, NUNCA, { dy: 10, sc: .85 }); vis(cCe.e, t, tCe - .1, NUNCA, { dy: 10, sc: .85 });
    // aviso
    vis(cCo3.e, t, tBa - .1, NUNCA, { dy: 20 }); nC3.textContent = (t < tCr ? 1 : t < tCr + .5 ? 2 : 3) === 1 ? '1 / 3' : t < tCr + .55 ? '2 / 3' : '3 / 3'; pulso(cCo3.e, t, tCr + .55, .05, .8);
    vis(cAv.e, t, tAv - .1, NUNCA, { dy: 22, sc: .96 }); aM.style.opacity = eo(pr(t, tNm - .1, .35)).toFixed(3); aP.style.opacity = eo(pr(t, tPz - .15, .35)).toFixed(3); pulso(aP, t, tPz, .05, .8);
  };
}

// =====================================================================================================================
const CAPS = { 0: abertura, 4: mensagem, 5: caminho, 9: cap09, 10: selos, 11: modulos, 13: mudanca };
cena(d => CAPS[d.cap](d), { fov: 26 });
