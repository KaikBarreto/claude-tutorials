<html lang="pt-BR"><head><meta charset="utf-8">

<script type="module">

  plano, clima, cena, estilo, enquadraRet, uneRet, ALT, LARG }
  from '../../../../perfis/ecoflix/cenas_v3_vertical/motor.js';
import { ceuClaro, mundoEscuro } from '../../../../perfis/ecoflix/cenas_v3_vertical/fundo.js';

// =====================================================================================================================
// comuns (vertical)

}
const STAND = (t, tit, t0, sai) => { clima(1); GL.style.visibility = 'hidden'; posTitulo(tit, t, t0 - .9, t0 - .45, sai); };
const sai01 = (t, a, d = .4) => 1 - eo(pr(t, a, d));    // 1 -> 0 (o que a câmera deixa para trás)

    pulso(parte(col.e, 5), t, tCo + .3, .05, .8);

    vis(chE.e, t, tEm + .05, NUNCA, { dy: 10, sc: .8 });
    vis(card.e, t, tRe - .1, NUNCA, { dy: 22, sc: .95 }); subDe(card, t, tFe - .05); nC.style.opacity = eo(pr(t, tDa - .05, .3)).toFixed(3); pulso(card.e, t, tDa + .1, .03, .8);

}

  const t0 = W(4, 'ele'), tSu = W(4, 'suporte'), tEm = W(4, 'e-mail'), tEp = W(4, 'empresa'), tTr = W(4, 'trilha'), tAu = W(4, 'aula'), tDu = W(4, 'duvida'), tFim = W(4, 'enviar', 1, 'e');

  const msg = X(`<div class="cartao" style="position:relative;width:432px;padding:24px 26px 28px">

  const m = id => msg.e.querySelector(`[data-m=${id}]`);

    msg.e.querySelector('.cur').style.opacity = t < tDu ? 0 : (Math.sin((t - tDu) * 7) > -.3 ? 1 : 0);

// =====================================================================================================================
// CENA "caminho" · cap05, linhas 0 a 6 · claro (o pátio, câmera de retrato seguindo a Dona Cida) → escuro (cada estação do caminho, uma por vez, em coluna)
function caminho() {
  const t0 = .4, tRe = W(0, 'recicla'), tDo = W(0, 'dona'), tCi = W(0, 'cida'), tLa = W(0, 'latinha'),
    tB = W(1, 'balanca'), tMa = W(1, 'marca'), tQu = W(1, 'quilos'),
    tCx = W(2, 'caixa'), tPe = W(2, 'pedido'), tSe = W(2, 'seis'), tDz = W(2, 'duzentos'), tPg = W(2, 'pagos'),
    tMt = W(3, 'material'), tEn = W(3, 'entra'), tVe = W(4, 'vendida'), tSf = W(4, 'serra'), tNo = W(4, 'nota'), tCo = W(5, 'dinheiro'), tCc = W(5, 'conta'), tNu = W(5, 'numeros'), tDi = W(5, 'dia'), tMe = W(5, 'mes'),
    tAu = W(6, 'cada'), tFim = W(6, 'trilha', 1, 'e');
  cores();
  // ================================================================ CLIMA CLARO · o pátio
  piso({ r: 30, x: 0, z: -2, passo: 1.3 }); U.uNevoa.value.set(.955, .975, .965, .8);
  const ceu = ceuClaro({ halo: [1.2, 3.2, -14] });
  const PORT = portao(CENA, [-6.4, 0, -2.2], { h: 3.4, placa: '' });
  const SX = -.45, B = balancaPlataforma(CENA, [SX, 0, 1.1], { c: 1.3, l: 1.1 }); B.scale.setScalar(1.6);
  const SUP = B.userData.sup * 1.6 + .02;
  const DC = pessoa(CENA, [-6.4, 0, -2.2], { camisa: '#C8664A', coque: true });
  const SAC = saco(CENA, [0, 0, 0], { aberto: true, carga: 'latinha', s: .8 });
  const chRe = plano(htmlChip(`${ic('map-pin', 18)}Recicla Vale Metais`, 'n'), { pos: [-6.4, 3.0, -1.9], rot: ROT, esc: .0185, anc: [.5, .5] });
  const chDo = plano(htmlChip(`${ic('user-round', 18)}Dona Cida`), { pos: [0, 2.3, 1.1], rot: ROT, esc: .0185, anc: [.5, 1] });
  const chLa = plano(htmlChip(`${ic('package', 18)}Latinha`, 'n'), { pos: [0, 1.5, 1.1], rot: ROT, esc: .0185, anc: [.5, 1] });
  // o visor: a tela do indicador da balança (a única superfície escura do mundo claro), de frente para onde a câmera vai mergulhar
  const VP = mundo(B, B.userData.tela), P4 = { x: VP[0] + .4, y: VP[1] - .5, z: VP[2], d: 6.6, az: .1, el: .16, oy: 6 }, EIXO = lugarDeFrente(VP, posCam(P4));
  const visor = plano(htmlVisor(['Peso']), { em: EIXO, pos: [0, 0, 0], esc: .0028, anc: [.5, .5] }); ligaVisor(visor.e);
  const tit1 = titulo('O sistema', 'Do portão até a conta');
  const CLAROS = [...ceu, chRe, chDo, chLa];
  // ================================================================ CLIMA ESCURO · uma estação por vez, numa coluna (a câmera desce)
  const ZD = -18, E = mundoEscuro(EIXO, ZD, EE), X = (html, x, y, o = {}) => E(html, x * EE, -y * EE, 0, o), ret = (a, b, c, d) => [a * EE, -d * EE, c * EE, -b * EE];
  const PASSO = 330;                                  // distância entre as estações da coluna
  const Y = k => k * PASSO;
  const est = (ic_, rot, sub = '', c = '') => X(htmlFluxoCartoes({ cartoes: [[ic_, rot, sub, c]], cw: 250 }), 0, 0);
  const sCx = X(htmlFluxoCartoes({ cartoes: [['wallet', 'Caixa', '']], cw: 250 }), 0, Y(0)), sEs = X(htmlFluxoCartoes({ cartoes: [['package', 'Estoque', '']], cw: 250 }), 0, Y(1)),
        sVe = X(htmlFluxoCartoes({ cartoes: [['file-text', 'Venda', '']], cw: 250 }), 0, Y(2)), sDi = X(htmlFluxoCartoes({ cartoes: [['landmark', 'Dinheiro na conta', '', 'res']], cw: 250 }), 0, Y(3));
  const DY = 40;   // folga entre o cartão da estação e o detalhe
  const sh = 34;   // meia altura do cartão da estação
  const doc = X(htmlDocumento({ icone: 'receipt', tipo: 'Pedido de compra', numero: 'Dona Cida', campos: [], itens: [['Alumínio latinha', '38 kg × R$ 6,20', 'R$ 235,60']], total: ['Total', 'R$ 235,60'], status: 'Pago na hora', w: 330, chave: false }), 0, Y(0) + sh + DY, { anc: [.5, 0] });
  const dEs = X(htmlCartao('package', 'Alumínio latinha', 'entra no estoque', '+0 kg', { res: true, w: 300 }), 0, Y(1) + sh + DY, { anc: [.5, 0] }), nEs = dEs.e.querySelector('.num'), oEs = dEs.e.querySelector('.onda');
  const dVe = X(htmlCartao('building-2', 'Serra Fina Alumínio<br>Reciclagem', 'Cliente', 'Nota fiscal', { w: 330, h: 150, fn: 28 }), 0, Y(2) + sh + DY, { anc: [.5, 0] }), nVe = dVe.e.querySelector('.num');
  const dDi = X(degrau('calendar-days', 'Dia', '', { w: 190 }), -100, Y(3) + sh + DY, { anc: [.5, 0] }), dMe = X(degrau('calendar-range', 'Mês', '', { w: 190 }), 100, Y(3) + sh + DY, { anc: [.5, 0] });
  const dNu = X(htmlChip(`${ic('flag', 18)}Números do dia e do mês`, ''), 0, Y(3) + sh + DY + 84 + 22, { anc: [.5, 0], z: 40 });
  // a coluna final: cada estação com a sua aula (uma lista, linhas baixas)
  const AUL = [['door-open', 'Portão', 'Comprar e vender sucata'], ['scale', 'Balança', 'Balança e impressora: o EcoTray'], ['wallet', 'Caixa', 'Caixa: abrir, fechar e o cofre'], ['package', 'Estoque', 'Estoque: saldo, histórico e posição'], ['file-text', 'Venda', 'Nota Fiscal de mercadoria (NF-e)'], ['landmark', 'Dinheiro na conta', 'Bancos, cofre e conciliação bancária']];
  const YL = Y(4) + 40, LH = 82;
  const lista = AUL.map(([i, r, s], k) => X(degrau(i, r, s, { w: 350, h: 76, selo: 44, fr: 20, cls: k === 5 ? '' : 'n' }), 0, YL + (k - 2.5) * 86));
  const ZERO = 0;
  E.fundo(0, 0, { aneis: false });
  const tit2 = titulo('O sistema', 'Do portão até a conta', 'escuro');
  const bloco = (p, ...ps) => uneRet(p.ret(), ...ps.map(q => q.ret()));
  const R2 = bloco(sCx, doc), R3 = bloco(sEs, dEs), R4 = bloco(sVe, dVe), R5 = bloco(sDi, dDi, dMe, dNu), R6 = uneRet(...lista.map(p => p.ret()));
  // o mundo escuro anda o necessário para a primeira estação ficar no eixo do visor: o mergulho segue reto e o visor não sai do centro
  const k0 = enquadraRet(null, R2, { ...K, z: ZD, max: MAX }), gx = k0.x, gy = k0.y, sh_ = r => [r[0] - gx, r[1] - gy, r[2] - gx, r[3] - gy];
  for (const p of E.lista) { p.pos[0] -= gx; p.pos[1] -= gy; }
  const G = enquadraRet(EIXO, sh_(R2), { ...K, z: ZD, az: 0, max: MAX }), S3 = enquadraRet(EIXO, sh_(R3), { ...K, z: ZD, az: .0, max: MAX }), S4 = enquadraRet(EIXO, sh_(R4), { ...K, z: ZD, az: .02, max: MAX }),
        S5 = enquadraRet(EIXO, sh_(R5), { ...K, z: ZD, az: -.01, max: MAX }), S6 = enquadraRet(EIXO, sh_(R6), { ...K, z: ZD, az: .0, max: 1.5 / EE });
  // ================================================================ CÂMERA
  const A1 = { x: -5.4, y: 1.6, z: 1.1, d: 17, az: .15, el: .2, oy: 50 };
  const tM = tMa + .05, tC = tCx - .3, ZF = EIXO.local(posCam(G))[2], merg = mergulho(EIXO.local(posCam(P4))[2], ZF, .5);
  camera([[t0 - 3, A1], [tLa + .2, { ...A1, x: -2.6, d: 16.5, az: .13 }, 'lin'], [tB + .45, P4], [tM, { ...P4, d: P4.d * .985 }, 'lin'], [tC, G, merg, { reta: true, mira: x => eis(cl(x * 2.1)) }],
    [tMt - .4, { ...G, az: -.005 }, 'lin'], [tMt + .9, S3], [tVe - .4, { ...S3, az: .01 }, 'lin'], [tVe + .9, S4], [tCo - .4, { ...S4, az: .0 }, 'lin'], [tCo + .9, S5],
    [tAu - .4, { ...S5, az: .01 }, 'lin'], [tAu + 1.0, S6], [tFim + 2.5, { ...S6, az: .02, d: S6.d * .985 }, 'lin']]);
  const zCam = u => { const k = pose(u); return EIXO.local([k.px, k.py, k.pz])[2]; };
  let tX = tM; while (tX < tC && zCam(tX) > .6) tX += 1 / 120;
  // ================================================================ a ação do pátio
  const camX = u => lerp(-6.4, -2.15, eio(pr(u, 3.55, 3.15)));
  const camZ = u => lerp(-2.2, 1.1, eio(pr(u, .4, 3.4)));
  const giro = u => lerp(-PI / 2, 0, eio(pr(u, 3.4, .7)));
  return t => {
    const x = camX(t), z = camZ(t), gi = giro(t), anda = (t > .4 && t < 6.8) ? 1 : 0, dist = (z + 2.2) + (x + 6.4);
