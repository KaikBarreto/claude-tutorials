<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- T01 "Sua conta e sua empresa" (EcoFlix): as ilustrações de conceito da aula, feitas no kit
     perfis/ecoflix/cenas/cenas_ecoflix.html (estilo e utilidades iguais; os dois exemplos do kit saíram, nenhum se aplica).
     Um CAPS[n] por capítulo com cena; no cap07 e no cap09 há duas cenas no mesmo CAPS[n], cada uma na sua janela.
     Cada cena usa exatamente as âncoras do ilustracoes.json (janela() abaixo): abre 0,3 s antes da palavra "de" e fecha
     "cauda" s depois do fim da palavra "ate". Tempos estimados em tempos/capNN.json até a voz chegar.
     Render de uma cena:  node render_cenas.cjs <n> capNN.json <saida.mp4> --html cenas.html --de <at> --ate <at + dur>
     Rótulos do app como no inventario.md; nomes e números do mundo da Recicla Vale Metais; desenhos genéricos, sem marca. -->
<style>
@font-face{font-family:M;font-weight:500;src:url(../../../web/fonts/montserrat-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:600;src:url(../../../web/fonts/montserrat-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:700;src:url(../../../web/fonts/montserrat-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:800;src:url(../../../web/fonts/montserrat-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:500;src:url(../../../web/fonts/montserrat-latin-ext-500-normal.woff2) format('woff2');unicode-range:U+0100-024F}
@font-face{font-family:M;font-weight:700;src:url(../../../web/fonts/montserrat-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-024F}
/* ---------------------------------------------------------------- paleta EcoFlix (marca: acento #50D088, escuro #121212)
   --v  acento: preenchimentos, barras, contornos de destaque (nunca texto sobre branco: contraste baixo)
   --ve verde escuro: texto e ícone verde sobre branco (contraste 5,0)   --vc verde claro: fundo de ícone/resultado
   --a  âmbar: o SEGUNDO conceito da cena (ex.: competência x caixa)     --ae texto âmbar (5,9)   --ac âmbar claro
   --t  texto (o escuro da marca)   --c texto secundário (4,8)   --l linhas   --e painel escuro (mostrador) */
:root{--v:#50D088;--ve:#2E7D57;--vc:#EAF8F0;--vm:#A9E9C6;--a:#F2B63D;--ae:#8A5A00;--ac:#FFF5DF;
  --t:#121212;--c:#6B7280;--l:#E6E9EE;--e:#121212}
*{box-sizing:border-box;margin:0;padding:0;transition:none!important;animation:none!important}
html,body{width:1280px;height:800px;overflow:hidden;background:#fff}
body{font-family:M,sans-serif;color:var(--t);-webkit-font-smoothing:antialiased}
#st{position:absolute;inset:0;overflow:hidden;background:
  radial-gradient(1100px 650px at 92% -12%,rgba(80,208,136,.09),transparent 62%),
  radial-gradient(900px 600px at -12% 112%,rgba(80,208,136,.06),transparent 60%),#fff}
.g{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:640px 400px}
.ab{position:absolute}
.row{display:flex;align-items:center}
/* título da cena: área (kicker) + conceito; sozinho fica grande no centro e sobe quando o desenho entra */
.kick{font-weight:700;font-size:15px;letter-spacing:.3em;color:var(--ve);text-transform:uppercase}
.h{font-weight:800;font-size:46px;letter-spacing:-.01em;line-height:1.1}
/* cartão, chip, etiqueta, ícone */
.card{position:absolute;background:#fff;border:1px solid #E1E8E4;border-radius:18px;
  box-shadow:0 18px 40px rgba(16,24,40,.10),0 3px 8px rgba(16,24,40,.06)}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:100%;height:100%}
.ico{display:flex;align-items:center;justify-content:center;flex:none;border-radius:14px;background:var(--vc);color:var(--ve)}
.ico.a{background:var(--ac);color:var(--ae)}
.tag{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;font-weight:800;font-size:20px;white-space:nowrap}
.tag.v{background:var(--vc);color:var(--ve)} .tag.a{background:var(--ac);color:var(--ae)}
.lbl{font-weight:700;font-size:17px;color:var(--c)}
.num{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.op{position:absolute;width:60px;height:60px;border-radius:50%;background:#F2F4F7;color:var(--t);display:flex;
  align-items:center;justify-content:center;font-weight:800;font-size:34px;line-height:1}
/* mostrador da balança (painel escuro, número no acento) */
.most{background:var(--e);border-radius:16px;padding:16px 22px 18px;box-shadow:0 16px 34px rgba(16,24,40,.22)}
.most .ml{position:relative;height:20px;font-weight:700;font-size:15px;letter-spacing:.22em;color:#A9E9C6;text-transform:uppercase}
.most .ml span{position:absolute;left:0;top:0;white-space:nowrap}
.most .mn{margin-top:6px;font-weight:800;font-size:44px;color:var(--v);font-variant-numeric:tabular-nums;white-space:nowrap}
.rip{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:3px solid var(--v);opacity:0}
/* T01 (faltavam no kit): interruptor desenhado, papel do comprovante, peça de fila, cursor, linha que acende, barra */
.chv{position:relative;display:inline-block;flex:none;width:48px;height:28px;border-radius:14px;background:#C9CED6}
.chv i{position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.25)}
.cp{position:absolute;inset:0;background:#fff;box-shadow:inset 0 0 0 1px #E3E8EC}
.peca{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:14px;background:#fff;
  border:2px solid #E1E8E4;font-weight:800;font-variant-numeric:tabular-nums;box-shadow:0 8px 18px rgba(16,24,40,.07)}
.cur svg{fill:#fff}
.hl{border-radius:8px;padding:2px 10px}
.bar{height:10px;border-radius:5px;background:#E6E9EE}
.cl{font-weight:600;font-size:15px;line-height:23px;color:#374151;white-space:nowrap}
</style></head>
<body><div id="st"></div>
<script>
// ------------------------------------------------------------------ utilidades (as do cenas_modelo.html + as da EcoFlix)
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const pr=(t,a,d=.45)=>cl((t-a)/d);
const lerp=(a,b,p)=>a+(b-a)*p;
const $=s=>document.querySelector(s);
const ST=document.getElementById('st');
function el(html,parent=ST){const d=document.createElement('div');d.innerHTML=html.trim();let f=null;for(const n of [...d.childNodes]){parent.appendChild(n);if(!f&&n.nodeType===1)f=n}return f}
function grupo(){return el('<div class="g"></div>')}
function ic(n,px,cor){const s=(window.ICONS||{})[n]||'';return `<span class="ic" style="width:${px}px;height:${px}px;${cor?'color:'+cor:''}">${s}</span>`}
function hex(c){c=c.replace('#','');return[0,2,4].map(i=>parseInt(c.substr(i,2),16))}
function mix(a,b,p){const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*cl(p))).join(',')})`}
// aparece em a, some em b (opacidade + leve subida + escala): a entrada e a saída suaves de tudo
function vis(e,t,a,b=1e9,o={}){
  const din=o.din??.5,dout=o.dout??.4,dy=o.dy??16,dx=o.dx??0,sc=o.sc??.985;
  const p=eo(pr(t,a,din)),q=1-eo(pr(t,b,dout)),op=Math.min(p,q);
  e.style.opacity=op.toFixed(4);e.style.visibility=op<=.001?'hidden':'visible';
  const s=sc+(1-sc)*p - (1-q)*(1-sc);
  e.style.transform=`translate(${((1-p)*dx).toFixed(2)}px,${((1-p)*dy-(1-q)*dy*.5).toFixed(2)}px) scale(${s.toFixed(4)})`;
  return op;
}
function ripple(r,t,a){const p=pr(t,a,.7);r.style.opacity=(p>0&&p<1)?(.6*(1-p)).toFixed(3):0;r.style.transform=`scale(${(.4+2.0*eo(p)).toFixed(3)})`}
function pulse(e,t,a,amp=.045,dur=.9){const p=pr(t,a,dur);e.style.scale=(p>0&&p<1)?(1+amp*Math.sin(Math.PI*p)).toFixed(4):''}
function digita(e,txt,t,a,b){const p=cl((t-a)/Math.max(.05,b-a));const n=Math.round(p*txt.length);
  const car=(p>0&&p<1)||(Math.floor(t*2.2)%2===0&&p<1.2&&t>=a)?'<span style="color:var(--v);font-weight:500">|</span>':'';
  e.innerHTML=(txt.slice(0,n)||'')+(t>=a&&t<b+.8?car:'');}
// EcoFlix: números e dinheiro no jeito brasileiro; contagem suave de um número; traço que se desenha; arco; contorno
const NF=new Intl.NumberFormat('pt-BR');
const kg=v=>NF.format(Math.round(v))+' kg';
const brl=v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function conta(e,t,a,d,v0,v1,fmt=kg){const p=eo(pr(t,a,d));const s=fmt(lerp(v0,v1,p));if(e.textContent!==s)e.textContent=s;return p}
function traco(p,t,a,d=.8){if(!p._L){p._L=p.getTotalLength();p.style.strokeDasharray=p._L}const q=eio(pr(t,a,d));p.style.strokeDashoffset=(p._L*(1-q)).toFixed(2);p.style.opacity=q>0?1:0;return q}
function arco(e,t,a,d,x0,y0,x1,y1,h=-80,rot=0){const p=eio(pr(t,a,d));const x=lerp(x0,x1,p),y=lerp(y0,y1,p)+h*4*p*(1-p);
  e.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${(rot*p).toFixed(2)}deg)`;return p}
function contorno(e,t,a,de,para,d=.45){e.style.borderColor=mix(de,para,eo(pr(t,a,d)))}
// título padrão da cena: grande no centro enquanto está sozinho, sobe para o alto quando o desenho entra (em "sobe")
function titulo(g,kick,txt){return el(`<div class="ab" style="left:0;top:0;width:1280px;text-align:center">
  <div class="kick">${kick}</div><div class="h" style="margin-top:12px">${txt}</div></div>`,g)}
function posTitulo(e,t,a,sobe,sai=1e9){vis(e,t,a,sai,{dy:14});const p=eio(pr(t,sobe,.7));
  e.style.top=lerp(318,46,p).toFixed(2)+'px';e.style.scale=lerp(1.12,1,p).toFixed(4)}

// ------------------------------------------------------------------ tempos da fala (capNN.json do proc.py ou estimado)
let D=null;
const norm=w=>w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9%./-]+/g,'');
function W(linha,palavra,n=1,campo='s'){
  const alvo=norm(palavra);let k=0;
  for(const w of D.words){if(w.linha===linha&&norm(w.w).replace(/[.,]$/,'')===alvo){k++;if(k===n)return w[campo]}}
  for(const w of D.words){if(w.linha===linha&&norm(w.w).startsWith(alvo)){k++;if(k>=n)return w[campo]}}
  console.warn('palavra não achada',linha,palavra);return L(linha);
}
const L=i=>(D.linhas[i]||{s:0}).s, LE=i=>(D.linhas[i]||{e:D.dur}).e;

// ------------------------------------------------------------------ desenhos genéricos (sem marca)
// caminhão de lado (frente para a direita), com a carga de sucata em pedaços (.pd) que podem ser descarregados
function caminhao(){
  const pd=[ // [forma, cor, centro da peça, destino no monte atrás do caminhão (deslocamento do centro e giro)]
    ['<polygon points="28,90 44,52 88,42 100,90"/>','#8C5A3C',[64,66],[-224,148,6]],
    ['<polygon points="82,90 102,36 146,48 154,90"/>','#6F7983',[118,63],[-318,122,12]],
    ['<rect x="118" y="44" width="112" height="16" rx="8" transform="rotate(-8 174 52)"/>','#9AA3AD',[174,52],[-334,98,-18]],
    ['<polygon points="148,90 170,54 212,44 232,90"/>','#A0694A',[190,67],[-425,148,-8]],
    ['<polygon points="210,90 232,40 276,54 286,90"/>','#4F5861',[248,65],[-373,120,-10]],
    ['<polygon points="258,90 282,60 308,66 312,90"/>','#8A949E',[285,75],[-375,148,4]],
    ['<g><circle cx="192" cy="64" r="19"/><circle cx="192" cy="64" r="7" fill="#8A949E"/></g>','#5E6670',[192,64],[-242,155,200]],
    ['<polygon points="40,70 60,50 84,64 64,86"/>','#B07A55',[62,68],[-307,100,30]]];
  const pecas=pd.map(([f,c,[cx,cy],[dx,dy,r]])=>`<g class="pd" data-cx="${cx}" data-cy="${cy}" data-dx="${dx}" data-dy="${dy}" data-r="${r}" fill="${c}">${f}</g>`).join('');
  const roda=x=>`<g class="roda" data-x="${x}" transform="translate(${x},196)"><circle r="26" fill="#1B1F24"/><circle r="12" fill="#9AA3AD"/>
    <rect x="-2.5" y="-23" width="5" height="10" rx="2" fill="#5B636C"/><rect x="-2.5" y="13" width="5" height="10" rx="2" fill="#5B636C"/></g>`;
  return `<svg viewBox="0 0 500 230" width="500" height="230" style="overflow:visible">
    <g class="carga">${pecas}</g>
    <rect x="18" y="86" width="304" height="88" rx="6" fill="#7E8994"/>
    <rect x="16" y="82" width="308" height="11" rx="4" fill="#68727D"/>
    <g stroke="#707A85" stroke-width="3">${[78,138,198,258].map(x=>`<line x1="${x}" y1="98" x2="${x}" y2="168"/>`).join('')}</g>
    <path d="M334,176 L334,76 Q334,64 346,64 L412,64 L462,116 L472,121 Q480,124 480,134 L480,176 Z" fill="#2F3640"/>
    <path d="M348,78 L406,78 L444,116 L348,116 Z" fill="#D7E5ED"/>
    <rect x="470" y="142" width="10" height="11" rx="2" fill="#F2B63D"/>
    <rect x="12" y="170" width="472" height="15" rx="4" fill="#23282E"/>
    ${roda(92)}${roda(158)}${roda(416)}
  </svg>`;
}

// ------------------------------------------------------------------ T01: utilidades que faltavam no kit (escritas aqui)
// janela da cena com as MESMAS âncoras do ilustracoes.json; trecho(): várias cenas no mesmo CAPS[n], cada grupo só existe
// perto da sua janela; tituloJ(): o título já está inteiro (grande no centro) no 1º quadro da janela e sobe em "sobe"
function janela(de,ate,cauda){return [W(de[0],de[1],de[2]||1)-.3, W(ate[0],ate[1],ate[2]||1,'e')+cauda]}
function trecho(g,t,j){const on=t>=j[0]-1.5&&t<=j[1]+1.5;g.style.display=on?'':'none';return on}
function tituloJ(tit,t,j,sobe){posTitulo(tit,t,j[0]-.6,sobe)}
// vários pulsos no mesmo elemento (pulse() chamado duas vezes no mesmo quadro: a segunda chamada apaga a primeira)
function pulsos(e,t,lista){let s=1;for(const [a,amp=.045,dur=.9] of lista){const p=pr(t,a,dur);if(p>0&&p<1)s*=1+amp*Math.sin(Math.PI*p)}
  e.style.scale=s===1?'':s.toFixed(4)}
// interruptor desenhado (p = 0 desligado, 1 ligado); fundo que acende atrás de uma linha (sobre branco)
function chave(e,p){e.style.background=mix('#C9CED6','#50D088',p);e.firstElementChild.style.left=lerp(4,24,eio(p)).toFixed(2)+'px'}
function acende(e,t,a,cor='#EAF8F0',d=.45){e.style.backgroundColor=mix('#FFFFFF',cor,eo(pr(t,a,d)))}
// papel de comprovante com a borda de baixo serrilhada (o conteúdo vai no 1º filho)
function cupom(pai,x,y,w,h){const n=Math.max(8,Math.round(w/18)),p=['0 0',`${w}px 0`];
  for(let i=n;i>=0;i--)p.push(`${(i*w/n).toFixed(1)}px ${(i%2)?h-9:h}px`);
  return el(`<div class="ab" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;filter:drop-shadow(0 14px 24px rgba(16,24,40,.13)) drop-shadow(0 2px 4px rgba(16,24,40,.08))">
    <div class="cp" style="clip-path:polygon(${p.join(',')})"></div></div>`,pai)}
// logo fictício da Recicla Vale Metais (dois montes do vale e o sol; não lembra o símbolo do EcoSistema nem marca real)
function simboloRV(px){return `<svg viewBox="0 0 48 48" width="${px}" height="${px}" style="display:block;flex:none">
  <rect x="1" y="1" width="46" height="46" rx="12" fill="#2F5D7C"/><circle cx="34" cy="14" r="4" fill="#F2B63D"/>
  <path d="M6 36 L18 18 L25 28 L31 21 L42 36 Z" fill="#fff"/><path d="M8 37.5 L40 37.5" stroke="#F2B63D" stroke-width="3" stroke-linecap="round"/></svg>`}
// pessoa genérica (silhueta sem rosto); coque para a Dona Cida
function pessoa(cor='#6F7983',coque=false,w=110){return `<svg viewBox="0 0 110 200" width="${w}" height="${Math.round(w*200/110)}" style="display:block;overflow:visible">
  ${coque?'<circle cx="55" cy="11" r="14" fill="#4B5563"/>':''}<circle cx="55" cy="40" r="28" fill="#4B5563"/>
  <path d="M6 200 L6 124 Q6 78 55 78 Q104 78 104 124 L104 200 Z" fill="${cor}"/></svg>`}
// carroça de mão com sucata (varal para a esquerda, onde fica a pessoa)
function carroca(w=250){return `<svg viewBox="0 0 250 160" width="${w}" height="${Math.round(w*160/250)}" style="display:block;overflow:visible">
  <polygon points="72,64 94,32 132,42 142,64" fill="#6F7983"/><polygon points="122,64 142,28 186,38 196,64" fill="#8C5A3C"/>
  <rect x="90" y="40" width="96" height="13" rx="6.5" fill="#9AA3AD" transform="rotate(-10 138 46)"/>
  <polygon points="172,64 198,36 226,48 232,64" fill="#4F5861"/>
  <path d="M60 62 L242 62 L230 114 L72 114 Z" fill="#A0694A"/>
  <path d="M66 80 L238 80 M70 97 L234 97" stroke="#87573B" stroke-width="3"/>
  <path d="M70 72 L2 96" stroke="#4B5563" stroke-width="7" stroke-linecap="round"/>
  <path d="M204 112 L210 154" stroke="#4B5563" stroke-width="6" stroke-linecap="round"/>
  <circle cx="134" cy="124" r="32" fill="#1B1F24"/><circle cx="134" cy="124" r="12" fill="#9AA3AD"/></svg>`}
// saco de latinhas; monte de ferro misto; a terra (impureza) é uma peça solta
function sacoLatinhas(w=150){return `<svg viewBox="0 0 150 140" width="${w}" height="${Math.round(w*140/150)}" style="display:block;overflow:visible">
  ${[[30,10],[56,1],[82,5],[106,12]].map(([x,y])=>`<g transform="translate(${x},${y})"><rect width="22" height="34" rx="5" fill="#AAB4BE"/>
    <rect y="4" width="22" height="7" fill="#8A949E"/><ellipse cx="11" cy="2" rx="11" ry="3" fill="#D5DBE1"/></g>`).join('')}
  <path d="M16 30 Q75 18 134 30 L142 118 Q142 138 120 138 L30 138 Q8 138 8 118 Z" fill="#D9C3A5"/>
  <path d="M16 31 Q75 46 134 31" fill="none" stroke="#BFA27E" stroke-width="4"/></svg>`}
function monteFerro(){return `<svg viewBox="0 0 200 110" width="200" height="110" style="display:block;overflow:visible">
  <polygon points="6,110 28,62 70,48 84,110" fill="#6F7983"/><polygon points="60,110 82,40 128,52 136,110" fill="#8C5A3C"/>
  <rect x="50" y="56" width="104" height="14" rx="7" fill="#9AA3AD" transform="rotate(-9 102 63)"/>
  <polygon points="118,110 140,58 176,66 196,110" fill="#4F5861"/>
  <circle cx="100" cy="88" r="16" fill="#5E6670"/><circle cx="100" cy="88" r="6" fill="#8A949E"/></svg>`}
function terra(){return `<svg viewBox="0 0 90 40" width="90" height="40" style="display:block;overflow:visible">
  <path d="M4 36 Q8 14 26 12 Q36 0 52 8 Q70 2 80 18 Q90 26 86 36 Z" fill="#8B6A47"/>
  <circle cx="30" cy="24" r="3" fill="#6E5236"/><circle cx="58" cy="20" r="2.5" fill="#6E5236"/><circle cx="70" cy="30" r="2.5" fill="#6E5236"/></svg>`}
const TAGC='background:#F2F4F7;color:#374151';   // etiqueta neutra (nome, situação)

const CAPS={};
// ------------------------------------------------------------------ CAPS[0] · cap00 · o comprovante com a cara da empresa
// fala: 0 "Oi! Neste tutorial a gente vai criar a conta da Recicla Vale Metais e deixar o EcoSistema com a cara dela."
// 1 "Quando o fornecedor sai do pátio com o comprovante na mão, ele precisa ver ali o nome, o CNPJ e o telefone da empresa."
CAPS[0]=()=>{
  const g=grupo(), tit=titulo(g,'Comprovante','A cara da empresa');
  const chao=el('<div class="ab" style="left:160px;top:640px;width:450px;height:4px;border-radius:2px;background:#DDE2E7"></div>',g);
  const forn=el(`<div class="ab row" style="left:183px;top:406px;align-items:flex-end"><div style="margin-right:-16px">${pessoa('#4F5861',false,130)}</div>${carroca(290)}</div>`,g);
  const cup=cupom(g,430,262,420,380), m=cup.firstElementChild;
  // sem identidade: só o lugar vazio e a pergunta
  const ph=el(`<div class="ab" style="left:28px;top:22px;width:364px;height:184px;border:2px dashed #D0D5DD;border-radius:14px;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px">${ic('circle-help',46,'#9AA3AD')}<div class="lbl" style="font-size:20px">De quem é?</div></div>`,m);

      <div style="position:relative;height:96px;margin-top:6px">
        <div class="ab bar ph1" style="left:0;top:10px;width:230px;height:14px"></div><div class="ab bar ph2" style="left:0;top:52px;width:170px;height:22px"></div>
        <div class="ab ca" style="left:0;top:0;font-weight:700;font-size:22px;color:#374151;white-space:nowrap;opacity:0">${calc}</div>
        <div class="ab num va" style="left:0;top:34px;font-size:40px;color:${cor};white-space:nowrap;opacity:0">R$ 0,00</div></div>
      <div style="border-top:1px solid var(--l);margin-top:14px"></div>
      <div class="row es" style="margin-top:14px;gap:10px;opacity:0">${ic('warehouse',22,'#2E7D57')}<div style="font-weight:700;font-size:18px">Estoque</div>
        <div class="num" style="margin-left:auto;font-size:22px;color:#2E7D57">190 kg</div></div></div>`,gB);
  const mL=metade(80,'Ligada','#2E7D57','190 kg × '+brl(.75)+' =',142.5), mD=metade(660,'Desligada','#8A5A00','200 kg × '+brl(.75)+' =',150);
  const TER0=[484,304], TER1=[680,388];          // a terra em cima do monte / no chão, ao lado da balança
  const JB=janela([12,'Uma'],[14,'ligada'],.6);
  return t=>{
    if(trecho(gA,t,JA)){
      const tDo=W(10,'Dona'), tTr=W(10,'trouxe'), tQu=W(10,'quilos'), tLa=W(10,'latinha'), tDa=W(10,'dao'), tAr=W(10,'arredondamento'),
            tRe=W(10,'recebe'), tSa=W(10,'saldo'), tPg=W(10,'pagar');
      tituloJ(titA,t,JA,tDo-.25);
      vis(chaoA,t,tDo-.2,1e9,{dy:0}); vis(cida,t,tDo-.15,1e9,{dx:-30,dy:0}); vis(tagC,t,tDo+.05,1e9,{dy:10});
      vis(saco,t,tDo,1e9,{dy:10,sc:1}); arco(sacoIn,t,tTr-.05,.8,198,500,292,482,-70);
      for(const e of [plat,poste,mostA]) vis(e,t,tTr-.3,1e9,{dy:10});
      conta(mostA.querySelector('.mn'),t,tQu-.75,.9,0,37); pulse(mostA,t,tLa,.05,.7);
      vis(calc,t,tDa-.1,1e9,{dy:18});
      vis(pill,t,tAr-.15,1e9,{dy:10}); chave(pill.querySelector('.chv'),eo(pr(t,tAr+.25,.4)));
      vis(porco,t,tAr+.1,1e9,{sc:.6,dy:0});
      // os 40 centavos saem do valor e caem no cofrinho; o valor vira R$ 229,00
      const a40=tAr+.65, f=arco(voa40,t,a40,.85,S40[0],S40[1],P40[0],P40[1],-50);
      voa40.style.opacity=(f>0?1-eo(cl((f-.8)/.2)):0).toFixed(3); c40.style.opacity=f>0?0:1;
      const q=eo(pr(t,a40+.75,.35)); c00.style.opacity=q.toFixed(3); v1.style.color=mix('#121212','#2E7D57',q);
      pulsos(porco,t,[[a40+.8,.08,.6],[tPg,.06,.7]]);
      vis(tRec,t,tRe-.1,1e9,{dy:10}); vis(tSal,t,tSa-.1,1e9,{dy:10});
    }
    if(trecho(gB,t,JB)){
      const tIm=W(12,'impureza'), tPe=W(12,'peso'), tEn=W(12,'entra'), tEs=W(12,'estoque'), tCh=W(12,'chave'), tVa=W(12,'valor'),
            tVd=W(13,'Valdir'), tQ1=W(13,'quilos'), tTe=W(13,'terra'), tLi=W(13,'ligada'), tR1=W(13,'recebe'), tQ3=W(13,'quilos',3,'e'),
            tDe=W(14,'desligada'), tR2=W(14,'recebe'), tQ4=W(14,'quilos',1,'e'), tE2=W(14,'estoque'), tRc=W(14,'Recicla');
      tituloJ(titB,t,JB,tIm-.25);
      // a balança com o monte e a terra por cima; a terra sai do peso e cai do lado
      for(const e of [chaoB,platB,monte]) vis(e,t,tIm-.1,1e9,{dy:12}); vis(terraE,t,tIm-.1,1e9,{dy:12,sc:1});
      const pt=arco(terraIn,t,tPe-.05,.8,TER0[0],TER0[1],TER1[0],TER1[1],-60,8);
      arco(tagImpIn,t,tPe-.05,.8,TER0[0]+100,TER0[1]-2,TER1[0]-14,TER1[1]-52,-60); vis(tagImp,t,tIm+.15,1e9,{dy:0,dx:-10,sc:1});
      tagImp.querySelector('.dk').style.opacity=eo(pr(t,tTe,.4)).toFixed(3); tagImp.querySelector('.dk').style.marginLeft='8px';
      traco(setaB,t,tEn-.1,.6); vis(pontaB,t,tEn+.4,1e9,{dy:0,dx:-6,din:.25});
      vis(est,t,tEs-.15,1e9,{dx:20,dy:0});
      // a chave nas duas posições e o valor pago de cada uma
      vis(mL,t,tCh-.1,1e9,{dy:18}); vis(mD,t,tCh+.05,1e9,{dy:18});
      chave(mL.querySelector('.chv'),eo(pr(t,tCh+.3,.4))); chave(mD.querySelector('.chv'),0);
      for(const mm of [mL,mD]){pulse(mm.querySelector('.vp'),t,tVa,.08,.7)}
      // Valdir e os números: 200 kg na balança, 10 kg de terra, 190 kg no estoque
      vis(vald,t,tVd-.1,1e9,{dx:-40,dy:0}); vis(mostB,t,tVd,1e9,{dy:10}); conta(mostB.querySelector('.mn'),t,tQ1-.7,.8,0,200);
      const ev=eo(pr(t,tTe+.4,.45)); est.querySelector('.ev').style.opacity=ev.toFixed(3); est.querySelector('.bar').style.opacity=(1-ev).toFixed(3);
      for(const mm of [mL,mD]) mm.querySelector('.es').style.opacity=ev.toFixed(3);
      const val=(mm,ta,tv,v)=>{const a=eo(pr(t,ta,.45)),b=eo(pr(t,tv-.1,.4));mm.querySelector('.ca').style.opacity=a.toFixed(3);mm.querySelector('.ph1').style.opacity=(1-a).toFixed(3);
        mm.querySelector('.va').style.opacity=b.toFixed(3);mm.querySelector('.ph2').style.opacity=(1-b).toFixed(3);conta(mm.querySelector('.va'),t,tv-.1,1.0,0,v,brl)};
      val(mL,tLi-.05,tQ3,142.5); val(mD,tDe-.05,tQ4,150);

      // a Recicla Vale deixa ligada
      const rv=mL.querySelector('.rv'); rv.style.opacity=eo(pr(t,tRc,.45)).toFixed(3);
      mL.style.boxShadow=`0 0 0 ${(5*eo(pr(t,tRc,.45))).toFixed(2)}px rgba(80,208,136,.25),0 18px 40px rgba(16,24,40,.10),0 3px 8px rgba(16,24,40,.06)`;
    }
  };
};

// ------------------------------------------------------------------ CAPS[10] · cap10 · 30/60/90 dias
// fala: 1 "Imagina que a Fundição Bandeira do Vale compra cobre e paga em três vezes: trinta, sessenta e noventa dias."
CAPS[10]=()=>{
  const g=grupo(), tit=titulo(g,'Pagamento','30/60/90 dias');
  const X0=240, XS=[527,813,1100], YA=574;     // eixo: dia 0 (emissão) e 30/60/90 dias
  const venda=el(`<div class="card" style="left:${X0-190}px;top:204px;width:380px;height:128px;padding:22px 24px">
      <div class="row" style="gap:14px"><div class="ico" style="width:50px;height:50px">${ic('receipt-text',27)}</div>
        <div><div style="font-weight:800;font-size:21px">Venda de cobre</div><div class="lbl" style="margin-top:4px">Fundição Bandeira do Vale</div></div></div></div>`,g);
  const eixo=el(`<svg class="ab" style="left:0;top:0;overflow:visible" width="1280" height="800">
      <path d="M${X0} 332 L${X0} ${YA}" stroke="#D9DEE4" stroke-width="3" stroke-dasharray="6 7" fill="none"/>
      <path class="ex" d="M${X0} ${YA} L${XS[2]} ${YA}" stroke="#D9DEE4" stroke-width="5" stroke-linecap="round" fill="none"/></svg>`,g);
  const linhaEixo=eixo.querySelector('.ex'), pontilhado=eixo.firstElementChild;
  const marca=(x,txt)=>el(`<div class="ab" style="left:${x-80}px;top:${YA-11}px;width:160px;text-align:center">
      <div class="mk" style="width:22px;height:22px;margin:0 auto;border-radius:50%;background:#fff;border:4px solid #C9CED6"></div>
      <div class="mt" style="margin-top:10px;font-weight:700;font-size:18px;color:#6B7280">${txt}</div></div>`,g);
  const m0=marca(X0,'Emissão'), ms=XS.map((x,i)=>marca(x,['30 dias','60 dias','90 dias'][i]));
  const parc=XS.map((x,i)=>el(`<div class="card row" style="left:0;top:0;width:200px;height:86px;padding:0 18px;gap:12px;white-space:nowrap">
      <div class="ico" style="width:42px;height:42px">${ic('banknote',24)}</div><div style="font-weight:800;font-size:19px">Parcela ${i+1}</div></div>`,g));
  const J=janela([1,'Imagina'],[1,'dias'],.6);
  return t=>{
    if(!trecho(g,t,J))return;
    const tFu=W(1,'Fundição'), tPa=W(1,'paga'), A=W(1,'vezes',1,'e'), B=W(1,'dias');
    tituloJ(tit,t,J,tFu-.3);
    vis(venda,t,tFu+.2,1e9,{dy:18});
    traco(pontilhado,t,tPa-.2,.4); traco(linhaEixo,t,tPa,.8);
    [m0,...ms].forEach((e,i)=>vis(e,t,tPa+.1+i*.15,1e9,{dy:8}));
    // as três parcelas saem da venda e pousam em 30, 60 e 90 dias, no ritmo da fala
    parc.forEach((e,i)=>{const pousa=A+i*(B-A)*.4, a=pousa-.8;
      const p=arco(e,t,a,.8,X0-100,296,XS[i]-100,440,-110);
      e.style.opacity=(p>0?eo(cl(p/.25)):0).toFixed(3); e.style.visibility=p>0?'visible':'hidden';
      const q=eo(pr(t,pousa-.05,.35)), k=ms[i];
      k.querySelector('.mk').style.borderColor=mix('#C9CED6','#50D088',q); k.querySelector('.mk').style.background=mix('#FFFFFF','#50D088',q);
      k.querySelector('.mt').style.color=mix('#6B7280','#2E7D57',q)});
    parc.forEach((e,i)=>pulse(e,t,B+i*.08,.05,.7));
  };
};
