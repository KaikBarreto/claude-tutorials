<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- T09 "Pedidos e Histórico do Caixa" · os PAPÉIS REAIS na tela (kit v3, clima claro: papel é mundo físico).
     Moldes: T08/cenas_v3/comprovante.html (cupom) e T04/cenas_v3/pdf.html (folha A4). Pedido do Kaik (19/11): toda fala de PDF
     ou comprovante mostra o papel real, sem redesenho; a câmera passeia e o marca-texto verde acompanha a fala.
     O app abre cada papel numa aba nova e o robô devolveu os seis no ensaio ($TUT_HOME/rec/t09/pdfs/). A edição os deixa em
     $TUT_HOME/t09/edit/out/comprovantes/ (fora do git):
       cap04.png            cap04-comprovante-vale-forte-21-10.pdf        pdftoppm -r 720 -png -singlefile
       cap06-aparecida.png  cap06-comprovante-aparecida.pdf               idem
       cap06-valdir.png     cap06-comprovante-valdir-sem-valores.pdf      idem
       cap07-relatorio.png  cap07-relatorio-pedidos-outubro.html          impresso em A4 pelo Chromium (mídia de impressão), página 1, -r 300
       cap09-fechamento.png cap09-relatorio-fechamento-70.pdf             -r 500, cortado em 690 pt de altura (o resto da página é branco)
       cap09-estoque.png    cap09-relatorio-estoque-70.html               impresso em A4 deitado (o @page da página), -r 400, cortado em 310 pt
     Janelas (../cenas/ilustracoes.json), sobre a voz real ($TUT_HOME/t09/narracao/capNN.json):
       cap04 · linha 4 · pdf04_comprovante_valeforte  "O comprovante já sai certo, no nome da Auto Peças, com a data de vinte e um de outubro. É esse que a gente manda pra ela."
       cap06 · linha 3 · pdf06_comprovante_aparecida  "Pronto: o comprovante abre na aba nova, com o peso certo. Daqui você imprime ou manda pra ela."
       cap06 · linha 6 · pdf06_comprovante_valdir     "E o comprovante sai só com o material e o peso. O pedido continua com o valor no sistema; só o papel sai sem."
       cap07 · linha 3 · pdf07_relatorio_pedidos      "... o relatório abre numa aba nova, pronto pra imprimir ou mandar pro contador."
       cap09 · linhas 0 e 1 · pdf09_fechamento        "... abre o relatório de fechamento daquele dia ... com quanto abriu, o que entrou e saiu em cada forma de pagamento, e com quanto fechou."
       cap09 · linhas 2 e 3 · pdf09_estoque_caixa     "... mostra, material por material, o que esse caixa comprou e vendeu, com o preço médio. Olha a bateria aqui ..."
     Em todas: o papel entra de cima (com o título no alto), o título sai e a câmera mergulha até o trecho que a fala cita.
     Coordenadas das marcas: pontos do PDF (pdftotext -bbox, os .bbox.html ao lado dos PNG).
     Render: render_cenas.cjs <cap> <capNN.json> saida.mp4 --html .../pdf.html --anexo $TUT_HOME/t09/edit/out/comprovantes
             --larg 1422 --dsf 1.35 --de <s> --ate <s>.  Auditoria: auditar.cjs --aula planejamento/ecoflix/T09 --larg 1422 -->
</head><body>
<script type="module">
import { pr, eo, W, vis, titulo, posTitulo, GL, mancha, piso, U, camera, plano, cena, estilo, enquadraRet }
  from '../../../../perfis/ecoflix/cenas_v3/motor.js';
import { ceuClaro } from '../../../../perfis/ecoflix/cenas_v3/fundo.js';

const NUNCA = 1e9;
// O papel é desenhado MAIOR que no quadro (K px por pt) para o Chromium não ampliar a camada (texto pequeno saía mole).
// CUPOM: 80 mm (226,77 pt), 3,4 m de largura no mundo; FOLHA: A4 em pé; DEITADA: A4 deitado, 9 m de largura.
const CUPOM = { wpt: 226.77, K: 3, E: .005, cupom: true }, FOLHA = { wpt: 594.96, K: 2.4, E: .008 / 2.4 }, DEITADA = { wpt: 841.92, K: 2.4, E: 9 / 841.92 / 2.4 };
const LEITURA = 287;   // zoom de leitura do cupom, em px de quadro por metro (o mesmo da T08: o corpo de 6 pt sai com ~26 px)

// marcas: [x0, y0, x1, y1, tipo]; tipo '' = marca-texto (cresce da esquerda), 'q' = moldura (faixa preta ou coluna, onde o marca-texto não aparece)
function papel(src, o) {
  const K = o.K, WP = Math.round(o.wpt * K), HPX = Math.round(o.hpt * K), m = K * o.E, r = (o.cupom ? 4.6 : 4.2) * K;
  estilo('folha9', `
.folha{position:relative;background:#fff}
.folha img{display:block;width:100%;height:100%;border-radius:inherit}
.folha .z{position:absolute;left:0;display:block}
.folha .mk{position:absolute;background:rgba(80,208,136,.46);mix-blend-mode:multiply;transform-origin:0 50%;transform:scaleX(0)}
.folha .mk.q{background:none;mix-blend-mode:normal;border-style:solid;border-color:#50D088;transform:none;opacity:0}`);
  const mk = Object.entries(o.marcas).map(([id, [x0, y0, x1, y1, tp]]) =>
    `<i class="mk ${tp ?? ''}" data-m="${id}" style="left:${(x0 * K).toFixed(1)}px;top:${(y0 * K).toFixed(1)}px;width:${((x1 - x0) * K).toFixed(1)}px;height:${((y1 - y0) * K).toFixed(1)}px;border-radius:${(2.8 * K).toFixed(1)}px${
      tp === 'q' ? `;border-width:${(1.9 * K).toFixed(1)}px;box-shadow:0 0 0 ${(1.9 * K).toFixed(1)}px rgba(80,208,136,.28)` : ''}"></i>`).join('');
  const s = o.cupom ? 1 : 1.45, sombra = `0 ${(22.7 * K * s).toFixed(0)}px ${(40 * K * s).toFixed(0)}px ${(-12 * K * s).toFixed(0)}px rgba(30,80,60,.38),0 ${(5.4 * K * s).toFixed(0)}px ${(10.8 * K * s).toFixed(0)}px ${(-4 * K * s).toFixed(0)}px rgba(30,80,60,.14)`;
  let pe = '';
  if (o.cupom) { const n = Math.round(WP / (9.3 * K)), hz = 5.3 * K, z = Array.from({ length: n + 1 }, (_, i) => `${(i * WP / n).toFixed(1)},${i % 2 ? hz : 0}`).join(' ');
    pe = `<svg class="z" style="bottom:${-hz}px" width="${WP}" height="${hz}"><polygon points="0,0 ${z} ${WP},0" fill="#fff"/></svg>`; }
  const yc = HPX * o.E / 2 + .45;
  return { ...o, m, yc, html: `<div class="folha" style="width:${WP}px;height:${HPX}px;border-radius:${o.cupom ? `${r}px ${r}px 0 0` : `${r}px`};box-shadow:${sombra}"><img src="${src}" alt="">${mk}${pe}</div>` };
}
function marca(e, id, t, a, d = .45) {
  const mk = (e._mk ??= {})[id] ??= e.querySelector(`[data-m="${id}"]`), k = eo(pr(t, a, d));
  if (mk.classList.contains('q')) { mk.style.opacity = k.toFixed(3); mk.style.transform = `scale(${(1.05 - .05 * k).toFixed(4)},${(1.25 - .25 * k).toFixed(4)})`; }
  else mk.style.transform = `scaleX(${k.toFixed(4)})`;
}
// trecho do papel (pt, de cima para baixo; por padrão na largura inteira) em metros: para enquadraRet
const faixa = (P, y0, y1, x0 = 0, x1 = P.wpt) => [(x0 - P.wpt / 2) * P.m, P.yc + (P.hpt / 2 - y1) * P.m, (x1 - P.wpt / 2) * P.m, P.yc + (P.hpt / 2 - y0) * P.m];
const palco = (r = 24) => { piso({ r, x: 0, z: -2, passo: 1.3 }); U.uNevoa.value.set(.955, .975, .965, .8); ceuClaro({ halo: [.2, 3.6, -12] }); };
const poe = (P, larg = 5.2) => ({ p: plano(P.html, { pos: [0, P.yc, 0], esc: P.E, sangra: true }), s: mancha(larg, 1.6, [0, 0, .1], { op: 0 }) });
// o papel de cima, com o título no alto (ALTO), e o trecho de perto (PERTO: o título já saiu)
const ALTO = (P, y1, o = {}) => enquadraRet(null, faixa(P, 0, y1), { topo: 150, margem: 48, el: .02, az: .04, ...o });
const PERTO = (P, y0, y1, o = {}) => enquadraRet(null, faixa(P, y0, y1, o.x0, o.x1), { topo: 70, margem: 56, max: P.cupom ? LEITURA : 1e9, el: .015, az: .02, ...o });
// a janela abre com o título já no alto e o papel chegando
const abre = (t, a, tit, sai, P) => { posTitulo(tit, t, a - 1.7, a - 1.3, sai); vis(P.p.e, t, a - .6, NUNCA, { dy: 72 }); };

// =====================================================================================================================
// cap04, linha 4 · o comprovante da bateria corrigida: Fornecedor: Auto Peças Vale Forte e a data de 21/10/2026
function cupom04(d) {
  const t0 = W(4, 'comprovante'), tno = W(4, 'nome'), tda = W(4, 'data'), tfim = W(4, 'ela', 1, 'e');
  palco();
  const P = papel(`${d.anexo}/cap04.png`, { ...CUPOM, hpt: 416.69, marcas: { forn: [19, 156.2, 209, 169.6], data: [139, 203.5, 213.5, 214.8] } }), F = poe(P);
  const tit = titulo('Comprovante', 'No nome da Auto Peças');
  const A = ALTO(P, 236), B = PERTO(P, 124, 226);
  camera([[t0 - 3, A], [tno - .6, { ...A, d: A.d * .985, az: .03 }, 'lin'], [tno + .45, B], [tfim + 2, { ...B, d: B.d * .975, az: -.012 }, 'lin']]);
  return t => {
    GL.style.opacity = eo(pr(t, t0 - .25, .35)).toFixed(3); abre(t, t0, tit, tno - .7, F);
    F.s.material.uniforms.uOp.value = .55 * (+F.p.e.style.opacity || 0);
    marca(F.p.e, 'forn', t, tno + .1); marca(F.p.e, 'data', t, tda + .15);
  };
}

// =====================================================================================================================
// cap06 · linha 3: o comprovante da Aparecida com o peso certo (42 Kg) · linha 6: o do Valdir, só com o material e o peso
// As duas folhas ficam no mesmo lugar; cada janela mostra a sua.
function cupom06(d) {
  const t0 = W(3, 'pronto'), tco = W(3, 'com'), tpe = W(3, 'peso'), tce = W(3, 'certo'), tf1 = W(3, 'ela', 1, 'e');
  const u0 = W(6, 'e'), uso = W(6, 'so'), uma = W(6, 'material'), upe = W(6, 'peso'), upa = W(6, 'papel'), uf = W(6, 'sem', 1, 'e');
  const MEIO = (tf1 + u0) / 2;
  palco();
  const P1 = papel(`${d.anexo}/cap06-aparecida.png`, { ...CUPOM, hpt: 430.87, marcas: { kg: [80.5, 287.6, 109.5, 299.6], pt: [11.5, 304.8, 89.5, 316.4] } });
  const P2 = papel(`${d.anexo}/cap06-valdir.png`, { ...CUPOM, hpt: 340.16, marcas: { mat: [17, 246.2, 68, 257.8], kg: [157, 248.4, 189, 260], tb: [12.5, 220.5, 214.3, 262.5, 'q'] } });
  const F1 = poe(P1), F2 = { p: plano(P2.html, { pos: [0, P2.yc, 0], esc: P2.E, sangra: true }), s: F1.s };
  const tit1 = titulo('Comprovante', 'Com o peso certo'), tit2 = titulo('Comprovante', 'Cupom sem valor');
  const A1 = ALTO(P1, 236), B1 = PERTO(P1, 228, 350), A2 = ALTO(P2, 236, { az: -.04 }), B2 = PERTO(P2, 126, 284, { az: -.02 });
  camera([[t0 - 3, A1], [tco - .5, { ...A1, d: A1.d * .985, az: .03 }, 'lin'], [tpe + .1, B1], [tf1 + 2, { ...B1, d: B1.d * .975, az: -.012 }, 'lin'],
    [u0 - 3, A2], [uso - .45, { ...A2, d: A2.d * .985, az: -.03 }, 'lin'], [uma - .05, B2], [uf + 2, { ...B2, d: B2.d * .975, az: .012 }, 'lin']]);
  return t => {
    const j2 = t > MEIO, a0 = j2 ? u0 : t0; F1.p.op = j2 ? 0 : 1; F2.p.op = j2 ? 1 : 0;
    GL.style.opacity = eo(pr(t, a0 - .25, .35)).toFixed(3);
    abre(t, t0, tit1, tco - .6, F1); abre(t, u0, tit2, uso - .55, F2);
    F1.s.material.uniforms.uOp.value = .55 * (+(j2 ? F2 : F1).p.e.style.opacity || 0);
    marca(F1.p.e, 'kg', t, tpe + .05); marca(F1.p.e, 'pt', t, tce + .1);
    marca(F2.p.e, 'mat', t, uma + .05); marca(F2.p.e, 'kg', t, upe + .05); marca(F2.p.e, 'tb', t, upa - .05, .5);
  };
}

// =====================================================================================================================
// cap07, linha 3 · o Relatório de Pedidos (PDF detalhado): o título, o período e os materiais embaixo do primeiro pedido
function relatorio07(d) {
  const t0 = W(3, 'relatorio'), tab = W(3, 'abre'), tno = W(3, 'nova'), tpr = W(3, 'pronto'), tfim = W(3, 'contador', 1, 'e');
  palco(26);
  const P = papel(`${d.anexo}/cap07-relatorio.png`, { ...FOLHA, hpt: 841.92, marcas: { tit: [70, 126.6, 188.5, 144.4], per: [70, 143, 195, 155.6], mat: [109.5, 197.5, 518.5, 230.5, 'q'] } }), F = poe(P, 6.4);
  const tit = titulo('Exportar', 'A lista em PDF');
  const A = ALTO(P, 352, { margem: 56, az: .05 }), B = enquadraRet(null, faixa(P, 108, 438), { topo: 60, margem: 50, el: .015, az: .02 });
  camera([[t0 - 3, A], [tab - .05, { ...A, d: A.d * .985, az: .045 }, 'lin'], [tno + .35, B], [tfim + 2, { ...B, d: B.d * .985, az: .0 }, 'lin']]);
  return t => {
    GL.style.opacity = eo(pr(t, t0 - .25, .35)).toFixed(3); abre(t, t0, tit, tab - .15, F);
    F.s.material.uniforms.uOp.value = .55 * (+F.p.e.style.opacity || 0);
    marca(F.p.e, 'tit', t, tab + .1); marca(F.p.e, 'per', t, tno + .1, .4); marca(F.p.e, 'mat', t, tpr, .45);
  };
}

// =====================================================================================================================
// cap09 · linhas 0 e 1: o relatório de fechamento do caixa #70 (cupom comprido: a câmera desce da abertura até o
// fechamento) · linhas 2 e 3: o Relatório de Estoque do Caixa #70 (folha deitada: a tabela e, depois, a linha da bateria)
function caixa09(d) {
  const t0 = W(0, 'abre'), tfe = W(0, 'fechamento'), tel = W(1, 'ele'), tab = W(1, 'abriu'), ten = W(1, 'entrou'), tsa = W(1, 'saiu'), tfo = W(1, 'forma'), tpg = W(1, 'pagamento'),
    tco = W(1, 'com', 2), tfc = W(1, 'fechou'), tf1 = W(1, 'fechou', 1, 'e');
  const u0 = W(2, 'mostra'), uma = W(2, 'material'), uco = W(2, 'comprou'), uve = W(2, 'vendeu'), upm = W(2, 'preco'), uol = W(3, 'olha'), uba = W(3, 'bateria'), udu = W(3, 'duzentos'),
    use = W(3, 'setecentos'), uf = W(3, 'operador', 1, 'e');
  const MEIO = (tf1 + u0) / 2;
  palco(30);
  const P1 = papel(`${d.anexo}/cap09-fechamento.png`, { ...CUPOM, hpt: 690, marcas: { bar: [12.2, 93, 214.5, 117.5, 'q'], abr: [17.5, 180.3, 209.5, 190], ent: [75.5, 410, 152.5, 420.4], sai: [76.5, 242.8, 150.5, 253.2],
    cd: [25.5, 277, 209.5, 286.2], cp: [25.5, 287.3, 209.5, 296.5], vd: [25.5, 444.2, 209.5, 453.4], vp: [25.5, 454.5, 209.5, 463.7], fec: [12.2, 599, 214.5, 636, 'q'] } });
  const P2 = papel(`${d.anexo}/cap09-estoque.png`, { ...DEITADA, hpt: 310, marcas: { cm: [61.5, 173.2, 120, 232.6, 'q'], cc: [150.5, 173.2, 295.5, 191.6, 'q'], cv: [411.5, 173.2, 540.5, 191.6, 'q'], pm: [318, 173.2, 401, 191.6, 'q'],
    bat: [64.5, 206.6, 116, 218.4], kg: [188.5, 206.6, 211, 218.4], val: [262, 206.6, 294, 218.4] } });
  const F1 = poe(P1), F2 = { p: plano(P2.html, { pos: [0, P2.yc, 0], esc: P2.E, sangra: true }), s: mancha(11, 1.8, [0, 0, .1], { op: 0 }) };
  const tit1 = titulo('Histórico do Caixa', 'O relatório de fechamento'), tit2 = titulo('Histórico do Caixa', 'O relatório de estoque');
  const A1 = ALTO(P1, 228), B1 = PERTO(P1, 126, 226), C1 = PERTO(P1, 234, 494, { margem: 50, az: -.015 }), D1 = PERTO(P1, 562, 652, { az: .02 });
  const A2 = ALTO(P2, 310, { az: -.03 }), B2 = PERTO(P2, 160, 252, { x0: 12, x1: 548, margem: 50, az: -.015 }), C2 = PERTO(P2, 160, 252, { x0: 12, x1: 412, margem: 50, az: .012 });
  camera([[t0 - 3, A1], [tel - .25, { ...A1, d: A1.d * .98, az: .03 }, 'lin'], [tab - .15, B1], [ten - .45, { ...B1, d: B1.d * .99, az: .01 }, 'lin'], [ten + .5, C1],
    [tpg + .5, { ...C1, d: C1.d * .985, az: -.025 }, 'lin'], [tco + .45, D1], [tf1 + 2, { ...D1, d: D1.d * .98, az: .0 }, 'lin'],
    [u0 - 3, A2], [uma - .55, { ...A2, d: A2.d * .985, az: -.025 }, 'lin'], [uma + .55, B2], [uol - .3, { ...B2, d: B2.d * .988, az: -.005 }, 'lin'], [uol + .65, C2],
    [uf + 2, { ...C2, d: C2.d * .975, az: .03 }, 'lin']]);
  return t => {
    const j2 = t > MEIO, a0 = j2 ? u0 : t0; F1.p.op = j2 ? 0 : 1; F2.p.op = j2 ? 1 : 0;
    GL.style.opacity = eo(pr(t, a0 - .25, .35)).toFixed(3);
    abre(t, t0, tit1, tel - .35, F1); abre(t, u0, tit2, uma - .65, F2);
    F1.s.material.uniforms.uOp.value = j2 ? 0 : .55 * (+F1.p.e.style.opacity || 0); F2.s.material.uniforms.uOp.value = j2 ? .55 * (+F2.p.e.style.opacity || 0) : 0;
    marca(F1.p.e, 'bar', t, tfe - .1, .5); marca(F1.p.e, 'abr', t, tab + .05);
    marca(F1.p.e, 'ent', t, ten + .3, .4); marca(F1.p.e, 'sai', t, tsa + .1, .4);
    marca(F1.p.e, 'cd', t, tfo); marca(F1.p.e, 'cp', t, tfo + .22); marca(F1.p.e, 'vd', t, tpg); marca(F1.p.e, 'vp', t, tpg + .22);
    marca(F1.p.e, 'fec', t, tfc - .05, .5);
    marca(F2.p.e, 'cm', t, uma + .5, .5); marca(F2.p.e, 'cc', t, uco, .4); marca(F2.p.e, 'cv', t, uve, .4); marca(F2.p.e, 'pm', t, upm, .4);
    marca(F2.p.e, 'bat', t, uba + .05); marca(F2.p.e, 'kg', t, udu + .05); marca(F2.p.e, 'val', t, use + .05);
  };
}

const CAPS = { 4: cupom04, 6: cupom06, 7: relatorio07, 9: caixa09 };
cena(d => CAPS[d.cap](d), { fov: 26 });
</script></body></html>
