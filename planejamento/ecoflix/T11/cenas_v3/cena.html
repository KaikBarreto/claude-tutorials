// comuns
const NUNCA = 1e9, EE = .0112;
const arco = (a, b, p, alt) => [lerp(a[0], b[0], p), lerp(a[1], b[1], p) + alt * 4 * p * (1 - p), lerp(a[2], b[2], p)];
const some = (o, k, s = 1) => { o.visible = k > .002; if (o.visible) o.scale.setScalar(k * s); };   // objeto 3D que entra crescendo
const cores = () => estilo('t11-cor', `.chip.am{background:linear-gradient(150deg,#F7CB68,#E59A22);color:#3A2A06;border-color:rgba(255,255,255,.4);box-shadow:0 12px 22px -8px rgba(229,154,34,.6)}`);

function escuro() {

// CENA "caminho" · cap01, linhas 1 a 3 · clima escuro (ficha, ordem, lançamento, estoque, custo)
// 1 "O caminho é este. Primeiro, a ficha técnica: a receita, com o que entra e o que sai. Depois, a ordem: quanto produzir e quem

    tlc = W(2, 'lancamento'), tq2 = W(2, 'quanto'), tl1 = W(2, 'latinha'), tai = W(2, 'ai'), tes = W(2, 'estoque'), tl2 = W(2, 'latinha', 2), ts2 = W(2, 'sai'), tf2 = W(2, 'fardo'), te2 = W(2, 'entra'),

// CENA "por_quilo" · cap03, linha 6 · clima escuro (a ficha leva 1 kg e a ordem multiplica)
// 6 "É sempre assim: a ficha leva a quantidade de um quilo, e a ordem multiplica. Quinhentos quilos de fardo pedem quinhentos
//    quilos de latinha. Cinquenta quilos de cobre pedem oitenta quilos de fio."
// Duas linhas de conta, a ficha (por quilo) à esquerda, a ordem (o lote) à direita: 1 kg × 500 = 500 kg; 1,6 kg × 50 = 80 kg.
function porQuilo() {
  const t0 = W(6, 'e'), tfi = W(6, 'ficha'), tum = W(6, 'um'), tor = W(6, 'ordem'), tmu = W(6, 'multiplica'), t5 = W(6, 'quinhentos'), tpe = W(6, 'pedem'), tl2 = W(6, 'latinha'), tci = W(6, 'cinquenta'), tqc = W(6, 'quilos', 3),
    tco = W(6, 'cobre'), toi = W(6, 'oitenta'), tfm = W(6, 'fio', 1, 'e');
  cores();
  const { EIXO, X, ret, fundo } = escuro(), R1 = -10, R2 = 150, XF = -180, XM = 50, XO = 280, CW = 330, CH_ = 120;
  const cart = (x, y, ...a) => X(htmlCartao(...a, { w: CW, h: CH_, fn: 32 }), x, y);
  const hF = X(htmlChip('Na ficha', 'n'), XF, -120, { z: 40 }), hO = X(htmlChip('Na ordem', 'am'), XO, -120, { z: 40 });
  const f1 = cart(XF, R1, 'package', 'Latinha', 'para 1 kg de fardo', '1 kg'), o1 = cart(XO, R1, 'package', 'Latinha', 'para 500 kg de fardo', '0 kg', { res: true }), m1 = X(htmlChip('× 500', 'am'), XM, R1, { z: 40 });
  const f2 = cart(XF, R2, 'package', 'Fio', 'para 1 kg de cobre', '1,6 kg'), o2 = cart(XO, R2, 'package', 'Fio', 'para 50 kg de cobre', '0 kg', { res: true }), m2 = X(htmlChip('× 50', 'am'), XM, R2, { z: 40 });
  const n1 = o1.e.querySelector('.num'), n2 = o2.e.querySelector('.num'), w1 = o1.e.querySelector('.onda'), w2 = o2.e.querySelector('.onda');

// CENA "ima" · cap04, linha 1 · clima claro (o coproduto: o ímã tira as latas de aço da latinha)
// 1 "Quando a latinha passa no ímã, as latas de aço que vieram no meio saem. Elas viram chaparia, que também tem valor. Mas
//    quanto sai, só dá pra saber depois de separar."
// A latinha anda na esteira, passa sob o ímã; as latas de aço sobem para ele e vão para o monte de chaparia; a pergunta fica no ar.
function ima4() {
  const t0 = W(1, 'quando'), tla = W(1, 'latinha'), tpa = W(1, 'passa'), tim = W(1, 'ima'), tac = W(1, 'aco'), tsa = W(1, 'saem'), tch = W(1, 'chaparia'), tva = W(1, 'valor'), tqu = W(1, 'quanto'), tse = W(1, 'separar'),
    tfim = W(1, 'separar', 1, 'e');
  piso({ r: 34, x: 0, z: 0, passo: 1.3 }); U.uNevoa.value.set(.955, .975, .965, .8); ceuClaro({ halo: [.3, 3.8, -15] });

  const ES = esteira(CENA, [-3.2, 0, 0], { c: 8, l: 1.2, h: .9 });
  const IM = ima(CENA, [XI, 2.35, 0]); trilho(CENA, XI - 2.2, XI + 2.2, 2.35 + IM.userData.topo, 0);
  const CG = grupo(CENA, [-8, .9, 0]); pecas(CG, 'latinha', Array.from({ length: 12 }, (_, i) => [(i - 5.5) * .2, (i % 2) * .09, ((i * 37) % 5 - 2) * .14]), { s: 1 });
  const AC = grupo(CENA, [0, 0, 0]); pecas(AC, 'ferro', [[-.25, 0, .05], [.22, .04, -.1], [0, .12, .08], [.08, .24, -.05]], { s: .8 });
  const MO = monte(CENA, [XM, 0, .2], { tipo: 'ferro', n: 60, r: 1.2, h: .8, mancha: true });
  const xc = t => -7.6 + 1.27 * (t - tla + .1);   // a latinha anda na esteira; o centro dela passa sob o ímã na palavra "aço"
  const chL = CH(htmlChip(`${ic('package', 18)}latinha`, 'n'), [0, 2.3, 0]), chI = CH(htmlChip(`${ic('magnet', 18)}ímã`, 'n'), [XI - 1.7, 3.0, 0], { anc: [1, .5] }), chA = CH(htmlChip('lata de aço', 'am'), [XI - 1.1, 1.9, 1.0], { anc: [1, .5] }),
    chC = CH(htmlChip(`${ic('package', 18)}chaparia`, 'n'), [XM, 1.9, .2]), chV = CH(htmlChip(`${ic('coins', 18)}tem valor`), [XM, 2.8, .2]), chQ = CH(htmlChip(`${ic('circle-help', 18)}quanto sai? só depois de separar`, 'am'), [XM - 1.3, 3.7, .2]);
  const tit = titulo('Ficha técnica', 'O coproduto');

  camera([[t0 - 3, P1], [tfim + 2.5, { ...P1, d: 17.0, az: .03 }, 'lin']]);

    GL.style.opacity = eo(pr(t, t0 + .08, .5)).toFixed(3); posTitulo(tit, t, t0 - .9, t0 - .45);
    corre(ES, 1.27 * t);
    const x = xc(t), ap = passa(pr(t, tla - .2, .5), 1.2) * (1 - eo(pr(t, tva - .7, .6))); CG.position.x = x; some(CG, ap);
    chL.pos[0] = x; chL.pos[1] = 2.0; vis(chL.e, t, tla - .05, tac - .1, { dy: 10, sc: .8 });
    vis(chI.e, t, tim - .1, NUNCA, { dy: 10, sc: .8 }); campo(IM, eo(pr(t, tim, .8)) * (1 - eo(pr(t, tch + .8, .8))));
    // as latas de aço: viajam na carga, sobem até o ímã na palavra "saem", e de lá vão para o monte de chaparia
    const up = eio(pr(t, tsa - .2, .9)), go = eio(pr(t, tch + .15, 1.5)), ini = [x, 1.12, 0], tip = [XI, 1.5, 0], alvo = [XM, 1.0, .2];
    let q = up < 1 ? [lerp(ini[0], tip[0], up), lerp(ini[1], tip[1], up), lerp(ini[2], tip[2], up)] : arco(tip, alvo, go, 1.1);

  };
}

  const B = X(htmlFluxoCartoes({ cartoes: [['calendar-days', 'Dias lançados', 'vão se acumulando', 'a'], ['calendar-check', 'Ordem finalizada', 'o fim do lote', 'n'], ['package', 'Estoque', 'só mexe agora', 'res']], cw: 190, vao: VAO }), 0, Y2);

  camera([[t0 - 3, S], [tfim + 2.5, { ...S, az: .03, d: S.d * .985 }, 'lin']]);

  };
}
