<!-- T11 · Produção: as ilustrações de conceito da aula (cópia do kit perfis/ecoflix/cenas/cenas_ecoflix.html, sem as duas
     cenas de exemplo). Uma cena por capítulo (CAPS[0] a CAPS[13], só os que têm [ILUSTRAÇÃO] no roteiro), cada uma presa
     às palavras da fala com W(linha, 'palavra'); a janela de cada cena (de/ate/cauda) está na lista ILU, a mesma do
     ilustracoes.json. Tempos estimados em tempos/capNN.json até a voz chegar. Render só do trecho:
       node render_cenas.cjs <n> <capNN.json> <saida.mp4> --html cenas.html --de <at> --ate <at + dur>
     Rótulos como no app (T11/inventario.md), números do mundo da Recicla Vale Metais, desenhos genéricos sem marca. -->
<style>
@font-face{font-family:M;font-weight:500;src:url(../../../web/fonts/montserrat-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:600;src:url(../../../web/fonts/montserrat-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:700;src:url(../../../web/fonts/montserrat-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:800;src:url(../../../web/fonts/montserrat-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:500;src:url(../../../web/fonts/montserrat-latin-ext-500-normal.woff2) format('woff2');unicode-range:U+0100-024F}
@font-face{font-family:M;font-weight:700;src:url(../../../web/fonts/montserrat-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-024F}
/* ---------------------------------------------------------------- paleta EcoFlix (marca: acento #50D088, escuro #121212)
   --v  acento: preenchimentos, barras, contornos de destaque (nunca texto sobre branco: contraste baixo)
   --ve verde escuro: texto e ícone verde sobre branco (contraste 5,0)   --vc verde claro: fundo de ícone/resultado
   --a  âmbar: o SEGUNDO conceito da cena (ex.: competência x caixa)     --ae texto âmbar (5,9)   --ac âmbar claro
   --t  texto (o escuro da marca)   --c texto secundário (4,8)   --l linhas   --e painel escuro (mostrador) */
:root{--v:#50D088;--ve:#2E7D57;--vc:#EAF8F0;--vm:#A9E9C6;--a:#F2B63D;--ae:#8A5A00;--ac:#FFF5DF;
  --t:#121212;--c:#6B7280;--l:#E6E9EE;--e:#121212}
*{box-sizing:border-box;margin:0;padding:0;transition:none!important;animation:none!important}
html,body{width:1280px;height:800px;overflow:hidden;background:#fff}
body{font-family:M,sans-serif;color:var(--t);-webkit-font-smoothing:antialiased}
#st{position:absolute;inset:0;overflow:hidden;background:
  radial-gradient(1100px 650px at 92% -12%,rgba(80,208,136,.09),transparent 62%),
  radial-gradient(900px 600px at -12% 112%,rgba(80,208,136,.06),transparent 60%),#fff}
.eco-grupo{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:640px 400px}
.ab{position:absolute}
.row{display:flex;align-items:center}
/* título da cena: área (kicker) + conceito; sozinho fica grande no centro e sobe quando o desenho entra */
.kick{font-weight:700;font-size:15px;letter-spacing:.3em;color:var(--ve);text-transform:uppercase}
.h{font-weight:800;font-size:46px;letter-spacing:-.01em;line-height:1.1}
/* cartão, chip, etiqueta, ícone */
.card{position:absolute;background:#fff;border:1px solid #E1E8E4;border-radius:18px;
  box-shadow:0 18px 40px rgba(16,24,40,.10),0 3px 8px rgba(16,24,40,.06)}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:100%;height:100%}
.ico{display:flex;align-items:center;justify-content:center;flex:none;border-radius:14px;background:var(--vc);color:var(--ve)}
.ico.a{background:var(--ac);color:var(--ae)}
.tag{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;font-weight:800;font-size:20px;white-space:nowrap}
.tag.v{background:var(--vc);color:var(--ve)} .tag.a{background:var(--ac);color:var(--ae)}
.tag.c{background:#4B5563;color:#fff} /* T11: etiqueta neutra (cinza) */
.tag.tg{font-size:24px;padding:11px 22px} /* T11: etiqueta maior */
.lbl{font-weight:700;font-size:17px;color:var(--c)}
.num{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.op{position:absolute;width:60px;height:60px;border-radius:50%;background:#4B5563;color:#fff;display:flex;
  align-items:center;justify-content:center;font-weight:800;font-size:34px;line-height:1}
/* mostrador da balança (painel escuro, número no acento) */
.most{background:var(--e);border-radius:16px;padding:16px 22px 18px;box-shadow:0 16px 34px rgba(16,24,40,.22)}
.most .ml{position:relative;height:20px;font-weight:700;font-size:15px;letter-spacing:.22em;color:#A9E9C6;text-transform:uppercase}
.most .ml span{position:absolute;left:0;top:0;white-space:nowrap}
.most .mn{margin-top:6px;font-weight:800;font-size:44px;color:var(--v);font-variant-numeric:tabular-nums;white-space:nowrap}
.rip{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:3px solid var(--v);opacity:0}
</style><style id="saturado">/* estilo saturado (Kaik, 11/11): selo, chip, etiqueta, quadrado de ícone e círculo de etapa
   com fundo cheio e ícone/texto branco; nunca fundo claro com conteúdo colorido, nunca ícone escuro sobre o verde */
:root{--vs:#50D088;--as:#F2B63D;--rs:#EF4444}
.ico{background:var(--vs);color:#fff}.ico.a{background:var(--as);color:#fff}
.tag.v{background:var(--vs);color:#fff}.tag.a{background:var(--as);color:#fff}

<script>
// ------------------------------------------------------------------ utilidades (as do cenas_modelo.html + as da EcoFlix)
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const pr=(t,a,d=.45)=>cl((t-a)/d);
const lerp=(a,b,p)=>a+(b-a)*p;
const $=s=>document.querySelector(s);
const ST=document.getElementById('st');
function el(html,parent=ST){const d=document.createElement('div');d.innerHTML=html.trim();let f=null;for(const n of [...d.childNodes]){parent.appendChild(n);if(!f&&n.nodeType===1)f=n}return f}
function grupo(){return el('<div class="eco-grupo"></div>')}
function ic(n,px,cor){const s=(window.ICONS||{})[n]||'';return `<span class="ic" style="width:${px}px;height:${px}px;${cor?'color:'+cor:''}">${s}</span>`}
function hex(c){c=c.replace('#','');return[0,2,4].map(i=>parseInt(c.substr(i,2),16))}
function mix(a,b,p){const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*cl(p))).join(',')})`}
// aparece em a, some em b (opacidade + leve subida + escala): a entrada e a saída suaves de tudo
function vis(e,t,a,b=1e9,o={}){
  const din=o.din??.5,dout=o.dout??.4,dy=o.dy??16,dx=o.dx??0,sc=o.sc??.985;
  const p=eo(pr(t,a,din)),q=1-eo(pr(t,b,dout)),op=Math.min(p,q);
  e.style.opacity=op.toFixed(4);e.style.visibility=op<=.001?'hidden':'visible';
  const s=sc+(1-sc)*p - (1-q)*(1-sc);
  e.style.transform=`translate(${((1-p)*dx).toFixed(2)}px,${((1-p)*dy-(1-q)*dy*.5).toFixed(2)}px) scale(${s.toFixed(4)})`;
  return op;
}
function ripple(r,t,a){const p=pr(t,a,.7);r.style.opacity=(p>0&&p<1)?(.6*(1-p)).toFixed(3):0;r.style.transform=`scale(${(.4+2.0*eo(p)).toFixed(3)})`}
function pulse(e,t,a,amp=.045,dur=.9){
  const p=pr(t,a,dur),f=(p>0&&p<1)?1+amp*Math.sin(Math.PI*p):1,c=e.style.transform;
  const meu=e._pw!==undefined&&c===e._pw, base=meu?e._pb:c;
  if(!meu||e._pt!==t)e._pm={};                       // quadro novo (ou o transform foi reescrito): recomeça os pulsos
  e._pm[`${a}|${amp}|${dur}`]=f;e._pt=t;e._pb=base;  // a mesma chamada repetida no mesmo t não se acumula
  let k=1;for(const v of Object.values(e._pm))k*=v;
  e.style.transform=k===1?base:(base?base+' ':'')+`scale(${k.toFixed(4)})`;e._pw=e.style.transform}
function digita(e,txt,t,a,b){const p=cl((t-a)/Math.max(.05,b-a));const n=Math.round(p*txt.length);
  const car=(p>0&&p<1)||(Math.floor(t*2.2)%2===0&&p<1.2&&t>=a)?'<span style="color:var(--v);font-weight:500">|</span>':'';
  e.innerHTML=(txt.slice(0,n)||'')+(t>=a&&t<b+.8?car:'');}
// EcoFlix: números e dinheiro no jeito brasileiro; contagem suave de um número; traço que se desenha; arco; contorno
const NF=new Intl.NumberFormat('pt-BR');
const kg=v=>NF.format(Math.round(v))+' kg';
const brl=v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function conta(e,t,a,d,v0,v1,fmt=kg){const p=eo(pr(t,a,d));const s=fmt(lerp(v0,v1,p));if(e.textContent!==s)e.textContent=s;return p}
function traco(p,t,a,d=.8){if(!p._L){p._L=p.getTotalLength();p.style.strokeDasharray=p._L}const q=eio(pr(t,a,d));p.style.strokeDashoffset=(p._L*(1-q)).toFixed(2);p.style.opacity=q>0?1:0;return q}
function arco(e,t,a,d,x0,y0,x1,y1,h=-80,rot=0){const p=eio(pr(t,a,d));const x=lerp(x0,x1,p),y=lerp(y0,y1,p)+h*4*p*(1-p);
  e.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${(rot*p).toFixed(2)}deg)`;return p}
function contorno(e,t,a,de,para,d=.45){e.style.borderColor=mix(de,para,eo(pr(t,a,d)))}
// título padrão da cena: grande no centro enquanto está sozinho, sobe para o alto quando o desenho entra (em "sobe")
function titulo(g,kick,txt){return el(`<div class="ab" style="left:0;top:0;width:1280px;text-align:center">
  <div class="kick">${kick}</div><div class="h" style="margin-top:12px">${txt}</div></div>`,g)}
function posTitulo(e,t,a,sobe,sai=1e9){vis(e,t,a,sai,{dy:14});const p=eio(pr(t,sobe,.7));
  e.style.top=lerp(318,46,p).toFixed(2)+'px';e.style.scale=lerp(1.12,1,p).toFixed(4)}

// ------------------------------------------------------------------ tempos da fala (capNN.json do proc.py ou estimado)
let D=null;
const norm=w=>w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9%./-]+/g,'');
function W(linha,palavra,n=1,campo='s'){
  const alvo=norm(palavra);let k=0;
  for(const w of D.words){if(w.linha===linha&&norm(w.w).replace(/[.,]$/,'')===alvo){k++;if(k===n)return w[campo]}}
  for(const w of D.words){if(w.linha===linha&&norm(w.w).startsWith(alvo)){k++;if(k>=n)return w[campo]}}
  console.warn('palavra não achada',linha,palavra);return L(linha);
}
const L=i=>(D.linhas[i]||{s:0}).s, LE=i=>(D.linhas[i]||{e:D.dur}).e;

// ------------------------------------------------------------------ desenhos genéricos (sem marca)
// caminhão de lado (frente para a direita), com a carga de sucata em pedaços (.pd) que podem ser descarregados
function caminhao(){
  const pd=[ // [forma, cor, centro da peça, destino no monte atrás do caminhão (deslocamento do centro e giro)]
    ['<polygon points="28,90 44,52 88,42 100,90"/>','#8C5A3C',[64,66],[-224,148,6]],
    ['<polygon points="82,90 102,36 146,48 154,90"/>','#6F7983',[118,63],[-318,122,12]],
    ['<rect x="118" y="44" width="112" height="16" rx="8" transform="rotate(-8 174 52)"/>','#9AA3AD',[174,52],[-334,98,-18]],
    ['<polygon points="148,90 170,54 212,44 232,90"/>','#A0694A',[190,67],[-425,148,-8]],
    ['<polygon points="210,90 232,40 276,54 286,90"/>','#4F5861',[248,65],[-373,120,-10]],
    ['<polygon points="258,90 282,60 308,66 312,90"/>','#8A949E',[285,75],[-375,148,4]],
    ['<g><circle cx="192" cy="64" r="19"/><circle cx="192" cy="64" r="7" fill="#8A949E"/></g>','#5E6670',[192,64],[-242,155,200]],
    ['<polygon points="40,70 60,50 84,64 64,86"/>','#B07A55',[62,68],[-307,100,30]]];
  const pecas=pd.map(([f,c,[cx,cy],[dx,dy,r]])=>`<g class="pd" data-cx="${cx}" data-cy="${cy}" data-dx="${dx}" data-dy="${dy-16}" data-r="${r}" fill="${c}">${f}</g>`).join('');
  const roda=x=>`<g class="roda" data-x="${x}" transform="translate(${x},196)"><circle r="26" fill="#1B1F24"/><circle r="12" fill="#9AA3AD"/>
    <rect x="-2.5" y="-23" width="5" height="10" rx="2" fill="#5B636C"/><rect x="-2.5" y="13" width="5" height="10" rx="2" fill="#5B636C"/></g>`;
  return `<svg viewBox="0 0 500 230" width="500" height="230" style="overflow:visible">
    <g class="carga">${pecas}</g>
    <rect x="18" y="86" width="304" height="88" rx="6" fill="#7E8994"/>
    <rect x="16" y="82" width="308" height="11" rx="4" fill="#68727D"/>
    <g stroke="#707A85" stroke-width="3">${[78,138,198,258].map(x=>`<line x1="${x}" y1="98" x2="${x}" y2="168"/>`).join('')}</g>
    <path d="M334,176 L334,76 Q334,64 346,64 L412,64 L462,116 L472,121 Q480,124 480,134 L480,176 Z" fill="#2F3640"/>
    <path d="M348,78 L406,78 L444,116 L348,116 Z" fill="#D7E5ED"/>
    <rect x="470" y="142" width="10" height="11" rx="2" fill="#F2B63D"/>
    <rect x="12" y="170" width="472" height="15" rx="4" fill="#23282E"/>
    ${roda(92)}${roda(158)}${roda(416)}
  </svg>`;
}

const CAPS={};

// Cada cena tem a sua janela: abre 0,3 s antes da palavra "de" e fecha "cauda" s depois do fim da palavra "ate"

   '480 kg','18 kg a mais','R$ 6,43']},
 {cap:11,id:'ilu11_rendimento',de:[2,'Rendimento',1],ate:[3,'cento',1],cauda:.8,
  resumo:'rendimento = saiu ÷ entrou (96,4%); perda = o que passou da ficha ÷ teórico (3,8%)',
  mostra:['Relatório','Rendimento e perda','saiu','fardo','480 kg','entrou','latinha','498 kg','18 kg','Rendimento',
   '480 ÷ 498','= 96,4%','Perda','18 ÷ 480','= 3,8%']},
 {cap:12,id:'ilu12_baixa',de:[3,'Desligado',1],ate:[3,'finalizada',1],cauda:.8,

  mostra:['Configurações','Quando o estoque baixa','A cada lançamento','Só ao finalizar','dia 1','dia 2','finalizar']},
 {cap:13,id:'ilu13_estorno',de:[4,'Nada',1],ate:[4,'desfeito',1],cauda:.8,
  resumo:'o estorno é uma linha nova no histórico: nada é apagado, o saldo volta',
  mostra:['Estoque','O estorno','Fio de cobre encapado','03/11','Produção','−80 kg','10/11','estorno','+80 kg','saldo',
   'nada é apagado']},
];
const I=id=>ILU.find(x=>x.id===id);
const janela=i=>[W(i.de[0],i.de[1],i.de[2])-.3, W(i.ate[0],i.ate[1],i.ate[2],'e')+i.cauda];
const svg=(w,h,inner,st='',k=1)=>`<svg viewBox="0 0 ${w} ${h}" width="${w*k}" height="${h*k}" style="overflow:visible;${st}">${inner}</svg>`;
const pos=(x,y,s,r=0,k=1,cls='')=>`<g ${cls?`class="${cls}"`:''} transform="translate(${x},${y}) rotate(${r}) scale(${k})">${s}</g>`;
const fixa=(e,op)=>{e.style.opacity=op.toFixed(4);e.style.visibility=op<=.001?'hidden':'visible'};
const tagW=(e,t,a,o={})=>vis(e,t,a,1e9,{dy:10,...o});

// ------------------------------------------------------------------ T11: desenhos do pátio (formas simples, sem marca)
// latinha de alumínio (centro em 0,0; 28 x 43), lata de aço (34 x 38, com frisos), torrão de terra, gota d'água
const LATA=`<rect x="-14" y="-21" width="28" height="43" rx="5" fill="#CDD5DD"/><rect x="-14" y="-6" width="28" height="11" fill="#B8C2CB"/>
  <rect x="-9.5" y="-16" width="5" height="34" rx="2.5" fill="#EEF2F5"/><ellipse cx="0" cy="-20.5" rx="13.6" ry="4.2" fill="#A9B3BD"/>
  <ellipse cx="0" cy="-20.8" rx="8.4" ry="2.3" fill="#909BA6"/><rect x="-14" y="17" width="28" height="5" rx="2.5" fill="#AFB9C3"/>`;
const ACO=`<rect x="-17" y="-18" width="34" height="38" rx="3" fill="#7F8993"/>
  <g stroke="#69737D" stroke-width="2.4"><line x1="-17" y1="-8" x2="17" y2="-8"/><line x1="-17" y1="1" x2="17" y2="1"/><line x1="-17" y1="10" x2="17" y2="10"/></g>
  <rect x="-12.5" y="-15" width="4.5" height="32" rx="2.2" fill="#A2ACB6"/><ellipse cx="8" cy="14" rx="4" ry="2.6" fill="#A0694A"/>
  <ellipse cx="0" cy="-18" rx="17" ry="4.6" fill="#99A3AD"/><ellipse cx="0" cy="-18.3" rx="12" ry="2.9" fill="#737D87"/>`;

// fardo prensado: cubo de latinhas amassadas com duas cintas (170 x 160)
let _uid=0;
function fardo(k=1){
  const u=++_uid, F='15,45 80,72 80,150 15,122', R='80,72 160,40 160,118 80,150', T='15,45 95,15 160,40 80,72';
  const el2=(l,c)=>l.map(([x,y,rx,ry,r],j)=>`<ellipse cx="${x}" cy="${y}" rx="${rx}" ry="${ry}" transform="rotate(${r} ${x} ${y})" fill="${c[j%c.length]}"/>`).join('');
  const fr=el2([[26,64,11,5,25],[50,74,12,5,24],[70,86,10,5,26],[24,90,10,5,22],[46,100,12,6,24],[68,112,11,5,25],[28,114,10,5,23],[52,126,12,5,26],[70,138,9,4,24]],['#C4CDD6','#A9B3BD','#BCC5CE']);
  const rt=el2([[96,80,12,5,-22],[122,70,13,5,-21],[146,58,10,5,-23],[100,104,12,6,-22],[126,94,13,5,-22],[150,84,9,5,-21],[98,128,12,5,-22],[124,118,13,6,-22],[149,106,9,5,-22]],['#8E99A4','#A3ADB7','#949FAA']);
  const tp=el2([[48,40,12,5,-8],[78,30,12,5,-10],[108,28,11,4,-14],[96,48,12,5,-12],[126,40,11,4,-14],[64,54,11,4,-6]],['#DDE3E8','#C7CFD7']);
  return svg(170*k,160*k,`<defs><clipPath id="cf${u}"><polygon points="${F}"/></clipPath><clipPath id="cr${u}"><polygon points="${R}"/></clipPath>
      <clipPath id="ct${u}"><polygon points="${T}"/></clipPath></defs>
    <g transform="scale(${k})"><polygon points="${T}" fill="#D3DAE1"/><polygon points="${F}" fill="#B4BEC8"/><polygon points="${R}" fill="#9AA5B0"/>
    <g clip-path="url(#cf${u})">${fr}</g><g clip-path="url(#cr${u})">${rt}</g><g clip-path="url(#ct${u})">${tp}</g>
    <g stroke="#4F5861" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M36.5,54 L36.5,131 M58.5,63 L58.5,140 M36.5,54 L116.5,23 M58.5,63 L138.5,32 M15,84 L80,111 L160,79"/></g>
    <polygon points="${T}" fill="none" stroke="#8A949E" stroke-width="1.5"/><polygon points="${F}" fill="none" stroke="#8A949E" stroke-width="1.5"/>
    <polygon points="${R}" fill="none" stroke="#7E8994" stroke-width="1.5"/></g>`);
}
// monte de latinhas deitadas (largura ~ 42 x n), chão em y = h
function monte(fileiras,h,dx=0){let s='';fileiras.forEach((n,j)=>{const y=h-14-j*25,x0=dx+(fileiras[0]-n)*21;
  for(let i=0;i<n;i++){const r=90+((i*37+j*53)%29)-14;s+=pos(x0+21+i*42,y,LATA,(i+j)%2?r:-r)}});return s}

const rolo=(c1,c2,k=1)=>svg(64*k,64*k,`<g transform="scale(${k})"><circle cx="32" cy="32" r="25" fill="none" stroke="${c1}" stroke-width="9"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="${c2}" stroke-width="7"/><circle cx="32" cy="32" r="4.5" fill="${c1}"/>
  <path d="M55,40 L63,52" stroke="#C8783C" stroke-width="5" stroke-linecap="round"/></g>`);
const FIO=k=>rolo('#2F3640','#4F5861',k), COBRE=k=>rolo('#B8692F','#E09A5E',k);
const seta=(w,cor='var(--v)',sw=5)=>svg(w,24,`<path d="M3 12 L${w-6} 12 M${w-16} 3 L${w-5} 12 L${w-16} 21" fill="none" stroke="${cor}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`);
const setaE=(w,cor='var(--v)',sw=5)=>svg(w,24,`<path d="M${w-3} 12 L6 12 M16 3 L5 12 L16 21" fill="none" stroke="${cor}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"/>`);
const tag=(cls,txt,x,y,st='')=>`<div class="ab" style="left:${x}px;top:${y}px;${st}"><div class="tag ${cls}">${txt}</div></div>`;
// etiqueta centrada em x (largura livre)
const tagC=(cls,txt,cx,y,g,st='')=>el(`<div class="ab" style="left:${cx-300}px;top:${y}px;width:600px;text-align:center;${st}"><div class="tag ${cls}">${txt}</div></div>`,g);

  return t=>{

  const v498=el(`<div class="ab" style="left:${X(498)-100}px;top:${R-132}px;width:200px;text-align:center"><div class="num" style="font-size:30px;color:var(--ae)">498 kg</div></div>`,g);

    const tre=W(1,'recicla'), tc=W(1,'cento'), tat=W(1,'ate'), tos=W(2,'os'), tmo=W(2,'motivo'), tde=W(2,'dentro'), tna=W(2,'nao'),

    posTitulo(tit,t,A-.5,tre-.35);

    vis(p498,t,tos-.1,1e9,{dy:-14}); vis(v498,t,tos+.05,1e9,{dy:8}); vis(sPede,t,tmo-.15); pulse(sPede.firstElementChild,t,tmo+.35,.06,.7);
    vis(pDen,t,tde-.1,1e9,{dy:-14}); vis(sNao,t,tna-.15);

// ------------------------------------------------------------------ CAPS[10] · Custo estimado × real
// fala 4: "Na ordem, o estimado era seis e vinte. A diferença vem dos dezoito quilos a mais de latinha: eles também entram

    vis(fl,t,ten-.15,1e9,{dy:-10});

// ------------------------------------------------------------------ CAPS[11] · Rendimento e perda

  const PX=900/498, WF=480*PX;
  const rot=(y,txt)=>el(`<div class="ab" style="left:40px;top:${y}px;width:160px;height:70px;display:flex;align-items:center;justify-content:flex-end">

     <div class="ab row" style="left:22px;top:0;height:66px;gap:14px;white-space:nowrap"><span style="font-weight:700;font-size:20px;color:#374151">${nome}</span>

  const bF=barra(214,WF,'var(--vm)','var(--v)','fardo','480 kg'), bE=barra(304,900,'#EEF1F4','#C5CBD3','latinha','498 kg');

  const t18=el(`<div class="ab" style="left:${1120-160}px;top:390px;width:160px;text-align:right"><div class="tag a">18 kg</div></div>`,g);
  const conta_=(x,cls,nome,f,r,cor)=>el(`<div class="card" style="left:${x}px;top:478px;width:450px;height:156px;padding:22px 28px">
     <div class="tag ${cls}">${nome}</div><div class="row" style="margin-top:18px;gap:14px"><span class="num" style="font-size:32px">${f}</span>

  const i=I('ilu12_baixa'), g=grupo();

       ${MX.map((x,k)=>`<div class="ab" style="left:${x-13}px;top:${y-13}px;width:26px;height:26px;border-radius:50%;background:#fff;border:4px solid #9AA3AD"></div>

     <path d="M8,14 L102,14 L90,78 L20,78 Z" fill="#E6E9EE" stroke="#9AA3AD" stroke-width="3" stroke-linejoin="round"/><rect x="4" y="10" width="102" height="8" rx="4" fill="#C5CBD3"/>`,'',1.3)}</div>`,g);
  const bloco=()=>el(`<div class="ab ico a" style="left:0;top:0;width:52px;height:52px;border-radius:12px;border:2px solid var(--a)">${ic('package',26)}</div>`,g);
  const bl=[bloco(),bloco()], BD=[[MX[0]-26,Y2+22],[MX[1]-26,Y2+22]], BB=[[MX[2]-58,Y2+18],[MX[2]+6,Y2+12]];
  const d2=desce(MX[2],Y2+140,46), e2=estq(MX[2],Y2+190,true);

    vis(L2,t,tds-.25,1e9,{dy:14}); vis(balde,t,tds+.1,1e9,{dy:10});
    bl.forEach((b,k)=>{const q=arco(b,t,tac+k*.18,.75,BD[k][0],BD[k][1],BB[k][0],BB[k][1],-70,k?14:-12); fixa(b,eo(pr(t,tdi-.15+k*.1,.45)))});
    vis(e2,t,tes-.15,1e9,{dy:8});

// ------------------------------------------------------------------ CAPS[13] · O estorno
// fala 4: "Nada é apagado: o histórico conta o que aconteceu, até o que foi desfeito." (as duas saídas já na tela no 1º
// quadro; o estorno entra como linha nova em "desfeito", nenhuma riscada; o saldo cresce 80 kg)
CAPS[13]=()=>{
  const i=I('ilu13_estorno'), g=grupo();
  const tit=titulo(g,'Estoque','O estorno');
  const lin=(y,data,tipo,v,verde)=>`<div class="ab row lh" style="left:0;top:${y}px;width:640px;height:88px;padding:0 28px;gap:18px;border-top:1px solid var(--l)">
     <span class="lbl" style="font-size:18px;width:64px">${data}</span>${tipo}
     <span class="num" style="font-size:27px;margin-left:auto;${verde?'color:var(--ve)':''}">${v}</span></div>`;
  const prod='<span class="tag c" style="font-size:16px;padding:6px 14px">Produção</span>';
  const hist=el(`<div class="card" style="left:110px;top:230px;width:640px;height:340px;overflow:hidden">
     <div class="row" style="height:76px;padding:0 28px;gap:14px;background:#FAFBFC">
       <div class="ico" style="width:44px;height:44px">${ic('history',24)}</div><div style="font-weight:800;font-size:22px">Fio de cobre encapado</div></div>
     ${lin(76,'03/11',prod,'−80 kg')}${lin(164,'03/11',prod,'−80 kg')}${lin(252,'10/11','<span style="font-weight:800;font-size:19px;color:var(--ve)">estorno</span>','+80 kg',1)}</div>`,g);
  const L=[...hist.querySelectorAll('.lh')];
  const selo=el(`<div class="ab" style="left:130px;top:0;width:600px;text-align:center"><div class="tag v">${ic('check',20)}nada é apagado</div></div>`,g);
  const pil=[0,1,2,3].map(k=>el(`<div class="ab row" style="left:880px;top:${520-k*52}px;width:240px;height:46px;border-radius:10px;background:#E6E9EE;border:2px solid #C5CBD3;
     justify-content:center;gap:14px">${[0,1,2,3].map(()=>FIO(.5)).join('')}</div>`,g));
  const novo=el(`<div class="ab" style="left:880px;top:${520-4*52}px;width:240px;height:46px;border-radius:10px;background:var(--vm);border:2px solid var(--v);
     display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px">+80 kg</div>`,g);
  const sal=el(`<div class="ab" style="left:880px;top:578px;width:240px;text-align:center"><div class="lbl" style="font-size:18px">saldo</div></div>`,g);
  return t=>{
    const [A]=janela(i);
    const tap=W(4,'apagado'), thi=W(4,'historico'), tde=W(4,'desfeito');
    posTitulo(tit,t,A-1.4,A-.75);
    vis(hist,t,A-.6,1e9,{dy:16}); vis(L[0],t,A-.6,1e9,{dy:0}); vis(L[1],t,A-.6,1e9,{dy:0});
    pil.forEach(p=>vis(p,t,A-.6,1e9,{dy:10})); vis(sal,t,A-.6,1e9,{dy:6});
    // o cartão cresce uma linha quando o estorno entra; o selo acompanha a borda de baixo
    const cr=eio(pr(t,tde-.3,.5)), hh=lerp(252,340,cr); hist.style.height=hh.toFixed(2)+'px'; selo.style.top=(230+hh+24).toFixed(2)+'px';
    vis(selo,t,tap-.15,1e9,{dy:10,sc:.9}); pulse(hist,t,thi-.1,.02,.8);
