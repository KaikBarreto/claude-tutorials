<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- T18 · Ambiental: MTR e CDF: cenas de conceito (cópia do kit perfis/ecoflix/cenas/cenas_ecoflix.html, com os dois
     exemplos tirados e os CAPS desta aula). 1280x800 CSS, quadro a quadro pelo render_cenas.cjs; tudo é função do tempo e
     cada mudança presa a uma palavra da fala (W(linha, 'palavra')), lida do tempos/capNN.json (estimado até a voz chegar).
     Janelas de cada cena: ilustracoes.json (de/ate/cauda). Sem documento oficial desenhado, sem brasão nem marca de órgão;
     a cena não ensina norma ambiental: mostra o que a fala diz. -->
<style>
@font-face{font-family:M;font-weight:500;src:url(../../../web/fonts/montserrat-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:600;src:url(../../../web/fonts/montserrat-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:700;src:url(../../../web/fonts/montserrat-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:800;src:url(../../../web/fonts/montserrat-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:500;src:url(../../../web/fonts/montserrat-latin-ext-500-normal.woff2) format('woff2');unicode-range:U+0100-024F}
@font-face{font-family:M;font-weight:700;src:url(../../../web/fonts/montserrat-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-024F}
/* ---------------------------------------------------------------- paleta EcoFlix (marca: acento #50D088, escuro #121212)
   --v  acento: preenchimentos, barras, contornos de destaque (nunca texto sobre branco: contraste baixo)
   --ve verde escuro: texto e ícone verde sobre branco (contraste 5,0)   --vc verde claro: fundo de ícone/resultado
   --a  âmbar: o SEGUNDO conceito da cena (ex.: competência x caixa)     --ae texto âmbar (5,9)   --ac âmbar claro
   --t  texto (o escuro da marca)   --c texto secundário (4,8)   --l linhas   --e painel escuro (mostrador) */
:root{--v:#50D088;--ve:#2E7D57;--vc:#EAF8F0;--vm:#A9E9C6;--a:#F2B63D;--ae:#8A5A00;--ac:#FFF5DF;
  --t:#121212;--c:#6B7280;--l:#E6E9EE;--e:#121212}
*{box-sizing:border-box;margin:0;padding:0;transition:none!important;animation:none!important}
html,body{width:1280px;height:800px;overflow:hidden;background:#fff}
body{font-family:M,sans-serif;color:var(--t);-webkit-font-smoothing:antialiased}
#st{position:absolute;inset:0;overflow:hidden;background:
  radial-gradient(1100px 650px at 92% -12%,rgba(80,208,136,.09),transparent 62%),
  radial-gradient(900px 600px at -12% 112%,rgba(80,208,136,.06),transparent 60%),#fff}
.eco-grupo{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:640px 400px}
.ab{position:absolute}
.row{display:flex;align-items:center}
/* título da cena: área (kicker) + conceito; sozinho fica grande no centro e sobe quando o desenho entra */
.kick{font-weight:700;font-size:15px;letter-spacing:.3em;color:var(--ve);text-transform:uppercase}
.h{font-weight:800;font-size:46px;letter-spacing:-.01em;line-height:1.1}
/* cartão, chip, etiqueta, ícone */
.card{position:absolute;background:#fff;border:1px solid #E1E8E4;border-radius:18px;
  box-shadow:0 18px 40px rgba(16,24,40,.10),0 3px 8px rgba(16,24,40,.06)}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:100%;height:100%}
.ico{display:flex;align-items:center;justify-content:center;flex:none;border-radius:14px;background:var(--vc);color:var(--ve)}
.ico.a{background:var(--ac);color:var(--ae)}
.tag{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;font-weight:800;font-size:20px;white-space:nowrap}
.tag.v{background:var(--vc);color:var(--ve)} .tag.a{background:var(--ac);color:var(--ae)}
.lbl{font-weight:700;font-size:17px;color:var(--c)}
.num{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.op{position:absolute;width:60px;height:60px;border-radius:50%;background:#F2F4F7;color:var(--t);display:flex;
  align-items:center;justify-content:center;font-weight:800;font-size:34px;line-height:1}
/* mostrador da balança (painel escuro, número no acento) */
.most{background:var(--e);border-radius:16px;padding:16px 22px 18px;box-shadow:0 16px 34px rgba(16,24,40,.22)}
.most .ml{position:relative;height:20px;font-weight:700;font-size:15px;letter-spacing:.22em;color:#A9E9C6;text-transform:uppercase}
.most .ml span{position:absolute;left:0;top:0;white-space:nowrap}
.most .mn{margin-top:6px;font-weight:800;font-size:44px;color:var(--v);font-variant-numeric:tabular-nums;white-space:nowrap}
.rip{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:3px solid var(--v);opacity:0}
</style><style id="saturado">/* estilo saturado (Kaik, 11/11): selo, chip, etiqueta, quadrado de ícone e círculo de etapa
   com fundo cheio e ícone/texto branco; nunca fundo claro com conteúdo colorido, nunca ícone escuro sobre o verde */
:root{--vs:#50D088;--as:#F2B63D;--rs:#EF4444}
.ico{background:var(--vs);color:#fff}.ico.a{background:var(--as);color:#fff}
.tag.v{background:var(--vs);color:#fff}.tag.a{background:var(--as);color:#fff}
</style></head>
<body><div id="st"></div>
<script>
// ------------------------------------------------------------------ utilidades (as do cenas_modelo.html + as da EcoFlix)
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const pr=(t,a,d=.45)=>cl((t-a)/d);
const lerp=(a,b,p)=>a+(b-a)*p;
const $=s=>document.querySelector(s);
const ST=document.getElementById('st');
function el(html,parent=ST){const d=document.createElement('div');d.innerHTML=html.trim();let f=null;for(const n of [...d.childNodes]){parent.appendChild(n);if(!f&&n.nodeType===1)f=n}return f}
function grupo(){return el('<div class="eco-grupo"></div>')}
function ic(n,px,cor){const s=(window.ICONS||{})[n]||'';return `<span class="ic" style="width:${px}px;height:${px}px;${cor?'color:'+cor:''}">${s}</span>`}
function hex(c){c=c.replace('#','');return[0,2,4].map(i=>parseInt(c.substr(i,2),16))}
function mix(a,b,p){const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*cl(p))).join(',')})`}
// aparece em a, some em b (opacidade + leve subida + escala): a entrada e a saída suaves de tudo
function vis(e,t,a,b=1e9,o={}){
  const din=o.din??.5,dout=o.dout??.4,dy=o.dy??16,dx=o.dx??0,sc=o.sc??.985;
  const p=eo(pr(t,a,din)),q=1-eo(pr(t,b,dout)),op=Math.min(p,q);
  e.style.opacity=op.toFixed(4);e.style.visibility=op<=.001?'hidden':'visible';
  const s=sc+(1-sc)*p - (1-q)*(1-sc);
  e.style.transform=`translate(${((1-p)*dx).toFixed(2)}px,${((1-p)*dy-(1-q)*dy*.5).toFixed(2)}px) scale(${s.toFixed(4)})`;
  return op;
}
function ripple(r,t,a){const p=pr(t,a,.7);r.style.opacity=(p>0&&p<1)?(.6*(1-p)).toFixed(3):0;r.style.transform=`scale(${(.4+2.0*eo(p)).toFixed(3)})`}
function pulse(e,t,a,amp=.045,dur=.9){
  const p=pr(t,a,dur),f=(p>0&&p<1)?1+amp*Math.sin(Math.PI*p):1,c=e.style.transform;
  const meu=e._pw!==undefined&&c===e._pw, base=meu?e._pb:c;
  if(!meu||e._pt!==t)e._pm={};                       // quadro novo (ou o transform foi reescrito): recomeça os pulsos
  e._pm[`${a}|${amp}|${dur}`]=f;e._pt=t;e._pb=base;  // a mesma chamada repetida no mesmo t não se acumula
  let k=1;for(const v of Object.values(e._pm))k*=v;
  e.style.transform=k===1?base:(base?base+' ':'')+`scale(${k.toFixed(4)})`;e._pw=e.style.transform}
function digita(e,txt,t,a,b){const p=cl((t-a)/Math.max(.05,b-a));const n=Math.round(p*txt.length);
  const car=(p>0&&p<1)||(Math.floor(t*2.2)%2===0&&p<1.2&&t>=a)?'<span style="color:var(--v);font-weight:500">|</span>':'';
  e.innerHTML=(txt.slice(0,n)||'')+(t>=a&&t<b+.8?car:'');}
// EcoFlix: números e dinheiro no jeito brasileiro; contagem suave de um número; traço que se desenha; arco; contorno
const NF=new Intl.NumberFormat('pt-BR');
const kg=v=>NF.format(Math.round(v))+' kg';
const brl=v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function conta(e,t,a,d,v0,v1,fmt=kg){const p=eo(pr(t,a,d));const s=fmt(lerp(v0,v1,p));if(e.textContent!==s)e.textContent=s;return p}
function traco(p,t,a,d=.8){if(!p._L){p._L=p.getTotalLength();p.style.strokeDasharray=p._L}const q=eio(pr(t,a,d));p.style.strokeDashoffset=(p._L*(1-q)).toFixed(2);p.style.opacity=q>0?1:0;return q}
function arco(e,t,a,d,x0,y0,x1,y1,h=-80,rot=0){const p=eio(pr(t,a,d));const x=lerp(x0,x1,p),y=lerp(y0,y1,p)+h*4*p*(1-p);
  e.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${(rot*p).toFixed(2)}deg)`;return p}
function contorno(e,t,a,de,para,d=.45){e.style.borderColor=mix(de,para,eo(pr(t,a,d)))}
// título padrão da cena: grande no centro enquanto está sozinho, sobe para o alto quando o desenho entra (em "sobe")
function titulo(g,kick,txt){return el(`<div class="ab" style="left:0;top:0;width:1280px;text-align:center">
  <div class="kick">${kick}</div><div class="h" style="margin-top:12px">${txt}</div></div>`,g)}
function posTitulo(e,t,a,sobe,sai=1e9){vis(e,t,a,sai,{dy:14});const p=eio(pr(t,sobe,.7));
  e.style.top=lerp(318,46,p).toFixed(2)+'px';e.style.scale=lerp(1.12,1,p).toFixed(4)}

// ------------------------------------------------------------------ tempos da fala (capNN.json do proc.py ou estimado)
let D=null;
const norm=w=>w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9%./-]+/g,'');
function W(linha,palavra,n=1,campo='s'){
  const alvo=norm(palavra);let k=0;
  for(const w of D.words){if(w.linha===linha&&norm(w.w).replace(/[.,]$/,'')===alvo){k++;if(k===n)return w[campo]}}
  for(const w of D.words){if(w.linha===linha&&norm(w.w).startsWith(alvo)){k++;if(k>=n)return w[campo]}}
  console.warn('palavra não achada',linha,palavra);return L(linha);
}
const L=i=>(D.linhas[i]||{s:0}).s, LE=i=>(D.linhas[i]||{e:D.dur}).e;

// ------------------------------------------------------------------ desenhos genéricos (sem marca)
// caminhão de lado (frente para a direita), com a carga de sucata em pedaços (.pd) que podem ser descarregados
function caminhao(){
  const pd=[ // [forma, cor, centro da peça, destino no monte atrás do caminhão (deslocamento do centro e giro)]
    ['<polygon points="28,90 44,52 88,42 100,90"/>','#8C5A3C',[64,66],[-224,148,6]],
    ['<polygon points="82,90 102,36 146,48 154,90"/>','#6F7983',[118,63],[-318,122,12]],
    ['<rect x="118" y="44" width="112" height="16" rx="8" transform="rotate(-8 174 52)"/>','#9AA3AD',[174,52],[-334,98,-18]],
    ['<polygon points="148,90 170,54 212,44 232,90"/>','#A0694A',[190,67],[-425,148,-8]],
    ['<polygon points="210,90 232,40 276,54 286,90"/>','#4F5861',[248,65],[-373,120,-10]],
    ['<polygon points="258,90 282,60 308,66 312,90"/>','#8A949E',[285,75],[-375,148,4]],
    ['<g><circle cx="192" cy="64" r="19"/><circle cx="192" cy="64" r="7" fill="#8A949E"/></g>','#5E6670',[192,64],[-242,155,200]],
    ['<polygon points="40,70 60,50 84,64 64,86"/>','#B07A55',[62,68],[-307,100,30]]];
  const pecas=pd.map(([f,c,[cx,cy],[dx,dy,r]])=>`<g class="pd" data-cx="${cx}" data-cy="${cy}" data-dx="${dx}" data-dy="${dy-16}" data-r="${r}" fill="${c}">${f}</g>`).join('');
  const roda=x=>`<g class="roda" data-x="${x}" transform="translate(${x},196)"><circle r="26" fill="#1B1F24"/><circle r="12" fill="#9AA3AD"/>
    <rect x="-2.5" y="-23" width="5" height="10" rx="2" fill="#5B636C"/><rect x="-2.5" y="13" width="5" height="10" rx="2" fill="#5B636C"/></g>`;
  return `<svg viewBox="0 0 500 230" width="500" height="230" style="overflow:visible">
    <g class="carga">${pecas}</g>
    <rect x="18" y="86" width="304" height="88" rx="6" fill="#7E8994"/>
    <rect x="16" y="82" width="308" height="11" rx="4" fill="#68727D"/>
    <g stroke="#707A85" stroke-width="3">${[78,138,198,258].map(x=>`<line x1="${x}" y1="98" x2="${x}" y2="168"/>`).join('')}</g>
    <path d="M334,176 L334,76 Q334,64 346,64 L412,64 L462,116 L472,121 Q480,124 480,134 L480,176 Z" fill="#2F3640"/>
    <path d="M348,78 L406,78 L444,116 L348,116 Z" fill="#D7E5ED"/>
    <rect x="470" y="142" width="10" height="11" rx="2" fill="#F2B63D"/>
    <rect x="12" y="170" width="472" height="15" rx="4" fill="#23282E"/>
    ${roda(92)}${roda(158)}${roda(416)}
  </svg>`;
}

// ------------------------------------------------------------------ desenhos desta aula (T18), no traço do kit
// (faltavam no kit: chaparia, oficina, pátio de reciclagem, motorista, notebook, folha, pasta, placa; os mesmos da T17
// onde o desenho se repete: caminhão com outra carga, placa, pasta, seta)
function escala(svg,w){return svg.replace('width="500" height="230"',`width="${w}" height="${Math.round(w*230/500)}"`)}
function caminhaoCom(carga,tres4){let s=caminhao();const a=s.indexOf('<g class="carga">'),b=s.indexOf('<rect x="18" y="86"');
  s=s.slice(0,a)+`<g class="carga" style="transform-box:fill-box;transform-origin:center">${carga}</g>\n    `+s.slice(b);
  return tres4?s.replace(/<g class="roda" data-x="92"[\s\S]*?<\/g>/,''):s}         // 3/4: sem o eixo traseiro duplo
// chaparia: chapas empilhadas na caçamba
function cargaChaparia(){const cs=['#A3ACB6','#8E98A2','#B5BDC6','#97A1AB','#ADB5BE','#9AA3AD'];let s='';
  for(let i=0;i<7;i++){const y=81-i*7.5,x=28+(i%2)*9,w=280-(i%3)*12;
    s+=`<rect x="${x}" y="${y.toFixed(1)}" width="${w}" height="7" rx="2" fill="${cs[i%6]}" stroke="#6F7983" stroke-width="1.2" transform="rotate(${i%2?-.8:.6} ${x+w/2} ${y})"/>`}
  return s}
const placa=(p,px=18)=>`<div style="display:inline-flex;align-items:center;justify-content:center;padding:3px 12px;border:2.5px solid #1F2933;
  border-radius:7px;background:#fff;font-weight:800;font-size:${px}px;letter-spacing:.08em;color:#121212;white-space:nowrap">${p}</div>`;
function pastaSvg(w,cor='#F2B63D',cor2='#F7C964'){const h=Math.round(w*.77);return `<svg viewBox="0 0 120 92" width="${w}" height="${h}">
  <path d="M6 14 Q6 6 14 6 L44 6 L54 16 L106 16 Q114 16 114 24 L114 80 Q114 88 106 88 L14 88 Q6 88 6 80 Z" fill="${cor}"/>
  <path d="M6 30 L114 30 L114 80 Q114 88 106 88 L14 88 Q6 88 6 80 Z" fill="${cor2}"/></svg>`}
function seta(pai,x0,y0,x1,y1,cor='var(--v)',lw=4){const s=el(`<svg class="ab" style="left:0;top:0;overflow:visible" width="1280" height="800">
  <path d="M${x0} ${y0} L${x1} ${y1}" fill="none" stroke="${cor}" stroke-width="${lw}" stroke-linecap="round"/></svg>`,pai);
  const ang=Math.atan2(y1-y0,x1-x0),a1=ang+2.5,a2=ang-2.5,L=13;
  const ponta=el(`<svg class="ab" style="left:0;top:0;overflow:visible" width="1280" height="800"><path d="M${(x1+L*Math.cos(a1)).toFixed(1)} ${(y1+L*Math.sin(a1)).toFixed(1)} L${x1} ${y1} L${(x1+L*Math.cos(a2)).toFixed(1)} ${(y1+L*Math.sin(a2)).toFixed(1)}"
    fill="none" stroke="${cor}" stroke-width="${lw}" stroke-linecap="round" stroke-linejoin="round"/></svg>`,pai);
  return {p:s.querySelector('path'),ponta}}
function rodas(cam,x,esc=1){cam.querySelectorAll('.roda').forEach(r=>r.setAttribute('transform',`translate(${r.dataset.x},196) rotate(${(x/esc/26*57.3).toFixed(2)})`))}
function anel(e,t,a,rgba){e.style.boxShadow=`0 0 0 ${(5*eo(pr(t,a,.45))).toFixed(2)}px ${rgba},0 18px 40px rgba(16,24,40,.10),0 3px 8px rgba(16,24,40,.06)`}
const V0='#E1E8E4', VA='#50D088', AA='#F2B63D', RV='rgba(80,208,136,.25)', RA='rgba(242,182,61,.25)';
// oficina (o gerador do exemplo): galpão com porta de enrolar e a placa da chave; 200 x 150
function oficinaSvg(w=200){return `<svg viewBox="0 0 200 150" width="${w}" height="${Math.round(w*.75)}">
  <rect x="14" y="48" width="172" height="102" fill="#E3E7EC"/><polygon points="6,52 100,12 194,52" fill="#5E6B78"/>
  <rect x="44" y="76" width="80" height="74" fill="#9AA3AD"/>${[86,98,110,122,134].map(y=>`<rect x="44" y="${y}" width="80" height="3" fill="#7E8994"/>`).join('')}
  <rect x="140" y="80" width="32" height="26" rx="3" fill="#C9D5DE"/><rect x="138" y="58" width="40" height="14" rx="3" fill="#F2B63D"/></svg>`}
// pátio de reciclagem (o destinador): galpão aberto, cerca e montes de sucata; 220 x 150
function patioSvg(w=220){return `<svg viewBox="0 0 220 150" width="${w}" height="${Math.round(w*150/220)}">
  <rect x="96" y="40" width="118" height="110" fill="#E3E7EC"/><polygon points="88,44 155,14 222,44" fill="#5E6B78"/><rect x="112" y="70" width="86" height="80" fill="#C3CAD2"/>
  <g fill="#C9D0D7">${[4,34,64].map(x=>`<rect x="${x}" y="84" width="7" height="66" rx="3"/>`).join('')}<rect x="0" y="96" width="92" height="5" rx="2"/><rect x="0" y="120" width="92" height="5" rx="2"/></g>
  <polygon points="10,150 26,118 50,110 66,124 84,108 104,150" fill="#8A949E"/><polygon points="36,150 52,130 74,128 92,150" fill="#6F7983"/>
  <rect x="44" y="114" width="36" height="8" rx="4" transform="rotate(-12 62 118)" fill="#8C5A3C"/>
  <polygon points="120,150 134,126 156,120 172,132 190,150" fill="#7E8994"/></svg>`}
// motorista (de pé, braço à frente para segurar a folha); 120 x 220, a mão em (104, 118)
function motoristaSvg(){return `<svg viewBox="0 0 120 220" width="120" height="220" style="overflow:visible">
  <rect x="38" y="150" width="20" height="66" rx="8" fill="#2F3640"/><rect x="62" y="150" width="20" height="66" rx="8" fill="#2F3640"/>
  <rect x="30" y="64" width="60" height="96" rx="20" fill="#3E8E64"/>
  <path d="M78 84 Q104 96 104 118" fill="none" stroke="#3E8E64" stroke-width="16" stroke-linecap="round"/>
  <circle cx="104" cy="120" r="9" fill="#D9A47E"/>
  <circle cx="60" cy="36" r="24" fill="#D9A47E"/><path d="M34 32 Q36 8 60 8 Q86 8 86 30 L96 32 L96 36 L34 36 Z" fill="#2F3640"/></svg>`}
// notebook genérico (sem marca)
function notebookSvg(w=230){return `<svg viewBox="0 0 230 160" width="${w}" height="${Math.round(w*160/230)}">
  <rect x="26" y="8" width="178" height="118" rx="10" fill="#2F3640"/><rect x="36" y="18" width="158" height="98" rx="4" fill="#F3F5F7"/>
  <path d="M6 132 L224 132 L214 152 Q212 156 206 156 L24 156 Q18 156 16 152 Z" fill="#9AA3AD"/><rect x="94" y="136" width="42" height="6" rx="3" fill="#7E8994"/></svg>`}
// folha de documento: sigla, subtítulo e as linhas cinza
function folha(sigla,sub,cls='v',w=150,h=150){return `<div class="card" style="position:relative;width:${w}px;height:${h}px;border-radius:12px;padding:16px 18px">
  <div class="row" style="gap:8px"><div class="ico ${cls}" style="width:32px;height:32px;border-radius:9px">${ic('file-text',18)}</div>
    <div style="font-weight:800;font-size:21px;color:var(--${cls}e)">${sigla}</div></div>
  ${sub?`<div class="sub" style="margin-top:10px;font-weight:700;font-size:15px;line-height:1.3">${sub}</div>`:''}
  ${[0,1].map(i=>`<div style="margin-top:${i?8:12}px;height:8px;border-radius:4px;background:#E9ECEF;width:${[w-50,w-76][i]}px"></div>`).join('')}</div>`}
// a pasta da licença (cap02 e cap08)

  const F1=faixa(492,'Recicla Vale','Aços Quiririm','geradora','e','MTR','v'), F2=faixa(628,'Auto Peças Vale Forte','Recicla Vale','destinadora','d','CDF','a');

  const P0=[[110,250],[110,410]], P1=[[380,250],[440,276]];

          tpe=W(1,'pedidos'), tju=W(1,'juntos');
    posTitulo(tit,t,at-.6,tli-.35);

    // o MTR e o CDF entram e vão para a pasta da licença
    const q1=arco(dM,t,tmo-.1,1.0,P0[0][0],P0[0][1],P1[0][0],P1[0][1],-70,-6), q2=arco(dC,t,tmo+.15,1.0,P0[1][0],P0[1][1],P1[1][0],P1[1][1],-70,5);
    vis(dM.firstElementChild,t,tm-.15,1e9,{dy:14}); vis(dC.firstElementChild,t,tc-.15,1e9,{dy:14});

    // a fiscalização pede os dois juntos

        <span class="row" style="color:var(--ve)">${ic('file-text',16)}</span><div style="font-weight:800;font-size:15px;color:var(--ve)">MTR</div></div>
        <div class="ab ok" style="right:-14px;top:-12px"><div class="ico" style="width:26px;height:26px;border-radius:50%;background:var(--vs);color:#fff">${ic('check',17)}</div></div></div></div>`,g);

  const bx=el(`<div class="ab" style="left:975px;top:446px;width:300px;text-align:center"><div class="tag v" style="font-size:16px;padding:6px 13px">${ic('circle-check',18)}baixa no SIGOR</div></div>`,g);
  const cdf=el(`<div class="ab" style="left:1010px;top:520px;width:170px">${folha('CDF','outubro','a',170,150)}</div>`,g);
  const liga=el(`<svg class="ab" style="left:0;top:0;overflow:visible" width="1280" height="800"><g fill="none" stroke="#F2B63D" stroke-width="3" stroke-linecap="round">
      ${YS.map(y=>`<path d="M${XB+112} ${y-26} C ${XB+150} ${y-26}, 960 560, 1006 590"/>`).join('')}</g></svg>`,g);
  const ligas=[...liga.querySelectorAll('path')];

  return t=>{
    const at=W(1,'Em')-.3, tou=W(1,'outubro'), tau=W(1,'Auto'), tcg=W(1,'cargas'), tcc=W(1,'ca'), tm=W(1,'MTR'), trv=W(1,'Recicla'), tre=W(1,'recebeu'), tbx=W(1,'baixa');

    pistas.forEach(({p,c,ok},i)=>{

      const q=eio(pr(t,tcg+i*.35,1.6)), x=lerp(XA,XB,q); c.style.left=x.toFixed(1)+'px'; rodas(c,x-XA,.26);
      vis(c,t,tcg-.15+i*.2,1e9,{dx:-20,dy:0}); vis(c.querySelector('.mt'),t,tm-.15+i*.15,1e9,{dy:6,sc:.8});

    vis(bx,t,tbx-.15,1e9,{dy:8});
    vis(cdf,t,tcd-.15,1e9,{dy:16}); pulse(cdf,t,to2,.05,.8);

// ------------------------------------------------------------------ CAPS[9] · Uma carga, três documentos
// fala 1 "São três documentos da mesma carga, cada um com o seu papel. A nota fiscal é a venda, e vai pra SEFAZ. O MTR é o
// transporte do resíduo, e vai pro órgão ambiental."  2 "E o CDF vem depois, do destinador, confirmando o destino."
// 3 "Eles são independentes: cada um é emitido na sua tela. O que o MTR aproveita da nota é o que a gente viu: os itens,
// pelo Puxar da nota fiscal, e a chave, na observação."   janela: de "São" (1) até o fim de "observação" (3)
CAPS[9]=()=>{
  const g=grupo();
  const tit=titulo(g,'Nota fiscal','Uma carga, três documentos');
  const cam=el(`<div class="ab" style="left:44px;top:${470-140}px;width:320px;height:147px">${escala(caminhaoCom(cargaChaparia(),true),320)}</div>`,g);
  const chao=el('<div class="ab" style="left:40px;top:470px;width:340px;height:5px;border-radius:3px;background:#E3E7EC"></div>',g);
  const pl=el(`<div class="ab" style="left:150px;top:488px">${placa('GHT7B19',17)}</div>`,g);
  const ROW=[[178,'v','NF-e','a venda','SEFAZ','em Notas Fiscais'],[338,'v','MTR','o transporte do resíduo','órgão ambiental','em Ambiental'],
             [498,'a','CDF','o destino','','do destinador']];
  const docs=ROW.map(([y,cls,sig,papel,para,onde],i)=>{const c=el(`<div class="card" style="left:${i===2?520:460}px;top:${y}px;width:${i===2?600:660}px;height:118px">
      <div class="ab row" style="left:24px;top:18px;gap:14px"><div class="ico ${cls}" style="width:50px;height:50px">${ic('file-text',27)}</div>
        <div style="font-weight:800;font-size:28px;color:var(--${cls}e)">${sig}</div>
        <div class="pp" style="font-weight:700;font-size:20px;white-space:nowrap">${papel}</div></div>
      ${para?`<div class="ab row para" style="left:88px;top:76px;gap:10px"><span class="row" style="color:#9AA3AD">${ic('arrow-right',20)}</span>
        <div class="tag" style="font-size:15px;padding:5px 12px;background:#4B5563;color:#fff">${ic('landmark',16)}${para}</div></div>`:''}
      <div class="ab lbl onde" style="right:24px;top:30px;font-size:17px;color:#4B5563;white-space:nowrap">${onde}</div></div>`,g);
    return c});
  const depois=el(`<div class="ab" style="left:608px;top:${498+74}px"><div class="tag a" style="font-size:15px;padding:5px 12px">${ic('clock',16)}depois</div></div>`,g);
  const ramos=el(`<svg class="ab" style="left:0;top:0;overflow:visible" width="1280" height="800"><g fill="none" stroke="#C9D2DA" stroke-width="3" stroke-linecap="round">
      <path d="M368 382 C 410 382, 410 237, 456 237"/><path d="M368 400 L 456 397"/><path d="M368 418 C 440 418, 450 557, 516 557"/></g></svg>`,g);
  const rs=[...ramos.querySelectorAll('path')];
  // o que o MTR aproveita da nota: os itens e a chave (seta da NF-e para o MTR, do lado direito)
  const apr=el(`<svg class="ab" style="left:0;top:0;overflow:visible" width="1280" height="800"><path d="M1124 238 C 1176 238, 1176 396, 1132 396" fill="none" stroke="var(--v)" stroke-width="4" stroke-linecap="round"/>
      <path d="M1142 387 L1131 396 L1142 405" fill="none" stroke="var(--v)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,g);
  const ap=apr.querySelector('path');
  const it=el(`<div class="ab" style="left:1180px;top:270px"><div class="tag v ti" style="font-size:15px;padding:5px 11px">itens</div>
      <div class="tag v tc" style="margin-top:10px;font-size:15px;padding:5px 11px">chave</div></div>`,g);

  return t=>{
    const at=W(1,'Sao')-.3, tdc=W(1,'documentos'), tca=W(1,'carga'), tno=W(1,'nota'), tve=W(1,'venda'), tse=W(1,'SEFAZ'), tm=W(1,'MTR'), ttr=W(1,'transporte'),
          tor=W(1,'orgao'), tcd=W(2,'CDF'), tdp=W(2,'depois'), tds=W(2,'destinador'), tdt=W(2,'destino'),
          tin=W(3,'independentes'), tte=W(3,'tela'), tap=W(3,'aproveita'), tit_=W(3,'itens'), tch=W(3,'chave');
    posTitulo(tit,t,at-.6,tca-.35);
    vis(cam,t,tca-.15,1e9,{dx:-24,dy:0}); vis(chao,t,tca-.15,1e9,{dy:6}); vis(pl,t,tca,1e9,{dy:8});
    const [dN,dM,dC]=docs;
    vis(dN,t,tno-.15,1e9,{dx:20,dy:0}); traco(rs[0],t,tno-.15,.5); vis(dN.querySelector('.pp'),t,tve-.15,1e9,{dx:-8,dy:0}); vis(dN.querySelector('.para'),t,tse-.2,1e9,{dx:-8,dy:0});
    vis(dM,t,tm-.15,1e9,{dx:20,dy:0}); traco(rs[1],t,tm-.15,.5); vis(dM.querySelector('.pp'),t,ttr-.15,1e9,{dx:-8,dy:0}); vis(dM.querySelector('.para'),t,tor-.2,1e9,{dx:-8,dy:0});
    vis(dC,t,tcd-.15,1e9,{dx:20,dy:0}); traco(rs[2],t,tcd-.15,.5); vis(dC.querySelector('.pp'),t,tdt-.15,1e9,{dx:-8,dy:0});
    vis(depois,t,tdp-.15,1e9,{dy:8}); vis(dC.querySelector('.onde'),t,tds-.15,1e9,{dx:-8,dy:0});
    // cada um na sua tela; o MTR aproveita os itens e a chave da nota
    vis(dN.querySelector('.onde'),t,tte-.25,1e9,{dx:-8,dy:0}); vis(dM.querySelector('.onde'),t,tte-.05,1e9,{dx:-8,dy:0});
    pulse(dN,t,tin,.02,.8); pulse(dM,t,tin+.15,.02,.8); pulse(dC,t,tin+.3,.02,.8);
    traco(ap,t,tap-.1,.6); vis(apr.lastElementChild,t,tap+.4,1e9,{dy:0,din:.25}); vis(it.querySelector('.ti'),t,tit_-.15,1e9,{dx:-8,dy:0}); vis(it.querySelector('.tc'),t,tch-.15,1e9,{dx:-8,dy:0});
  };
};
