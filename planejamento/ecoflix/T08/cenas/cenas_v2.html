<!-- PILOTO DO KIT 2D V2 (refino de motion, 18/11; perfis/ecoflix/cenas3d/MOTION_V2.md): o cenas.html desta aula com os
     blocos "KIT 2D V2" colados no fim (todas as cenas ganham o acabamento e as curvas novas sem mudança) e o CAPS[7]
     "Só no Finalizar" redesenhado com o que o kit traz de novo (V2.foco, V2.curso, V2.sobre, V2.golpe, V2.passa).
     Mesmos textos e rótulos do cenas.html; as âncoras são as palavras da mesma fala.
     T08 "Ticket de Pesagem" · ilustrações de conceito (kit perfis/ecoflix/cenas/cenas_ecoflix_v2.html).
     Uma janela por capítulo (ilustracoes.json): cap00 peso agora, preço depois · cap01 compra direta × ticket ·
     cap03 o rascunho salvo sozinho · cap04 entrada e saída (o desenho do kit "Tara e peso líquido") · cap05 a conta do
     líquido (os cartões do mesmo desenho) · cap06 uma aba por caminhão · cap07 só no Finalizar · cap08 pesagens mescladas.
     Tudo função do tempo, preso às falas do narracao/tts_textos.py com W(linha, 'palavra').
     Render só do trecho: node render_cenas.cjs <cap> capNN.json saida.mp4 --html cenas.html --de <at> --ate <at+dur>.
     Utilidades novas (faltavam no kit): kgd() (kg com casas), setaD(), caminhao(cores, cabine, vazio), balanca(), no(). -->
<style>

<script>
// ------------------------------------------------------------------ utilidades (as do kit, sem mudança)
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const pr=(t,a,d=.45)=>cl((t-a)/d);
const lerp=(a,b,p)=>a+(b-a)*p;
const $=s=>document.querySelector(s);
const ST=document.getElementById('st');
function el(html,parent=ST){const d=document.createElement('div');d.innerHTML=html.trim();let f=null;for(const n of [...d.childNodes]){parent.appendChild(n);if(!f&&n.nodeType===1)f=n}return f}
function grupo(){return el('<div class="eco-grupo"></div>')}
function ic(n,px,cor){const s=(window.ICONS||{})[n]||'';return `<span class="ic" style="width:${px}px;height:${px}px;${cor?'color:'+cor:''}">${s}</span>`}
function hex(c){c=c.replace('#','');return[0,2,4].map(i=>parseInt(c.substr(i,2),16))}
function mix(a,b,p){const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*cl(p))).join(',')})`}
function vis(e,t,a,b=1e9,o={}){
  const din=o.din??.5,dout=o.dout??.4,dy=o.dy??16,dx=o.dx??0,sc=o.sc??.985;
  const p=eo(pr(t,a,din)),q=1-eo(pr(t,b,dout)),op=Math.min(p,q);
  e.style.opacity=op.toFixed(4);e.style.visibility=op<=.001?'hidden':'visible';
  const s=sc+(1-sc)*p - (1-q)*(1-sc);
  e.style.transform=`translate(${((1-p)*dx).toFixed(2)}px,${((1-p)*dy-(1-q)*dy*.5).toFixed(2)}px) scale(${s.toFixed(4)})`;
  return op;
}
function ripple(r,t,a){const p=pr(t,a,.7);r.style.opacity=(p>0&&p<1)?(.6*(1-p)).toFixed(3):0;r.style.transform=`scale(${(.4+2.0*eo(p)).toFixed(3)})`}
function pulse(e,t,a,amp=.045,dur=.9){
  const p=pr(t,a,dur),f=(p>0&&p<1)?1+amp*Math.sin(Math.PI*p):1,c=e.style.transform;
  const meu=e._pw!==undefined&&c===e._pw, base=meu?e._pb:c;
  if(!meu||e._pt!==t)e._pm={};                       // quadro novo (ou o transform foi reescrito): recomeça os pulsos
  e._pm[`${a}|${amp}|${dur}`]=f;e._pt=t;e._pb=base;  // a mesma chamada repetida no mesmo t não se acumula
  let k=1;for(const v of Object.values(e._pm))k*=v;
  e.style.transform=k===1?base:(base?base+' ':'')+`scale(${k.toFixed(4)})`;e._pw=e.style.transform}
const NF=new Intl.NumberFormat('pt-BR');
const kg=v=>NF.format(Math.round(v))+' kg';
const brl=v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function conta(e,t,a,d,v0,v1,fmt=kg){const p=eo(pr(t,a,d));const s=fmt(lerp(v0,v1,p));if(e.textContent!==s)e.textContent=s;return p}
function traco(p,t,a,d=.8){if(!p._L){p._L=p.getTotalLength();p.style.strokeDasharray=p._L}const q=eio(pr(t,a,d));p.style.strokeDashoffset=(p._L*(1-q)).toFixed(2);p.style.opacity=q>0?1:0;return q}
function arco(e,t,a,d,x0,y0,x1,y1,h=-80,rot=0){const p=eio(pr(t,a,d));const x=lerp(x0,x1,p),y=lerp(y0,y1,p)+h*4*p*(1-p);
  e.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${(rot*p).toFixed(2)}deg)`;return p}
function contorno(e,t,a,de,para,d=.45){e.style.borderColor=mix(de,para,eo(pr(t,a,d)))}
function titulo(g,kick,txt){return el(`<div class="ab" style="left:0;top:0;width:1280px;text-align:center">
  <div class="kick">${kick}</div><div class="h" style="margin-top:12px">${txt}</div></div>`,g)}
function posTitulo(e,t,a,sobe,sai=1e9){vis(e,t,a,sai,{dy:14});const p=eio(pr(t,sobe,.7));
  e.style.top=lerp(318,46,p).toFixed(2)+'px';e.style.scale=lerp(1.12,1,p).toFixed(4)}
// ------------------------------------------------------------------ utilidades desta aula (faltavam no kit)
const NFd=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:3});
const kgd=v=>NFd.format(v)+' kg';                       // kg com casas: 21,6 kg (o kg() do kit arredonda)
const kg1=v=>v.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+' kg';   // contagem com uma casa
// seta (linha + ponta) num só <path>, para o traco() desenhar a ponta por último
function setaD(x1,y1,x2,y2,h=13){const a=Math.atan2(y2-y1,x2-x1),f=s=>`${(x2-h*Math.cos(a+s*.55)).toFixed(1)} ${(y2-h*Math.sin(a+s*.55)).toFixed(1)}`;
  return `M${x1} ${y1} L${x2} ${y2} M${f(1)} L${x2} ${y2} L${f(-1)}`}
function svgTela(pai){return el('<svg class="ab" style="left:0;top:0;overflow:visible" width="1280" height="800"></svg>',pai)}
function caminho(sv,d,cor='var(--v)',w=4,extra=''){const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke',cor);p.setAttribute('stroke-width',w);
  p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');if(extra)p.setAttribute('stroke-dasharray',extra);
  p.style.opacity=0;sv.appendChild(p);return p}
// linha tracejada que se desenha (o traco() usa o dasharray): revela por clip
function tracejado(p,t,a,d=.7){const q=eio(pr(t,a,d));p.style.opacity=q>0?1:0;p.style.clipPath=`inset(0 ${((1-q)*100).toFixed(2)}% 0 0)`;return q}
// linha reta que cresce do começo ao fim mudando o próprio "d" (mantém o tracejado; serve para linha vertical)
function linhaParcial(p,t,a,d,x0,y0,x1,y1){const q=eio(pr(t,a,d));p.setAttribute('d',`M${x0} ${y0} L${lerp(x0,x1,q).toFixed(2)} ${lerp(y0,y1,q).toFixed(2)}`);
  p.style.opacity=q>0?1:0;return q}

// ------------------------------------------------------------------ tempos da fala
let D=null;
const norm=w=>w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9%./-]+/g,'');
function W(linha,palavra,n=1,campo='s'){
  const alvo=norm(palavra);let k=0;
  for(const w of D.words){if(w.linha===linha&&norm(w.w).replace(/[.,]$/,'')===alvo){k++;if(k===n)return w[campo]}}
  for(const w of D.words){if(w.linha===linha&&norm(w.w).startsWith(alvo)){k++;if(k>=n)return w[campo]}}
  console.warn('palavra não achada',linha,palavra);return L(linha);
}
const L=i=>(D.linhas[i]||{s:0}).s, LE=i=>(D.linhas[i]||{e:D.dur}).e;

// ------------------------------------------------------------------ desenhos genéricos (sem marca)
const PECAS=[ // [forma, cor, centro da peça, destino no monte atrás do veículo] (as do kit)
  ['<polygon points="28,90 44,52 88,42 100,90"/>','#8C5A3C',[64,66],[-224,148,6]],
  ['<polygon points="82,90 102,36 146,48 154,90"/>','#6F7983',[118,63],[-318,122,12]],
  ['<rect x="118" y="44" width="112" height="16" rx="8" transform="rotate(-8 174 52)"/>','#9AA3AD',[174,52],[-334,98,-18]],
  ['<polygon points="148,90 170,54 212,44 232,90"/>','#A0694A',[190,67],[-425,148,-8]],
  ['<polygon points="210,90 232,40 276,54 286,90"/>','#4F5861',[248,65],[-373,120,-10]],
  ['<polygon points="258,90 282,60 308,66 312,90"/>','#8A949E',[285,75],[-375,148,4]],
  ['<g><circle cx="192" cy="64" r="19"/><circle cx="192" cy="64" r="7" fill="#8A949E"/></g>','#5E6670',[192,64],[-242,155,200]],
  ['<polygon points="40,70 60,50 84,64 64,86"/>','#B07A55',[62,68],[-307,100,30]]];
// cores da carga: latinha (alumínio) e bateria; sem lista, as do kit (ferro)
const LATINHA=['#C9D1D9','#AEB8C2','#DDE3E8','#B8C2CC','#9AA6B2','#CDD5DD','#A5B0BB','#D5DCE3'];
const BATERIA=['#3D4651','#2F3640','#4F5861','#23282E','#3D4651','#2F3640','#4F5861','#2F3640'];
// o caminhão do kit (frente para a direita), com a cor da carga e da cabine; vazio = sem carga
function caminhao(cores,cabine='#2F3640',vazio=false){
  const pecas=vazio?'':PECAS.map(([f,c,[cx,cy],[dx,dy,r]],i)=>`<g class="pd" data-cx="${cx}" data-cy="${cy}" data-dx="${dx}" data-dy="${dy-16}" data-r="${r}" fill="${cores?cores[i]:c}">${f}</g>`).join('');
  const roda=x=>`<g class="roda" data-x="${x}" transform="translate(${x},196)"><circle r="26" fill="#1B1F24"/><circle r="12" fill="#9AA3AD"/>
    <rect x="-2.5" y="-23" width="5" height="10" rx="2" fill="#5B636C"/><rect x="-2.5" y="13" width="5" height="10" rx="2" fill="#5B636C"/></g>`;
  return `<svg viewBox="0 0 500 230" width="500" height="230" style="overflow:visible">
    <g class="carga">${pecas}</g>
    <rect x="18" y="86" width="304" height="88" rx="6" fill="#7E8994"/>
    <rect x="16" y="82" width="308" height="11" rx="4" fill="#68727D"/>
    <g stroke="#707A85" stroke-width="3">${[78,138,198,258].map(x=>`<line x1="${x}" y1="98" x2="${x}" y2="168"/>`).join('')}</g>
    <path d="M334,176 L334,76 Q334,64 346,64 L412,64 L462,116 L472,121 Q480,124 480,134 L480,176 Z" fill="${cabine}"/>
    <path d="M348,78 L406,78 L444,116 L348,116 Z" fill="#D7E5ED"/>
    <rect x="470" y="142" width="10" height="11" rx="2" fill="#F2B63D"/>
    <rect x="12" y="170" width="472" height="15" rx="4" fill="#23282E"/>
    ${roda(92)}${roda(158)}${roda(416)}
  </svg>`;
}
// balança de caminhão do kit (chão, plataforma, poste e mostrador escuro com dois rótulos), dentro de um "cena"
function balanca(cena,r1,r2){
  const chao=el('<div class="ab" style="left:70px;top:604px;width:1140px;height:4px;border-radius:2px;background:#DDE2E7"></div>',cena);
  const plat=el('<div class="ab" style="left:318px;top:590px;width:580px;height:16px;border-radius:5px;background:#CBD1D8;border:2px solid #A8B0B9"></div>',cena);
  const poste=el('<div class="ab" style="left:1055px;top:452px;width:10px;height:152px;border-radius:4px;background:#B9C1C9"></div>',cena);
  const most=el(`<div class="ab most" style="left:910px;top:330px;width:300px">
      <div class="ml"><span class="m1">${r1}</span><span class="m2">${r2||''}</span></div><div class="mn">0 kg</div></div>`,cena);
  return {chao,plat,poste,most,mn:most.querySelector('.mn'),m1:most.querySelector('.m1'),m2:most.querySelector('.m2')};
}
// nó de um caminho (ícone + rótulo), com o ícone verde por cima do cinza para "acender"
function no(pai,x,y,w,n,txt,o={}){
  const e=el(`<div class="card" style="left:${x}px;top:${y}px;width:${w}px;height:${o.h||128}px;text-align:center;border-width:2px">
      <div style="position:relative;width:54px;height:54px;margin:${o.mt||18}px auto 0">
        <div class="ico n" style="position:absolute;inset:0">${ic(n,30)}</div><div class="ico ac ${o.a?'a':''}" style="position:absolute;inset:0;opacity:0">${ic(n,30)}</div></div>
      <div class="ttl" style="font-size:${o.fs||19}px;margin-top:10px;white-space:normal;line-height:1.15;padding:0 12px">${txt}</div></div>`,pai);
  e._ac=e.querySelector('.ac'); return e;
}
function acende(e,t,a,cor='#50D088'){const p=eo(pr(t,a,.45));e._ac.style.opacity=p.toFixed(3);contorno(e,t,a,'#E1E8E4',cor);return p}

const CAPS={};

// ------------------------------------------------------------------ CAPS[0] · Peso agora, preço depois (L1-L2)
// 1 "Na Recicla Vale Metais, a Cooperativa Recomeço mandou um caminhão de latinha, e o preço só vai ser combinado depois."
// 2 "Com o Ticket de Pesagem, você registra o peso agora e resolve o valor depois."
// O caminhão e a balança do kit; o "9.460 kg" desce para o ticket e o "R$ ?" fica esperando ao lado dele.
CAPS[0]=()=>{
  const g=grupo();
  const tit=titulo(g,'Ticket de Pesagem','Peso agora, preço depois');
  const coop=el(`<div class="tag n ab" style="left:96px;top:166px">${ic('users',22)}Cooperativa Recomeço</div>`,g);
  const cena=el('<div class="ab" style="left:0;top:0;width:1280px;height:800px;transform-origin:640px 168px;transform:translate(0,-60px) scale(.74)"></div>',g);
  const B=balanca(cena,'Peso');
  const cam=el(`<div class="ab" style="left:0;top:0;width:500px;height:230px">${caminhao(LATINHA)}</div>`,cena);
  const rodas=[...cam.querySelectorAll('.roda')];
  const X1=360, Y=366, X0=-900, BR=9460;
  const precoW=el('<div class="ab" style="left:1086px;top:236px;width:150px;height:74px"></div>',g);
  const preco=el(`<div class="ab" style="left:0;top:0;width:150px;height:74px">
      <svg class="ab" style="left:0;top:0;overflow:visible" width="150" height="74"><path d="M24 4 L138 4 Q146 4 146 12 L146 62 Q146 70 138 70 L24 70 L4 37 Z" fill="#F2B63D" stroke="#F2B63D" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="26" cy="37" r="6" fill="#fff" stroke="#F2B63D" stroke-width="3"/></svg>
      <div class="ab num" style="left:46px;top:17px;font-size:30px;color:#fff">R$ ?</div>
      <div class="ab rel" style="left:120px;top:-20px;width:42px;height:42px;border-radius:50%;background:var(--as);color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(16,24,40,.16)">${ic('clock',24)}</div></div>`,precoW);
  const rel=preco.querySelector('.rel');
  const tk=el(`<div class="card" style="left:300px;top:470px;width:460px;height:236px">
      <div class="row" style="position:absolute;left:26px;top:22px;gap:14px"><div class="ico" style="width:48px;height:48px">${ic('ticket',28)}</div>

// 4 "Repara: até aqui, nada entrou no estoque e nada saiu do caixa. A compra está em rascunho, e o efeito só acontece quando
// ela for finalizada."
CAPS[7]=()=>{
  // v2. A ideia em uma imagem: o peso anda pelo caminho (uma conta verde que viaja), para na compra em rascunho e o
  // estoque e o caixa esperam apagados do outro lado do Finalizar; na palavra "finalizada" a conta passa pelo Finalizar,
  // se divide e só então acende os dois. Um foco por momento (o que não é o assunto recua), cada nó entra depois do
  // traço que leva a ele, as setas do fim são curvas (não quinas) e nada some: o que foi dito fica na tela.
  const {eo5,eio5,ei,golpe,passa,foco,curso,sobre}=V2;
  const g=grupo();
  const tit=titulo(g,'Valorizar','Só no Finalizar');
  const sv=svgTela(g), Y=384, CY=Y+66;
  const n1=no(g,70,Y,176,'ticket','Ticket',{h:132,mt:20}), n2=no(g,292,Y,176,'badge-dollar-sign','Valorizar',{h:132,mt:20}),
        n3=no(g,514,Y-14,208,'clipboard-list','Compra',{h:160}), n4=no(g,768,Y,176,'circle-check','Finalizar',{h:132,mt:20});
  const rasc=el('<div class="tag a" style="position:absolute;left:51px;top:114px;font-size:16px;padding:5px 12px">rascunho</div>',n3);
  const fE=no(g,1024,CY-174,186,'warehouse','Estoque',{h:132,mt:20}), fC=no(g,1024,CY+42,186,'wallet','Caixa',{h:132,mt:20});
  const selo=(e)=>({esp:el(`<div class="ab" style="right:-14px;top:-14px;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--as);color:#fff;opacity:0;box-shadow:var(--s1)">${ic('hourglass',20)}</div>`,e),
    ok:el(`<div class="ab" style="right:-14px;top:-14px;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--v);color:#fff;opacity:0;box-shadow:var(--s1)">${ic('check',22)}</div>`,e)});
  const bE=selo(fE), bC=selo(fC);
  const rip=el('<div class="rip" style="left:88px;top:47px"></div>',n4);
  // trechos do caminho: c = trilho cinza (o que ainda não aconteceu), v = verde (o que já passou), m = por onde a conta anda
  const reta=(x0,x1)=>({d:`M${x0} ${CY} L${x1} ${CY}`,p:`M${x1-11} ${CY-8} L${x1} ${CY} L${x1-11} ${CY+8}`});
  const curva=(y0,y1)=>({d:`M944 ${y0} C 992 ${y0} 976 ${y1} 1024 ${y1}`,p:`M1013 ${y1-8} L1024 ${y1} L1013 ${y1+8}`});
  const seg=({d,p})=>({c:caminho(sv,d+' '+p,'#D3D9DE',4),v:caminho(sv,d,'var(--v)',4),pv:caminho(sv,p,'var(--v)',4),m:caminho(sv,d,'none',0)});
  const s12=seg(reta(252,286)), s23=seg(reta(474,508)), s34=seg(reta(728,762)), s4E=seg(curva(CY-18,CY-108)), s4C=seg(curva(CY+18,CY+108));
  const conta_=()=>el('<div class="ab" style="left:0;top:0;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--v);opacity:0;box-shadow:0 0 0 5px rgba(80,208,136,.25),0 2px 6px rgba(16,24,40,.25)"></div>',g);
  const kA=conta_(), kB=conta_();
  // a conta anda por um trecho de a até a+d: o verde segue atrás dela, a ponta da seta acende na chegada; devolve o avanço
  const anda=(k,s,t,a,d)=>{const x=pr(t,a,d),p=eio5(x);curso(s.v,p);s.pv.style.opacity=eo(pr(t,a+d*.8,.15)).toFixed(3);
    if(x>0&&x<1){sobre(k,s.m,p);k.style.opacity=(Math.min(1,x/.15)*Math.min(1,(1-x)/.12)).toFixed(3);k._on=1}return x};
  // o nó acende quando a conta chega: a cor entra e o cartão dá um golpe curto
  const chega=(e,t,a,cor)=>{acende(e,t,a,cor);pulse(e,t,a,.05,.7)};
  const recua=(e,t,a)=>{const k=lerp(.6,1,eo(pr(t,a,.4))).toFixed(3);e.children[0].style.opacity=k;e.children[1].style.opacity=k};
  const espera=(b,t,a,fim)=>{const p=passa(pr(t,a,.45),1.8),q=pr(t,fim,.14);b.esp.style.opacity=(eo(pr(t,a,.2))*(1-q)).toFixed(3);
    b.esp.style.transform=`scale(${(Math.max(0,p)*(1-q)).toFixed(4)},${Math.max(0,p).toFixed(4)}) rotate(${(t>a?12*Math.sin((t-a)*2.4):0).toFixed(2)}deg)`;
    const r=passa(pr(t,fim+.12,.4),2);b.ok.style.opacity=eo(pr(t,fim+.12,.12)).toFixed(3);b.ok.style.transform=`scale(${Math.max(0,r).toFixed(4)})`};

  return t=>{
    const j0=W(4,'repara')-.3, tat=W(4,'ate'), taq=W(4,'aqui'), ten=W(4,'entrou'), tes=W(4,'estoque'), tsa=W(4,'saiu'), tcx=W(4,'caixa'),
          tra=W(4,'rascunho'), tso=W(4,'so'), tfi=W(4,'finalizada');
    posTitulo(tit,t,j0-.6,tat-.45);
    kA._on=kB._on=0;
    // "até aqui": Ticket → Valorizar → Compra (em rascunho, âmbar). Cada nó entra um pouco antes de a conta chegar nele
    const a1=tat-.15, h1=a1+.42, h2=h1+.5, dH=.34;
    vis(n1,t,a1,1e9,{dy:16,sc:.94}); chega(n1,t,a1+.22);
    vis(s12.c,t,h1-.2,1e9,{dy:0}); vis(n2,t,h1-.12,1e9,{dy:16,sc:.94}); anda(kA,s12,t,h1,dH); chega(n2,t,h1+dH-.04);
    vis(s23.c,t,h2-.2,1e9,{dy:0}); vis(n3,t,h2-.12,1e9,{dy:16,sc:.94}); anda(kA,s23,t,h2,dH); chega(n3,t,h2+dH-.04,'#F2B63D');
    // "nada entrou no estoque e nada saiu do caixa": o outro lado aparece apagado, esperando (ampulheta), e balança de leve
    vis(s34.c,t,ten-.42,1e9,{dy:0}); vis(n4,t,ten-.3,1e9,{dy:16,sc:.94});
    traco(s4E.c,t,tes-.5,.4); vis(fE,t,tes-.3,1e9,{dx:14,dy:0,sc:.94}); espera(bE,t,tes,tfi+.52);

    const f0=tfi-.5;

    anda(kA,s4E,t,f0+.52,.48); anda(kB,s4C,t,f0+.61,.48);
    chega(fE,t,f0+.98); chega(fC,t,f0+1.07);
    if(!kA._on)kA.style.opacity=0; if(!kB._on)kB.style.opacity=0;
    // foco (depois de todo vis): o que espera fica recuado até acender; na palavra "rascunho" o caminho já andado recua
    // (o miolo do cartão recua, não o cartão: a ampulheta âmbar continua viva em cima dele)
    recua(n4,t,tso-.15); recua(fE,t,f0+.9); recua(fC,t,f0+.99);
    for(const e of [n1,n2]) foco(e,t,tra-.2,tso-.2,{fora:true,min:.68});
  };
};

// ------------------------------------------------------------------ CAPS[8] · Pesagens mescladas no papel (L4)
// 4 "Uma dica: se o ticket tiver pesagens do mesmo material mescladas numa linha, o comprovante mostra só a soma. Pra conferir
// cada pesagem no papel, use o Desmesclar pesagens antes de imprimir."
CAPS[8]=()=>{
  const g=grupo();
  const tit=titulo(g,'Comprovante','Pesagens mescladas');
  const tk=el(`<div class="card" style="left:100px;top:170px;width:540px;height:330px">

        <div class="t" style="left:12px;top:13px;font-weight:600;font-size:18px">Ferro misto</div><div class="t" style="right:12px;top:12px;font-weight:800;font-size:19px">${kg(2000)}</div></div>
      <div class="ab dois" style="left:20px;top:116px;width:400px;height:104px">
        <div class="t" style="left:12px;top:13px;font-weight:600;font-size:18px">Ferro misto</div><div class="t" style="right:12px;top:12px;font-weight:800;font-size:19px">${kg(1200)}</div>
        <div class="t" style="left:12px;top:65px;font-weight:600;font-size:18px">Ferro misto</div><div class="t" style="right:12px;top:64px;font-weight:800;font-size:19px">${kg(800)}</div></div>
    </div>`,g);
  const um=pap.querySelector('.um'), dois=pap.querySelector('.dois');

  return t=>{
    const j0=W(4,'dica')-.3, tti=W(4,'ticket'), tpe=W(4,'pesagens'), tme=W(4,'mescladas'), tco=W(4,'comprovante'), tso=W(4,'soma'),

    const hs=eo(pr(t,tso-.15,.4))*(1-pd); um.style.background=`rgba(80,208,136,${(.2*hs).toFixed(3)})`; pulse(um,t,tso-.1,.05,.7); pulse(um,t,tcf,.04,.7);
    vis(btn,t,tde-.15,1e9,{dy:12}); contorno(btn,t,tde,'#D6EFE1','#50D088'); pulse(btn,t,tde+.1,.05,.7);

};

<!-- ======================= KIT 2D V2 · INÍCIO (refino de motion e acabamento, 18/11) =======================
     Estes dois blocos (style#v2 e script#v2) são o kit v2 inteiro: colados antes de </body> de qualquer cenas.html feito
     com o kit v1, trocam por cima o acabamento (fichas de raio, sombra e ritmo de letra) e as utilidades de movimento
     (vis, ripple, pulse, conta, traco, arco, posTitulo), sem tocar em nenhum CAPS. O que é novo fica em V2.* para não
     bater com função de aula (há aulas com foco(), segue() e viaja() próprios). Ver perfis/ecoflix/cenas3d/MOTION_V2.md. -->
<style id="v2">
:root{--r1:10px;--r2:14px;--r3:18px;--rp:999px;
  --s1:0 1px 2px rgba(16,24,40,.08),2px 5px 12px -2px rgba(16,24,40,.14);
  --s2:0 1px 2px rgba(16,24,40,.05),3px 14px 30px -8px rgba(16,24,40,.16),0 2px 6px rgba(16,24,40,.04);
  --s3:0 2px 4px rgba(0,0,0,.14),5px 22px 44px -12px rgba(16,24,40,.38);
  --lz:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(0,0,0,.07)}
body{text-rendering:geometricPrecision}
#st{background:radial-gradient(1100px 650px at 92% -12%,rgba(80,208,136,.10),transparent 62%),
  radial-gradient(900px 600px at -12% 112%,rgba(80,208,136,.06),transparent 60%),
  linear-gradient(180deg,#fff 0%,#fff 46%,#F6F8F9 100%)}
.kick{font-size:14px;letter-spacing:.3em;white-space:nowrap}

.most{background:linear-gradient(180deg,#1B1D1C 0%,#121212 55%);border-radius:var(--r3);
  box-shadow:var(--s3),inset 0 1px 0 rgba(255,255,255,.10),inset 0 0 0 1px rgba(255,255,255,.05)}
.most .mn{letter-spacing:-.015em}
</style>
<script id="v2">
// curvas com intenção, mola e golpe (as mesmas do kit3d_v2.js) e as utilidades novas, todas em V2.*
var V2=(()=>{
  const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), pr=(t,a,d=.45)=>cl((t-a)/d), lerp=(a,b,p)=>a+(b-a)*p, PI=Math.PI;
  const eo=x=>1-Math.pow(1-cl(x),3);
  const eo5=x=>1-Math.pow(1-cl(x),5);                                  // entrada: arranca rápido, desacelera por muito tempo
  const ei=x=>{x=cl(x);return x*x*x};                                  // saída: curta e acelerando
  const eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
  const eio5=x=>{x=cl(x);return x<.5?16*x**5:1-Math.pow(-2*x+2,5)/2};  // movimento com peso
  const passa=(x,k=1.1)=>{x=cl(x)-1;return 1+(k+1)*x*x*x+k*x*x};       // passa um pouco e volta
  function mola(x,z=.5){x=cl(x);if(x>=1)return 1;if(z>=1){const w=9;return 1-Math.exp(-w*x)*(1+w*x)}
    const w=7/z,wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*x)*(Math.cos(wd*x)+z*w/wd*Math.sin(wd*x))}
  const golpe=(x,n=1.6,a=4.2)=>(x<=0||x>=1)?0:Math.exp(-a*x)*Math.sin(2*PI*n*x)*(1-x)*1.55;
  const escalona=(a,i,passo=.09)=>a+i*passo;
  // foco: um assunto por momento. Recua (opacidade e saturação) fora de [a,b]; o.fora inverte. Chamar DEPOIS do vis.
  function foco(e,t,a,b=1e9,o={}){let k=Math.min(eo(pr(t,a,o.d??.4)),1-eo(pr(t,b,o.d??.4)));if(o.fora)k=1-k;const m=o.min??.42;
    e.style.opacity=((+e.style.opacity||0)*lerp(m,1,k)).toFixed(4);e.style.filter=k>.995?'':`saturate(${lerp(.35,1,k).toFixed(3)})`;return k}
  // curso: o traço de um <path> desenhado até a fração p (para o traço seguir um objeto que viaja em cima dele)
  function curso(p,q){if(!p._L){p._L=p.getTotalLength();p.style.strokeDasharray=p._L}q=cl(q);p.style.strokeDashoffset=(p._L*(1-q)).toFixed(2);p.style.opacity=q>0?1:0}
  // sobre: põe o elemento (left/top = 0, centrado por margem) no ponto da fração q do <path>
  function sobre(e,p,q){const L=p._Lm??(p._Lm=p.getTotalLength()),pt=p.getPointAtLength(L*cl(q));e.style.transform=`translate(${pt.x.toFixed(2)}px,${pt.y.toFixed(2)}px)`;return pt}
  // leitura de balança num .most: o número passa do valor e volta (mola), de `passo` em `passo` enquanto mexe
  function pesa(mn,t,a,d,v0,v1,o={}){const x=pr(t,a,d),ps=o.passo??10,v=lerp(v0,v1,mola(x,o.z??.74));
    const s=(o.fmt||kg)(x<=0?v0:x>=1?v1:Math.round(v/ps)*ps);if(mn.textContent!==s)mn.textContent=s;return x}
  return{eo5,ei,eio5,passa,mola,golpe,escalona,foco,curso,sobre,pesa};
})();
// ---- as utilidades do kit, por cima das do v1 (mesmos nomes e parâmetros)
// vis: a entrada arranca na hora e desacelera por muito tempo (a opacidade chega antes da posição: já se lê enquanto
// assenta); a saída é curta e acelerando; quem entra por escala (sc < .9) passa um pouco do tamanho e volta
function vis(e,t,a,b=1e9,o={}){
  const din=o.din??.5,dout=o.dout??.4,dy=o.dy??16,dx=o.dx??0,sc=o.sc??.985;
  const x=pr(t,a,din*1.3),p=V2.eo5(x),po=eo(pr(t,a,din*.62)),y=pr(t,b,dout*.7),q=1-V2.ei(y),op=Math.min(po,1-y*y);
  e.style.opacity=op.toFixed(4);e.style.visibility=op<=.001?'hidden':'visible';
  const ps=sc<.9?V2.passa(pr(t,a,din*1.1),1.6):p,s=sc+(1-sc)*ps-(1-q)*(1-sc)*.6;
  e.style.transform=`translate(${((1-p)*dx).toFixed(2)}px,${((1-p)*dy-(1-q)*dy*.4).toFixed(2)}px) scale(${s.toFixed(4)})`;
  return op;
}
function ripple(r,t,a){const p=pr(t,a,.85);r.style.opacity=(p>0&&p<1)?(.7*Math.pow(1-p,1.6)).toFixed(3):0;r.style.transform=`scale(${(.4+2.2*V2.eo5(p)).toFixed(3)})`}
// pulse: bate rápido e assenta (mola), em vez de inchar e desinchar igual dos dois lados. Mesma regra do v1: chamar
// DEPOIS do vis do mesmo elemento; pulsos no mesmo instante se multiplicam.
function pulse(e,t,a,amp=.045,dur=.9){
  const p=pr(t,a,dur),f=(p>0&&p<1)?1+amp*1.25*V2.golpe(p,1.1,3.4):1,c=e.style.transform;
  const meu=e._pw!==undefined&&c===e._pw, base=meu?e._pb:c;
  if(!meu||e._pt!==t)e._pm={};
  e._pm[`${a}|${amp}|${dur}`]=f;e._pt=t;e._pb=base;
  let k=1;for(const v of Object.values(e._pm))k*=v;
  e.style.transform=k===1?base:(base?base+' ':'')+`scale(${k.toFixed(4)})`;e._pw=e.style.transform}
function conta(e,t,a,d,v0,v1,fmt=kg){const p=V2.eo5(pr(t,a,d*1.15));const s=fmt(lerp(v0,v1,p));if(e.textContent!==s)e.textContent=s;return p}
// traco: a linha arranca com peso e chega desacelerando; arco: o objeto sai devagar, voa e pousa (sem parar de tranco)
function traco(p,t,a,d=.8){if(!p._L){p._L=p.getTotalLength();p.style.strokeDasharray=p._L}const x=pr(t,a,d*1.1),q=lerp(eio(x),V2.eo5(x),.45);p.style.strokeDashoffset=(p._L*(1-q)).toFixed(2);p.style.opacity=q>0?1:0;return q}
