<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- T08 "Ticket de Pesagem" · ilustrações de conceito (kit perfis/ecoflix/cenas/cenas_ecoflix.html).
     Uma janela por capítulo (ilustracoes.json): cap00 peso agora, preço depois · cap01 compra direta × ticket ·
     cap03 o rascunho salvo sozinho · cap04 entrada e saída (o desenho do kit "Tara e peso líquido") · cap05 a conta do
     líquido (os cartões do mesmo desenho) · cap06 uma aba por caminhão · cap07 só no Finalizar · cap08 pesagens mescladas.
     Tudo função do tempo, preso às falas do narracao/tts_textos.py com W(linha, 'palavra').
     Render só do trecho: node render_cenas.cjs <cap> capNN.json saida.mp4 --html cenas.html --de <at> --ate <at+dur>.
     Utilidades novas (faltavam no kit): kgd() (kg com casas), setaD(), caminhao(cores, cabine, vazio), balanca(), no(). -->
<style>
@font-face{font-family:M;font-weight:500;src:url(../../../web/fonts/montserrat-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:600;src:url(../../../web/fonts/montserrat-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:700;src:url(../../../web/fonts/montserrat-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:800;src:url(../../../web/fonts/montserrat-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:500;src:url(../../../web/fonts/montserrat-latin-ext-500-normal.woff2) format('woff2');unicode-range:U+0100-024F}
@font-face{font-family:M;font-weight:700;src:url(../../../web/fonts/montserrat-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-024F}
/* paleta EcoFlix (igual ao kit): --v acento (só preenchimento, barra, contorno) · --ve texto verde · --ae texto âmbar */
:root{--v:#50D088;--ve:#2E7D57;--vc:#EAF8F0;--vm:#A9E9C6;--a:#F2B63D;--ae:#8A5A00;--ac:#FFF5DF;
  --t:#121212;--c:#6B7280;--l:#E6E9EE;--e:#121212;--r:#B42318;--rc:#FEF3F2}
*{box-sizing:border-box;margin:0;padding:0;transition:none!important;animation:none!important}
html,body{width:1280px;height:800px;overflow:hidden;background:#fff}
body{font-family:M,sans-serif;color:var(--t);-webkit-font-smoothing:antialiased}
#st{position:absolute;inset:0;overflow:hidden;background:
  radial-gradient(1100px 650px at 92% -12%,rgba(80,208,136,.09),transparent 62%),
  radial-gradient(900px 600px at -12% 112%,rgba(80,208,136,.06),transparent 60%),#fff}
.g{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:640px 400px}
.ab{position:absolute}
.row{display:flex;align-items:center}
.kick{font-weight:700;font-size:15px;letter-spacing:.3em;color:var(--ve);text-transform:uppercase}
.h{font-weight:800;font-size:46px;letter-spacing:-.01em;line-height:1.1}
.card{position:absolute;background:#fff;border:1px solid #E1E8E4;border-radius:18px;
  box-shadow:0 18px 40px rgba(16,24,40,.10),0 3px 8px rgba(16,24,40,.06)}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:100%;height:100%}
.ico{display:flex;align-items:center;justify-content:center;flex:none;border-radius:14px;background:var(--vc);color:var(--ve)}
.ico.a{background:var(--ac);color:var(--ae)}
.ico.n{background:#F2F4F7;color:#4B5563}
.tag{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;font-weight:800;font-size:20px;white-space:nowrap}
.tag.v{background:var(--vc);color:var(--ve)} .tag.a{background:var(--ac);color:var(--ae)} .tag.n{background:#F2F4F7;color:#374151}
.lbl{font-weight:700;font-size:17px;color:var(--c)}
.num{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.op{position:absolute;width:60px;height:60px;border-radius:50%;background:#F2F4F7;color:var(--t);display:flex;
  align-items:center;justify-content:center;font-weight:800;font-size:34px;line-height:1}
.most{background:var(--e);border-radius:16px;padding:16px 22px 18px;box-shadow:0 16px 34px rgba(16,24,40,.22)}

.rip{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:3px solid var(--v);opacity:0}
/* desta aula */
.ttl{font-weight:800;font-size:22px;line-height:1.2;white-space:nowrap}
.sub{font-weight:600;font-size:17px;line-height:1.3;color:#4B5563;white-space:nowrap}
.chk{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.chk.v{background:var(--v);color:#fff} .chk.x{background:#EEF0F3;color:#6B7280}
.pc{position:absolute;display:flex;align-items:center;gap:12px;padding:0 18px;height:64px;border-radius:16px;background:#fff;
  border:2px solid #E1E8E4;box-shadow:0 8px 20px rgba(16,24,40,.07)}
.pp{position:absolute;background:#fff;border-radius:6px;box-shadow:0 14px 30px rgba(16,24,40,.16),0 2px 6px rgba(16,24,40,.08)}

</style><style id="saturado">/* estilo saturado (Kaik, 11/11): selo, chip, etiqueta, quadrado de ícone e círculo de etapa
   com fundo cheio e ícone/texto branco; nunca fundo claro com conteúdo colorido, nunca ícone escuro sobre o verde */
:root{--vs:#16A34A;--as:#D97706;--rs:#DC2626}

<body><div id="st"></div>
<script>
// ------------------------------------------------------------------ utilidades (as do kit, sem mudança)
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const pr=(t,a,d=.45)=>cl((t-a)/d);
const lerp=(a,b,p)=>a+(b-a)*p;
const $=s=>document.querySelector(s);
const ST=document.getElementById('st');
function el(html,parent=ST){const d=document.createElement('div');d.innerHTML=html.trim();let f=null;for(const n of [...d.childNodes]){parent.appendChild(n);if(!f&&n.nodeType===1)f=n}return f}
function grupo(){return el('<div class="g"></div>')}
function ic(n,px,cor){const s=(window.ICONS||{})[n]||'';return `<span class="ic" style="width:${px}px;height:${px}px;${cor?'color:'+cor:''}">${s}</span>`}
function hex(c){c=c.replace('#','');return[0,2,4].map(i=>parseInt(c.substr(i,2),16))}
function mix(a,b,p){const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*cl(p))).join(',')})`}
function vis(e,t,a,b=1e9,o={}){
  const din=o.din??.5,dout=o.dout??.4,dy=o.dy??16,dx=o.dx??0,sc=o.sc??.985;
  const p=eo(pr(t,a,din)),q=1-eo(pr(t,b,dout)),op=Math.min(p,q);
  e.style.opacity=op.toFixed(4);e.style.visibility=op<=.001?'hidden':'visible';
  const s=sc+(1-sc)*p - (1-q)*(1-sc);
  e.style.transform=`translate(${((1-p)*dx).toFixed(2)}px,${((1-p)*dy-(1-q)*dy*.5).toFixed(2)}px) scale(${s.toFixed(4)})`;
  return op;
}
function ripple(r,t,a){const p=pr(t,a,.7);r.style.opacity=(p>0&&p<1)?(.6*(1-p)).toFixed(3):0;r.style.transform=`scale(${(.4+2.0*eo(p)).toFixed(3)})`}
function pulse(e,t,a,amp=.045,dur=.9){const p=pr(t,a,dur);e.style.scale=(p>0&&p<1)?(1+amp*Math.sin(Math.PI*p)).toFixed(4):''}
const NF=new Intl.NumberFormat('pt-BR');
const kg=v=>NF.format(Math.round(v))+' kg';
const brl=v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function conta(e,t,a,d,v0,v1,fmt=kg){const p=eo(pr(t,a,d));const s=fmt(lerp(v0,v1,p));if(e.textContent!==s)e.textContent=s;return p}
function traco(p,t,a,d=.8){if(!p._L){p._L=p.getTotalLength();p.style.strokeDasharray=p._L}const q=eio(pr(t,a,d));p.style.strokeDashoffset=(p._L*(1-q)).toFixed(2);p.style.opacity=q>0?1:0;return q}
function arco(e,t,a,d,x0,y0,x1,y1,h=-80,rot=0){const p=eio(pr(t,a,d));const x=lerp(x0,x1,p),y=lerp(y0,y1,p)+h*4*p*(1-p);
  e.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${(rot*p).toFixed(2)}deg)`;return p}
function contorno(e,t,a,de,para,d=.45){e.style.borderColor=mix(de,para,eo(pr(t,a,d)))}
function titulo(g,kick,txt){return el(`<div class="ab" style="left:0;top:0;width:1280px;text-align:center">
  <div class="kick">${kick}</div><div class="h" style="margin-top:12px">${txt}</div></div>`,g)}
function posTitulo(e,t,a,sobe,sai=1e9){vis(e,t,a,sai,{dy:14});const p=eio(pr(t,sobe,.7));
  e.style.top=lerp(318,46,p).toFixed(2)+'px';e.style.scale=lerp(1.12,1,p).toFixed(4)}
// ------------------------------------------------------------------ utilidades desta aula (faltavam no kit)
const NFd=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:3});
const kgd=v=>NFd.format(v)+' kg';                       // kg com casas: 21,6 kg (o kg() do kit arredonda)
const kg1=v=>v.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+' kg';   // contagem com uma casa
// seta (linha + ponta) num só <path>, para o traco() desenhar a ponta por último
function setaD(x1,y1,x2,y2,h=13){const a=Math.atan2(y2-y1,x2-x1),f=s=>`${(x2-h*Math.cos(a+s*.55)).toFixed(1)} ${(y2-h*Math.sin(a+s*.55)).toFixed(1)}`;
  return `M${x1} ${y1} L${x2} ${y2} M${f(1)} L${x2} ${y2} L${f(-1)}`}
function svgTela(pai){return el('<svg class="ab" style="left:0;top:0;overflow:visible" width="1280" height="800"></svg>',pai)}
function caminho(sv,d,cor='var(--v)',w=4,extra=''){const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke',cor);p.setAttribute('stroke-width',w);
  p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');if(extra)p.setAttribute('stroke-dasharray',extra);
  p.style.opacity=0;sv.appendChild(p);return p}
// linha tracejada que se desenha (o traco() usa o dasharray): revela por clip
function tracejado(p,t,a,d=.7){const q=eio(pr(t,a,d));p.style.opacity=q>0?1:0;p.style.clipPath=`inset(0 ${((1-q)*100).toFixed(2)}% 0 0)`;return q}
// linha reta que cresce do começo ao fim mudando o próprio "d" (mantém o tracejado; serve para linha vertical)
function linhaParcial(p,t,a,d,x0,y0,x1,y1){const q=eio(pr(t,a,d));p.setAttribute('d',`M${x0} ${y0} L${lerp(x0,x1,q).toFixed(2)} ${lerp(y0,y1,q).toFixed(2)}`);
  p.style.opacity=q>0?1:0;return q}

// ------------------------------------------------------------------ tempos da fala
let D=null;
const norm=w=>w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9%./-]+/g,'');
function W(linha,palavra,n=1,campo='s'){
  const alvo=norm(palavra);let k=0;
  for(const w of D.words){if(w.linha===linha&&norm(w.w).replace(/[.,]$/,'')===alvo){k++;if(k===n)return w[campo]}}
  for(const w of D.words){if(w.linha===linha&&norm(w.w).startsWith(alvo)){k++;if(k>=n)return w[campo]}}
  console.warn('palavra não achada',linha,palavra);return L(linha);
}
const L=i=>(D.linhas[i]||{s:0}).s, LE=i=>(D.linhas[i]||{e:D.dur}).e;

// ------------------------------------------------------------------ desenhos genéricos (sem marca)
const PECAS=[ // [forma, cor, centro da peça, destino no monte atrás do veículo] (as do kit)
  ['<polygon points="28,90 44,52 88,42 100,90"/>','#8C5A3C',[64,66],[-224,148,6]],
  ['<polygon points="82,90 102,36 146,48 154,90"/>','#6F7983',[118,63],[-318,122,12]],
  ['<rect x="118" y="44" width="112" height="16" rx="8" transform="rotate(-8 174 52)"/>','#9AA3AD',[174,52],[-334,98,-18]],
  ['<polygon points="148,90 170,54 212,44 232,90"/>','#A0694A',[190,67],[-425,148,-8]],
  ['<polygon points="210,90 232,40 276,54 286,90"/>','#4F5861',[248,65],[-373,120,-10]],
  ['<polygon points="258,90 282,60 308,66 312,90"/>','#8A949E',[285,75],[-375,148,4]],
  ['<g><circle cx="192" cy="64" r="19"/><circle cx="192" cy="64" r="7" fill="#8A949E"/></g>','#5E6670',[192,64],[-242,155,200]],
  ['<polygon points="40,70 60,50 84,64 64,86"/>','#B07A55',[62,68],[-307,100,30]]];
// cores da carga: latinha (alumínio) e bateria; sem lista, as do kit (ferro)
const LATINHA=['#C9D1D9','#AEB8C2','#DDE3E8','#B8C2CC','#9AA6B2','#CDD5DD','#A5B0BB','#D5DCE3'];
const BATERIA=['#3D4651','#2F3640','#4F5861','#23282E','#3D4651','#2F3640','#4F5861','#2F3640'];
// o caminhão do kit (frente para a direita), com a cor da carga e da cabine; vazio = sem carga
function caminhao(cores,cabine='#2F3640',vazio=false){
  const pecas=vazio?'':PECAS.map(([f,c,[cx,cy],[dx,dy,r]],i)=>`<g class="pd" data-cx="${cx}" data-cy="${cy}" data-dx="${dx}" data-dy="${dy}" data-r="${r}" fill="${cores?cores[i]:c}">${f}</g>`).join('');
  const roda=x=>`<g class="roda" data-x="${x}" transform="translate(${x},196)"><circle r="26" fill="#1B1F24"/><circle r="12" fill="#9AA3AD"/>
    <rect x="-2.5" y="-23" width="5" height="10" rx="2" fill="#5B636C"/><rect x="-2.5" y="13" width="5" height="10" rx="2" fill="#5B636C"/></g>`;
  return `<svg viewBox="0 0 500 230" width="500" height="230" style="overflow:visible">
    <g class="carga">${pecas}</g>
    <rect x="18" y="86" width="304" height="88" rx="6" fill="#7E8994"/>
    <rect x="16" y="82" width="308" height="11" rx="4" fill="#68727D"/>
    <g stroke="#707A85" stroke-width="3">${[78,138,198,258].map(x=>`<line x1="${x}" y1="98" x2="${x}" y2="168"/>`).join('')}</g>
    <path d="M334,176 L334,76 Q334,64 346,64 L412,64 L462,116 L472,121 Q480,124 480,134 L480,176 Z" fill="${cabine}"/>
    <path d="M348,78 L406,78 L444,116 L348,116 Z" fill="#D7E5ED"/>
    <rect x="470" y="142" width="10" height="11" rx="2" fill="#F2B63D"/>
    <rect x="12" y="170" width="472" height="15" rx="4" fill="#23282E"/>
    ${roda(92)}${roda(158)}${roda(416)}
  </svg>`;
}
// balança de caminhão do kit (chão, plataforma, poste e mostrador escuro com dois rótulos), dentro de um "cena"
function balanca(cena,r1,r2){
  const chao=el('<div class="ab" style="left:70px;top:604px;width:1140px;height:4px;border-radius:2px;background:#DDE2E7"></div>',cena);
  const plat=el('<div class="ab" style="left:318px;top:590px;width:580px;height:16px;border-radius:5px;background:#CBD1D8;border:2px solid #A8B0B9"></div>',cena);
  const poste=el('<div class="ab" style="left:1055px;top:452px;width:10px;height:152px;border-radius:4px;background:#B9C1C9"></div>',cena);
  const most=el(`<div class="ab most" style="left:910px;top:330px;width:300px">
      <div class="ml"><span class="m1">${r1}</span><span class="m2">${r2||''}</span></div><div class="mn">0 kg</div></div>`,cena);
  return {chao,plat,poste,most,mn:most.querySelector('.mn'),m1:most.querySelector('.m1'),m2:most.querySelector('.m2')};
}
// nó de um caminho (ícone + rótulo), com o ícone verde por cima do cinza para "acender"
function no(pai,x,y,w,n,txt,o={}){
  const e=el(`<div class="card" style="left:${x}px;top:${y}px;width:${w}px;height:${o.h||128}px;text-align:center;border-width:2px">
      <div style="position:relative;width:54px;height:54px;margin:${o.mt||18}px auto 0">
        <div class="ico n" style="position:absolute;inset:0">${ic(n,30)}</div><div class="ico ac ${o.a?'a':''}" style="position:absolute;inset:0;opacity:0">${ic(n,30)}</div></div>
      <div class="ttl" style="font-size:${o.fs||19}px;margin-top:10px;white-space:normal;line-height:1.15;padding:0 12px">${txt}</div></div>`,pai);
  e._ac=e.querySelector('.ac'); return e;
}
function acende(e,t,a,cor='#50D088'){const p=eo(pr(t,a,.45));e._ac.style.opacity=p.toFixed(3);contorno(e,t,a,'#E1E8E4',cor);return p}

const CAPS={};

// ------------------------------------------------------------------ CAPS[0] · Peso agora, preço depois (L1-L2)
// 1 "Na Recicla Vale Metais, a Cooperativa Recomeço mandou um caminhão de latinha, e o preço só vai ser combinado depois."
// 2 "Com o Ticket de Pesagem, você registra o peso agora e resolve o valor depois."
// O caminhão e a balança do kit; o "9.460 kg" desce para o ticket e o "R$ ?" fica esperando ao lado dele.
CAPS[0]=()=>{
  const g=grupo();
  const tit=titulo(g,'Ticket de Pesagem','Peso agora, preço depois');
  const coop=el(`<div class="tag n ab" style="left:96px;top:166px">${ic('users',22)}Cooperativa Recomeço</div>`,g);
  const cena=el('<div class="ab" style="left:0;top:0;width:1280px;height:800px;transform-origin:640px 168px;transform:translate(0,-60px) scale(.74)"></div>',g);
  const B=balanca(cena,'Peso');
  const cam=el(`<div class="ab" style="left:0;top:0;width:500px;height:230px">${caminhao(LATINHA)}</div>`,cena);
  const rodas=[...cam.querySelectorAll('.roda')];
  const X1=360, Y=366, X0=-900, BR=9460;
  const precoW=el('<div class="ab" style="left:1086px;top:236px;width:150px;height:74px"></div>',g);
  const preco=el(`<div class="ab" style="left:0;top:0;width:150px;height:74px">
      <svg class="ab" style="left:0;top:0;overflow:visible" width="150" height="74"><path d="M24 4 L138 4 Q146 4 146 12 L146 62 Q146 70 138 70 L24 70 L4 37 Z" fill="#D97706" stroke="#D97706" stroke-width="3" stroke-linejoin="round"/>
        <circle cx="26" cy="37" r="6" fill="#fff" stroke="#F2B63D" stroke-width="3"/></svg>
      <div class="ab num" style="left:46px;top:17px;font-size:30px;color:#fff">R$ ?</div>
      <div class="ab rel" style="left:120px;top:-20px;width:42px;height:42px;border-radius:50%;background:var(--as);color:#fff;border:2px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(16,24,40,.16)">${ic('clock',24)}</div></div>`,precoW);
  const rel=preco.querySelector('.rel');
  const tk=el(`<div class="card" style="left:300px;top:470px;width:460px;height:236px">
      <div class="row" style="position:absolute;left:26px;top:22px;gap:14px"><div class="ico" style="width:48px;height:48px">${ic('ticket',28)}</div>
        <div class="ttl">Ticket de Pesagem</div></div>
      <div class="ab sub" style="left:26px;top:88px">Cooperativa Recomeço</div>
      <div class="ab sub" style="left:26px;top:116px">Alumínio latinha</div>
      <div class="ab slot" style="left:26px;top:152px;width:408px;height:60px;border-radius:12px;border:2px dashed #CBD1D8"></div>
      <div class="ab num pv" style="left:26px;top:158px;width:408px;text-align:center;font-size:36px;color:var(--ve);opacity:0">${kg(BR)}</div></div>`,g);
  const pv=tk.querySelector('.pv'), slot=tk.querySelector('.slot');
  const voa=el(`<div class="ab num" style="left:0;top:0;font-size:36px;color:var(--ve);white-space:nowrap;opacity:0">${kg(BR)}</div>`,g);

  return t=>{
    const j0=W(1,'na')-.3, tco=W(1,'cooperativa'), tca=W(1,'caminhao'), tla=W(1,'latinha'), tpr=W(1,'preco'), tde=W(1,'depois');

  const badge=(e)=>({esp:el(`<div class="ab" style="right:-14px;top:-14px;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--as);color:#fff;opacity:0">${ic('hourglass',20)}</div>`,e),
    ok:el(`<div class="ab" style="right:-14px;top:-14px;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--v);color:#fff;opacity:0">${ic('check',22)}</div>`,e)});
  const bE=badge(fE), bC=badge(fC);
  const s=(x0,y0,x1,y1)=>({c:caminho(sv,setaD(x0,y0,x1,y1,12),'#CBD1D8',4),v:caminho(sv,setaD(x0,y0,x1,y1,12),'var(--v)',4)});
  const s12=s(258,364,302,364), s23=s(488,364,532,364), s34=s(758,364,802,364), s4E=s(988,350,1032,262), s4C=s(988,378,1032,468);

  return t=>{
    const j0=W(4,'repara')-.3, taq=W(4,'aqui'), ten=W(4,'entrou'), tes=W(4,'estoque'), tcx=W(4,'caixa'), tra=W(4,'rascunho'), tfi=W(4,'finalizada');
    posTitulo(tit,t,j0-.6,taq-.35);
    vis(n1,t,taq-.15,1e9,{dy:14,sc:.95}); acende(n1,t,taq);
    traco(s12.v,t,taq+.1,.25); vis(n2,t,taq+.2,1e9,{dy:14,sc:.95}); acende(n2,t,taq+.3);
    traco(s23.v,t,taq+.45,.25); vis(n3,t,taq+.55,1e9,{dy:14,sc:.95}); acende(n3,t,taq+.65,'#F2B63D');
    traco(s34.c,t,ten-.25,.3); vis(n4,t,ten-.1,1e9,{dy:14,sc:.95});
    traco(s4E.c,t,tes-.35,.3); vis(fE,t,tes-.2,1e9,{dy:14,sc:.95}); bE.esp.style.opacity=Math.min(eo(pr(t,tes,.4)),1-eo(pr(t,tfi+.1,.4))).toFixed(3);
    traco(s4C.c,t,tcx-.35,.3); vis(fC,t,tcx-.2,1e9,{dy:14,sc:.95}); bC.esp.style.opacity=Math.min(eo(pr(t,tcx,.4)),1-eo(pr(t,tfi+.1,.4))).toFixed(3);
    pulse(n3,t,tra-.1,.05,.8); pulse(rasc,t,tra-.1,.1,.8);
    // finalizada: o Finalizar acende e só então o estoque e o caixa
    acende(n4,t,tfi-.25); traco(s34.v,t,tfi-.35,.25); traco(s4E.v,t,tfi-.05,.25); traco(s4C.v,t,tfi-.05,.25);
    acende(fE,t,tfi+.1); acende(fC,t,tfi+.1); bE.ok.style.opacity=eo(pr(t,tfi+.1,.4)).toFixed(3); bC.ok.style.opacity=eo(pr(t,tfi+.1,.4)).toFixed(3);
  };
};

// ------------------------------------------------------------------ CAPS[8] · Pesagens mescladas no papel (L4)
// 4 "Uma dica: se o ticket tiver pesagens do mesmo material mescladas numa linha, o comprovante mostra só a soma. Pra conferir
// cada pesagem no papel, use o Desmesclar pesagens antes de imprimir."
CAPS[8]=()=>{
  const g=grupo();
  const tit=titulo(g,'Comprovante','Pesagens mescladas');
  const tk=el(`<div class="card" style="left:100px;top:170px;width:540px;height:330px">
      <div class="row" style="position:absolute;left:26px;top:22px;gap:14px"><div class="ico" style="width:48px;height:48px">${ic('ticket',28)}</div>
        <div class="ttl">No ticket</div></div></div>`,g);
  const linhaT=(y,v)=>el(`<div class="pc" style="left:126px;top:${y}px;width:488px;height:66px;justify-content:space-between">
      <div class="ttl" style="font-size:20px">Ferro misto</div><div class="num" style="font-size:24px">${kg(v)}</div></div>`,g);
  const YA=270, YB=356, YM=313;
  const LA=linhaT(YA,1200), LB=linhaT(YB,800), LM=linhaT(YM,2000);
  LM.style.borderColor='#A9E9C6';
  const btn=el(`<div class="pc" style="left:100px;top:540px;height:66px;padding:0 24px 0 14px;border-color:#D6EFE1">
      <div class="ico" style="width:42px;height:42px;border-radius:12px">${ic('split',24)}</div><div class="ttl" style="font-size:21px">Desmesclar pesagens</div></div>`,g);
  const pap=el(`<div class="pp" style="left:720px;top:170px;width:440px;height:330px">
      <div class="t" style="left:0;top:24px;width:440px;text-align:center;font-weight:800;font-size:21px">Recicla Vale Metais</div>
      <div class="t" style="left:0;top:58px;width:440px;text-align:center;font-weight:800;font-size:15px;letter-spacing:.06em">TICKET DE PESAGEM</div>
      <div class="ab" style="left:26px;top:94px;width:388px;height:1px;background:#CBD1D8"></div>
      <div class="ab um" style="left:20px;top:116px;width:400px;height:52px;border-radius:10px">
        <div class="t" style="left:12px;top:13px;font-weight:600;font-size:18px">Ferro misto</div><div class="t" style="right:12px;top:12px;font-weight:800;font-size:19px">${kg(2000)}</div></div>
      <div class="ab dois" style="left:20px;top:116px;width:400px;height:104px">
        <div class="t" style="left:12px;top:13px;font-weight:600;font-size:18px">Ferro misto</div><div class="t" style="right:12px;top:12px;font-weight:800;font-size:19px">${kg(1200)}</div>
        <div class="t" style="left:12px;top:65px;font-weight:600;font-size:18px">Ferro misto</div><div class="t" style="right:12px;top:64px;font-weight:800;font-size:19px">${kg(800)}</div></div>
    </div>`,g);
  const um=pap.querySelector('.um'), dois=pap.querySelector('.dois');

  return t=>{
    const j0=W(4,'dica')-.3, tti=W(4,'ticket'), tpe=W(4,'pesagens'), tme=W(4,'mescladas'), tco=W(4,'comprovante'), tso=W(4,'soma'),
          tcf=W(4,'conferir'), tde=W(4,'desmesclar'), tim=W(4,'imprimir');
    posTitulo(tit,t,j0-.6,tti-.55);
    vis(tk,t,tti-.15,1e9,{dy:18,sc:.95});
    // duas pesagens; mesclar junta as duas numa linha; desmesclar separa de novo
    const mj=eio(pr(t,tme-.1,.6)), sp=eio(pr(t,tde+.15,.6)), k=mj*(1-sp);
    for(const [L,y0,a] of [[LA,YA,0],[LB,YB,.12]]){const op=eo(pr(t,tpe-.15+a,.45))*(1-k);
      L.style.opacity=op.toFixed(3); L.style.visibility=op>.001?'visible':'hidden'; L.style.transform=`translateY(${((YM-y0)*k).toFixed(2)}px)`;}
    const om=eo(pr(t,tme+.2,.4))*(1-eo(pr(t,tde+.15,.35))); LM.style.opacity=om.toFixed(3); LM.style.visibility=om>.001?'visible':'hidden';
    // o papel: só a soma; depois do desmesclar, uma linha por pesagem
    vis(pap,t,tco-.15,1e9,{dy:18,sc:.95});
    const pd=eo(pr(t,tim-.2,.45)); um.style.opacity=(1-pd).toFixed(3); dois.style.opacity=pd.toFixed(3);
    const hs=eo(pr(t,tso-.15,.4))*(1-pd); um.style.background=`rgba(80,208,136,${(.2*hs).toFixed(3)})`; pulse(um,t,tso-.1,.05,.7); pulse(um,t,tcf,.04,.7);
    vis(btn,t,tde-.15,1e9,{dy:12}); contorno(btn,t,tde,'#D6EFE1','#50D088'); pulse(btn,t,tde+.1,.05,.7);
  };
};

// ------------------------------------------------------------------ API para o renderizador
let RENDER=null;
window.setup=d=>{D=d;ST.innerHTML='';RENDER=CAPS[d.cap]();return true};
window.R=t=>{RENDER(t);return true};
</script></body></html>
