<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- T20 · Portal do Cliente e Fornecedor: as ilustrações de conceito, no kit da EcoFlix (perfis/ecoflix/cenas/cenas_ecoflix.html;
     docs/09-aula-ilustrada.md, "Ilustração de conceito no meio do capítulo"). 1280x800 CSS, window.setup(dados) + window.R(t);
     tudo é função do tempo e cada mudança fica presa a uma palavra com W(linha, 'palavra'). Uma janela por cena (ilustracoes.json);
     até a voz chegar, os tempos são os estimados de tempos/capNN.json.
     Cenas: CAPS[0] do print ao link · CAPS[1] até onde vai o acesso · CAPS[2] quem tem o link, entra · CAPS[3] cliente e
     fornecedor (vale o que esconde mais) · CAPS[4] cada aba, três jeitos · CAPS[6] um saldo, dois lados · CAPS[8] quem pede e
     quem decide · CAPS[10] fotos no pedido (fala 0 e 1) e dois links diferentes (fala 5 e 6).
     Celular e computador genéricos, com a tela lisa: a página do portal nunca é desenhada (é tela do app). Sem logo nem marca. -->
<style>
@font-face{font-family:M;font-weight:500;src:url(../../../web/fonts/montserrat-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:600;src:url(../../../web/fonts/montserrat-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:700;src:url(../../../web/fonts/montserrat-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:800;src:url(../../../web/fonts/montserrat-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:500;src:url(../../../web/fonts/montserrat-latin-ext-500-normal.woff2) format('woff2');unicode-range:U+0100-024F}
@font-face{font-family:M;font-weight:700;src:url(../../../web/fonts/montserrat-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-024F}
/* ---------------------------------------------------------------- paleta EcoFlix (marca: acento #50D088, escuro #121212)
   --v  acento: preenchimentos, barras, contornos de destaque (nunca texto sobre branco: contraste baixo)
   --ve verde escuro: texto e ícone verde sobre branco (contraste 5,0)   --vc verde claro: fundo de ícone/resultado
   --a  âmbar: o SEGUNDO conceito da cena (ex.: competência x caixa)     --ae texto âmbar (5,9)   --ac âmbar claro
   --t  texto (o escuro da marca)   --c texto secundário (4,8)   --l linhas   --e painel escuro (mostrador) */
:root{--v:#50D088;--ve:#2E7D57;--vc:#EAF8F0;--vm:#A9E9C6;--a:#F2B63D;--ae:#8A5A00;--ac:#FFF5DF;
  --t:#121212;--c:#6B7280;--l:#E6E9EE;--e:#121212}
*{box-sizing:border-box;margin:0;padding:0;transition:none!important;animation:none!important}
html,body{width:1280px;height:800px;overflow:hidden;background:#fff}
body{font-family:M,sans-serif;color:var(--t);-webkit-font-smoothing:antialiased}
#st{position:absolute;inset:0;overflow:hidden;background:
  radial-gradient(1100px 650px at 92% -12%,rgba(80,208,136,.09),transparent 62%),
  radial-gradient(900px 600px at -12% 112%,rgba(80,208,136,.06),transparent 60%),#fff}
.g{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:640px 400px}
.ab{position:absolute}
.row{display:flex;align-items:center}
/* título da cena: área (kicker) + conceito; sozinho fica grande no centro e sobe quando o desenho entra */
.kick{font-weight:700;font-size:15px;letter-spacing:.3em;color:var(--ve);text-transform:uppercase}
.h{font-weight:800;font-size:46px;letter-spacing:-.01em;line-height:1.1}
/* cartão, chip, etiqueta, ícone */
.card{position:absolute;background:#fff;border:1px solid #E1E8E4;border-radius:18px;
  box-shadow:0 18px 40px rgba(16,24,40,.10),0 3px 8px rgba(16,24,40,.06)}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:100%;height:100%}
.ico{display:flex;align-items:center;justify-content:center;flex:none;border-radius:14px;background:var(--vc);color:var(--ve)}
.ico.a{background:var(--ac);color:var(--ae)}
.tag{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;font-weight:800;font-size:20px;white-space:nowrap}
.tag.v{background:var(--vc);color:var(--ve)} .tag.a{background:var(--ac);color:var(--ae)}
.lbl{font-weight:700;font-size:17px;color:var(--c)}
.num{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.op{position:absolute;width:60px;height:60px;border-radius:50%;background:#F2F4F7;color:var(--t);display:flex;
  align-items:center;justify-content:center;font-weight:800;font-size:34px;line-height:1}
/* mostrador da balança (painel escuro, número no acento) */
.most{background:var(--e);border-radius:16px;padding:16px 22px 18px;box-shadow:0 16px 34px rgba(16,24,40,.22)}
.most .ml{position:relative;height:20px;font-weight:700;font-size:15px;letter-spacing:.22em;color:#A9E9C6;text-transform:uppercase}
.most .ml span{position:absolute;left:0;top:0;white-space:nowrap}
.most .mn{margin-top:6px;font-weight:800;font-size:44px;color:var(--v);font-variant-numeric:tabular-nums;white-space:nowrap}
.rip{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:3px solid var(--v);opacity:0}
/* T20: rótulo embaixo do desenho, legenda curta, chips (1 a 3 palavras), balão de conversa, selo redondo */
.rot{font-weight:800;font-size:23px;text-align:center;white-space:nowrap}
.sub{font-weight:700;font-size:20px;color:#4B5563;text-align:center;white-space:nowrap}
.tag.c{background:#F2F4F7;color:#4B5563}
.chip{display:inline-flex;align-items:center;gap:9px;padding:10px 19px 10px 16px;border-radius:999px;font-weight:800;font-size:20px;
  white-space:nowrap;background:#fff;border:1.5px solid #DDE5E0;color:var(--t);box-shadow:0 6px 14px rgba(16,24,40,.07)}
.chip.v{background:var(--vc);border-color:var(--vm);color:var(--ve)}
.chip.a{background:var(--ac);border-color:#F6D58E;color:var(--ae)}
.chip.c{background:#F2F4F7;border-color:#E1E5EA;color:#4B5563}
.chip.r{background:#FDECEA;border-color:#F6C5BF;color:#B42318}
.bal{position:absolute;background:#fff;border:1.5px solid #DCE4DF;border-radius:18px;box-shadow:0 12px 26px rgba(16,24,40,.10)}
.rabo{position:absolute;width:18px;height:18px;background:inherit;border-right:1.5px solid #DCE4DF;border-bottom:1.5px solid #DCE4DF}
.badge{position:absolute;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 14px rgba(16,24,40,.16)}
.badge.v{background:var(--vc);border:3px solid var(--v);color:var(--ve)}
.badge.a{background:var(--ac);border:3px solid var(--a);color:var(--ae)}
</style></head>
<body><div id="st"></div>
<script>
// ------------------------------------------------------------------ utilidades (as do cenas_modelo.html + as da EcoFlix)
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const pr=(t,a,d=.45)=>cl((t-a)/d);
const lerp=(a,b,p)=>a+(b-a)*p;
const $=s=>document.querySelector(s);
const ST=document.getElementById('st');
function el(html,parent=ST){const d=document.createElement('div');d.innerHTML=html.trim();let f=null;for(const n of [...d.childNodes]){parent.appendChild(n);if(!f&&n.nodeType===1)f=n}return f}
function grupo(){return el('<div class="g"></div>')}
function ic(n,px,cor){const s=(window.ICONS||{})[n]||'';return `<span class="ic" style="width:${px}px;height:${px}px;${cor?'color:'+cor:''}">${s}</span>`}
function hex(c){c=c.replace('#','');return[0,2,4].map(i=>parseInt(c.substr(i,2),16))}
function mix(a,b,p){const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*cl(p))).join(',')})`}
// aparece em a, some em b (opacidade + leve subida + escala): a entrada e a saída suaves de tudo
function vis(e,t,a,b=1e9,o={}){
  const din=o.din??.5,dout=o.dout??.4,dy=o.dy??16,dx=o.dx??0,sc=o.sc??.985;
  const p=eo(pr(t,a,din)),q=1-eo(pr(t,b,dout)),op=Math.min(p,q);
  e.style.opacity=op.toFixed(4);e.style.visibility=op<=.001?'hidden':'visible';
  const s=sc+(1-sc)*p - (1-q)*(1-sc);
  e.style.transform=`translate(${((1-p)*dx).toFixed(2)}px,${((1-p)*dy-(1-q)*dy*.5).toFixed(2)}px) scale(${s.toFixed(4)})`;
  return op;
}
function ripple(r,t,a){const p=pr(t,a,.7);r.style.opacity=(p>0&&p<1)?(.6*(1-p)).toFixed(3):0;r.style.transform=`scale(${(.4+2.0*eo(p)).toFixed(3)})`}
function pulse(e,t,a,amp=.045,dur=.9){const p=pr(t,a,dur);e.style.scale=(p>0&&p<1)?(1+amp*Math.sin(Math.PI*p)).toFixed(4):''}
function digita(e,txt,t,a,b){const p=cl((t-a)/Math.max(.05,b-a));const n=Math.round(p*txt.length);
  const car=(p>0&&p<1)||(Math.floor(t*2.2)%2===0&&p<1.2&&t>=a)?'<span style="color:var(--v);font-weight:500">|</span>':'';
  e.innerHTML=(txt.slice(0,n)||'')+(t>=a&&t<b+.8?car:'');}
// EcoFlix: números e dinheiro no jeito brasileiro; contagem suave de um número; traço que se desenha; arco; contorno
const NF=new Intl.NumberFormat('pt-BR');
const kg=v=>NF.format(Math.round(v))+' kg';
const brl=v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function conta(e,t,a,d,v0,v1,fmt=kg){const p=eo(pr(t,a,d));const s=fmt(lerp(v0,v1,p));if(e.textContent!==s)e.textContent=s;return p}
function traco(p,t,a,d=.8){if(!p._L){p._L=p.getTotalLength();p.style.strokeDasharray=p._L}const q=eio(pr(t,a,d));p.style.strokeDashoffset=(p._L*(1-q)).toFixed(2);p.style.opacity=q>0?1:0;return q}
function arco(e,t,a,d,x0,y0,x1,y1,h=-80,rot=0){const p=eio(pr(t,a,d));const x=lerp(x0,x1,p),y=lerp(y0,y1,p)+h*4*p*(1-p);
  e.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${(rot*p).toFixed(2)}deg)`;return p}
function contorno(e,t,a,de,para,d=.45){e.style.borderColor=mix(de,para,eo(pr(t,a,d)))}
// título padrão da cena: grande no centro enquanto está sozinho, sobe para o alto quando o desenho entra (em "sobe")
function titulo(g,kick,txt){return el(`<div class="ab" style="left:0;top:0;width:1280px;text-align:center">
  <div class="kick">${kick}</div><div class="h" style="margin-top:12px">${txt}</div></div>`,g)}
function posTitulo(e,t,a,sobe,sai=1e9){vis(e,t,a,sai,{dy:14});const p=eio(pr(t,sobe,.7));
  e.style.top=lerp(318,46,p).toFixed(2)+'px';e.style.scale=lerp(1.12,1,p).toFixed(4)}

// ------------------------------------------------------------------ tempos da fala (capNN.json do proc.py ou estimado)
let D=null;
const norm=w=>w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9%./-]+/g,'');
function W(linha,palavra,n=1,campo='s'){
  const alvo=norm(palavra);let k=0;
  for(const w of D.words){if(w.linha===linha&&norm(w.w).replace(/[.,]$/,'')===alvo){k++;if(k===n)return w[campo]}}
  for(const w of D.words){if(w.linha===linha&&norm(w.w).startsWith(alvo)){k++;if(k>=n)return w[campo]}}
  console.warn('palavra não achada',linha,palavra);return L(linha);
}
const L=i=>(D.linhas[i]||{s:0}).s, LE=i=>(D.linhas[i]||{e:D.dur}).e;

// ------------------------------------------------------------------ desenhos genéricos (sem marca)
// caminhão de lado (frente para a direita), com a carga de sucata em pedaços (.pd) que podem ser descarregados
function caminhao(){
  const pd=[ // [forma, cor, centro da peça, destino no monte atrás do caminhão (deslocamento do centro e giro)]
    ['<polygon points="28,90 44,52 88,42 100,90"/>','#8C5A3C',[64,66],[-224,148,6]],
    ['<polygon points="82,90 102,36 146,48 154,90"/>','#6F7983',[118,63],[-318,122,12]],
    ['<rect x="118" y="44" width="112" height="16" rx="8" transform="rotate(-8 174 52)"/>','#9AA3AD',[174,52],[-334,98,-18]],
    ['<polygon points="148,90 170,54 212,44 232,90"/>','#A0694A',[190,67],[-425,148,-8]],
    ['<polygon points="210,90 232,40 276,54 286,90"/>','#4F5861',[248,65],[-373,120,-10]],
    ['<polygon points="258,90 282,60 308,66 312,90"/>','#8A949E',[285,75],[-375,148,4]],
    ['<g><circle cx="192" cy="64" r="19"/><circle cx="192" cy="64" r="7" fill="#8A949E"/></g>','#5E6670',[192,64],[-242,155,200]],
    ['<polygon points="40,70 60,50 84,64 64,86"/>','#B07A55',[62,68],[-307,100,30]]];
  const pecas=pd.map(([f,c,[cx,cy],[dx,dy,r]])=>`<g class="pd" data-cx="${cx}" data-cy="${cy}" data-dx="${dx}" data-dy="${dy}" data-r="${r}" fill="${c}">${f}</g>`).join('');
  const roda=x=>`<g class="roda" data-x="${x}" transform="translate(${x},196)"><circle r="26" fill="#1B1F24"/><circle r="12" fill="#9AA3AD"/>
    <rect x="-2.5" y="-23" width="5" height="10" rx="2" fill="#5B636C"/><rect x="-2.5" y="13" width="5" height="10" rx="2" fill="#5B636C"/></g>`;
  return `<svg viewBox="0 0 500 230" width="500" height="230" style="overflow:visible">
    <g class="carga">${pecas}</g>
    <rect x="18" y="86" width="304" height="88" rx="6" fill="#7E8994"/>
    <rect x="16" y="82" width="308" height="11" rx="4" fill="#68727D"/>
    <g stroke="#707A85" stroke-width="3">${[78,138,198,258].map(x=>`<line x1="${x}" y1="98" x2="${x}" y2="168"/>`).join('')}</g>
    <path d="M334,176 L334,76 Q334,64 346,64 L412,64 L462,116 L472,121 Q480,124 480,134 L480,176 Z" fill="#2F3640"/>
    <path d="M348,78 L406,78 L444,116 L348,116 Z" fill="#D7E5ED"/>
    <rect x="470" y="142" width="10" height="11" rx="2" fill="#F2B63D"/>
    <rect x="12" y="170" width="472" height="15" rx="4" fill="#23282E"/>
    ${roda(92)}${roda(158)}${roda(416)}
  </svg>`;
}

// ------------------------------------------------------------------ T20: desenhos genéricos que faltavam no kit
// pessoa em pé, busto (avatar), celular e monitor com a tela lisa (nunca a página do app), escritório, galpão com fardos, chave,
// porta que abre, QR de enfeite, folha A4 (comprovante), cupom térmico, envelope, pasta, foto de carga, chip, X, voo, pulsos.
let UID=0; const uid=p=>`${p}${++UID}`;
const PELE='#E8B791', CAB='#3A2B22';
const PAP=['#C9A57C','#9B7A55'], PETc=['#A9D3E6','#6E9FB6'], LAT=['#C6CDD5','#8A949E'];
function pessoa(cor='#5C8FD6',esc='#4A78BA',cel=false,w=80){             // 80x170 na escala 1, os pés em y 164
  return `<svg viewBox="0 0 80 170" width="${w}" height="${(w*170/80).toFixed(1)}" style="display:block;overflow:visible">
    <rect x="23" y="100" width="15" height="64" rx="7" fill="#3B4A5C"/><rect x="42" y="100" width="15" height="64" rx="7" fill="#3B4A5C"/>
    <path d="M21,52 L14,98" stroke="${esc}" stroke-width="11" stroke-linecap="round" fill="none"/>
    ${cel?'':`<path d="M59,52 L66,98" stroke="${esc}" stroke-width="11" stroke-linecap="round" fill="none"/>`}
    <path d="M16,60 Q16,40 36,40 L44,40 Q64,40 64,60 L64,110 L16,110 Z" fill="${cor}"/>
    ${cel?`<path d="M59,50 Q77,68 61,80" stroke="${esc}" stroke-width="11" stroke-linecap="round" fill="none"/>
      <g transform="rotate(-14 55 64)"><rect x="46" y="48" width="18" height="31" rx="3.5" fill="#1F2630"/><rect x="48.5" y="51" width="13" height="24" rx="2" fill="#DDEFE5"/></g>`:''}
    <circle cx="40" cy="21" r="16" fill="${PELE}"/><path d="M24,21 Q23,4 40,4 Q57,4 56,21 Q50,12 40,12 Q30,12 24,21 Z" fill="${CAB}"/>
  </svg>`;
}
function busto(px,cor='#5C8FD6',fundo='#EEF1F4'){
  return `<svg viewBox="0 0 100 100" width="${px}" height="${px}" style="display:block;flex:none"><circle cx="50" cy="50" r="50" fill="${fundo}"/>
    <path d="M21,87 Q23,61 50,60 Q77,61 79,87 Q66,99 50,99 Q34,99 21,87 Z" fill="${cor}"/>
    <circle cx="50" cy="38" r="17" fill="${PELE}"/><path d="M33,38 Q32,20 50,20 Q68,20 67,38 Q60,29 50,29 Q40,29 33,38 Z" fill="${CAB}"/></svg>`;
}
function celular(w=130){const h=Math.round(w*240/130), g=uid('cg'), c=uid('cc');   // 130x240 na escala 1
  return `<svg viewBox="0 0 130 240" width="${w}" height="${h}" style="display:block;overflow:visible">
    <defs><linearGradient id="${g}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6FBF8"/><stop offset="1" stop-color="#D9EEE2"/></linearGradient>
      <clipPath id="${c}"><rect x="8" y="10" width="114" height="220" rx="16"/></clipPath></defs>
    <rect x="0" y="0" width="130" height="240" rx="22" fill="#1F2630"/>
    <g clip-path="url(#${c})"><rect x="8" y="10" width="114" height="220" fill="url(#${g})"/><polygon points="80,10 114,10 30,230 -4,230" fill="#fff" opacity=".45"/></g>
    <rect x="49" y="17" width="32" height="7" rx="3.5" fill="#1F2630"/>
  </svg>`;
}
function monitor(w=340){const h=Math.round(w*250/340), g=uid('mg');           // 340x250 na escala 1
  return `<svg viewBox="0 0 340 250" width="${w}" height="${h}" style="display:block">
    <defs><linearGradient id="${g}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F6FBF8"/><stop offset="1" stop-color="#D9EEE2"/></linearGradient></defs>
    <rect x="148" y="205" width="44" height="30" fill="#A8B0B9"/><rect x="104" y="232" width="132" height="14" rx="7" fill="#C3CAD2"/>
    <rect x="0" y="0" width="340" height="212" rx="14" fill="#1F2630"/>
    <rect x="11" y="11" width="318" height="186" rx="7" fill="url(#${g})"/>
    <polygon points="196,11 252,11 130,197 74,197" fill="#fff" opacity=".4"/>
  </svg>`;
}
function fardo(x,y,w,h,c,f){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${c}"/>
  <rect x="${(x+w*.26).toFixed(1)}" y="${y}" width="4" height="${h}" fill="${f}"/><rect x="${(x+w*.66).toFixed(1)}" y="${y}" width="4" height="${h}" fill="${f}"/>`}
function escritorio(w=230){                                                 // 230x230 na escala 1
  const jan=(x,y)=>`<rect x="${x}" y="${y}" width="42" height="36" rx="3" fill="#B8D4E6"/><rect x="${x}" y="${y+16}" width="42" height="3" fill="#9DBDD2"/>`;
  return `<svg viewBox="0 0 230 230" width="${w}" height="${w}" style="display:block">
    <rect x="12" y="34" width="206" height="196" rx="4" fill="#E2E7EC"/><rect x="0" y="22" width="230" height="16" rx="4" fill="#BAC4CE"/>
    ${[34,94,154].map(x=>jan(x,58)+jan(x,112)).join('')}
    <rect x="66" y="152" width="98" height="10" rx="3" fill="#fff"/>
    <rect x="93" y="170" width="44" height="60" rx="3" fill="#6B7A8A"/><circle cx="129" cy="202" r="3" fill="#E2E7EC"/>
  </svg>`;
}
function galpao(w=290){                                                     // 290x230 na escala 1, fardos de papelão e PET
  return `<svg viewBox="0 0 290 230" width="${w}" height="${(w*230/290).toFixed(1)}" style="display:block">
    <path d="M16,92 L145,36 L274,92 L274,230 L16,230 Z" fill="#D3DAE1"/>
    <path d="M0,88 L145,24 L290,88 L290,100 L145,36 L0,100 Z" fill="#7E8994"/>
    <rect x="80" y="112" width="130" height="118" rx="3" fill="#3B4450"/>
    ${fardo(88,192,56,38,...PAP)}${fardo(146,192,56,38,...PETc)}${fardo(104,152,56,38,...PAP)}
    ${fardo(222,194,50,36,...PAP)}${fardo(228,158,44,34,...PETc)}
  </svg>`;
}
function chave(w=200){const h=w*.4, k=w/200;                                 // a ponta para a esquerda, o elo do link na cabeça
  return `<div style="position:relative;width:${w}px;height:${h}px">
    <svg viewBox="0 0 200 80" width="${w}" height="${h}" style="display:block;overflow:visible">
      <rect x="8" y="33" width="130" height="14" rx="5" fill="#3FB877"/>
      <rect x="24" y="45" width="11" height="22" rx="2" fill="#3FB877"/><rect x="44" y="45" width="11" height="16" rx="2" fill="#3FB877"/>

function qr(px,sem=7){let s=sem>>>0;const r=()=>(s=(Math.imul(s,1664525)+1013904223)>>>0)/4294967296;const N=21;let q='';

// ------------------------------------------------------------------ CAPS[10] · Fotos no pedido (fala 0 e 1) e Dois links (fala 5 e 6)
// 0 "Agora, as fotos. Elas entram na compra ou na venda, em Opções avançadas, no Anexar." 1 "E quem aponta o celular pro QR Code
// do comprovante cai numa página só com as fotos daquele pedido."
// 5 "Uma dica: são dois links diferentes. O de fotos mostra só aquele pedido. O do portal mostra o histórico inteiro do parceiro,
// então cuida mais dele." 6 "E no comprovante que sai no caixa, o QR Code leva o parceiro pro portal dele, já aberto naquele pedido."
// As falas 0 e 1 viram uma cena só (as duas marcações vêm em linhas seguidas: duas janelas coladas piscariam a tela entre elas).
CAPS[10]=()=>{
  // ---- cena A: fotos no pedido e o QR do comprovante
  const gA=grupo();
  const titA=titulo(gA,'Fotos','Fotos no pedido');
  const pedA=el(`<div class="card" style="left:56px;top:184px;width:388px;height:320px;padding:24px 28px">
      <div class="row" style="gap:16px"><div class="ico" style="width:54px;height:54px;background:#EEF1F4;color:#4B5563">${ic('clipboard-list',30)}</div>
        <div style="font-weight:800;font-size:26px">Pedido</div></div>
      ${barra(28,98,230,'#E1E6EB',10)}${barra(28,120,170,'#EEF1F4',10)}
      ${[0,1,2].map(i=>`<div class="ab" style="left:${28+i*110}px;top:152px;width:96px;height:72px;border-radius:9px;border:2px dashed #CBD3DB"></div>`).join('')}</div>`,gA);
  const tC=el(chip('Compra','a'),pedA), tVd=el(chip('Venda','v'),pedA);
  for(const [c,x] of [[tC,28],[tVd,150]]){c.style.position='absolute';c.style.left=x+'px';c.style.top='250px';c.style.fontSize='19px';c.style.padding='8px 16px'}
  const cam=el(`<div class="ab row" style="left:20px;top:536px;width:460px;justify-content:center;gap:8px"></div>`,gA);
  const op1=el(chip('Opções avançadas','c','sliders-horizontal'),cam), sv=el(`<div>${ic('chevron-right',26,'#9AA3AD')}</div>`,cam), op2=el(chip('Anexar','v','camera'),cam);
  const TIP=['papelao','pet','latinha'];
  const FT=TIP.map(k=>el(`<div class="ab" style="left:0;top:0;visibility:hidden">${foto(k,140)}</div>`,gA));     // 140x106
  const F0=[[506,196,-6],[574,300,4],[512,404,-3]];                                // fotos soltas (canto, giro)
  const SLOT=[0,1,2].map(i=>[56+1+28+i*110+48-70, 184+1+152+36-53]);               // canto da foto (escala .686) centrada na vaga
  const a4=el(`<div class="ab" style="left:632px;top:194px">${folhaA4(224)}</div>`,gA);       // 632-856, 194-511; QR 76 px no canto
  const ligA=el(`<svg class="ab" style="left:0;top:0;overflow:visible" width="1280" height="800">
      <path d="M450 350 L622 350" fill="none" stroke="#9AA3AD" stroke-width="4" stroke-linecap="round"/>
      <path d="M608 339 L623 350 L608 361" fill="none" stroke="#9AA3AD" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,gA);
  const [lap,lah]=ligA.querySelectorAll('path');
  const celW=el('<div class="ab" style="left:0;top:0;transform:translate(1046px,240px) rotate(-10deg);transform-origin:70px 129px"></div>',gA);
  const celA=el(`<div>${celular(140)}</div>`,celW);
  const brilho=el(`<div class="ab" style="left:9px;top:11px;width:122px;height:236px;border-radius:17px;opacity:0;
      background:radial-gradient(120% 80% at 50% 40%,rgba(80,208,136,.6),rgba(80,208,136,0) 72%)"></div>`,celW);
  const raio=el(`<svg class="ab" style="left:0;top:0;overflow:visible;opacity:0" width="1280" height="800">
      <polygon points="1058,330 844,414 844,500 1058,358" fill="rgba(80,208,136,.22)"/></svg>`,gA);
  const FC=TIP.map(k=>el(`<div class="ab" style="left:0;top:0;visibility:hidden">${foto(k,118)}</div>`,gA));     // 118x90
  const FC1=[[880,144,-7],[994,130,3],[1108,146,7]];
  // ---- cena B: dois links diferentes
  const gB=grupo();
  const titB=titulo(gB,'Fotos','Dois links diferentes');
  const env=el(`<div class="ab" style="left:84px;top:210px">${envelope(330)}</div>`,gB);       // 84-414, 210-481
  const tgEw=el('<div class="ab" style="left:84px;top:500px;width:330px"></div>',gB);
  const tgE=el('<div style="display:flex;justify-content:center"><div class="tag v" style="font-size:22px">Link de fotos</div></div>',tgEw);
  const sbE=el('<div class="ab sub" style="left:84px;top:558px;width:330px">só aquele pedido</div>',gB);
  const pasW=el('<div class="ab" style="left:820px;top:200px"></div>',gB), pas=el(`<div>${pasta(400)}</div>`,pasW);   // 820-1220, 200-520
  const tgPw=el('<div class="ab" style="left:820px;top:538px;width:400px"></div>',gB);
  const tgP=el('<div style="display:flex;justify-content:center"><div class="tag a" style="font-size:22px">Link do portal</div></div>',tgPw);
  const sbP=el('<div class="ab sub" style="left:820px;top:596px;width:400px">histórico inteiro</div>',gB);
  const cadB=el(`<div class="badge a" style="left:988px;top:372px;width:64px;height:64px">${ic('lock',30)}</div>`,gB);
  const cup=el(`<div class="ab" style="left:548px;top:300px">${cupom(184,320)}</div>`,gB);      // 548-732, 300-620
  const ligB=el(`<svg class="ab" style="left:0;top:0;overflow:visible" width="1280" height="800">
      <path d="M738 470 C 772 470, 784 440, 818 426" fill="none" stroke="var(--a)" stroke-width="4" stroke-linecap="round"/>
      <path d="M802 419 L820 425 L810 441" fill="none" stroke="var(--a)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`,gB);
  const [lbp,lbh]=ligB.querySelectorAll('path');
  const folB=el(`<div class="ab" style="left:914px;top:168px;width:212px;height:122px;background:#fff;border-radius:9px;border:2.5px solid var(--v);
      box-shadow:0 10px 22px rgba(16,24,40,.12)">${barra(18,18,100,'#CBD3DB',10)}${barra(18,38,150)}</div>`,gB);
  const pedB=el(chip('pedido','v','clipboard-list',20),folB); pedB.style.position='absolute'; pedB.style.left='18px'; pedB.style.top='60px';
  // as duas etiquetas nascem lado a lado no meio ("dois links") e vão para baixo do desenho de cada uma
  const TE=[515-249,404-523], TP=[757-1020,404-561];

  return t=>{
    // cena A
    const a0=W(0,'Agora'), afo=W(0,'fotos'), aco=W(0,'compra'), ave=W(0,'venda'), aop=W(0,'Opcoes'), aan=W(0,'Anexar'),
      ace=W(1,'celular'), aqr=W(1,'QR'), acp=W(1,'comprovante'), apg=W(1,'pagina'), af2=W(1,'fotos'), fimA=W(1,'pedido',1,'e')+.65;
    gA.style.display=t<=fimA+.05?'block':'none';
    posTitulo(titA,t,a0-.85,afo-.55);
    FT.forEach((e,i)=>{const [x0,y0,r0]=F0[i], [x1,y1]=SLOT[i];
      const p=eio(pr(t,aan+.05+i*.15,.75)), en=eo(pr(t,afo-.1+i*.12,.45));
      poe(e,lerp(x0,x1,p),lerp(y0,y1,p)-60*4*p*(1-p)+(1-en)*16,lerp(.96+.04*en,.686,p),en,lerp(r0,0,p))});
    vis(pedA,t,aco-.2,1e9,{dx:-20,dy:0}); vis(tC,t,aco-.05,1e9,{sc:.8,dy:0}); vis(tVd,t,ave-.05,1e9,{sc:.8,dy:0});
    vis(op1,t,aop-.1,1e9,{dy:10}); vis(sv,t,aan-.25,1e9,{dx:-8,dy:0}); vis(op2,t,aan-.15,1e9,{dy:10}); pulsos(op2,t,[aan+.1],.06,.7);
    vis(celA,t,ace-.15,1e9,{dx:30,dy:0});
    vis(a4,t,aqr-.15,1e9,{dy:18}); pulsos(a4.querySelector('.qrA'),t,[aqr+.3],.1,.8);
    raio.style.opacity=(eo(pr(t,aqr+.35,.4))*.95).toFixed(3);
    traco(lap,t,acp-.1,.6); lah.style.opacity=eo(pr(t,acp+.4,.2)).toFixed(3);
    brilho.style.opacity=eo(pr(t,apg-.1,.45)).toFixed(3);
    FC.forEach((e,i)=>{const [x1,y1,r]=FC1[i], a=af2-.15+i*.14; const [x,y,p]=voo(t,a,.75,1057,324,x1,y1,-40);
      poe(e,x,y,lerp(.4,1,eo(p)),t<a?0:eo(cl((t-a)/.2)),r*p)});
    // cena B
    const b0=W(5,'Uma'), bdo=W(5,'dois'), bfo=W(5,'fotos'), bpe=W(5,'pedido'), bpo=W(5,'portal'), bhi=W(5,'historico'), bcu=W(5,'cuida'),
      bcp=W(6,'comprovante'), bcx=W(6,'caixa'), bqr=W(6,'QR'), ble=W(6,'leva'), bp2=W(6,'portal'), bab=W(6,'aberto'), bpd=W(6,'pedido');
    gB.style.display=t>=b0-1.2?'block':'none';
    posTitulo(titB,t,b0-.85,bdo-.55);
    vis(tgE,t,bdo-.1,1e9,{dy:10}); vis(tgP,t,bdo+.05,1e9,{dy:10});
    const me=eio(pr(t,bfo-.2,.7)), mp=eio(pr(t,bpo-.2,.7));
    tgEw.style.transform=`translate(${(TE[0]*(1-me)).toFixed(1)}px,${(TE[1]*(1-me)).toFixed(1)}px)`;
    tgPw.style.transform=`translate(${(TP[0]*(1-mp)).toFixed(1)}px,${(TP[1]*(1-mp)).toFixed(1)}px)`;
    vis(env,t,bfo-.1,1e9,{dy:18}); vis(sbE,t,bpe-.1,1e9,{dy:8});
    vis(pas,t,bpo-.1,1e9,{dy:18}); vis(sbP,t,bhi-.1,1e9,{dy:8});
    vis(cadB,t,bcu-.05,1e9,{sc:.5,dy:0});
    const cu=eo(pr(t,bcu-.05,.45)); pas.style.filter=`drop-shadow(0 0 ${(14*cu).toFixed(1)}px rgba(242,182,61,${(.55*cu).toFixed(3)}))`;
    vis(cup,t,bcp-.15,1e9,{dy:20}); pulsos(cup,t,[bcx],.03,.7); pulsos(cup.querySelector('.qrC'),t,[bqr],.1,.8);
    traco(lbp,t,ble-.1,.6); lbh.style.opacity=eo(pr(t,ble+.4,.2)).toFixed(3); pulsos(pasW,t,[bp2],.03,.8);
    const ab=eio(pr(t,bab-.1,.6)); folB.style.opacity=ab.toFixed(3); folB.style.visibility=ab<=.001?'hidden':'visible';
    folB.style.transform=`translateY(${lerp(120,0,ab).toFixed(2)}px)`;
    vis(pedB,t,bpd-.15,1e9,{sc:.8,dy:0});
  };
};

// ------------------------------------------------------------------ API para o renderizador
let RENDER=null;
window.setup=d=>{D=d;ST.innerHTML='';RENDER=CAPS[d.cap]();return true};
window.R=t=>{RENDER(t);return true};
</script></body></html>
