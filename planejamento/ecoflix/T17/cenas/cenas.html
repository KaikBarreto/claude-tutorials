<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- T17 · Transporte, serviço e o contador: cenas de conceito (cópia do kit perfis/ecoflix/cenas/cenas_ecoflix.html, com
     os dois exemplos tirados e os CAPS desta aula). 1280x800 CSS, quadro a quadro pelo render_cenas.cjs; tudo é função
     do tempo e cada mudança presa a uma palavra da fala (W(linha, 'palavra')), lida do tempos/capNN.json (estimado até a
     voz chegar). Janelas de cada cena: ilustracoes.json (de/ate/cauda). Fiscal do exemplo em Lucro Real (não aparece):
     a cena não ensina regra; mostra o que a fala diz. -->
<style>
@font-face{font-family:M;font-weight:500;src:url(../../../web/fonts/montserrat-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:600;src:url(../../../web/fonts/montserrat-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:700;src:url(../../../web/fonts/montserrat-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:800;src:url(../../../web/fonts/montserrat-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:500;src:url(../../../web/fonts/montserrat-latin-ext-500-normal.woff2) format('woff2');unicode-range:U+0100-024F}
@font-face{font-family:M;font-weight:700;src:url(../../../web/fonts/montserrat-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-024F}
/* ---------------------------------------------------------------- paleta EcoFlix (marca: acento #50D088, escuro #121212)
   --v  acento: preenchimentos, barras, contornos de destaque (nunca texto sobre branco: contraste baixo)
   --ve verde escuro: texto e ícone verde sobre branco (contraste 5,0)   --vc verde claro: fundo de ícone/resultado
   --a  âmbar: o SEGUNDO conceito da cena (ex.: competência x caixa)     --ae texto âmbar (5,9)   --ac âmbar claro
   --t  texto (o escuro da marca)   --c texto secundário (4,8)   --l linhas   --e painel escuro (mostrador) */
:root{--v:#50D088;--ve:#2E7D57;--vc:#EAF8F0;--vm:#A9E9C6;--a:#F2B63D;--ae:#8A5A00;--ac:#FFF5DF;
  --t:#121212;--c:#6B7280;--l:#E6E9EE;--e:#121212}
*{box-sizing:border-box;margin:0;padding:0;transition:none!important;animation:none!important}
html,body{width:1280px;height:800px;overflow:hidden;background:#fff}
body{font-family:M,sans-serif;color:var(--t);-webkit-font-smoothing:antialiased}
#st{position:absolute;inset:0;overflow:hidden;background:
  radial-gradient(1100px 650px at 92% -12%,rgba(80,208,136,.09),transparent 62%),
  radial-gradient(900px 600px at -12% 112%,rgba(80,208,136,.06),transparent 60%),#fff}
.eco-grupo{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:640px 400px}
.ab{position:absolute}
.row{display:flex;align-items:center}
/* título da cena: área (kicker) + conceito; sozinho fica grande no centro e sobe quando o desenho entra */
.kick{font-weight:700;font-size:15px;letter-spacing:.3em;color:var(--ve);text-transform:uppercase}
.h{font-weight:800;font-size:46px;letter-spacing:-.01em;line-height:1.1}
/* cartão, chip, etiqueta, ícone */
.card{position:absolute;background:#fff;border:1px solid #E1E8E4;border-radius:18px;
  box-shadow:0 18px 40px rgba(16,24,40,.10),0 3px 8px rgba(16,24,40,.06)}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:100%;height:100%}
.ico{display:flex;align-items:center;justify-content:center;flex:none;border-radius:14px;background:var(--vc);color:var(--ve)}
.ico.a{background:var(--ac);color:var(--ae)}
.tag{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;font-weight:800;font-size:20px;white-space:nowrap}
.tag.v{background:var(--vc);color:var(--ve)} .tag.a{background:var(--ac);color:var(--ae)}
.lbl{font-weight:700;font-size:17px;color:var(--c)}
.num{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.op{position:absolute;width:60px;height:60px;border-radius:50%;background:#F2F4F7;color:var(--t);display:flex;
  align-items:center;justify-content:center;font-weight:800;font-size:34px;line-height:1}
/* mostrador da balança (painel escuro, número no acento) */
.most{background:var(--e);border-radius:16px;padding:16px 22px 18px;box-shadow:0 16px 34px rgba(16,24,40,.22)}
.most .ml{position:relative;height:20px;font-weight:700;font-size:15px;letter-spacing:.22em;color:#A9E9C6;text-transform:uppercase}
.most .ml span{position:absolute;left:0;top:0;white-space:nowrap}
.most .mn{margin-top:6px;font-weight:800;font-size:44px;color:var(--v);font-variant-numeric:tabular-nums;white-space:nowrap}
.rip{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:3px solid var(--v);opacity:0}
</style><style id="saturado">/* estilo saturado (Kaik, 11/11): selo, chip, etiqueta, quadrado de ícone e círculo de etapa
   com fundo cheio e ícone/texto branco; nunca fundo claro com conteúdo colorido, nunca ícone escuro sobre o verde */
:root{--vs:#50D088;--as:#F2B63D;--rs:#EF4444}
.ico{background:var(--vs);color:#fff}.ico.a{background:var(--as);color:#fff}
.tag.v{background:var(--vs);color:#fff}.tag.a{background:var(--as);color:#fff}
</style></head>
<body><div id="st"></div>
<script>
// ------------------------------------------------------------------ utilidades (as do cenas_modelo.html + as da EcoFlix)
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const pr=(t,a,d=.45)=>cl((t-a)/d);
const lerp=(a,b,p)=>a+(b-a)*p;
const $=s=>document.querySelector(s);
const ST=document.getElementById('st');
function el(html,parent=ST){const d=document.createElement('div');d.innerHTML=html.trim();let f=null;for(const n of [...d.childNodes]){parent.appendChild(n);if(!f&&n.nodeType===1)f=n}return f}
function grupo(){return el('<div class="eco-grupo"></div>')}
function ic(n,px,cor){const s=(window.ICONS||{})[n]||'';return `<span class="ic" style="width:${px}px;height:${px}px;${cor?'color:'+cor:''}">${s}</span>`}
function hex(c){c=c.replace('#','');return[0,2,4].map(i=>parseInt(c.substr(i,2),16))}
function mix(a,b,p){const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*cl(p))).join(',')})`}
// aparece em a, some em b (opacidade + leve subida + escala): a entrada e a saída suaves de tudo
function vis(e,t,a,b=1e9,o={}){
  const din=o.din??.5,dout=o.dout??.4,dy=o.dy??16,dx=o.dx??0,sc=o.sc??.985;
  const p=eo(pr(t,a,din)),q=1-eo(pr(t,b,dout)),op=Math.min(p,q);
  e.style.opacity=op.toFixed(4);e.style.visibility=op<=.001?'hidden':'visible';
  const s=sc+(1-sc)*p - (1-q)*(1-sc);
  e.style.transform=`translate(${((1-p)*dx).toFixed(2)}px,${((1-p)*dy-(1-q)*dy*.5).toFixed(2)}px) scale(${s.toFixed(4)})`;
  return op;
}
function ripple(r,t,a){const p=pr(t,a,.7);r.style.opacity=(p>0&&p<1)?(.6*(1-p)).toFixed(3):0;r.style.transform=`scale(${(.4+2.0*eo(p)).toFixed(3)})`}
function pulse(e,t,a,amp=.045,dur=.9){
  const p=pr(t,a,dur),f=(p>0&&p<1)?1+amp*Math.sin(Math.PI*p):1,c=e.style.transform;
  const meu=e._pw!==undefined&&c===e._pw, base=meu?e._pb:c;
  if(!meu||e._pt!==t)e._pm={};                       // quadro novo (ou o transform foi reescrito): recomeça os pulsos
  e._pm[`${a}|${amp}|${dur}`]=f;e._pt=t;e._pb=base;  // a mesma chamada repetida no mesmo t não se acumula
  let k=1;for(const v of Object.values(e._pm))k*=v;
  e.style.transform=k===1?base:(base?base+' ':'')+`scale(${k.toFixed(4)})`;e._pw=e.style.transform}
function digita(e,txt,t,a,b){const p=cl((t-a)/Math.max(.05,b-a));const n=Math.round(p*txt.length);
  const car=(p>0&&p<1)||(Math.floor(t*2.2)%2===0&&p<1.2&&t>=a)?'<span style="color:var(--v);font-weight:500">|</span>':'';
  e.innerHTML=(txt.slice(0,n)||'')+(t>=a&&t<b+.8?car:'');}
// EcoFlix: números e dinheiro no jeito brasileiro; contagem suave de um número; traço que se desenha; arco; contorno
const NF=new Intl.NumberFormat('pt-BR');
const kg=v=>NF.format(Math.round(v))+' kg';
const brl=v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function conta(e,t,a,d,v0,v1,fmt=kg){const p=eo(pr(t,a,d));const s=fmt(lerp(v0,v1,p));if(e.textContent!==s)e.textContent=s;return p}
function traco(p,t,a,d=.8){if(!p._L){p._L=p.getTotalLength();p.style.strokeDasharray=p._L}const q=eio(pr(t,a,d));p.style.strokeDashoffset=(p._L*(1-q)).toFixed(2);p.style.opacity=q>0?1:0;return q}
function arco(e,t,a,d,x0,y0,x1,y1,h=-80,rot=0){const p=eio(pr(t,a,d));const x=lerp(x0,x1,p),y=lerp(y0,y1,p)+h*4*p*(1-p);
  e.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${(rot*p).toFixed(2)}deg)`;return p}
function contorno(e,t,a,de,para,d=.45){e.style.borderColor=mix(de,para,eo(pr(t,a,d)))}
// título padrão da cena: grande no centro enquanto está sozinho, sobe para o alto quando o desenho entra (em "sobe")
function titulo(g,kick,txt){return el(`<div class="ab" style="left:0;top:0;width:1280px;text-align:center">
  <div class="kick">${kick}</div><div class="h" style="margin-top:12px">${txt}</div></div>`,g)}
function posTitulo(e,t,a,sobe,sai=1e9){vis(e,t,a,sai,{dy:14});const p=eio(pr(t,sobe,.7));
  e.style.top=lerp(318,46,p).toFixed(2)+'px';e.style.scale=lerp(1.12,1,p).toFixed(4)}

// ------------------------------------------------------------------ tempos da fala (capNN.json do proc.py ou estimado)
let D=null;
const norm=w=>w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9%./-]+/g,'');
function W(linha,palavra,n=1,campo='s'){
  const alvo=norm(palavra);let k=0;
  for(const w of D.words){if(w.linha===linha&&norm(w.w).replace(/[.,]$/,'')===alvo){k++;if(k===n)return w[campo]}}
  for(const w of D.words){if(w.linha===linha&&norm(w.w).startsWith(alvo)){k++;if(k>=n)return w[campo]}}
  console.warn('palavra não achada',linha,palavra);return L(linha);
}
const L=i=>(D.linhas[i]||{s:0}).s, LE=i=>(D.linhas[i]||{e:D.dur}).e;

// ------------------------------------------------------------------ desenhos genéricos (sem marca)
// caminhão de lado (frente para a direita), com a carga de sucata em pedaços (.pd) que podem ser descarregados
function caminhao(){
  const pd=[ // [forma, cor, centro da peça, destino no monte atrás do caminhão (deslocamento do centro e giro)]
    ['<polygon points="28,90 44,52 88,42 100,90"/>','#8C5A3C',[64,66],[-224,148,6]],
    ['<polygon points="82,90 102,36 146,48 154,90"/>','#6F7983',[118,63],[-318,122,12]],
    ['<rect x="118" y="44" width="112" height="16" rx="8" transform="rotate(-8 174 52)"/>','#9AA3AD',[174,52],[-334,98,-18]],
    ['<polygon points="148,90 170,54 212,44 232,90"/>','#A0694A',[190,67],[-425,148,-8]],
    ['<polygon points="210,90 232,40 276,54 286,90"/>','#4F5861',[248,65],[-373,120,-10]],
    ['<polygon points="258,90 282,60 308,66 312,90"/>','#8A949E',[285,75],[-375,148,4]],
    ['<g><circle cx="192" cy="64" r="19"/><circle cx="192" cy="64" r="7" fill="#8A949E"/></g>','#5E6670',[192,64],[-242,155,200]],
    ['<polygon points="40,70 60,50 84,64 64,86"/>','#B07A55',[62,68],[-307,100,30]]];
  const pecas=pd.map(([f,c,[cx,cy],[dx,dy,r]])=>`<g class="pd" data-cx="${cx}" data-cy="${cy}" data-dx="${dx}" data-dy="${dy-16}" data-r="${r}" fill="${c}">${f}</g>`).join('');
  const roda=x=>`<g class="roda" data-x="${x}" transform="translate(${x},196)"><circle r="26" fill="#1B1F24"/><circle r="12" fill="#9AA3AD"/>
    <rect x="-2.5" y="-23" width="5" height="10" rx="2" fill="#5B636C"/><rect x="-2.5" y="13" width="5" height="10" rx="2" fill="#5B636C"/></g>`;
  return `<svg viewBox="0 0 500 230" width="500" height="230" style="overflow:visible">
    <g class="carga">${pecas}</g>
    <rect x="18" y="86" width="304" height="88" rx="6" fill="#7E8994"/>
    <rect x="16" y="82" width="308" height="11" rx="4" fill="#68727D"/>
    <g stroke="#707A85" stroke-width="3">${[78,138,198,258].map(x=>`<line x1="${x}" y1="98" x2="${x}" y2="168"/>`).join('')}</g>
    <path d="M334,176 L334,76 Q334,64 346,64 L412,64 L462,116 L472,121 Q480,124 480,134 L480,176 Z" fill="#2F3640"/>
    <path d="M348,78 L406,78 L444,116 L348,116 Z" fill="#D7E5ED"/>
    <rect x="470" y="142" width="10" height="11" rx="2" fill="#F2B63D"/>
    <rect x="12" y="170" width="472" height="15" rx="4" fill="#23282E"/>
    ${roda(92)}${roda(158)}${roda(416)}
  </svg>`;
}

// ------------------------------------------------------------------ desenhos desta aula (T17), no traço do kit
// (faltavam no kit: carga de alumínio, caçamba, placa, folha de documento, pasta e o caminhão com outra carga)
function escala(svg,w){return svg.replace('width="500" height="230"',`width="${w}" height="${Math.round(w*230/500)}"`)}
// o caminhão do kit com outra carga (a caçamba e as rodas são as mesmas)
function caminhaoCom(carga){let s=caminhao();const a=s.indexOf('<g class="carga">'),b=s.indexOf('<rect x="18" y="86"');
  return s.slice(0,a)+`<g class="carga" style="transform-box:fill-box;transform-origin:center">${carga}</g>\n    `+s.slice(b)}
// alumínio de duas vendas: um feixe de perfis (à esquerda) e blocos prensados (à direita)
function cargaAluminio(){
  const barras=[0,1,2,3,4].map(i=>`<rect x="30" y="${44+i*9}" width="136" height="8" rx="4" fill="${i%2?'#D6DCE2':'#C4CCD4'}" stroke="#8E9AA6" stroke-width="1.4"/>`).join('');
  const cinta=x=>`<rect x="${x}" y="39" width="7" height="51" rx="2" fill="#6F7B87"/>`;
  const bloco=(x,y,c)=>`<rect x="${x}" y="${y}" width="66" height="34" rx="4" fill="${c}" stroke="#7E8A96" stroke-width="2"/>
    <line x1="${x+9}" y1="${y+12}" x2="${x+57}" y2="${y+12}" stroke="#8E9AA6" stroke-width="2"/><line x1="${x+9}" y1="${y+22}" x2="${x+57}" y2="${y+22}" stroke="#8E9AA6" stroke-width="2"/>`;
  return `<g class="perfil">${barras}${cinta(62)}${cinta(130)}</g><g class="bloco">${bloco(176,54,'#AEB8C2')}${bloco(246,54,'#B9C2CB')}${bloco(211,20,'#A5AFB9')}</g>`;
}
// caçamba estacionária (sem marca), com sucata por cima; 240 x 150, os pés no y 146
function cacamba(){return `<svg viewBox="0 0 240 150" width="240" height="150" style="overflow:visible">
  <polygon points="66,42 92,16 126,30 118,44" fill="#7E8994"/><polygon points="118,44 148,14 176,26 168,44" fill="#9AA3AD"/>
  <rect x="94" y="28" width="74" height="11" rx="5" transform="rotate(-10 131 33)" fill="#8C5A3C"/>
  <polygon points="14,40 226,40 204,132 36,132" fill="#5E6B78"/><polygon points="14,40 226,40 222,56 18,56" fill="#4C5764"/>
  <rect x="30" y="76" width="180" height="13" fill="#F2B63D"/>
  ${[66,102,138,174].map(x=>`<line x1="${x}" y1="58" x2="${(x-(x-120)*.12).toFixed(1)}" y2="128" stroke="#4C5764" stroke-width="4"/>`).join('')}
  <rect x="46" y="132" width="26" height="14" rx="3" fill="#2F3640"/><rect x="168" y="132" width="26" height="14" rx="3" fill="#2F3640"/></svg>`}
// placa genérica (sem faixa nem bandeira)
const placa=(p,px=18)=>`<div style="display:inline-flex;align-items:center;justify-content:center;padding:3px 12px;border:2.5px solid #1F2933;
  border-radius:7px;background:#fff;font-weight:800;font-size:${px}px;letter-spacing:.08em;color:#121212;white-space:nowrap">${p}</div>`;
// pasta (desenho) na cor do conceito
function pastaSvg(w,cor='#F2B63D',cor2='#F7C964'){const h=Math.round(w*.77);return `<svg viewBox="0 0 120 92" width="${w}" height="${h}">
  <path d="M6 14 Q6 6 14 6 L44 6 L54 16 L106 16 Q114 16 114 24 L114 80 Q114 88 106 88 L14 88 Q6 88 6 80 Z" fill="${cor}"/>
  <path d="M6 30 L114 30 L114 80 Q114 88 106 88 L14 88 Q6 88 6 80 Z" fill="${cor2}"/></svg>`}
// seta reta com ponta (svg), de (x0,y0) a (x1,y1) na página; devolve o path para o traco()
function seta(pai,x0,y0,x1,y1,cor='var(--v)',lw=4){const s=el(`<svg class="ab" style="left:0;top:0;overflow:visible" width="1280" height="800">
  <path d="M${x0} ${y0} L${x1} ${y1}" fill="none" stroke="${cor}" stroke-width="${lw}" stroke-linecap="round"/></svg>`,pai);
  const ang=Math.atan2(y1-y0,x1-x0),a1=ang+2.5,a2=ang-2.5,L=13;
  const ponta=el(`<svg class="ab" style="left:0;top:0;overflow:visible" width="1280" height="800"><path d="M${(x1+L*Math.cos(a1)).toFixed(1)} ${(y1+L*Math.sin(a1)).toFixed(1)} L${x1} ${y1} L${(x1+L*Math.cos(a2)).toFixed(1)} ${(y1+L*Math.sin(a2)).toFixed(1)}"
    fill="none" stroke="${cor}" stroke-width="${lw}" stroke-linecap="round" stroke-linejoin="round"/></svg>`,pai);
  return {p:s.querySelector('path'),ponta}}
// rodas do caminhão girando com a distância percorrida (x em px da página, escala do desenho)
function rodas(cam,x,esc=1){cam.querySelectorAll('.roda').forEach(r=>r.setAttribute('transform',`translate(${r.dataset.x},196) rotate(${(x/esc/26*57.3).toFixed(2)})`))}
// brilho em volta de um cartão (o anel suave da cor do conceito)
function anel(e,t,a,rgba){e.style.boxShadow=`0 0 0 ${(5*eo(pr(t,a,.45))).toFixed(2)}px ${rgba},0 18px 40px rgba(16,24,40,.10),0 3px 8px rgba(16,24,40,.06)`}
const V0='#E1E8E4', VA='#50D088', AA='#F2B63D', RV='rgba(80,208,136,.25)', RA='rgba(242,182,61,.25)';

const CAPS={};
// ------------------------------------------------------------------ CAPS[0] · O dia da Recicla Vale (abertura)
// fala 0 "Oi! Neste tutorial a gente vai cuidar dos outros documentos da Recicla Vale Metais: o que acompanha a carga na
// estrada, o que cobra um serviço e o pacote que o contador pede todo mês."  1 "Hoje sai um caminhão de alumínio pra Minas
// Gerais, a coleta com caçamba na Aços Quiririm vira cobrança, e outubro fecha com o contador."
// janela: de "Recicla" (linha 0) até o fim de "contador" (linha 1)
CAPS[0]=()=>{
  const g=grupo();
  const tit=titulo(g,'Terça, 10 de novembro','Recicla Vale Metais');
  const CW=360,CH=384,CY=240;
  const cartao=(x,icone,txt,cor,chao=true)=>el(`<div class="card" style="left:${x}px;top:${CY}px;width:${CW}px;height:${CH}px;overflow:hidden">
      <div class="ab row" style="left:24px;top:24px;gap:12px"><div class="ico${cor==='a'?' a':''}" style="width:40px;height:40px;border-radius:12px">${icone}</div>
        <div style="font-weight:800;font-size:21px;white-space:nowrap">${txt}</div></div>
      ${chao?'<div class="ab" style="left:0;top:248px;width:360px;height:6px;background:#E6EAEE"></div>':''}</div>`,g);
  // 1 · a carga na estrada: o caminhão com o alumínio, Taubaté → Itamonte (MG)
  const c1=cartao(60,ic('truck',22),'Carga na estrada');
  const estr=el(`<svg class="ab" style="left:0;top:249px" width="360" height="4"><line x1="0" y1="2" x2="360" y2="2" stroke="#fff" stroke-width="2.5" stroke-dasharray="16 14"/></svg>`,c1);
  const cam=el(`<div class="ab" style="left:0;top:${248-146}px;width:330px;height:152px">${escala(caminhaoCom(cargaAluminio()),330)}</div>`,c1);
  const rota=el(`<div class="ab row" style="left:24px;top:290px;gap:8px">
      <div class="tag v" style="font-size:16px;padding:6px 12px">Taubaté</div><span class="row" style="color:var(--ve)">${ic('arrow-right',22)}</span>
      <div class="tag v" style="font-size:16px;padding:6px 12px">Itamonte (MG)</div></div>`,c1);

  const mot=el(`<div class="ab" style="left:948px;top:${366+Y}px;width:150px;text-align:center">

  const i1=item(98,ic('circle-check',22),'Notas da carga'), i2=item(158,ic('circle-check',22),'Caminhão'), i3=item(218,ic('circle-check',22),'Motorista');
  // a viagem: emitido antes de sair ("Autorizado"), encerrado no fim ("Encerrado")
  const via=el('<div class="ab" style="left:0;top:0;width:1280px;height:800px"></div>',g);
  const YR=616;
  const est=el(`<div class="ab" style="left:200px;top:${YR-4}px;width:880px;height:8px;border-radius:4px;background:#E3E7EC"></div>`,via);
  const tr=el(`<svg class="ab" style="left:200px;top:${YR-1}px" width="880" height="2"><line x1="0" y1="1" x2="880" y2="1" stroke="#fff" stroke-width="2" stroke-dasharray="14 12"/></svg>`,via);
  const no=x=>el(`<div class="ab" style="left:${x-11}px;top:${YR-11}px;width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--v)"></div>`,via);
  const nA=no(200), nE=no(1080);
  const selo=(x,txt,id)=>el(`<div class="ab" style="left:${x-110}px;top:${YR-74}px;width:220px;text-align:center"><div class="tag v" id="${id}" style="font-size:18px;padding:7px 16px">${ic('circle-check',20)}${txt}</div></div>`,via);
  const sA=selo(200,'Autorizado','sA'), sE=selo(1080,'Encerrado','sE');
  const rot=(x,txt)=>el(`<div class="ab lbl" style="left:${x-110}px;top:${YR+38}px;width:220px;text-align:center;font-size:18px;color:#4B5563">${txt}</div>`,via);
  const rA=rot(200,'antes de sair'), rE=rot(1080,'fim da viagem');
  const mk=el(`<div class="ab" style="left:0;top:0"><div class="ico" style="width:62px;height:62px;border-radius:50%;background:var(--vs);color:#fff;border:3px solid #fff;box-shadow:0 8px 18px rgba(16,24,40,.14)">${ic('truck',32)}</div></div>`,via);

  return t=>{
    const at=W(1,'Imagina')-.3, tc=W(1,'caminhao'), tal=W(1,'aluminio'), tn=W(1,'nota'), tf=W(1,'fiscal'), tm=W(1,'manifesto'),
          tmd=W(1,'MDF-e'), tdo=W(1,'documento'), tno=W(1,'notas'), tca=W(1,'caminhao',2), tmo=W(1,'motorista');

    vis(sA,t,te-.1,1e9,{dy:12}); pulse(sA,t,te+.3,.05,.7); vis(rA,t,tan-.15,1e9,{dy:8});
    for(const e of [nE,rE]) vis(e,t,ten-.25,1e9,{dy:8});

    se.style.background=mix('#4B5563','#50D088',ch); se.style.color='#fff'; pulse(sE,t,fim+.1,.06,.7);
  };
};

// ------------------------------------------------------------------ CAPS[3] · O percurso (mapa simplificado)
// fala 3 "Agora, o percurso. Hoje o caminhão leva alumínio pra Serra Fina, em Itamonte, Minas Gerais."  4 "Ele sai de
// Taubaté, passa pelo Rio de Janeiro e sobe pra Minas. São Paulo é a origem, Minas Gerais é o destino, e o Rio de Janeiro é
// o estado do meio do caminho."  5 "O estado do meio do caminho vai no Percurso. E isso a gente preenche em cada manifesto,

// mapa esquemático (sem marca de mapa): MG em cima, SP embaixo à esquerda, RJ embaixo à direita; Taubaté (SP) → Resende
// (RJ) → Itamonte (MG), como a carga da Serra Fina
CAPS[3]=()=>{
  const g=grupo();
  const tit=titulo(g,'Transporte','O percurso');
  const MX0=290, MX1=70, MY=150;
  const mapa=el(`<div class="card" style="left:0;top:${MY}px;width:700px;height:580px;overflow:hidden;background:#F7F8FA"></div>`,g);
  const svg=el(`<svg class="ab" style="left:0;top:0" width="700" height="580" viewBox="0 0 700 580">
    <polygon id="mg" points="0,0 700,0 700,305 610,290 510,305 430,280 350,295 230,270 120,290 0,280" fill="#EEF1F4" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>
    <polygon id="sp" points="0,280 120,290 230,270 350,295 430,280 470,370 490,450 470,580 0,580" fill="#E9EDF1" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>

    <path d="M0,580 L0,566 C90,556 180,560 260,552 C340,544 420,556 500,546 C580,536 640,530 700,520 L700,580 Z" fill="#E4EEF6"/>
    <path id="r1" d="M 250 452 C 320 444, 400 436, 470 430 S 540 424, 565 418" fill="none" stroke="var(--v)" stroke-width="7" stroke-linecap="round"/>
    <path id="r2" d="M 565 418 C 590 398, 592 352, 574 304 S 540 214, 532 178" fill="none" stroke="var(--v)" stroke-width="7" stroke-linecap="round"/>
    <circle id="cab" r="9" fill="#fff" stroke="var(--ve)" stroke-width="4"/>
  </svg>`,mapa);

  const uf=(x,y,s)=>el(`<div class="ab" style="left:${x-60}px;top:${y-22}px;width:120px;text-align:center;font-weight:800;font-size:34px;letter-spacing:.04em;color:#6B7280">${s}</div>`,mapa);
  const uMG=uf(150,150,'MG'), uSP=uf(92,322,'SP'), uRJ=uf(642,398,'RJ');

      <path d="M0,0 C-13,-15 -17,-22 -17,-30 A17,17 0 1 1 17,-30 C17,-22 13,-15 0,0 Z" fill="var(--v)" stroke="var(--ve)" stroke-width="2.5"/>
      <circle cx="0" cy="-30" r="6.5" fill="#fff"/></g></svg>`,mapa);

  const nT=nome(262,466,'Taubaté (SP)'), nI=nome(532,100,'Itamonte (MG)');

  const etq=(x,y,txt)=>el(`<div class="ab" style="left:${x-150}px;top:${y}px;width:300px;text-align:center"><div class="tag v" style="font-size:15px;padding:6px 13px">${txt}</div></div>`,mapa);
  const eO=etq(236,504,'Carregamento (Origem)'), eD=etq(532,58,'Descarregamento (Destino)');
  const eM=el(`<div class="ab" style="left:450px;top:470px;width:300px;text-align:center"><div class="tag v" style="font-size:15px;padding:6px 13px;border:2px solid var(--v)">meio do caminho</div></div>`,mapa);
  // o cartão do Percurso (rótulos do app) e o RJ que vai para ele
  const per=el(`<div class="card" style="left:810px;top:300px;width:400px;height:192px">
      <div class="ab" style="left:26px;top:24px;font-weight:800;font-size:25px">Percurso</div>
      <div class="ab lbl" style="left:26px;top:58px">(UFs Atravessadas)</div>
      <div class="ab row" style="left:26px;top:106px;width:348px;height:58px;padding:0 16px;border-radius:12px;background:#F7F9FA;border:1px solid var(--l)">
        <div style="font-weight:700;font-size:18px;color:#4B5563">1ª UF</div></div></div>`,g);
  const rjc=el(`<div class="ab" style="left:0;top:0"><div class="tag v" style="font-size:20px;padding:7px 18px;border:2px solid var(--v)">RJ</div></div>`,g);
  const cada=el(`<div class="ab row" style="left:836px;top:520px;gap:12px"><div class="ico" style="width:40px;height:40px;border-radius:11px">${ic('file-text',21)}</div>
      <div class="lbl" style="font-size:19px;color:#4B5563">em cada manifesto</div></div>`,g);

  return t=>{
    const at=W(3,'Agora')-.3, tp=W(3,'percurso'), tc=W(3,'caminhao'), ti=W(3,'Itamonte');
    const ts=W(4,'sai'), tj=W(4,'Janeiro'), tsb=W(4,'sobe'), tmi=W(4,'Minas'), tri=W(4,'Rio'), tor=W(4,'origem'), tde=W(4,'destino'), tme=W(4,'meio');
    const tv=W(5,'vai'), tpe=W(5,'Percurso'), tma=W(5,'manifesto');
    posTitulo(tit,t,at-.6,tp-.3);

    const sh=eio(pr(t,tv-.3,.75)); mapa.style.left=lerp(MX0,MX1,sh).toFixed(2)+'px';

    vis(per,t,tpe-.15,1e9,{dx:24,dy:0});
    const x0=MX1+642-34, y0=MY+398-22, x1=810+26+348-16-78, y1=300+106+9;
    const qq=arco(rjc,t,tpe+.15,.9,x0,y0,x1,y1,-90,0); const o=eo(cl(qq/.2)); rjc.style.opacity=o.toFixed(3); rjc.style.visibility=o>0?'visible':'hidden';
    pulse(rjc.firstElementChild,t,tpe+1.1,.06,.7);

  };
};

// ------------------------------------------------------------------ CAPS[5] · Encerrar × cancelar
// fala 1 "Uma dica: encerrar não é cancelar. Encerrar é o fim normal da viagem. Cancelar é anular um manifesto que não
// deveria existir, e tem prazo curto."   janela: de "Uma" até o fim de "curto"
CAPS[5]=()=>{
  const g=grupo();
  const tit=titulo(g,'Manifesto','Encerrar × cancelar');
  const cartao=(y,cls,txt,sub)=>el(`<div class="card" style="left:110px;top:${y}px;width:1060px;height:244px">
      <div class="ab" style="left:36px;top:52px"><div class="tag ${cls}" style="font-size:25px;padding:11px 24px">${txt}</div></div>

// fala 5 "Foi uma venda pra Fundição Bandeira do Vale. A nota saiu no dia trinta de outubro, mas o pedido só foi finalizado

  const dif=el(`<div class="ab" style="left:0;top:0;width:1280px;height:800px">
