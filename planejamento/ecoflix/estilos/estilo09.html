<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>9 · Interface escura com vidro e brilho</title>
<!-- Vidro: tema escuro #161618, formas translúcidas com fio de luz na borda, brilho verde por trás e reflexo no piso; rótulos em vidro fosco. -->
<style>
#fd{background:radial-gradient(520px 380px at 50% 66%,rgba(80,208,136,.26),transparent 70%),radial-gradient(420px 340px at 96% 22%,rgba(80,208,136,.16),transparent 70%),
  radial-gradient(380px 320px at -6% 8%,rgba(90,150,255,.12),transparent 70%),#161618}
#fd:after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.10) 1px,transparent 1.4px);background-size:26px 26px;
  -webkit-mask-image:radial-gradient(520px 520px at 50% 60%,#000,transparent 78%)}
.kick{color:#50D088}.h{color:#F4F6F5}
.visor{background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1px solid rgba(255,255,255,.22);border-radius:18px;backdrop-filter:blur(14px);
  box-shadow:0 24px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.28),0 0 44px rgba(80,208,136,.20)}
.vl{color:rgba(255,255,255,.68)}.vn{color:#6CF0A8;text-shadow:0 0 18px rgba(80,208,136,.75)}
.chip{background:linear-gradient(160deg,rgba(80,208,136,.30),rgba(80,208,136,.12));border:1px solid rgba(108,240,168,.6);color:#D9FBE8;backdrop-filter:blur(10px);
  box-shadow:0 10px 26px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.25),0 0 26px rgba(80,208,136,.35)}
.chip svg{color:#6CF0A8}
</style></head><body>
<script type="module">
import { palco, prende, pronto, CORES_LATA } from './comum.js';
import { partes, svg, G, CH, X0, BX, BY, VISOR, SELO } from './lado.js';
const B = (o = .34) => `stroke="rgba(255,255,255,${o})" stroke-width="1.2"`;
const est = p => {
  switch (p.g) {
    case 'cab': return [`fill="#50D088" filter="url(#gl)" opacity=".75"`, `fill="url(#gv)" stroke="#B9FFD9" stroke-width="1.3"`];
    case 'cabFaixa': return `fill="rgba(0,40,20,.22)"`;
    case 'janela': return `fill="url(#gj)" stroke="rgba(255,255,255,.75)" stroke-width="1.2"`;
    case 'porta': return `fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.2"`;
    case 'bau': return `fill="url(#gb)" ${B(.42)}`;
    case 'bauBorda': case 'bauFrente': return `fill="rgba(255,255,255,.26)" ${B(.5)}`;
    case 'bauFriso': return `fill="rgba(255,255,255,.10)" ${B(.22)}`;
    case 'pneu': return `fill="#0E0F10" stroke="rgba(255,255,255,.5)" stroke-width="1.3"`;
    case 'aro': return `fill="url(#gb)" ${B(.5)}`;
    case 'cubo': return `fill="#6CF0A8" filter="url(#gp)"`;
    case 'farol': return [`fill="#FFE9A8" filter="url(#gl)"`, `fill="#FFF4D0"`];
    case 'deck': return [`fill="#50D088" filter="url(#gl)" opacity=".5"`, `fill="url(#gb)" ${B(.5)}`];
    case 'deckTopo': return `fill="#6CF0A8" filter="url(#gp)"`;
    case 'rampa': return `fill="rgba(255,255,255,.10)" ${B(.3)}`;
    case 'celula': return `fill="rgba(108,240,168,.6)"`;
    case 'lata': return `fill="rgba(255,255,255,.22)" stroke="rgba(255,255,255,.55)" stroke-width=".9"`;
    case 'lataFaixa': return `fill="${CORES_LATA[p.ci]}" opacity=".85"`;
    case 'viga': return `fill="rgba(242,182,61,.55)" stroke="rgba(255,220,150,.8)" stroke-width="1"`;
    case 'tubo': case 'chapa': return `fill="rgba(255,255,255,.26)" ${B(.6)}`;
    case 'tuboFuro': return `fill="#161618" ${B(.4)}`;
    case 'poste': case 'posteBase': return `fill="rgba(255,255,255,.18)" ${B(.3)}`;
    case 'macaneta': case 'espelho': return `fill="rgba(255,255,255,.55)"`;
    default: return `fill="rgba(255,255,255,.13)" ${B(.3)}`;
  }
};
const defs = `<linearGradient id="gv" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8CF2BC"/><stop offset=".55" stop-color="#50D088"/><stop offset="1" stop-color="#2A9E62"/></linearGradient>
  <linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".30"/><stop offset="1" stop-color="#fff" stop-opacity=".07"/></linearGradient>
  <linearGradient id="gj" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#BFF5DA" stop-opacity=".35"/></linearGradient>
  <linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#50D088" stop-opacity=".34"/><stop offset="1" stop-color="#50D088" stop-opacity="0"/></linearGradient>
  <linearGradient id="gf" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6CF0A8" stop-opacity="0"/><stop offset=".5" stop-color="#6CF0A8"/><stop offset="1" stop-color="#6CF0A8" stop-opacity="0"/></linearGradient>
  <filter id="gl" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="gp" x="-40%" y="-300%" width="180%" height="700%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
// anéis de leitura atrás do caminhão, linha do piso com luz e reflexo
const antes = `<g fill="none" stroke="rgba(108,240,168,.20)" stroke-width="1.2"><circle cx="364" cy="${G - 120}" r="190"/><circle cx="364" cy="${G - 120}" r="250" stroke-dasharray="3 9"/><circle cx="364" cy="${G - 120}" r="310" opacity=".5"/></g>
  <rect x="20" y="${CH}" width="688" height="1.6" fill="url(#gf)"/>
  <path d="M94 ${CH + 2}H634L690 ${CH + 120}H38Z" fill="url(#gr)"/>
  <g stroke="rgba(108,240,168,.22)" stroke-width="1">${[1, 2, 3, 4].map(i => `<path d="M${94 - i * 11} ${CH + 2 + i * 24}H${634 + i * 11}" opacity="${1 - i * .2}"/>`).join('')}</g>`;
const depois = `<path d="M${BX + 12} ${BY - 122}H${BX + 100}" stroke="rgba(255,255,255,.8)" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M${X0 + 8} ${G - 150}H${X0 + 330}" stroke="rgba(255,255,255,.55)" stroke-width="1.2"/>`;
const p = palco({ meio: svg(partes({ carga: { n: 96, esc: 1.06 } }), est, { defs, antes, depois }) });
prende(p.visor, VISOR.x, VISOR.y, 1, 1); prende(p.chip, SELO.x, SELO.y);
pronto();
</script></body></html>
