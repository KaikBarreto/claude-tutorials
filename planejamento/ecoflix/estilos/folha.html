<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>EcoFlix · folha de estilos (10 em um quadro)</title>
<!-- Folha 3840x2160, grade 5x2: a mesma cena (dupla pesagem: caminhão carregado na balança, visor 9.460 kg, selo "Carregado") em 10 estilos.
     Cada painel é um estiloNN.html (728x880) num iframe. Render: node render.cjs (ver LEIA.md). -->
<style>
@font-face{font-family:M;font-weight:500;src:url(../../../ferramentas/web/fonts/montserrat-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:600;src:url(../../../ferramentas/web/fonts/montserrat-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:700;src:url(../../../ferramentas/web/fonts/montserrat-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:800;src:url(../../../ferramentas/web/fonts/montserrat-latin-800-normal.woff2) format('woff2')}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:3840px;height:2160px;overflow:hidden;background:#161618;font-family:M,sans-serif;color:#F4F6F5;-webkit-font-smoothing:antialiased}
.topo{position:absolute;left:40px;right:40px;top:44px;height:84px;display:flex;align-items:flex-end;justify-content:space-between}
.topo .k{font-weight:700;font-size:20px;letter-spacing:.3em;text-transform:uppercase;color:#50D088}
.topo .t{margin-top:8px;font-weight:800;font-size:46px;letter-spacing:-.01em}
.topo .d{font-weight:600;font-size:24px;color:#A3ABA7;text-align:right;line-height:1.4}
.topo .d b{color:#F4F6F5;font-weight:700}
.p{position:absolute;width:728px}
.p iframe{display:block;width:728px;height:880px;border:0;border-radius:22px;background:#fff;box-shadow:0 0 0 1.5px rgba(255,255,255,.14),0 24px 50px rgba(0,0,0,.45)}
.leg{display:flex;align-items:center;gap:16px;height:68px;padding:8px 6px 0}
.n{flex:none;width:44px;height:44px;border-radius:50%;background:#50D088;color:#161618;font-weight:800;font-size:24px;display:flex;align-items:center;justify-content:center}
.nm{font-weight:800;font-size:27px;white-space:nowrap}
.ds{font-weight:600;font-size:19px;color:#8E9692;white-space:nowrap;margin-left:auto}
</style></head><body>
<div class="topo"><div><div class="k">EcoFlix · ilustrações</div><div class="t">Folha de estilos: a mesma cena em 10 acabamentos</div></div>
  <div class="d">Cena igual em todos: <b>dupla pesagem</b>, caminhão carregado de sucata sobre a balança,<br>visor <b>9.460 kg</b> e selo <b>Carregado</b>. Só o estilo muda.</div></div>
<script>
const E = [['Argila 3D fosca', 'o atual'], ['Flat vetorial 2D', 'cor chapada'], ['Isométrico vetorial', '3 tons, sem perspectiva'], ['Traço fino', 'linha + acento verde'], ['Low-poly 3D', 'facetado'],
  ['3D toon', 'cel shading + contorno'], ['Papel recortado', 'camadas com sombra'], ['Blueprint', 'desenho técnico'], ['Vidro escuro', 'painel SaaS premium'], ['Gradientes suaves', 'formas geométricas']];
let falta = E.length; addEventListener('message', e => { if (e.data && e.data.pronto && --falta === 0) window.PRONTO = true; });
E.forEach(([nm, ds], i) => { const n = String(i + 1).padStart(2, '0'), x = 40 + (i % 5) * 758, y = 164 + Math.floor(i / 5) * 984;
  document.body.insertAdjacentHTML('beforeend', `<div class="p" style="left:${x}px;top:${y}px"><iframe src="estilo${n}.html${i ? '' : '?pr=2.2&sm=2048'}" scrolling="no"></iframe>
    <div class="leg"><div class="n">${i + 1}</div><div class="nm">${nm}</div><div class="ds">${ds}</div></div></div>`); });
</script></body></html>
