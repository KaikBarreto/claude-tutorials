<script type="module">

// comuns
const NUNCA = 1e9, EE = .0112, ROT = [-.2, .1, 0];

const cartaoP = (icone, rot, sub, cls, cw = 190) => htmlFluxoCartoes({ cartoes: [[icone, rot, sub, cls]], cw });   // cartão pequeno (selo + rótulo + legenda)
const subDe = (p, t, a, sel = '.d-s') => { const s = p.e.querySelector(sel); if (s) s.style.opacity = eo(pr(t, a, .3)).toFixed(3); };   // a legenda entra na palavra que a diz

function escuro() {

const STAND2 = (t, tit, t0) => { clima(1); GL.style.visibility = 'hidden'; posTitulo(tit, t, t0 - .9, -9); };   // título já no alto desde o primeiro quadro

const cx = (row, i) => parte(row.e, i).offsetLeft + parte(row.e, i).offsetWidth / 2 - row.w / 2;   // centro do cartão i da fileira, em px a partir do centro

// CENA "dia" · cap00, linhas 0 e 1 · clima escuro (o caminho do dia no sistema)
// 0 "Oi! Neste tutorial a gente vai fazer o que a Recicla Vale Metais faz o dia inteiro: pesar, comprar, pagar e imprimir o comprovante. E depois vender."
// 1 "A sucata chega no portão e vai pra balança. Daí o peso tem que virar valor certo e pagamento na hora, sem anotar nada no papel."
// Cada passo do dia entra na palavra que o nomeia; na linha 1 a câmera abre e entra o caminho da sucata até o pagamento, e o papel que não existe.
function dia() {
  const t0 = W(0, 'oi'), tRe = W(0, 'recicla'), tPe = W(0, 'pesar'), tCo = W(0, 'comprar'), tPa = W(0, 'pagar'), tCm = W(0, 'comprovante'), tVe = W(0, 'vender'),

  cores();
  const { EIXO, X, ret, fundo } = escuro();
  const Y1 = -80, Y2 = 118;
  const r1 = X(htmlFluxoCartoes({ cartoes: [['scale', 'Pesar', ''], ['shopping-cart', 'Comprar', ''], ['hand-coins', 'Pagar', ''], ['receipt', 'Comprovante', ''], ['handshake', 'Vender', '', 'res']], cw: 190, vao: 64 }), 0, Y1);
  const r2 = X(htmlFluxoCartoes({ cartoes: [['door-open', 'Portão', 'a sucata chega'], ['scale', 'Balança', 'o peso'], ['circle-check', 'Valor certo', ''], ['hand-coins', 'Pagamento na hora', '', 'res']], cw: 190, vao: 64 }), 0, Y2);
  const chE = X(htmlChip(`${ic('building-2', 18)}Recicla Vale Metais`, 'n'), 0, Y1 - r1.h / 2 - 20, { anc: [.5, 1], z: 40 });
  const chP = X(htmlChip(`${ic('file-x', 18)}Sem papel`, 'a'), 0, Y2 + r2.h / 2 + 22, { anc: [.5, 0], z: 40 });
  fundo(0, 20, { aneis: false });
  const tit = titulo('Neste tutorial', 'O dia no pátio', 'escuro');
  const R1 = uneRet(r1.ret(), chE.ret()), R2 = uneRet(R1, r2.ret(), chP.ret());
  const S1 = enquadraRet(EIXO, R1, { az: -.03, max: 1.4 / EE }), S2 = enquadraRet(EIXO, R2, { az: .025 });
  camera([[t0 - 3, S1], [tSu - .5, { ...S1, az: -.012, d: S1.d * .985 }, 'lin'], [tSu + 1.0, S2], [tFim + 2.5, { ...S2, az: .04, d: S2.d * .985 }, 'lin']]);
  return t => {
    STAND2(t, tit, t0);
    vis(chE.e, t, tRe - .1, NUNCA, { dy: 10, sc: .9 });
    fluxoCartoes(r1.e, t, tPe - .35, NUNCA, { tempos: [tPe, tCo, tPa, tCm, tVe] }); pulso(parte(r1.e, 4), t, tVe + .3, .05, .8);
    foco(r1.e, t, -9, tSu - .1, { min: .75 });
    fluxoCartoes(r2.e, t, tSu - .35, NUNCA, { tempos: [tSu, tBa, tVa, tPg] }); pulso(parte(r2.e, 3), t, tPg + .3, .05, .8);
    vis(chP.e, t, tPp - .1, NUNCA, { dy: 10, sc: .85 });
  };
}

// 1 "Quando você escolhe o material, o sistema procura o preço nesta ordem. Primeiro, o preço especial combinado com aquele fornecedor. Depois, a tabela do pedido. E por último, o preço do próprio material."

  cores();

  const row = X(htmlFluxoCartoes({ cartoes: [['package', 'Escolhe o material', ''], ['star', 'Preço especial', 'combinado com o fornecedor'], ['list-ordered', 'Tabela de Preços', 'a do pedido'], ['tag', 'Preço do material', 'o do cadastro', 'res']], cw: 215, vao: 66 }), 0, -40);
  const YC = -40 + row.h / 2 + 30;
  const c1 = X(htmlChip(`${ic('badge-check', 18)}Preço especial aplicado`, 'n'), cx(row, 1), YC, { anc: [.5, 0] }), c2 = X(htmlChip(`${ic('badge-check', 18)}Preço da tabela aplicado`, 'n'), cx(row, 2), YC, { anc: [.5, 0] }),
    c3 = X(htmlChip(`${ic('pencil', 18)}Só uma sugestão`, 'a'), cx(row, 3), YC, { anc: [.5, 0] });
  fundo(0, 10, { aneis: false });
  const tit = titulo('Preço', 'Qual preço vale', 'escuro');
  const R1 = row.ret(), R2 = uneRet(R1, c1.ret(), c2.ret(), c3.ret());
  const S1 = enquadraRet(EIXO, R1, { az: -.03, max: 1.4 / EE }), S2 = enquadraRet(EIXO, R2, { az: .02, max: 1.4 / EE });
  camera([[t0 - 3, S1], [tDi - .5, { ...S1, az: -.01, d: S1.d * .985 }, 'lin'], [tDi + .9, S2], [tFim + 2.5, { ...S2, az: .035, d: S2.d * .985 }, 'lin']]);

    STAND2(t, tit, t0);

    pulso(parte(row.e, 1), t, tEf + .15, .04, .7); pulso(parte(row.e, 2), t, tTb + .15, .04, .7); pulso(parte(row.e, 3), t, tPm + .35, .04, .7);
    vis(c1.e, t, tE2 - .1, NUNCA, { dy: 12, sc: .9 }); vis(c2.e, t, tT2 - .1, NUNCA, { dy: 12, sc: .9 }); vis(c3.e, t, tSg - .15, NUNCA, { dy: 12, sc: .9 });
  };
}

// CENA "formas" · cap11, linha 1 · clima escuro (as três formas de pagar e quem fica devendo)
// 1 "São três formas. Dinheiro sai do caixa. Pix ou transferência sai da conta do banco. E o saldo é o fiado: na compra, a Recicla Vale fica devendo ao fornecedor. Na venda, é o cliente que fica devendo."

  const YB = -70 + row.h / 2 + 36;
  const cA = X(cartaoP('arrow-down-left', 'Na compra', 'a Recicla Vale fica devendo ao fornecedor', 'a', 330), -190, YB, { anc: [.5, 0] }),
    cB = X(cartaoP('arrow-up-right', 'Na venda', 'o cliente fica devendo', 'a', 330), 190, YB, { anc: [.5, 0] });
  fundo(0, 30, { aneis: false });
  const tit = titulo('Pagamento', 'Três formas', 'escuro');
  const R1 = row.ret(), R2 = uneRet(R1, cA.ret(), cB.ret());
  const S1 = enquadraRet(EIXO, R1, { az: -.03, max: 1.4 / EE }), S2 = enquadraRet(EIXO, R2, { az: .02, max: 1.4 / EE });
  camera([[t0 - 3, S1], [tFi - .2, { ...S1, az: -.012, d: S1.d * .985 }, 'lin'], [tFi + .9, S2], [tFim + 2.5, { ...S2, az: .035, d: S2.d * .985 }, 'lin']]);
  return t => {
    STAND2(t, tit, t0);
    fluxoCartoes(row.e, t, tDi - .35, NUNCA, { tempos: [tDi, tPx, tSa] });
    subDe({ e: parte(row.e, 0) }, t, tCa - .25); subDe({ e: parte(row.e, 1) }, t, tCt - .1); subDe({ e: parte(row.e, 2) }, t, tFi - .05);
    pulso(parte(row.e, 2), t, tFi + .3, .05, .8);
    for (let i = 0; i < 2; i++) foco(parte(row.e, i), t, -9, tCp - .15, { min: .6 });
    vis(cA.e, t, tCp - .1, NUNCA, { dy: 18, sc: .95 }); subDe(cA, t, tRe - .1); pulso(cA.e, t, tDv + .15, .04, .7);
    vis(cB.e, t, tVd - .1, NUNCA, { dy: 18, sc: .95 }); subDe(cB, t, tCl - .1); pulso(cB.e, t, tD2 + .15, .04, .7);
  };
}

// =====================================================================================================================
// CENA "pesagem" · cap06, linhas 0 a 2 · clima claro (o pátio físico, câmera de estação em estação)
// 0 "Antes de seguir, três palavras do pátio. Tara é o peso do que não é material, como o saco, o tambor ou a caçamba. Impureza é a sujeira que vem junto: terra, borracha, plástico."

// 2 "E quando a sucata vem numa carroça ou num caminhão, tem a dupla pesagem. Pesa cheio, descarrega e pesa vazio. A diferença é a carga."
// Estação 1: saco, tambor e caçamba (a tara). Estação 2: terra, borracha e plástico (a impureza). Estação 3: a conta em cartões (Bruto − Tara − Impureza = Líquido → Estoque).
// Estação 4: a carroça cheia na balança, descarregada e vazia, e a carga (a diferença), SEM números (412, 96 e 316 a fala só diz na linha 4, com a tela do app). Tudo no clima claro: é o pátio, sem passar pelos dados.
function pesagem() {
  const R1 = 412, R2 = 96, BR = R1 - R2, TAT = -9, TAB = -6.2, TCX = -9.9;
  const t0 = W(0, 'antes'), tTa = W(0, 'tara'), tSa = W(0, 'saco'), tTm = W(0, 'tambor'), tCa = W(0, 'cacamba'), tIm = W(0, 'impureza'), tSu = W(0, 'sujeira'), tTe = W(0, 'terra'), tBo = W(0, 'borracha'), tPl = W(0, 'plastico'),
    tLi = W(1, 'liquido'), tBr = W(1, 'bruto'), tM1 = W(1, 'menos'), tT1 = W(1, 'tara'), tM2 = W(1, 'menos', 2), tI1 = W(1, 'impureza'), tEs = W(1, 'estoque'),
    tCr = W(2, 'carroca'), tDu = W(2, 'dupla'), tCh = W(2, 'cheio'), tDe = W(2, 'descarrega'), tVz = W(2, 'vazio'), tDf = W(2, 'diferenca'), tCg = W(2, 'carga'), tFim = W(2, 'carga', 1, 'e');
  cores();
  // ---------------------------------------------------------------- o mundo
  const XT = -8.4, XI = 4.9, XC = 18.5, XB = 33;   // centros das estações
  piso({ r: 60, x: 12, z: -2, passo: 1.3 }); U.uNevoa.value.set(.955, .975, .965, .8);

  const sa = saco(CENA, [XT - 2.0, 0, 0], { s: 1.0 }), tb = tambor(CENA, [XT, 0, 0]), ca = cacamba(CENA, [XT + 2.4, 0, 0], { s: .95 });
  const CH = (icone, txt, cls, pos, esc = .0135) => plano(htmlChip(`${ic(icone, 18)}${txt}`, cls), { pos, rot: ROT, esc, anc: [.5, 1] });
  const chS = CH('package', 'Saco', 'n', [XT - 2.0, 1.05, 0]), chT = CH('package', 'Tambor', 'n', [XT, 1.05, 0]), chC = CH('package', 'Caçamba', 'n', [XT + 2.4, 1.05, 0]);
  const hT = plano(cartaoP('package-open', 'Tara', 'o que não é material', 'a', 200), { pos: [XT, 3.0, 0], rot: ROT, esc: .0135, anc: [.5, 0] });

  const hI = plano(cartaoP('droplets', 'Impureza', 'a sujeira que vem junto', 'a', 200), { pos: [XI, 3.0, 0], rot: ROT, esc: .0135, anc: [.5, 0] });
  // estação 3 · a conta, em duas fileiras como a da T08: Bruto − Tara − Impureza em cima, o Líquido embaixo
  const FZ = 3, EC = .0135, FD = 3.7, YA = 2.0, YL = .15;
  const cart = (x, y, ic_, rot, sub, cls) => plano(cartaoP(ic_, rot, sub, cls, 210), { pos: [x, y, FZ], rot: ROT, esc: EC, anc: [.5, 0] });
  const cB = cart(XC - FD, YA, 'scale', 'Bruto', 'tudo junto', 'n'), cT = cart(XC, YA, 'package-open', 'Tara', 'a embalagem', 'a'), cI = cart(XC + FD, YA, 'droplets', 'Impureza', 'a sujeira', 'a'),
    cL = cart(XC, YL, 'badge-check', 'Líquido', 'o material', 'res');
  const HC = cT.h * EC;
  const OP = (txt, x, y) => plano(htmlOp(txt), { pos: [x, y, FZ + .05], rot: ROT, esc: .0105 }), oM1 = OP('−', XC - FD / 2, YA + HC / 2), oM2 = OP('−', XC + FD / 2, YA + HC / 2), oIg = OP('=', XC - 2.1, YL + HC / 2);
  const sC = [mancha(3.2, 1.2, [XC, 0, FZ - .05], { op: 0 })];
  const chE = plano(htmlChip(`${ic('package', 18)}Estoque`, 'n'), { pos: [XC + 2.0, YL + HC / 2 - .15, FZ], rot: ROT, esc: .0135, anc: [0, .5] });
  // estação 4 · a dupla pesagem
  const SB = 2.0, B = balancaPlataforma(CENA, [XB, 0, 0], { c: 1.2, l: 1.0 }); B.scale.setScalar(SB);
  const SUP = B.userData.sup * SB + .02, CAR = carroca(CENA, [XB - .15, SUP, .05], { carga: 'ferro', n: 24 });
  const lotesC = CAR.userData.lotes || [], descarga = monte(CENA, [XB + 3.4, 0, -1.0], { tipo: 'ferro', n: 36, r: .8, h: .5 });
  const visor = plano(htmlVisor(['1ª Pesagem', '2ª Pesagem', 'Peso Bruto']), { pos: [XB, 2.55, -.4], rot: ROT, esc: .0046 }); ligaVisor(visor.e); visor.e.vn.style.display = 'none';   // sem números: a fala diz 412, 96 e 316 só na linha 4, com a tela do app

const K = 1.5, E = .01, YC = 4.35;   // px por pt e metros por px
const LEITURA = 2.87 / E;
function papel(src, lpt, hpt, marcas) {
  const WP = Math.round(lpt * K);
  estilo('cupom', `
.cupom{position:relative;background:#fff;border-radius:7px 7px 0 0;box-shadow:0 34px 60px -18px rgba(30,80,60,.38),0 8px 16px -6px rgba(30,80,60,.14)}

.cupom .mk{position:absolute;border-radius:4px;background:rgba(80,208,136,.46);mix-blend-mode:multiply;transform-origin:0 50%;transform:scaleX(0)}
.cupom .mk.n{mix-blend-mode:normal;background:rgba(80,208,136,.62)}`);
  const h = Math.round(hpt * K), n = Math.round(WP / 14), z = Array.from({ length: n + 1 }, (_, i) => `${(i * WP / n).toFixed(1)},${i % 2 ? 8 : 0}`).join(' ');
  const mk = Object.entries(marcas).map(([id, [x0, y0, x1, y1, c]]) =>

  return { h, WP, html: `<div class="cupom" style="width:${WP}px;height:${h}px"><img src="${src}" style="width:${WP}px;height:${h}px" alt="">${mk}<svg class="z" width="${WP}" height="8"><polygon points="0,0 ${z} ${WP},0" fill="#fff"/></svg></div>`,
    faixa: (y0, y1) => [-WP / 2 * E, YC + (h / 2 - y1 * K) * E, WP / 2 * E, YC + (h / 2 - y0 * K) * E] };   // linhas do papel (pt, de cima para baixo) em metros, na largura inteira
}
