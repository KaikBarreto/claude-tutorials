<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- T07 cap06 · cena final 3D da pesagem (kit perfis/ecoflix/cenas3d/kit3d.js; o piloto que o Kaik aprovou em 11/11, refeito
     com o kit). A mesma cena da ../cenas/cenas.html (CAPS[6], que fica de reserva): tara (saco, tambor, caçamba), impureza
     (terra, borracha, plástico) e Bruto − Tara − Impureza = Líquido, que vai pro estoque; depois a dupla pesagem da carroça,
     412 − 96 = 316 kg. Mesmas âncoras W(linha,'palavra') e mesmos números da cena 2D.
     Um só mundo: parte 1 em torno da origem (tara à esquerda, impureza à direita, o bruto na frente) e a parte 2 (balança de
     pátio, carroça) em (12, 0, −2); a câmera viaja de uma para a outra na palavra "sucata".
     Render (o render_cenas.cjs já sobe o Chromium com --allow-file-access-from-files):
       node ferramentas/edit/cenas/render_cenas.cjs 6 <cap06.json> ilu06_pesagem.mp4 --html planejamento/ecoflix/T07/cenas3d/cena3d.html --de 0.10 --ate 36.08
     Custo: ~1 s por quadro em 2560x1600; prévia com --dsf 1.35 (1728x1080) ~0,4 s. -->
</head><body>
<script type="module">
import { THREE, PI, eo, eio, pr, lerp, rng, pega, W, L, el, ic, vis, ripple, pulse, kg, conta, posTitulo, titulo, selo, chip, coluna, op, onda,
  cartao, mostrador, CENA, camera, ancora, mundo, M, argila, tinge, grupo, mancha, anel, destaque, cresce, pulso, domo, peca, monte,
  saco, tambor, cacamba, sacoAberto, fardo, palete, carroca, balancaPatio, COR, cena } from '../../../../perfis/ecoflix/cenas3d/kit3d.js';

cena(() => {
  // ================= parte 1: tara (esquerda), impureza (direita), o bruto (frente) e o estoque
  const P1 = grupo(CENA);
  const XA = -2.3, XB = 2.55, B = [.5, 0, .5], EST = [.5, 0, 2.2];
  const tara = [saco(P1, [-3.3, 0, .1]), tambor(P1, [-2.35, 0, -.05]), cacamba(P1, [-1.25, 0, .05])];
  tara.forEach((g, i) => { g.userData.ry = [.25, 0, -.2][i]; g.rotation.y = g.userData.ry; mancha(g, [.95, .85, 1.45][i], [.85, .85, 1.05][i], .28); argila(g); });
  // monte com impureza: a sucata e, por cima, terra, borracha e plástico (aparecem cada um na sua palavra)
  const GI = monte(P1, [XB, 0, 0], { n: 34, rx: .9, rz: .76, h: .56, mancha: [2.3, 1.9] });
  const imp = { terra: [], borracha: [], plastico: [] };
  for (const c of ['terra', 'borracha', 'plastico']) for (const p of domo(c === 'terra' ? 7 : c === 'borracha' ? 4 : 5, .76, .62, .56, 0, .88))
    imp[c].push(peca(GI, c, p, c === 'terra' ? 1.1 : 1));
  // o bruto: saco aberto com cobre e sujeira; a tara sobe e volta pro grupo da tara, a impureza voa pro monte
  const GB = grupo(P1, B), bag = sacoAberto(GB), heap = grupo(GB), mB = mancha(GB, 1.3, 1.1, .32);
  for (const p of domo(24, .3, .25, .95)) peca(heap, pega(['cobre', 'cobre', 'cobre', 'alu']), p);
  const voa = []; for (const c of ['terra', 'terra', 'terra', 'borracha', 'borracha', 'plastico', 'plastico']) {
    const p = domo(1, .22, .18, .95, 0, .95)[0]; const o = peca(P1, c, [0, 0, 0], c === 'terra' ? 1.1 : 1); o.userData.loc = p; voa.push(o); }
  const anB = anel(P1, .66, .07, B), ondB = anel(P1, .66, .05, B);
  // estoque: palete com um fardo de alumínio; o cobre limpo chega e vira o fardo de cobre
  const GE = grupo(P1, EST); palete(GE, [0, 0, 0]); fardo(GE, [-.3, .115, 0], COR.alu); const fCu = fardo(GE, [.32, .115, 0], COR.cobre); mancha(GE, 1.9, 1.5, .3);
  // ================= parte 2: balança de pátio, mostrador, carroça e o monte descarregado
  const PX = 12, PZ = -2, P2 = balancaPatio(CENA, [PX, 0, PZ]), TOPO = mundo(P2, P2.userData.topo);
  const CAR = carroca(CENA, [0, 0, PZ]), rodas = CAR.userData.rodas;
  const carga = domo(20, .7, .4, .5, .6).map(p => { const o = peca(CENA, pega(['aco', 'aco', 'ferrugem', 'ferrugem', 'aco']), [0, 0, 0]);
    o.userData.loc = p; o.userData.r0 = o.rotation.clone(); return o; });
  const MON = [PX - 3.05, 0, PZ + 1.2], alvo = domo(20, .75, .62, .5), mM = mancha(CENA, 2.2, 1.9, .3, MON);
  const anM = anel(CENA, .92, .08, MON), ondM = anel(CENA, .92, .05, MON);
  const altura = x => P2.userData.altura(x - PX);   // chão sob as rodas (rampa da esquerda e plataforma)

  // ================= rótulos HTML
  const tit = titulo('Pesagem', 'Tara, impureza e líquido', 'Dupla pesagem'), [h1, h2] = tit.hs;
  const sTa = selo('v', 'Tara', 'o que não é material'), sIm = selo('a', 'Impureza', 'a sujeira que vem junto');
  const cTa = ['saco', 'tambor', 'caçamba'].map(t => chip(t)), cIm = ['terra', 'borracha', 'plástico'].map(t => chip(t));
  // a conta da parte 1: Bruto − Tara − Impureza = Líquido (tudo junto, a embalagem, a sujeira, o material)
  const k1 = coluna(312, 676, 'e', 'Bruto', 'tudo junto'), k2 = coluna(538, 676, 'v', 'Tara', 'a embalagem'),
        k3 = coluna(772, 676, 'a', 'Impureza', 'a sujeira'), k4 = coluna(1002, 676, 'v', 'Líquido', 'o material');
  const o1 = op(424, 678, '−'), o2 = op(652, 678, '−'), o3 = op(888, 678, '='), ripL = onda(k4, 100, 22);
  const sEs = selo('v', `${ic('warehouse', 24)}Estoque`);
  // parte 2: mostrador (painel escuro, número verde) preso no poste, e a conta em cartões
  const most = mostrador('1ª Pesagem', '2ª Pesagem');
  const R1 = 412, R2 = 96;
  const c1 = cartao(122, 662, '', '1ª Pesagem', 'carroça cheia', R1), c2 = cartao(492, 662, '', '2ª Pesagem', 'carroça vazia', R2),
        c3 = cartao(862, 662, 'v', 'Peso Bruto', 'a carga', R1 - R2, { res: true });
  const oM = op(455, 695, '−'), oI = op(825, 695, '='), rip = onda(c3, 84, 78);

  // ================= tempos (as âncoras da cena 2D)
  const j0 = W(0, 'antes') - .3, tta = W(0, 'tara'), tna = W(0, 'nao'), tsa = W(0, 'saco'), ttb = W(0, 'tambor'), tcc = W(0, 'cacamba'),
        tim = W(0, 'impureza'), tsj = W(0, 'sujeira'), tte = W(0, 'terra'), tbo = W(0, 'borracha'), tpl = W(0, 'plastico');
  const tl1 = W(1, 'liquido'), tbr = W(1, 'bruto'), tm1 = W(1, 'menos'), tt1 = W(1, 'tara'), tm2 = W(1, 'menos', 2), ti1 = W(1, 'impureza'),
        tl2 = W(1, 'liquido', 2), ten = W(1, 'entra'), tes = W(1, 'estoque');
  const tsu = W(2, 'sucata'), tcr = W(2, 'carroca'), tdu = W(2, 'dupla'), tch = W(2, 'cheio'), tde = W(2, 'descarrega'), tp2 = W(2, 'pesa', 2),
        tvz = W(2, 'vazio'), tdi = W(2, 'diferenca'), tca = W(2, 'carga');
  const TX = tsu - .1, L1 = L(1) - .2, chegou = tcr + Math.max(1.2, tdu - tcr + .3), X0 = PX + .45 - 6.0, X1 = PX - .45;
  // câmera: perto da tara; abre para tara + impureza na "impureza"; desce para o bruto na fala 2; viaja para a balança
  camera([[0, { x: XA, y: .42, z: .05, d: 7.2, az: -.07, el: .34, oy: -6 }],
    [tim - .7, { x: XA + .1, y: .42, z: .05, d: 6.8, az: -.03, el: .34, oy: -6 }, 'lin'],
    [tim + .8, { x: .08, y: .4, z: .5, d: 10.9, az: 0, el: .37, oy: -8 }, 'eio'],
    [TX, { x: .12, y: .4, z: .6, d: 10.3, az: .07, el: .38, oy: -4 }, 'lin'],
    [TX + 2.7, { x: PX - .75, y: .45, z: PZ + .3, d: 10.6, az: -.1, el: .3, oy: -22 }, 'eio', 2.2],
    [60, { x: PX - .75, y: .45, z: PZ + .3, d: 9.9, az: -.03, el: .3, oy: -22 }, 'lin']]);

  return t => {
    // ---------- parte 1 (3D)
    P1.visible = t < TX + 3;
    tara.forEach((g, i) => { cresce(g, t, tta - .05 + i * .12, .65); const a = [tsa, ttb, tcc][i] - .15; tinge(g, eo(pr(t, a, .5))); pulso(g, t, a, .08, .7); });
    cresce(GI, t, tim - .1, .7, .25);
    for (const [c, a] of [['terra', tte], ['borracha', tbo], ['plastico', tpl]]) imp[c].forEach((o, i) => { const p = eo(pr(t, a - .12 + i * .05, .4));
      o.visible = p > 0; o.scale.copy(o.userData.s0).multiplyScalar(Math.max(1e-4, p)); });
    const pB = cresce(GB, t, tbr - .3, .6, .3);
    // a tara (o saco) sobe e vai para o grupo da tara, encolhendo
    const qT = eio(pr(t, tt1 - .1, 1.15)); bag.visible = qT < .999;
    bag.position.set(lerp(0, XA - B[0], qT), lerp(0, .85, qT) + 1.0 * Math.sin(PI * qT), lerp(0, -B[2], qT));
    bag.scale.setScalar(Math.max(1e-4, 1 - qT * qT)); bag.rotation.z = .5 * qT;
    // a impureza sai do bruto e voa para o monte
    voa.forEach((o, i) => { const lp = o.userData.loc, q = eio(pr(t, ti1 - .12 + i * .06, 1.0)), s0 = o.userData.s0;
      const x0 = B[0] + lp[0] * pB, y0 = lp[1] * pB, z0 = B[2] + lp[2] * pB, x1 = XB - .55 + .07 * i, y1 = .3, z1 = .25 + .03 * i;
      o.visible = pB > 0 && q < .999; o.position.set(lerp(x0, x1, q), lerp(y0, y1, q) + .28 * Math.sin(PI * q), lerp(z0, z1, q));
      o.scale.copy(s0).multiplyScalar(Math.max(1e-4, pB * (q < .75 ? 1 : 1 - (q - .75) / .25))); });
    destaque(anB, ondB, t, tl2 - .1); anB.material.opacity *= 1 - eo(pr(t, ten - .3, .4));
    // o líquido entra no estoque: o monte limpo desliza para o palete e vira o fardo de cobre
    cresce(GE, t, ten - .45, .6, .25);
    const qE = eio(pr(t, ten - .05, .8)), as = eo(pr(t, tt1 + .35, .7)), se = Math.max(1e-4, 1 - .65 * qE * qE);
    heap.position.set((EST[0] - B[0] + .32) * qE, .12 * qE + .25 * Math.sin(PI * qE), (EST[2] - B[2]) * qE);
    heap.scale.set((1 + .22 * as) * se, (1 - .24 * as) * se, (1 + .22 * as) * se); heap.visible = qE < .98; mB.material.opacity = mB.userData.op * (1 - qE);
    fCu.visible = qE > .6; fCu.scale.setScalar(Math.max(1e-4, eo((qE - .6) / .4))); pulso(fCu, t, tes, .06, .6);
    // ---------- parte 2 (3D)
    const pa = eio(pr(t, tcr, chegou - tcr)), xc = lerp(X0, X1, pa);
    CAR.position.set(xc, altura(xc), PZ); rodas.forEach(r => { r.rotation.z = -(xc - X1) / .36; });
    carga.forEach((o, i) => { const lp = o.userData.loc, q = eio(pr(t, tde + .1 + i * .055, .75)), a = alvo[i];
      const x0 = xc + lp[0], y0 = altura(xc) + lp[1], z0 = PZ + lp[2], x1 = MON[0] + a[0], y1 = a[1], z1 = MON[2] + a[2];
      o.position.set(lerp(x0, x1, q), lerp(y0, y1, q) + .6 * Math.sin(PI * q), lerp(z0, z1, q));
      o.rotation.set(o.userData.r0.x + 2.2 * q, o.userData.r0.y + 1.2 * q, o.userData.r0.z); });
    mM.material.opacity = .3 * eo(pr(t, tde + .4, 1.2)); destaque(anM, ondM, t, tca - .15);
    const v2 = t > TX - .5; P2.visible = v2; CAR.visible = v2; carga.forEach(o => { o.visible = v2; });

    // ---------- rótulos
    posTitulo(tit, t, j0 - .6, tta - .55); vis(h1, t, -9, TX, { dy: 0, sc: 1 }); vis(h2, t, TX + .05, 1e9, { dy: 10, sc: 1 });
    vis(sTa, t, tta - .1, TX, { dy: 12 }); vis(sTa.lastChild, t, tna - .1, 1e9, { dy: 6 }); ancora(sTa, [XA, 1.12, 0], .5, 1);
    pulse(sTa.firstChild, t, tt1 + .75, .07, .7);
    tara.forEach((g, i) => { const e = cTa[i]; vis(e, t, [tsa, ttb, tcc][i] - .15, L1, { dy: 8, sc: .85 }); ancora(e, [g.position.x, 0, g.position.z + .5], .5, 0, 0, 10); });
    vis(sIm, t, tim - .1, TX, { dy: 12 }); vis(sIm.lastChild, t, tsj - .1, 1e9, { dy: 6 }); ancora(sIm, [XB, .95, 0], .5, 1);
    pulse(sIm.firstChild, t, ti1 + .8, .07, .7);
    cIm.forEach((e, i) => { vis(e, t, [tte, tbo, tpl][i] - .1, L1, { dy: 8, sc: .85 }); ancora(e, [XB + (i - 1) * .78, 0, .95], .5, 0, 0, 10); });
    vis(k4, t, tl1 - .1, TX, { dy: 20, sc: .94 }); vis(o3, t, tl1 + .15, TX, { sc: .6, dy: 0 });
    vis(k1, t, tbr - .15, TX, { dy: 20 }); vis(o1, t, tm1 - .1, TX, { sc: .6, dy: 0 }); vis(k2, t, tt1 - .15, TX, { dy: 20 });
    vis(o2, t, tm2 - .1, TX, { sc: .6, dy: 0 }); vis(k3, t, ti1 - .15, TX, { dy: 20 });
    pulse(k4, t, tl2, .05, .8); ripple(ripL, t, tl2);
    vis(sEs, t, ten - .05, TX, { dy: 12 }); ancora(sEs, [EST[0] + .72, .28, EST[2]], 0, .5, 10, 0); pulse(sEs, t, tes, .06, .7);
    // parte 2
    vis(most, t, TX + 1.9, 1e9, { dy: 10 }); ancora(most, TOPO, .5, 1, 0, 4);
    if (t < tvz - .1) conta(most.mn, t, chegou - .15, .9, 0, R1); else conta(most.mn, t, tvz - .1, .65, R1, R2);
    most.troca(t, tvz - .1); pulse(most, t, tch, .05, .7); pulse(most, t, tvz + .7, .05, .7);
    vis(c1, t, tch - .15, 1e9, { dy: 22 }); vis(oM, t, tp2 - .1, 1e9, { sc: .6, dy: 0 }); vis(c2, t, tvz + .3, 1e9, { dy: 22 });
    vis(oI, t, tdi - .1, 1e9, { sc: .6, dy: 0 }); vis(c3, t, tdi + .12, 1e9, { dy: 22, sc: .94 });
    pulse(c3, t, tca, .04, .8); ripple(rip, t, tca);
  };
}, { aquece: [20, 33] });
</script></body></html>
