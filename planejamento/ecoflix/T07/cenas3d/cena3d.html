<!-- T07 cap06 · PILOTO 3D (Kaik, 11/11: "podem ter ilustrações de conceitos que ficariam melhor se fossem ilustradas/3D").
     A mesma cena da ../cenas/cenas.html (CAPS[6]: tara, impureza e líquido + dupla pesagem), com as mesmas âncoras
     W(linha,'palavra') e os mesmos números (412 − 96 = 316 kg), feita em 3D "argila" com three.js r170 local
     (three.module.min.js ao lado; a página não usa rede). Rótulos em HTML por cima, no estilo saturado do kit.
     Mesma API do kit: window.setup(dados) e window.R(t); WebGL com preserveDrawingBuffer.
     Render: node render_cenas3d.cjs 6 ../cenas/tempos/cap06.json saida.mp4 --de 0.40 --ate 36.05
     (o render_cenas3d.cjs é a cópia do render_cenas.cjs com --allow-file-access-from-files, que o import do módulo pede).
     Um só mundo: parte 1 em torno da origem (tara à esquerda, impureza à direita, o bruto na frente) e a parte 2 (balança
     de pátio, carroça) em (12, 0, −2); a câmera viaja de uma para a outra na palavra "sucata". -->

<script type="module">
import * as THREE from './three.module.min.js';

// ------------------------------------------------------------------ utilidades (as do kit)
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const pr=(t,a,d=.45)=>cl((t-a)/d);
const lerp=(a,b,p)=>a+(b-a)*p;
const OV=document.getElementById('ov');
function el(html,parent=OV){const d=document.createElement('div');d.innerHTML=html.trim();const f=d.firstElementChild;parent.appendChild(f);return f}
function ic(n,px){return `<span class="ic" style="width:${px}px;height:${px}px">${(window.ICONS||{})[n]||''}</span>`}
function vis(e,t,a,b=1e9,o={}){
  const din=o.din??.5,dout=o.dout??.4,dy=o.dy??16,dx=o.dx??0,sc=o.sc??.985;
  const p=eo(pr(t,a,din)),q=1-eo(pr(t,b,dout)),op=Math.min(p,q);
  e.style.opacity=op.toFixed(4);e.style.visibility=op<=.001?'hidden':'visible';
  const s=sc+(1-sc)*p-(1-q)*(1-sc);
  e.style.transform=`translate(${((1-p)*dx).toFixed(2)}px,${((1-p)*dy-(1-q)*dy*.5).toFixed(2)}px) scale(${s.toFixed(4)})`;
  return op;
}
function ripple(r,t,a){const p=pr(t,a,.7);r.style.opacity=(p>0&&p<1)?(.6*(1-p)).toFixed(3):0;r.style.transform=`scale(${(.4+2.0*eo(p)).toFixed(3)})`}
function pulse(e,t,a,amp=.045,dur=.9){const p=pr(t,a,dur);e.style.scale=(p>0&&p<1)?(1+amp*Math.sin(Math.PI*p)).toFixed(4):''}
const NF=new Intl.NumberFormat('pt-BR');
const kg=v=>NF.format(Math.round(v))+' kg';
function conta(e,t,a,d,v0,v1){const s=kg(lerp(v0,v1,eo(pr(t,a,d))));if(e.textContent!==s)e.textContent=s}
function posTitulo(e,t,a,sobe,sai=1e9){vis(e,t,a,sai,{dy:14});const p=eio(pr(t,sobe,.7));
  e.style.top=lerp(318,46,p).toFixed(2)+'px';e.style.scale=lerp(1.12,1,p).toFixed(4)}

// ------------------------------------------------------------------ tempos da fala (iguais ao kit)
let D=null;
const norm=w=>w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9%./-]+/g,'');
function W(linha,palavra,n=1,campo='s'){
  const alvo=norm(palavra);let k=0;
  for(const w of D.words){if(w.linha===linha&&norm(w.w).replace(/[.,]$/,'')===alvo){k++;if(k===n)return w[campo]}}
  for(const w of D.words){if(w.linha===linha&&norm(w.w).startsWith(alvo)){k++;if(k>=n)return w[campo]}}
  console.warn('palavra não achada',linha,palavra);return L(linha);
}
const L=i=>(D.linhas[i]||{s:0}).s;

// ------------------------------------------------------------------ 3D: utilidades
const Q=new URLSearchParams(location.search);   // variantes de custo (aa=0, sm=2048, st=pcf|vsm, rs=1); sem nada = o padrão
const rng=(s=>()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296})(20261111);
const ri=(a,b)=>lerp(a,b,rng());
const PI=Math.PI;
const MAT=o=>{if(Q.get('mt')==='l'){delete o.roughness;delete o.metalness;return new THREE.MeshLambertMaterial(o)}return new THREE.MeshStandardMaterial(o)};
const MC={};   // materiais foscos reaproveitados (argila: roughness alto, sem metal)
function M(c,o={}){const k=c+(o.f?'f':'')+(o.ds?'d':'')+(o.r??'');
  return MC[k]||(MC[k]=MAT({color:c,roughness:o.r??.86,metalness:0,flatShading:!!o.f,side:o.ds?THREE.DoubleSide:THREE.FrontSide}))}
function MU(c,o={}){return MAT({color:c,roughness:o.r??.88,metalness:0,side:o.ds?THREE.DoubleSide:THREE.FrontSide})} // material próprio (muda de cor)
function poe(g,m,pai,p=[0,0,0],r=[0,0,0],s=1){const o=new THREE.Mesh(g,m);o.position.set(...p);o.rotation.set(...r);
  if(Array.isArray(s))o.scale.set(...s);else o.scale.setScalar(s);o.castShadow=o.receiveShadow=true;pai.add(o);return o}
function grupo(pai,p=[0,0,0]){const g=new THREE.Group();g.position.set(...p);pai.add(g);return g}
// caixa de cantos arredondados (o RoundedBoxGeometry dos exemplos do three, sem addon)
function rbox(w,h,d,r=.04,seg=2){seg=seg*2+1;r=Math.min(w/2,h/2,d/2,r);
  const g=new THREE.BoxGeometry(1,1,1,seg,seg,seg).toNonIndexed(),P=g.attributes.position.array,N=g.attributes.normal.array;
  const bx=w/2-r,by=h/2-r,bz=d/2-r,hs=.5/seg,n=new THREE.Vector3();
  for(let i=0;i<P.length;i+=3){const x=P[i],y=P[i+1],z=P[i+2];
    n.set(x-Math.sign(x)*hs,y-Math.sign(y)*hs,z-Math.sign(z)*hs).normalize();
    P[i]=bx*Math.sign(x)+n.x*r;P[i+1]=by*Math.sign(y)+n.y*r;P[i+2]=bz*Math.sign(z)+n.z*r;N[i]=n.x;N[i+1]=n.y;N[i+2]=n.z}
  g.deleteAttribute('uv');return g}
// sombra de contato (mancha macia no chão, por baixo da sombra da luz)
let TXS=null;
function mancha(pai,w,d,op=.3,p=[0,0,0]){
  if(!TXS){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),gr=g.createRadialGradient(64,64,0,64,64,64);
    gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.5,'rgba(255,255,255,.5)');gr.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=gr;g.fillRect(0,0,128,128);TXS=new THREE.CanvasTexture(c)}
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d),new THREE.MeshBasicMaterial({map:TXS,color:0x1d2b24,transparent:true,opacity:op,depthWrite:false}));
  m.rotation.x=-PI/2;m.position.set(p[0],.004,p[2]);m.renderOrder=1;m.userData.op=op;pai.add(m);return m}
// anel verde no chão (destaque) e a onda que sai dele
function anel(pai,r,w=.07,p=[0,0,0]){const m=new THREE.Mesh(new THREE.RingGeometry(r-w/2,r+w/2,72),
  new THREE.MeshBasicMaterial({color:0x50D088,transparent:true,opacity:0,depthWrite:false}));
  m.rotation.x=-PI/2;m.position.set(p[0],.008,p[2]);m.renderOrder=2;pai.add(m);return m}
function destaque(an,onda,t,a){const p=eo(pr(t,a,.45));an.material.opacity=.95*p;an.visible=p>0;an.scale.setScalar(lerp(.85,1,p));
  const q=pr(t,a+.05,.9);onda.visible=q>0&&q<1;onda.material.opacity=.7*(1-q);onda.scale.setScalar(1+.7*eo(q))}
// entrada de um objeto: cresce do chão (escala) com um leve giro; nada de pulo
function cresce(o,t,a,d=.6,giro=.35){const p=eo(pr(t,a,d)),s=o.userData.s??1;o.visible=p>0;o.scale.setScalar(Math.max(1e-4,p)*s);
  o.rotation.y=(o.userData.ry??0)-giro*(1-p);return p}
function pulso(o,t,a,amp=.07,dur=.7){const p=pr(t,a,dur);if(p>0&&p<1)o.scale.multiplyScalar(1+amp*Math.sin(PI*p))}
// monte: posições num domo de raio rx/rz e altura h, mais perto da superfície (o miolo não aparece)
function monte(n,rx,rz,h,y0=0,sup=.45){const P=[];for(let i=0;i<n;i++){const a=rng()*2*PI,u=Math.sqrt(rng());
  const top=h*Math.pow(1-u*u,.8);P.push([Math.cos(a)*u*rx,y0+top*(sup+(1-sup)*rng())+.03,Math.sin(a)*u*rz])}return P}

// ------------------------------------------------------------------ 3D: peças de sucata e de impureza (genéricas)
const GEO={};
function geos(){
  GEO.tubo=new THREE.CylinderGeometry(.042,.042,.46,12);   GEO.bobina=new THREE.TorusGeometry(.1,.032,8,18);
  GEO.chapa=rbox(.32,.035,.24,.012,1);                      GEO.bloco=new THREE.DodecahedronGeometry(.12,0);
  GEO.lata=new THREE.CylinderGeometry(.05,.05,.14,14);      GEO.perfil=rbox(.52,.055,.055,.014,1);
  GEO.terra=new THREE.DodecahedronGeometry(.075,0);         GEO.pneu=new THREE.TorusGeometry(.12,.045,8,14,PI*1.1);
  GEO.mangueira=new THREE.CylinderGeometry(.03,.03,.32,10); GEO.caco=rbox(.17,.014,.11,.006,1);
  GEO.garrafa=new THREE.CylinderGeometry(.045,.05,.17,12);
}
const PAL={cobre:['#C8703A','#B45F2D','#D98C58'],alu:['#C9D1DA','#AFB9C4','#DDE3E9'],aco:['#7E8995','#646F7B','#8F99A4'],
  ferrugem:['#9A5B3A','#86513A','#A86A48'],terra:['#7A5233','#8B6240','#6A4529'],borracha:['#22272E','#2E343C'],plastico:['#4F8EDC','#E6EEF7','#3E7BC6']};
const TIPOS={cobre:['tubo','bobina','bloco','tubo','bobina'],alu:['lata','perfil','chapa','lata'],aco:['chapa','bloco','perfil','chapa'],
  ferrugem:['bloco','chapa','perfil'],terra:['terra'],borracha:['pneu','mangueira'],plastico:['caco','caco','garrafa']};
const pega=a=>a[Math.floor(rng()*a.length)];
function giro(k){if(k==='tubo'||k==='mangueira'||k==='garrafa')return[ri(-.4,.4),ri(0,2*PI),PI/2+ri(-.4,.4)];
  if(k==='bobina'||k==='pneu')return[PI/2+ri(-.5,.5),ri(0,2*PI),ri(-.4,.4)];
  if(k==='bloco'||k==='terra')return[ri(0,2*PI),ri(0,2*PI),ri(0,2*PI)];
  if(k==='lata')return[ri(-.4,.4)+(rng()<.5?PI/2:0),ri(0,2*PI),ri(-.4,.4)];
  return[ri(-.3,.3),ri(0,2*PI),ri(-.3,.3)]}
function peca(pai,metal,p,s=1){const k=pega(TIPOS[metal]),cor=pega(PAL[metal]);
  const sc=(k==='bloco'||k==='terra')?[s*ri(.8,1.3),s*ri(.55,.95),s*ri(.8,1.25)]:s*ri(.85,1.15);
  const o=poe(GEO[k],M(cor,{f:k==='bloco'||k==='terra'}),pai,p,giro(k),sc);o.receiveShadow=Q.get('rs')==='1';o.userData.s0=o.scale.clone();return o}

// ------------------------------------------------------------------ 3D: desenhos (sem marca)
// saco de ráfia fechado (tara)
function saco(pai,p){const g=grupo(pai,p),mt=MU('#E9D6AC'),ml=MU('#B89A62'),mf=MU('#C9AF7E');
  const pts=[[0,0],[.2,.004],[.29,.05],[.325,.17],[.335,.34],[.315,.5],[.26,.62],[.17,.71],[.085,.77],[.072,.81],[.1,.87],[.115,.92],[.07,.95],[0,.955]];
  poe(new THREE.LatheGeometry(pts.map(([r,y])=>new THREE.Vector2(r,y)),30),mt,g,[0,0,0],[0,0,0],[1,1,.82]);
  poe(new THREE.TorusGeometry(.083,.024,8,20),ml,g,[0,.79,0],[PI/2,0,0],[1,.82,1]);
  for(const [y,r] of [[.25,.331],[.42,.33]])poe(new THREE.TorusGeometry(r,.007,6,40),mf,g,[0,y,0],[PI/2,0,0],[1,.82,1]);
  return {g,mats:[[mt,'#E9D6AC'],[ml,'#B89A62'],[mf,'#C9AF7E']]}}
// tambor de aço
function tambor(pai,p){const g=grupo(pai,p),mt=MU('#557891'),ma=MU('#46667D');
  poe(new THREE.CylinderGeometry(.29,.29,.86,36),mt,g,[0,.43,0]);
  for(const y of [.29,.57])poe(new THREE.TorusGeometry(.292,.017,8,40),ma,g,[0,y,0],[PI/2,0,0]);
  for(const y of [.012,.858])poe(new THREE.TorusGeometry(.282,.022,8,40),ma,g,[0,y,0],[PI/2,0,0]);
  poe(new THREE.CylinderGeometry(.045,.045,.03,16),ma,g,[.14,.87,.06]);
  return {g,mats:[[mt,'#557891'],[ma,'#46667D']]}}
// caçamba pequena (de empilhadeira): corpo em trapézio, boca escura e dois patins
function cacamba(pai,p){const g=grupo(pai,p),mt=MU('#6E7B88'),mi=MU('#56626F'),mp=MU('#2F353C');
  const sh=new THREE.Shape();sh.moveTo(-.42,0);sh.lineTo(.42,0);sh.lineTo(.56,.5);sh.lineTo(-.56,.5);sh.closePath();
  const geo=new THREE.ExtrudeGeometry(sh,{depth:.04,bevelEnabled:true,bevelThickness:.012,bevelSize:.012,bevelSegments:1,curveSegments:1});
  geo.translate(0,.08,-.02);for(const z of [-.31,.31])poe(geo,mt,g,[0,0,z]);            // as duas pontas em trapézio
  const inc=Math.atan2(.14,.5);for(const sx of [-1,1])poe(rbox(.045,.53,.66,.015,1),mt,g,[sx*.49,.33,0],[0,0,-sx*inc]);   // laterais inclinadas
  poe(rbox(.86,.04,.62,.015,1),mi,g,[0,.1,0]);                                           // fundo (mais escuro: a boca aberta)
  for(const x of [-.28,.28])poe(rbox(.13,.07,.72,.02,1),mp,g,[x,.035,0]);
  return {g,mats:[[mt,'#6E7B88'],[mi,'#56626F'],[mp,'#2F353C']]}}
// saco aberto (o bruto): ráfia por fora, sucata aparecendo na boca
function sacoAberto(pai){const mt=MU('#E9D6AC',{ds:true}),mf=M('#C9AF7E');
  const pts=[[0,0],[.24,.004],[.34,.05],[.385,.17],[.395,.34],[.38,.5],[.35,.62],[.33,.7],[.345,.75],[.365,.775]];
  const g=grupo(pai);poe(new THREE.LatheGeometry(pts.map(([r,y])=>new THREE.Vector2(r,y)),34),mt,g,[0,0,0],[0,0,0],[1,1,.84]);
  poe(new THREE.TorusGeometry(.358,.026,8,40),mf,g,[0,.765,0],[PI/2,0,0],[1,.84,1]);
  for(const y of [.22,.4])poe(new THREE.TorusGeometry(.392,.007,6,44),mf,g,[0,y,0],[PI/2,0,0],[1,.84,1]);
  return g}
// fardo prensado com duas cintas
function fardo(pai,p,cor){const g=grupo(pai,p);poe(rbox(.5,.42,.46,.035,2),M(cor),g,[0,.21,0]);
  for(const x of [-.13,.13])poe(rbox(.03,.43,.47,.01,1),M('#2F353C'),g,[x,.21,0]);return g}
// palete de madeira
function palete(pai,p){const g=grupo(pai,p),m=M('#C9A27A'),m2=M('#B48C64');
  for(const z of [-.4,0,.4])poe(rbox(1.3,.08,.13,.02,1),m2,g,[0,.04,z]);
  for(let i=0;i<6;i++)poe(rbox(.18,.035,1.0,.012,1),m,g,[-.55+i*.22,.098,0]);return g}

// ------------------------------------------------------------------ cena
let RD,CENA,CAM,SOL,CHAO,CK=[],RENDER=null;
function base(){
  RD=new THREE.WebGLRenderer({canvas:document.getElementById('gl'),antialias:Q.get('aa')!=='0',alpha:true,preserveDrawingBuffer:true});
  // 3D a 1920x1200 no máximo (o palco final é menor que isso); os rótulos HTML ficam na resolução cheia
  RD.setPixelRatio(Math.min(window.devicePixelRatio||1,+(Q.get('pr')||1.5)));RD.setSize(1280,800,false);RD.setClearColor(0x000000,0);
  RD.shadowMap.enabled=Q.get('sh')!=='0';RD.shadowMap.type={pcf:THREE.PCFShadowMap,vsm:THREE.VSMShadowMap}[Q.get('st')]??THREE.PCFSoftShadowMap;
  CENA=new THREE.Scene();
  CAM=new THREE.PerspectiveCamera(26,1280/800,.1,120);
  CENA.add(new THREE.HemisphereLight(0xffffff,0xB9C2CB,1.7));
  SOL=new THREE.DirectionalLight(0xffffff,2.3);SOL.castShadow=true;SOL.shadow.mapSize.setScalar(+(Q.get('sm')||1024));SOL.shadow.blurSamples=8;
  const sc=SOL.shadow.camera;sc.left=-6.5;sc.right=6.5;sc.top=6.5;sc.bottom=-6.5;sc.near=1;sc.far=40;
  SOL.shadow.bias=-.0004;SOL.shadow.normalBias=.02;SOL.shadow.radius=4;CENA.add(SOL,SOL.target);
