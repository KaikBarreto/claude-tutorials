<!-- T07 "Comprar e vender sucata" · ilustrações de conceito (kit perfis/ecoflix/cenas/cenas_ecoflix.html).
     Uma janela por capítulo (ilustracoes.json): cap00 o dia no pátio · cap02 Não informado · cap04 qual preço vale ·
     cap06 tara, impureza e líquido + dupla pesagem (o desenho do kit "Tara e peso líquido", com a carroça do Zé) ·
     cap09 as três formas · cap11 as parcelas · cap12 o cupom · cap13 o lucro do latão · cap14 cobre misto → cobre mel ·
     cap15 operação com Erro. Tudo função do tempo, preso às falas do narracao/tts_textos.py com W(linha, 'palavra').
     Render só do trecho: node render_cenas.cjs <cap> capNN.json saida.mp4 --html cenas.html --de <at> --ate <at+dur>.
     Utilidades novas desta aula (faltavam no kit): kgd() (kg com casas), setaD() (seta para o traco()), carroca(),

/* paleta EcoFlix (igual ao kit): --v acento (só preenchimento, barra, contorno) · --ve texto verde · --ae texto âmbar */
:root{--v:#50D088;--ve:#2E7D57;--vc:#EAF8F0;--vm:#A9E9C6;--a:#F2B63D;--ae:#8A5A00;--ac:#FFF5DF;

*{box-sizing:border-box;margin:0;padding:0;transition:none!important;animation:none!important}
html,body{width:1280px;height:800px;overflow:hidden;background:#fff}

<script>
// ------------------------------------------------------------------ utilidades (as do kit, sem mudança)
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const pr=(t,a,d=.45)=>cl((t-a)/d);
const lerp=(a,b,p)=>a+(b-a)*p;
const $=s=>document.querySelector(s);
const ST=document.getElementById('st');
function el(html,parent=ST){const d=document.createElement('div');d.innerHTML=html.trim();let f=null;for(const n of [...d.childNodes]){parent.appendChild(n);if(!f&&n.nodeType===1)f=n}return f}
function grupo(){return el('<div class="g"></div>')}
function ic(n,px,cor){const s=(window.ICONS||{})[n]||'';return `<span class="ic" style="width:${px}px;height:${px}px;${cor?'color:'+cor:''}">${s}</span>`}
function hex(c){c=c.replace('#','');return[0,2,4].map(i=>parseInt(c.substr(i,2),16))}
function mix(a,b,p){const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*cl(p))).join(',')})`}
function vis(e,t,a,b=1e9,o={}){
  const din=o.din??.5,dout=o.dout??.4,dy=o.dy??16,dx=o.dx??0,sc=o.sc??.985;
  const p=eo(pr(t,a,din)),q=1-eo(pr(t,b,dout)),op=Math.min(p,q);
  e.style.opacity=op.toFixed(4);e.style.visibility=op<=.001?'hidden':'visible';
  const s=sc+(1-sc)*p - (1-q)*(1-sc);
  e.style.transform=`translate(${((1-p)*dx).toFixed(2)}px,${((1-p)*dy-(1-q)*dy*.5).toFixed(2)}px) scale(${s.toFixed(4)})`;
  return op;
}
function ripple(r,t,a){const p=pr(t,a,.7);r.style.opacity=(p>0&&p<1)?(.6*(1-p)).toFixed(3):0;r.style.transform=`scale(${(.4+2.0*eo(p)).toFixed(3)})`}
function pulse(e,t,a,amp=.045,dur=.9){const p=pr(t,a,dur);e.style.scale=(p>0&&p<1)?(1+amp*Math.sin(Math.PI*p)).toFixed(4):''}
const NF=new Intl.NumberFormat('pt-BR');
const kg=v=>NF.format(Math.round(v))+' kg';
const brl=v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function conta(e,t,a,d,v0,v1,fmt=kg){const p=eo(pr(t,a,d));const s=fmt(lerp(v0,v1,p));if(e.textContent!==s)e.textContent=s;return p}
function traco(p,t,a,d=.8){if(!p._L){p._L=p.getTotalLength();p.style.strokeDasharray=p._L}const q=eio(pr(t,a,d));p.style.strokeDashoffset=(p._L*(1-q)).toFixed(2);p.style.opacity=q>0?1:0;return q}
function arco(e,t,a,d,x0,y0,x1,y1,h=-80,rot=0){const p=eio(pr(t,a,d));const x=lerp(x0,x1,p),y=lerp(y0,y1,p)+h*4*p*(1-p);
  e.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${(rot*p).toFixed(2)}deg)`;return p}
function contorno(e,t,a,de,para,d=.45){e.style.borderColor=mix(de,para,eo(pr(t,a,d)))}
function titulo(g,kick,txt){return el(`<div class="ab" style="left:0;top:0;width:1280px;text-align:center">
  <div class="kick">${kick}</div><div class="h" style="margin-top:12px">${txt}</div></div>`,g)}
function posTitulo(e,t,a,sobe,sai=1e9){vis(e,t,a,sai,{dy:14});const p=eio(pr(t,sobe,.7));
  e.style.top=lerp(318,46,p).toFixed(2)+'px';e.style.scale=lerp(1.12,1,p).toFixed(4)}
// ------------------------------------------------------------------ utilidades desta aula (faltavam no kit)
const NFd=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:3});
const kgd=v=>NFd.format(v)+' kg';                       // kg com casas: 21,6 kg (o kg() do kit arredonda)
const kg1=v=>v.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+' kg';   // contagem com uma casa
// seta (linha + ponta) num só <path>, para o traco() desenhar a ponta por último
function setaD(x1,y1,x2,y2,h=13){const a=Math.atan2(y2-y1,x2-x1),f=s=>`${(x2-h*Math.cos(a+s*.55)).toFixed(1)} ${(y2-h*Math.sin(a+s*.55)).toFixed(1)}`;
  return `M${x1} ${y1} L${x2} ${y2} M${f(1)} L${x2} ${y2} L${f(-1)}`}
function svgTela(pai){return el('<svg class="ab" style="left:0;top:0;overflow:visible" width="1280" height="800"></svg>',pai)}
function caminho(sv,d,cor='var(--v)',w=4,extra=''){const p=document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d',d);p.setAttribute('fill','none');p.setAttribute('stroke',cor);p.setAttribute('stroke-width',w);
  p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');if(extra)p.setAttribute('stroke-dasharray',extra);
  p.style.opacity=0;sv.appendChild(p);return p}
// linha tracejada que se desenha (o traco() usa o dasharray): revela por clip
function tracejado(p,t,a,d=.7){const q=eio(pr(t,a,d));p.style.opacity=q>0?1:0;p.style.clipPath=`inset(0 ${((1-q)*100).toFixed(2)}% 0 0)`;return q}
// linha reta que cresce do começo ao fim mudando o próprio "d" (mantém o tracejado; serve para linha vertical)
function linhaParcial(p,t,a,d,x0,y0,x1,y1){const q=eio(pr(t,a,d));p.setAttribute('d',`M${x0} ${y0} L${lerp(x0,x1,q).toFixed(2)} ${lerp(y0,y1,q).toFixed(2)}`);
  p.style.opacity=q>0?1:0;return q}

// ------------------------------------------------------------------ tempos da fala
let D=null;
const norm=w=>w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9%./-]+/g,'');
function W(linha,palavra,n=1,campo='s'){
  const alvo=norm(palavra);let k=0;
  for(const w of D.words){if(w.linha===linha&&norm(w.w).replace(/[.,]$/,'')===alvo){k++;if(k===n)return w[campo]}}
  for(const w of D.words){if(w.linha===linha&&norm(w.w).startsWith(alvo)){k++;if(k>=n)return w[campo]}}
  console.warn('palavra não achada',linha,palavra);return L(linha);
}
const L=i=>(D.linhas[i]||{s:0}).s, LE=i=>(D.linhas[i]||{e:D.dur}).e;

// ------------------------------------------------------------------ desenhos genéricos (sem marca)
const PECAS=[ // [forma, cor, centro da peça, destino no monte atrás do veículo] (as do kit)
  ['<polygon points="28,90 44,52 88,42 100,90"/>','#8C5A3C',[64,66],[-224,148,6]],
  ['<polygon points="82,90 102,36 146,48 154,90"/>','#6F7983',[118,63],[-318,122,12]],
  ['<rect x="118" y="44" width="112" height="16" rx="8" transform="rotate(-8 174 52)"/>','#9AA3AD',[174,52],[-334,98,-18]],
  ['<polygon points="148,90 170,54 212,44 232,90"/>','#A0694A',[190,67],[-425,148,-8]],
  ['<polygon points="210,90 232,40 276,54 286,90"/>','#4F5861',[248,65],[-373,120,-10]],
  ['<polygon points="258,90 282,60 308,66 312,90"/>','#8A949E',[285,75],[-375,148,4]],
  ['<g><circle cx="192" cy="64" r="19"/><circle cx="192" cy="64" r="7" fill="#8A949E"/></g>','#5E6670',[192,64],[-242,155,200]],
  ['<polygon points="40,70 60,50 84,64 64,86"/>','#B07A55',[62,68],[-307,100,30]]];
const pecasSVG=()=>PECAS.map(([f,c,[cx,cy],[dx,dy,r]])=>`<g class="pd" data-cx="${cx}" data-cy="${cy}" data-dx="${dx}" data-dy="${dy}" data-r="${r}" fill="${c}">${f}</g>`).join('');
// carroça de mão de lado (frente para a direita): a mesma caçamba e a mesma carga do caminhão do kit, uma roda grande e
// o varal (puxador); a roda gira com a distância (data-x/data-y/data-r)
function carroca(){
  return `<svg viewBox="0 0 500 230" width="500" height="230" style="overflow:visible">
    <g class="carga">${pecasSVG()}</g>
    <rect x="18" y="86" width="304" height="80" rx="6" fill="#7E8994"/>
    <rect x="16" y="82" width="308" height="11" rx="4" fill="#68727D"/>
    <g stroke="#707A85" stroke-width="3">${[78,138,198,258].map(x=>`<line x1="${x}" y1="98" x2="${x}" y2="158"/>`).join('')}</g>
    <rect x="10" y="160" width="330" height="12" rx="5" fill="#23282E"/>
    <path d="M326 104 L470 112" stroke="#5B636C" stroke-width="11" stroke-linecap="round"/>
    <path d="M458 111 L488 113" stroke="#2F3640" stroke-width="16" stroke-linecap="round"/>
    <g class="roda" data-x="170" data-y="186" data-r="36" transform="translate(170,186)"><circle r="36" fill="#1B1F24"/><circle r="17" fill="#9AA3AD"/>
      <rect x="-3" y="-32" width="6" height="12" rx="2" fill="#5B636C"/><rect x="-3" y="20" width="6" height="12" rx="2" fill="#5B636C"/>
      <rect x="-32" y="-3" width="12" height="6" rx="2" fill="#5B636C"/><rect x="20" y="-3" width="12" height="6" rx="2" fill="#5B636C"/></g>
  </svg>`;
}
// mini desenhos de tara (110x96): saco de ráfia, tambor, caçamba
const SACO=`<svg viewBox="0 0 110 96" width="110" height="96"><path d="M27 34 Q14 84 31 90 L79 90 Q96 84 83 34 Q69 27 55 31 Q41 27 27 34 Z" fill="#EFE6D2" stroke="#C2AE84" stroke-width="3" stroke-linejoin="round"/>
  <path d="M44 32 Q55 13 66 32" fill="none" stroke="#C2AE84" stroke-width="4" stroke-linecap="round"/>
  <g stroke="#DACBA8" stroke-width="2.5" stroke-linecap="round"><line x1="25" y1="52" x2="85" y2="52"/><line x1="23" y1="66" x2="87" y2="66"/><line x1="24" y1="80" x2="86" y2="80"/></g></svg>`;
const TAMBOR=`<svg viewBox="0 0 110 96" width="110" height="96"><rect x="27" y="16" width="56" height="76" rx="7" fill="#6F7983"/>
  <ellipse cx="55" cy="17" rx="28" ry="7" fill="#8A949E"/><rect x="27" y="40" width="56" height="5" fill="#5B636C"/><rect x="27" y="66" width="56" height="5" fill="#5B636C"/></svg>`;
const CACAMBA=`<svg viewBox="0 0 110 96" width="110" height="96"><polygon points="6,36 104,36 92,86 18,86" fill="#7E8994"/>
  <rect x="2" y="29" width="106" height="9" rx="3" fill="#68727D"/><g stroke="#707A85" stroke-width="3"><line x1="40" y1="42" x2="42" y2="82"/><line x1="70" y1="42" x2="68" y2="82"/></g>
  <rect x="16" y="86" width="16" height="6" rx="2" fill="#23282E"/><rect x="78" y="86" width="16" height="6" rx="2" fill="#23282E"/></svg>`;
// monte de ferro com a impureza (300x124): terra, borracha e plástico em grupos que entram nas palavras
const MONTE=`<svg viewBox="0 0 300 124" width="300" height="124" style="overflow:visible">
  <path d="M16 120 Q38 74 78 62 Q118 24 160 32 Q206 20 238 62 Q270 80 286 120 Z" fill="#8A949E"/>
  <g fill="#6F7983"><polygon points="70,92 96,66 128,74 118,104"/><polygon points="150,58 186,44 204,72 170,86"/><polygon points="214,96 236,74 262,92 240,112"/></g>
  <g fill="#A0694A"><polygon points="112,50 140,40 150,62 124,70"/><polygon points="40,108 62,90 84,104 60,118"/></g>
  <g class="terra" fill="#7A5233"><circle cx="96" cy="100" r="8"/><circle cx="138" cy="92" r="6"/><circle cx="196" cy="98" r="9"/><circle cx="58" cy="82" r="5"/><circle cx="236" cy="54" r="6"/><circle cx="168" cy="110" r="7"/></g>
  <g class="borracha" fill="#1B1F24"><rect x="140" y="70" width="28" height="11" rx="5" transform="rotate(-18 154 75)"/><rect x="210" y="80" width="24" height="10" rx="5" transform="rotate(14 222 85)"/><rect x="84" y="56" width="22" height="9" rx="4" transform="rotate(8 95 60)"/></g>
  <g class="plastico"><polygon points="118,84 132,80 128,94" fill="#4F8EDC"/><polygon points="248,100 262,94 262,108" fill="#4F8EDC"/><polygon points="176,40 190,46 180,54" fill="#E6EEF7" stroke="#9FB3C8" stroke-width="2"/><polygon points="64,98 76,94 74,106" fill="#E6EEF7" stroke="#9FB3C8" stroke-width="2"/></g>
</svg>`;

const CAPS={};

// ------------------------------------------------------------------ CAPS[0] · O dia no pátio (L0-L1)
// 0 "...faz o dia inteiro: pesar, comprar, pagar e imprimir o comprovante. E depois vender."  1 "A sucata chega no portão e
// vai pra balança. Daí o peso tem que virar valor certo e pagamento na hora, sem anotar nada no papel."
CAPS[0]=()=>{
  const g=grupo();
  const tit=titulo(g,'Recicla Vale Metais','O dia no pátio');
  const sv=svgTela(g);
  const linhaDia=caminho(sv,'M96 282 L1184 282','#DDE2E7',4);
  const passos=[['scale','Pesar'],['clipboard-list','Comprar'],['banknote','Pagar'],['receipt-text','Comprovante'],['truck','Vender']];
  const cards=passos.map(([n,txt],i)=>el(`<div class="card" style="left:${69+i*238}px;top:178px;width:190px;height:208px;border-width:2px">
      <div class="ico dz" style="width:92px;height:92px;margin:30px auto 0;border-radius:24px">${ic(n,50)}</div>
      <div class="ttl ml" style="text-align:center;margin-top:20px">${txt}</div></div>`,g));
  const pix=el('<div class="tag v" style="position:absolute;left:112px;top:18px;font-size:15px;padding:5px 11px;border:2px solid #fff">Pix</div>',cards[2]);
  const setas=[0,1,2,3].map(i=>caminho(sv,`M${69+i*238+190+18} 270 L${69+i*238+190+30} 282 L${69+i*238+190+18} 294`,'var(--v)',4));
  // o portão, a balança com o visor e o computador (L1)
  const chao=el('<div class="ab" style="left:84px;top:700px;width:1112px;height:4px;border-radius:2px;background:#DDE2E7"></div>',g);
  const portao=el(`<div class="ab" style="left:96px;top:548px;width:110px;height:154px">
      <div class="ab" style="left:0;top:0;width:14px;height:154px;border-radius:4px;background:#9AA3AD"></div>
      <div class="ab" style="left:96px;top:0;width:14px;height:154px;border-radius:4px;background:#9AA3AD"></div>
      <div class="ab" style="left:0;top:0;width:110px;height:12px;border-radius:4px;background:#7E8994"></div></div>`,g);
  const plat=el('<div class="ab" style="left:236px;top:678px;width:232px;height:16px;border-radius:5px;background:#CBD1D8;border:2px solid #A8B0B9"></div>',g);
  const col=el('<div class="ab" style="left:444px;top:540px;width:12px;height:140px;border-radius:4px;background:#B9C1C9"></div>',g);
  const most=el(`<div class="ab most" style="left:330px;top:452px;width:240px">

      <div class="ttl" style="margin-top:16px;font-size:28px">Cobre mel</div>
      <div class="num mk" style="font-size:40px;margin-top:6px;color:var(--ve)">42 kg</div></div>`,g);
  const pm=misto.querySelector('.pm'), mk=mel.querySelector('.mk');
  const sv=svgTela(g);
  const P0=[262,266], P1=[898,246], HA=-120;                 // o pedaço sai do topo do misto e pousa no topo do mel
  const rota=caminho(sv,`M${P0[0]+60} ${P0[1]+72} Q${(P0[0]+P1[0])/2+60} ${(P0[1]+P1[1])/2+2*HA+72} ${P1[0]+60} ${P1[1]+72}`,'#E7A15F',4,'3 10');
  const peca=el(`<div class="ab" style="left:0;top:0;width:120px;height:110px">
      <svg class="ab" style="left:10px;top:44px;overflow:visible" width="100" height="56"><path d="M4 54 Q20 22 46 16 Q72 6 90 30 Q98 42 98 54 Z" fill="#D9894A"/>
        <polygon points="30,48 44,30 60,40 50,54" fill="#E7A15F"/></svg>
      <div class="tag a" style="position:absolute;left:14px;top:0;font-size:19px;padding:6px 14px">18 kg</div></div>`,g);
  const s=caminho(sv,setaD(957,618,957,646,12),'var(--v)',4);
  const ven=el(`<div class="tag v ab" style="left:847px;top:656px;font-size:21px">${ic('shopping-cart',24)}Venda: 60 kg</div>`,g);

  return t=>{
    const j0=W(3,'cobre')-.3, tco=W(3,'cobre'), tme=W(3,'mel'), tse=W(3,'sessenta'), tve=W(3,'venda'), tpr=W(3,'precisa');
    posTitulo(tit,t,j0-.6,tco-.45);
    vis(misto,t,tco,1e9,{dy:16,sc:.95}); vis(mel,t,tco+.2,1e9,{dy:16,sc:.95});
    const dv=Math.max(.8,tse-tme-.1);
    tracejado(rota,t,tme+.05,dv);
    arco(peca,t,tme+.05,dv,P0[0],P0[1],P1[0],P1[1],HA);
    const op=eo(pr(t,tme-.15,.3)); peca.style.opacity=op.toFixed(3); peca.style.visibility=op>.001?'visible':'hidden';
    pm.style.transform=`scale(${lerp(1,.9,eio(pr(t,tme+.05,dv))).toFixed(4)})`;
    conta(mk,t,tse-.15,.8,42,60);
    pulse(mel,t,tse+.65,.03,.7);
    traco(s,t,tve-.25,.3); vis(ven,t,tve-.1,1e9,{dy:10}); pulse(ven,t,tpr,.05,.7);
  };
};

// ------------------------------------------------------------------ CAPS[15] · Operação com Erro (L4)
// 4 "Uma dica: se uma operação ficar com Erro, ela não vai de novo sozinha, pra não lançar em dobro. Use o Tentar novamente,
// o ícone de atualizar do lado: ele reenvia sem duplicar. Sem esse botão, remova pela lixeira e refaça a operação
// normalmente." Rótulos do app: "Compra", "Venda", "Erro", o ícone de atualizar ("Tentar novamente") e a lixeira
// ("Remover da fila"), em components/OfflinePendingSyncTabs.tsx.
CAPS[15]=()=>{
  const g=grupo();
  const tit=titulo(g,'Sem internet','Operação com Erro');
  const caixa=el(`<div class="card" style="left:110px;top:156px;width:370px;height:350px">
      <div class="row" style="position:absolute;left:26px;top:22px;gap:12px"><div class="ico n" style="width:42px;height:42px;border-radius:12px">${ic('laptop',24)}</div>
      <div class="ttl" style="font-size:20px">No computador</div></div></div>`,g);
  const nuvem=el(`<div class="ab" style="left:836px;top:150px;width:330px;text-align:center;color:#9AA3AD">${ic('cloud',96)}</div>`,g);
  const fila=[['Compra','shopping-cart'],['Venda','circle-dollar-sign'],['Compra','shopping-cart']].map(([txt,n],i)=>{
    const w=el('<div class="ab" style="left:0;top:0;width:310px;height:74px"></div>',g);
    const c=el(`<div class="pc" style="left:0;top:0;width:310px;height:74px;border-radius:16px">
        <div class="ico ${i===1?'n':''}" style="width:44px;height:44px;border-radius:50%">${ic(n,24)}</div>
        <div class="ttl" style="font-size:21px">${txt}</div>
        <div class="ok chk v" style="margin-left:auto;width:36px;height:36px;opacity:0">${ic('check',22)}</div>
        <div class="er tag" style="margin-left:auto;font-size:16px;padding:6px 12px;background:var(--rs);color:#fff;opacity:0;position:absolute;right:14px">${ic('circle-alert',18)}Erro</div></div>`,w);
    return {w,c,ok:c.querySelector('.ok'),er:c.querySelector('.er')};
  });
  const POS=[[140,236],[140,322],[140,408]], DEST=[[846,262],[846,348]];
  const sv=svgTela(g);
  const tent=caminho(sv,'M462 445 Q650 420 830 400','#9AA3AD',4,'8 9');
  const ban=el(`<div class="ab" style="left:618px;top:398px;width:56px;height:56px;border-radius:50%;background:var(--rs);color:#fff;
      display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(16,24,40,.12)">${ic('ban',34)}</div>`,g);
  const opc=(x,n,cls,rot,sub)=>el(`<div class="card" style="left:${x}px;top:546px;width:500px;height:150px;border-width:2px">
      <div class="row" style="position:absolute;left:26px;top:28px;gap:18px">
        <div class="ico ${cls} gi" style="width:64px;height:64px;border-radius:18px">${ic(n,34)}</div>
        <div><div class="ttl" style="font-size:23px">${rot}</div><div class="sub ss" style="margin-top:6px;font-size:18px;font-weight:700;color:${cls?'var(--ae)':'var(--ve)'}">${sub}</div></div></div>
      <div class="chk v ck" style="position:absolute;right:24px;top:52px;opacity:0">${ic('check',24)}</div></div>`,g);
  const oA=opc(110,'refresh-cw','','Tentar novamente','reenvia sem duplicar'), oB=opc(670,'trash-2','a','Remover da fila','e refaça a operação');

  return t=>{
    const j0=W(4,'dica')-.3, top=W(4,'operacao'), ter=W(4,'erro'), tna=W(4,'nao'), tso=W(4,'sozinha'), tdo=W(4,'dobro'),
          tte=W(4,'tentar'), tat=W(4,'atualizar'), tre=W(4,'reenvia'), tdu=W(4,'duplicar'), tse=W(4,'sem',2), tli=W(4,'lixeira'), trf=W(4,'refaca');
    posTitulo(tit,t,j0-.6,top-.5);
    vis(caixa,t,top-.12,1e9,{dy:16}); vis(nuvem,t,top,1e9,{dy:10});
    // depois que as duas sobem, a caixa do computador encolhe em volta da que ficou
    const fe=eio(pr(t,top+1.6,.6)); caixa.style.top=lerp(156,312,fe).toFixed(2)+'px'; caixa.style.height=lerp(350,194,fe).toFixed(2)+'px';
    fila.forEach((f,i)=>{
      vis(f.c,t,top-.02+i*.1,1e9,{dy:12});
      if(i<2){const a=top+.45+i*.3; arco(f.w,t,a,.75,POS[i][0],POS[i][1],DEST[i][0],DEST[i][1],-70);
        f.ok.style.opacity=eo(pr(t,a+.7,.3)).toFixed(3);}
      else f.w.style.transform=`translate(${POS[2][0]}px,${POS[2][1]}px)`;
    });
    const e=fila[2], pe=eo(pr(t,ter-.1,.4));
    e.c.style.borderColor=mix('#E1E8E4','#F3B8B0',pe); e.c.style.background=mix('#FFFFFF','#FEF3F2',pe); e.er.style.opacity=pe.toFixed(3);
    pulse(e.c,t,ter-.1,.04,.7);
    tracejado(tent,t,tna-.15,.7); vis(ban,t,tso-.15,1e9,{dy:0,sc:.5}); pulse(ban,t,tdo-.1,.12,.7);
    vis(oA,t,tte-.15,1e9,{dy:18,sc:.95}); vis(oA.querySelector('.ss'),t,tre-.1,1e9,{dy:6});
    const gi=oA.querySelector('.gi svg'); gi.style.transform=`rotate(${(360*eio(pr(t,tat-.1,.9))).toFixed(1)}deg)`;
    vis(oA.querySelector('.ck'),t,tdu-.1,1e9,{dy:0,sc:.5});
    vis(oB,t,tse-.15,1e9,{dy:18,sc:.95}); pulse(oB.querySelector('.gi'),t,tli-.1,.12,.7); vis(oB.querySelector('.ss'),t,trf-.1,1e9,{dy:6});
  };
};

let RENDER=null;
window.setup=d=>{D=d;ST.innerHTML='';RENDER=CAPS[d.cap]();return true};
