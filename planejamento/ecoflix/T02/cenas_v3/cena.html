<script type="module">

const cartaoP = (icone, rot, sub, cls, cw = 190) => htmlFluxoCartoes({ cartoes: [[icone, rot, sub, cls]], cw });   // cartão pequeno (selo + rótulo + legenda)

// =====================================================================================================================
// CENA "chaveiro" · cap03, linha 1 · clima escuro (permissão é dado do sistema)
// "São três perfis prontos, e o Personalizado. Pensa num chaveiro: cada perfil pronto já vem com um conjunto de chaves.
//  O Personalizado vem vazio, pra você montar."
// Os quatro perfis na ordem da tela. No "chaveiro" cada um ganha a argola; no "chaves" as chaves caem nas três prontas
// (as do Somente Visualização são vazadas: só abrem para olhar). No fim a câmera fecha no Personalizado: argola vazia e o "+".
function htmlChaveiro(n, o = {}) {
  estilo('chv', `.chv{position:relative;width:336px;height:280px}.chv svg{position:absolute;inset:0;overflow:visible}.chv .k{transform-origin:120px 58px;opacity:0}`);
  const A = Array.from({ length: n }, (_, i) => (i - (n - 1) / 2) * 25), v = o.vazada;
  const ch = a => `<g class="k" data-a="${a}"><g transform="translate(120 58)"><path d="M0 2V33" stroke="rgba(255,255,255,.5)" stroke-width="2.4" stroke-linecap="round"/>
    ${v ? `<circle cy="45" r="11" stroke="#6CF0A8" stroke-width="2.6"/><path d="M-3.5 56V112Q-3.5 115 0 115Q3.5 115 3.5 112V104H10V98H3.5V93H8.5V87H3.5V56" stroke="#6CF0A8" stroke-width="2.6" stroke-linejoin="round"/>`
        : `<circle cy="45" r="12.5" fill="url(#chvG)"/><circle cy="41.5" r="4" fill="#1B2A23"/><rect x="-3.6" y="55" width="7.2" height="61" rx="3.4" fill="url(#chvG)"/><rect x="2" y="87" width="8.5" height="6.4" rx="2" fill="url(#chvG)"/><rect x="2" y="98" width="10" height="6.4" rx="2" fill="url(#chvG)"/>`}</g></g>`;

    <path class="elo" d="M120 0V11" stroke="rgba(255,255,255,.5)" stroke-width="2.4" stroke-linecap="round"/>
    <circle class="aro" cx="120" cy="34" r="23" stroke="${n ? 'rgba(255,255,255,.82)' : 'rgba(247,197,90,.9)'}" stroke-width="5" ${n ? '' : 'stroke-dasharray="7 8"'} stroke-linecap="round"/>${A.map(ch).join('')}</svg></div>`;

function chaveiroAnda(e, t, tAro, tCh) {

  K.forEach((k, i) => { const a = tCh + i * .09, p = pr(t, a, 1.1); k.style.opacity = eo(pr(t, a, .22)).toFixed(3);
    k.style.transform = `rotate(${(+k.dataset.a + 24 * golpe(p, 1.3, 3.2) * (i % 2 ? -1 : 1)).toFixed(2)}deg) translateY(${(-16 * (1 - eo5(pr(t, a, .4)))).toFixed(2)}px)`; });
}
function chaveiro() {

  const EE = .0112, EIXO = lugar([0, 0, 0]), E = mundoEscuro(EIXO, 0, EE), X = (html, x, y, o = {}) => E(html, x * EE, -y * EE, 0, o);   // X: posição em px do desenho (y para baixo)

  const cart = PERFIS.map(([i, r, s, c], k) => X(cartaoP(i, r, s, c, CW), k * P, 0, { anc: [0, 0] })), HC = cart[0].h, LT = 3 * P + cart[3].w;
  const arg = PERFIS.map((p, k) => X(htmlChaveiro(p[4], { vazada: k === 2 }), k * P + cart[k].w / 2, HC, { anc: [.5, 0], sobre: true }));
  const mais = X(htmlOp('+'), 3 * P + cart[3].w / 2, HC + 172, { sobre: true });
  E.fundo(LT / 2 * EE, -(HC + AH) / 2 * EE, { aneis: false });

  const ret = (x0, y0, x1, y1) => [x0 * EE, -y1 * EE, x1 * EE, -y0 * EE];

        S2 = enquadraRet(EIXO, ret(3 * P - 40, 0, 3 * P + cart[3].w + 40, HC + AH), { az: -.03, max: 1.42 / EE });   // 3 · fecha no Personalizado

  return t => {
    clima(1); GL.style.visibility = 'hidden'; posTitulo(tit, t, t0 - .9, t0 - .45);

// CENA "comprador" · cap06, linha 1 · clima claro (gente e fichas: o mundo físico)
// "Pensa num comprador que roda a rua e não deve ver os fornecedores dos colegas. A restrição faz a pessoa enxergar só o

// dos colegas apagam e sobram as que ele mesmo lançou.
function comprador() {
  const L = 1, t0 = W(L, 'pensa'), tco = W(L, 'comprador'), tru = W(L, 'rua'), tfo = W(L, 'fornecedores'), tcl = W(L, 'colegas'), tre = W(L, 'restricao'), ten = W(L, 'enxergar'), tso = W(L, 'so'),
    tla = W(L, 'lancou'), tfim = W(L, 'lancou', 1, 'e');
  patio([0, 3.2, -12]);
  const XA = -3.05, XB = [.15, 3.05], X0 = XA - 4.4, ta = t0 - .7, tch = tru + .25;
  const A = pessoa(CENA, [X0, 0, 0], { camisa: '#2FB271', bone: '#2E7D57' });
  XB.forEach((x, i) => { const p = pessoa(CENA, [x, 0, 0], i ? { camisa: '#8E9BB0', cabelo: '#5A4636', coque: true } : { camisa: '#A6B2C2', pele: '#C98F6B' }); p.rotation.y = -PI / 2; });
  const an = anel(.9, [XA, 0, 0]);
  const EF = .0078, YF = [2.42, 3.1], ficha = (x, y, sub, cls) => plano(cartaoP('store', 'Fornecedor', sub, cls, 196), { pos: [x, y, 0], rot: [-.06, 0, 0], esc: EF });
  const fA = YF.map(y => ficha(X0, y, 'do comprador', '')), fB = XB.flatMap(x => YF.map(y => ficha(x, y, 'de um colega', 'n')));
  const FZ = 2.9, chR = plano(htmlChip(`${ic('eye-off', 18)}Restrição`, 'n'), { pos: [-2.2, .5, 3.4], rot: [-.2, 0, 0], esc: .0095 });
  const chS = plano(htmlChip(`${ic('eye', 18)}só o que ela mesma lançou`), { pos: [.85, .5, 3.4], rot: [-.2, 0, 0], esc: .0095 });
  const tit = titulo('Permissões', 'Restrições');
  const K1 = { x: -1.25, y: 1.72, z: 0, d: 11.8, az: .1, el: .1 }, K2 = { x: 0, y: 1.7, z: 0, d: 12.3, az: .035, el: .1 }, K3 = { x: -.35, y: 1.68, z: 0, d: 12.0, az: -.03, el: .1 };
  camera([[t0 - 3, K1], [tfo - .55, { ...K1, d: 11.6, az: .085 }, 'lin'], [tfo + .6, K2], [tre - .4, { ...K2, d: 12.15, az: .015 }, 'lin'], [tre + .8, K3], [tfim + 2.5, { ...K3, d: 11.8, az: -.05 }, 'lin']]);
  return t => {
    GL.style.opacity = eo(pr(t, t0 + .08, .5)).toFixed(3); posTitulo(tit, t, t0 - .9, t0 - .45);
    const p = pr(t, ta, tch - ta), x = lerp(X0, XA, 1 - Math.pow(1 - p, 2.1)), gira = eio(pr(t, tch - .25, .5));
    A.position.x = x; A.userData.anda((x - X0) * 5.2 * (1 - gira)); A.rotation.y = -PI / 2 * gira;
    fA.forEach((f, i) => { f.pos[0] = x; vis(f.e, t, (i ? tru - .05 : tco + .2), 1e9, { dy: 18, sc: .95 }); });
    fB.forEach((f, i) => { vis(f.e, t, (i < 2 ? tfo - .1 : tcl - .15) + (i % 2) * .14, 1e9, { dy: 18, sc: .95 }); foco(f.e, t, -9, ten - .1 + i * .07, { min: .2 }); });
    vis(chR.e, t, tre - .1, 1e9, { dy: 10, sc: .8 }); vis(chS.e, t, tso - .1, 1e9, { dy: 10, sc: .8 });
    for (const [i, f] of fA.entries()) pulso(f.e, t, tla - .05 + i * .12, .06, .8); pulso(chS.e, t, tla + .1, .06, .8); destaque(an, t, tla - .1);
  };

// =====================================================================================================================
// CENA "cracha" · cap08, linha 1 · clima claro (crachá e gaveta: papel e gente)

// crachá aparece e, no "rasgar", parte em dois.
function htmlCracha() {
  estilo('crc', `
.crc{position:relative;width:220px;height:300px}
.crc .corpo{position:absolute;left:0;top:40px;width:220px;height:260px;border-radius:18px;background:linear-gradient(165deg,#fff,#F3F8F6);border:1px solid #fff;
  box-shadow:0 26px 48px -14px rgba(30,80,60,.32),0 6px 14px -4px rgba(30,80,60,.12);overflow:hidden;text-align:center}
.crc .faixa{height:58px;background:linear-gradient(100deg,#2FB271,#63D99B);color:#fff;font-weight:800;font-size:13.5px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:9px;white-space:nowrap}
.crc .fita{position:absolute;left:97px;top:0;width:26px;height:60px;border-radius:5px;background:linear-gradient(180deg,#39424A,#59646E)}
.crc .av{margin:16px auto 0;width:82px;height:82px;border-radius:50%;background:linear-gradient(160deg,#E4EFEA,#C9DAD2);color:#7C8F87;display:flex;align-items:center;justify-content:center}

  return `<div class="crc"><div class="corpo"><div class="faixa">Recicla Vale Metais</div><div class="av">${ic('user-round', 46)}</div><div class="nm">Marcos Antunes</div><div class="st"><i></i>Ativo</div></div><div class="fita"></div></div>`;
}
function cracha() {

  const c1 = X(htmlCracha(), XE, Y0, { z: 0, sobre: true });
  const gB = X(`<div style="position:relative;width:332px;height:214px;border-radius:14px 14px 24px 24px;background:linear-gradient(170deg,#fff,#EBF3EF);border:1px solid #fff;box-shadow:0 30px 54px -16px rgba(30,80,60,.36),0 -8px 16px -10px rgba(30,80,60,.22)">

  const chS = X(htmlChip(`${ic('lock', 18)}sem acesso`, 'n'), XE, 262, { z: 90, sobre: true });

  const mE = X(`<div style="clip-path:polygon(-60px -60px,${zz.join(',')},-60px 360px)">${htmlCracha()}</div>`, XD - 55, Y0, { anc: [.25, .5], sobre: true });
  const mD = X(`<div style="clip-path:polygon(280px -60px,${zz.join(',')},280px 360px)">${htmlCracha()}</div>`, XD + 55, Y0, { anc: [.75, .5], sobre: true });

// =====================================================================================================================
// CENA "cadeiras" · cap10, linhas 1 e 2 · clima claro (cadeiras e gente)
// "Pensa em cadeiras: cada usuário ativo ocupa uma. Quem está desativado libera a dele."
// "E se o plano diminuir e sobrar gente, o sistema abre uma janela pedindo pra você escolher quem desativar."
// Três cadeiras, o Rafael, a Juliana e o Marcos sentados: 3 / 3 usuários. No "desativado" o Marcos levanta e sai de lado
// (2 / 3); volta no começo da linha 2; no "diminuir" a cadeira dele some e ele sobra de pé; no "janela", o aviso do sistema.
function cadeiras() {
