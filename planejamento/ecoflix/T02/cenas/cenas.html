<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- T02 "Usuários e permissões" (EcoFlix): as ilustrações de conceito da aula, feitas no kit
     perfis/ecoflix/cenas/cenas_ecoflix.html (estilo e utilidades iguais; os dois exemplos do kit saíram, nenhum se aplica).
     Um CAPS[n] por capítulo com cena; no cap04 há duas cenas no mesmo CAPS[n], cada uma na sua janela.
     Cada cena usa exatamente as âncoras do ilustracoes.json (janela() abaixo): abre 0,3 s antes da palavra "de" e fecha
     "cauda" s depois do fim da palavra "ate". Tempos estimados em tempos/capNN.json até a voz chegar.
     Render de uma cena:  node render_cenas.cjs <n> capNN.json <saida.mp4> --html cenas.html --de <at> --ate <at + dur>
     Rótulos do app como no inventario.md (e as 3 ações de "Contas a Pagar/Receber" de config/routes.ts); pessoas e
     números do mundo da Recicla Vale Metais; desenhos genéricos, sem marca. -->
<style>
@font-face{font-family:M;font-weight:500;src:url(../../../web/fonts/montserrat-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:600;src:url(../../../web/fonts/montserrat-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:700;src:url(../../../web/fonts/montserrat-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:800;src:url(../../../web/fonts/montserrat-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:500;src:url(../../../web/fonts/montserrat-latin-ext-500-normal.woff2) format('woff2');unicode-range:U+0100-024F}
@font-face{font-family:M;font-weight:700;src:url(../../../web/fonts/montserrat-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-024F}
/* ---------------------------------------------------------------- paleta EcoFlix (marca: acento #50D088, escuro #121212)
   --v  acento: preenchimentos, barras, contornos de destaque (nunca texto sobre branco: contraste baixo)
   --ve verde escuro: texto e ícone verde sobre branco (contraste 5,0)   --vc verde claro: fundo de ícone/resultado
   --a  âmbar: o SEGUNDO conceito da cena (ex.: competência x caixa)     --ae texto âmbar (5,9)   --ac âmbar claro
   --t  texto (o escuro da marca)   --c texto secundário (4,8)   --l linhas   --e painel escuro (mostrador) */
:root{--v:#50D088;--ve:#2E7D57;--vc:#EAF8F0;--vm:#A9E9C6;--a:#F2B63D;--ae:#8A5A00;--ac:#FFF5DF;
  --t:#121212;--c:#6B7280;--l:#E6E9EE;--e:#121212}
*{box-sizing:border-box;margin:0;padding:0;transition:none!important;animation:none!important}
html,body{width:1280px;height:800px;overflow:hidden;background:#fff}
body{font-family:M,sans-serif;color:var(--t);-webkit-font-smoothing:antialiased}
#st{position:absolute;inset:0;overflow:hidden;background:
  radial-gradient(1100px 650px at 92% -12%,rgba(80,208,136,.09),transparent 62%),
  radial-gradient(900px 600px at -12% 112%,rgba(80,208,136,.06),transparent 60%),#fff}
.g{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:640px 400px}
.ab{position:absolute}
.row{display:flex;align-items:center}
/* título da cena: área (kicker) + conceito; sozinho fica grande no centro e sobe quando o desenho entra */
.kick{font-weight:700;font-size:15px;letter-spacing:.3em;color:var(--ve);text-transform:uppercase}
.h{font-weight:800;font-size:46px;letter-spacing:-.01em;line-height:1.1}
/* cartão, chip, etiqueta, ícone */
.card{position:absolute;background:#fff;border:1px solid #E1E8E4;border-radius:18px;
  box-shadow:0 18px 40px rgba(16,24,40,.10),0 3px 8px rgba(16,24,40,.06)}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:100%;height:100%}
.ico{display:flex;align-items:center;justify-content:center;flex:none;border-radius:14px;background:var(--vc);color:var(--ve)}
.ico.a{background:var(--ac);color:var(--ae)}
.tag{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;font-weight:800;font-size:20px;white-space:nowrap}
.tag.v{background:var(--vc);color:var(--ve)} .tag.a{background:var(--ac);color:var(--ae)}
.lbl{font-weight:700;font-size:17px;color:var(--c)}
.num{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.op{position:absolute;width:60px;height:60px;border-radius:50%;background:#F2F4F7;color:var(--t);display:flex;
  align-items:center;justify-content:center;font-weight:800;font-size:34px;line-height:1}
/* mostrador da balança (painel escuro, número no acento) */
.most{background:var(--e);border-radius:16px;padding:16px 22px 18px;box-shadow:0 16px 34px rgba(16,24,40,.22)}
.most .ml{position:relative;height:20px;font-weight:700;font-size:15px;letter-spacing:.22em;color:#A9E9C6;text-transform:uppercase}
.most .ml span{position:absolute;left:0;top:0;white-space:nowrap}
.most .mn{margin-top:6px;font-weight:800;font-size:44px;color:var(--v);font-variant-numeric:tabular-nums;white-space:nowrap}
.rip{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:3px solid var(--v);opacity:0}
/* T02 (faltavam no kit): interruptor desenhado, linha que acende, barra, coroa e escudo preenchidos */
.chv{position:relative;display:inline-block;flex:none;width:48px;height:28px;border-radius:14px;background:#C9CED6}
.chv i{position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.25)}
.hl{border-radius:8px;padding:2px 10px}
.bar{height:10px;border-radius:5px;background:#E6E9EE}
.fsh svg{fill:#16A34A} .fcr svg{fill:#FFFFFF}
</style><style id="saturado">/* estilo saturado (Kaik, 11/11): selo, chip, etiqueta, quadrado de ícone e círculo de etapa
   com fundo cheio e ícone/texto branco; nunca fundo claro com conteúdo colorido, nunca ícone escuro sobre o verde */
:root{--vs:#16A34A;--as:#D97706;--rs:#DC2626}
.ico{background:var(--vs);color:#fff}.ico.a{background:var(--as);color:#fff}
.tag.v{background:var(--vs);color:#fff}.tag.a{background:var(--as);color:#fff}
</style></head>
<body><div id="st"></div>
<script>
// ------------------------------------------------------------------ utilidades (as do cenas_modelo.html + as da EcoFlix)
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const pr=(t,a,d=.45)=>cl((t-a)/d);
const lerp=(a,b,p)=>a+(b-a)*p;
const $=s=>document.querySelector(s);
const ST=document.getElementById('st');
function el(html,parent=ST){const d=document.createElement('div');d.innerHTML=html.trim();let f=null;for(const n of [...d.childNodes]){parent.appendChild(n);if(!f&&n.nodeType===1)f=n}return f}
function grupo(){return el('<div class="g"></div>')}
function ic(n,px,cor){const s=(window.ICONS||{})[n]||'';return `<span class="ic" style="width:${px}px;height:${px}px;${cor?'color:'+cor:''}">${s}</span>`}
function hex(c){c=c.replace('#','');return[0,2,4].map(i=>parseInt(c.substr(i,2),16))}
function mix(a,b,p){const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*cl(p))).join(',')})`}
// aparece em a, some em b (opacidade + leve subida + escala): a entrada e a saída suaves de tudo
function vis(e,t,a,b=1e9,o={}){
  const din=o.din??.5,dout=o.dout??.4,dy=o.dy??16,dx=o.dx??0,sc=o.sc??.985;
  const p=eo(pr(t,a,din)),q=1-eo(pr(t,b,dout)),op=Math.min(p,q);
  e.style.opacity=op.toFixed(4);e.style.visibility=op<=.001?'hidden':'visible';
  const s=sc+(1-sc)*p - (1-q)*(1-sc);
  e.style.transform=`translate(${((1-p)*dx).toFixed(2)}px,${((1-p)*dy-(1-q)*dy*.5).toFixed(2)}px) scale(${s.toFixed(4)})`;
  return op;
}
function ripple(r,t,a){const p=pr(t,a,.7);r.style.opacity=(p>0&&p<1)?(.6*(1-p)).toFixed(3):0;r.style.transform=`scale(${(.4+2.0*eo(p)).toFixed(3)})`}
function pulse(e,t,a,amp=.045,dur=.9){const p=pr(t,a,dur);e.style.scale=(p>0&&p<1)?(1+amp*Math.sin(Math.PI*p)).toFixed(4):''}
function digita(e,txt,t,a,b){const p=cl((t-a)/Math.max(.05,b-a));const n=Math.round(p*txt.length);
  const car=(p>0&&p<1)||(Math.floor(t*2.2)%2===0&&p<1.2&&t>=a)?'<span style="color:var(--v);font-weight:500">|</span>':'';
  e.innerHTML=(txt.slice(0,n)||'')+(t>=a&&t<b+.8?car:'');}
// EcoFlix: números e dinheiro no jeito brasileiro; contagem suave de um número; traço que se desenha; arco; contorno
const NF=new Intl.NumberFormat('pt-BR');
const kg=v=>NF.format(Math.round(v))+' kg';
const brl=v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function conta(e,t,a,d,v0,v1,fmt=kg){const p=eo(pr(t,a,d));const s=fmt(lerp(v0,v1,p));if(e.textContent!==s)e.textContent=s;return p}
function traco(p,t,a,d=.8){if(!p._L){p._L=p.getTotalLength();p.style.strokeDasharray=p._L}const q=eio(pr(t,a,d));p.style.strokeDashoffset=(p._L*(1-q)).toFixed(2);p.style.opacity=q>0?1:0;return q}
function arco(e,t,a,d,x0,y0,x1,y1,h=-80,rot=0){const p=eio(pr(t,a,d));const x=lerp(x0,x1,p),y=lerp(y0,y1,p)+h*4*p*(1-p);
  e.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${(rot*p).toFixed(2)}deg)`;return p}
function contorno(e,t,a,de,para,d=.45){e.style.borderColor=mix(de,para,eo(pr(t,a,d)))}
// título padrão da cena: grande no centro enquanto está sozinho, sobe para o alto quando o desenho entra (em "sobe")
function titulo(g,kick,txt){return el(`<div class="ab" style="left:0;top:0;width:1280px;text-align:center">
  <div class="kick">${kick}</div><div class="h" style="margin-top:12px">${txt}</div></div>`,g)}
function posTitulo(e,t,a,sobe,sai=1e9){vis(e,t,a,sai,{dy:14});const p=eio(pr(t,sobe,.7));
  e.style.top=lerp(318,46,p).toFixed(2)+'px';e.style.scale=lerp(1.12,1,p).toFixed(4)}

// ------------------------------------------------------------------ tempos da fala (capNN.json do proc.py ou estimado)
let D=null;
const norm=w=>w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9%./-]+/g,'');
function W(linha,palavra,n=1,campo='s'){
  const alvo=norm(palavra);let k=0;
  for(const w of D.words){if(w.linha===linha&&norm(w.w).replace(/[.,]$/,'')===alvo){k++;if(k===n)return w[campo]}}
  for(const w of D.words){if(w.linha===linha&&norm(w.w).startsWith(alvo)){k++;if(k>=n)return w[campo]}}
  console.warn('palavra não achada',linha,palavra);return L(linha);
}
const L=i=>(D.linhas[i]||{s:0}).s, LE=i=>(D.linhas[i]||{e:D.dur}).e;

// ------------------------------------------------------------------ desenhos genéricos (sem marca)
// caminhão de lado (frente para a direita), com a carga de sucata em pedaços (.pd) que podem ser descarregados
function caminhao(){
  const pd=[ // [forma, cor, centro da peça, destino no monte atrás do caminhão (deslocamento do centro e giro)]
    ['<polygon points="28,90 44,52 88,42 100,90"/>','#8C5A3C',[64,66],[-224,148,6]],
    ['<polygon points="82,90 102,36 146,48 154,90"/>','#6F7983',[118,63],[-318,122,12]],
    ['<rect x="118" y="44" width="112" height="16" rx="8" transform="rotate(-8 174 52)"/>','#9AA3AD',[174,52],[-334,98,-18]],
    ['<polygon points="148,90 170,54 212,44 232,90"/>','#A0694A',[190,67],[-425,148,-8]],
    ['<polygon points="210,90 232,40 276,54 286,90"/>','#4F5861',[248,65],[-373,120,-10]],
    ['<polygon points="258,90 282,60 308,66 312,90"/>','#8A949E',[285,75],[-375,148,4]],
    ['<g><circle cx="192" cy="64" r="19"/><circle cx="192" cy="64" r="7" fill="#8A949E"/></g>','#5E6670',[192,64],[-242,155,200]],
    ['<polygon points="40,70 60,50 84,64 64,86"/>','#B07A55',[62,68],[-307,100,30]]];
  const pecas=pd.map(([f,c,[cx,cy],[dx,dy,r]])=>`<g class="pd" data-cx="${cx}" data-cy="${cy}" data-dx="${dx}" data-dy="${dy}" data-r="${r}" fill="${c}">${f}</g>`).join('');
  const roda=x=>`<g class="roda" data-x="${x}" transform="translate(${x},196)"><circle r="26" fill="#1B1F24"/><circle r="12" fill="#9AA3AD"/>
    <rect x="-2.5" y="-23" width="5" height="10" rx="2" fill="#5B636C"/><rect x="-2.5" y="13" width="5" height="10" rx="2" fill="#5B636C"/></g>`;
  return `<svg viewBox="0 0 500 230" width="500" height="230" style="overflow:visible">
    <g class="carga">${pecas}</g>
    <rect x="18" y="86" width="304" height="88" rx="6" fill="#7E8994"/>
    <rect x="16" y="82" width="308" height="11" rx="4" fill="#68727D"/>
    <g stroke="#707A85" stroke-width="3">${[78,138,198,258].map(x=>`<line x1="${x}" y1="98" x2="${x}" y2="168"/>`).join('')}</g>
    <path d="M334,176 L334,76 Q334,64 346,64 L412,64 L462,116 L472,121 Q480,124 480,134 L480,176 Z" fill="#2F3640"/>
    <path d="M348,78 L406,78 L444,116 L348,116 Z" fill="#D7E5ED"/>
    <rect x="470" y="142" width="10" height="11" rx="2" fill="#F2B63D"/>
    <rect x="12" y="170" width="472" height="15" rx="4" fill="#23282E"/>
    ${roda(92)}${roda(158)}${roda(416)}
  </svg>`;
}

// ------------------------------------------------------------------ T02: utilidades que faltavam no kit (escritas aqui)
// janela da cena com as MESMAS âncoras do ilustracoes.json; trecho(): várias cenas no mesmo CAPS[n], cada grupo só existe
// perto da sua janela; tituloJ(): o título já está inteiro (grande no centro) no 1º quadro da janela e sobe em "sobe"
function janela(de,ate,cauda){return [W(de[0],de[1],de[2]||1)-.3, W(ate[0],ate[1],ate[2]||1,'e')+cauda]}
function trecho(g,t,j){const on=t>=j[0]-1.5&&t<=j[1]+1.5;g.style.display=on?'':'none';return on}
function tituloJ(tit,t,j,sobe){posTitulo(tit,t,j[0]-.6,sobe)}
// vários pulsos no mesmo elemento (pulse() chamado duas vezes no mesmo quadro: a segunda chamada apaga a primeira)
function pulsos(e,t,lista){let s=1;for(const [a,amp=.045,dur=.9] of lista){const p=pr(t,a,dur);if(p>0&&p<1)s*=1+amp*Math.sin(Math.PI*p)}
  e.style.scale=s===1?'':s.toFixed(4)}
// interruptor desenhado (p = 0 desligado, 1 ligado); fundo que acende atrás de uma linha (sobre branco)
function chave(e,p){e.style.background=mix('#C9CED6','#50D088',p);e.firstElementChild.style.left=lerp(4,24,eio(p)).toFixed(2)+'px'}
function acende(e,t,a,cor='#EAF8F0',d=.45){e.style.backgroundColor=mix('#FFFFFF',cor,eo(pr(t,a,d)))}
// porta (a tela): fechada e aberta empilhadas; abre(e, p) troca uma pela outra
function porta(px,c0='#6B7280',c1='#2E7D57'){return `<div style="position:relative;width:${px}px;height:${px}px;flex:none">
  <div class="ab pf" style="left:0;top:0">${ic('door-closed',px,c0)}</div><div class="ab pa" style="left:0;top:0;opacity:0">${ic('door-open',px,c1)}</div></div>`}
function abre(e,p){e.querySelector('.pf').style.opacity=(1-p).toFixed(3);e.querySelector('.pa').style.opacity=p.toFixed(3)}
// foco num cartão: contorno verde e anel suave entre a e b
function foco(e,t,a,b=1e9){const on=eo(pr(t,a,.4))*(1-eo(pr(t,b,.4)));e.style.borderColor=mix('#E1E8E4','#50D088',on);
  e.style.boxShadow=`0 0 0 ${(4*on).toFixed(2)}px rgba(80,208,136,.22),0 18px 40px rgba(16,24,40,.10),0 3px 8px rgba(16,24,40,.06)`}
const TAGC='background:#4B5563;color:#fff';   // etiqueta neutra (nome, situação)
const SETA=(x0,y0,x1,y1,cor='var(--v)')=>`<svg class="ab" style="left:0;top:0;overflow:visible" width="1280" height="800">
  <path class="s" d="M${x0} ${y0} L${x1} ${y1}" fill="none" stroke="${cor}" stroke-width="4" stroke-linecap="round"/></svg>`;
const PONTA=(x,y,cor='var(--v)')=>`<svg class="ab" style="left:${x-14}px;top:${y-12}px;overflow:visible" width="24" height="24">
  <path d="M2 2 L14 12 L2 22" fill="none" stroke="${cor}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

const CAPS={};
// ------------------------------------------------------------------ CAPS[0] · cap00 · a equipe e as portas de cada um
// fala: 0 "Oi! Neste tutorial a gente vai colocar a equipe da Recicla Vale Metais dentro do EcoSistema, cada um com o
// acesso certo."  1 "O Marcos pesa o material e opera o caixa, mas não precisa ver o lucro."  2 "A Juliana cuida das
// contas e das notas, e não mexe no caixa."  3 "O dono decide quem vê valor, quem abre caixa e quem não vê nada."
CAPS[0]=()=>{
  const g=grupo(), tit=titulo(g,'Recicla Vale Metais','A equipe');
  const P=[['Rafael Nogueira','Dono','#16A34A','#FFFFFF'],['Marcos Antunes','Balança e caixa','#D97706','#FFFFFF'],['Juliana Prado','Escritório','#4B5563','#FFFFFF']];
  const X=k=>85+k*380;
  const cards=P.map(([n,papel,bg,fg],k)=>el(`<div class="card row" style="left:${X(k)}px;top:244px;width:350px;height:136px;padding:0 22px;gap:18px;border-width:2px">
      <div style="position:relative;width:72px;height:72px;border-radius:50%;background:${bg};display:flex;align-items:center;justify-content:center;flex:none">${ic('user-round',40,fg)}
        ${k===0?`<div class="ab" style="right:-8px;top:-8px;width:32px;height:32px;border-radius:50%;background:#D97706;border:2px solid #fff;display:flex;align-items:center;justify-content:center">${ic('crown',17,'#fff')}</div>`:''}</div>
      <div><div style="font-weight:800;font-size:22px;white-space:nowrap">${n}</div><div class="tag" style="margin-top:8px;font-size:15px;padding:5px 12px;${TAGC}">${papel}</div></div></div>`,g));
  // as telas de cada um: aberta (verde), fechada (cinza) ou o lucro que ele não vê (âmbar, riscado)
  const EST={a:['door-open','#16A34A','#FFFFFF'],f:['door-closed','#4B5563','#FFFFFF'],x:['eye-off','#D97706','#FFFFFF']};
  const chip=(k,i,txt,e)=>{const [icn,bg,fg]=EST[e];return el(`<div class="ab row" style="left:${X(k)}px;top:${408+i*58}px;width:350px;height:46px;border-radius:12px;padding:0 16px;gap:12px;background:${bg};color:${fg}">
      ${ic(icn,22,fg)}<span style="position:relative;font-weight:700;font-size:17px;white-space:nowrap">${txt}${e==='x'?'<span class="risco" style="position:absolute;left:-3px;right:-3px;top:50%;height:2px;background:#fff;transform:scaleX(0);transform-origin:0 50%"></span>':''}</span></div>`,g)};
  const R=[chip(0,0,'Acesso Total','a'),chip(0,1,'Caixa','a'),chip(0,2,'Contas a Pagar/Receber','a'),chip(0,3,'Ver Projeção de Lucro','a')];
  const M=[chip(1,0,'Ticket de Pesagem','a'),chip(1,1,'Estoque','a'),chip(1,2,'Caixa','a'),chip(1,3,'Ver Projeção de Lucro','x')];
  const Ju=[chip(2,0,'Contas a Pagar/Receber','a'),chip(2,1,'Movimentações Bancárias','a'),chip(2,2,'Fiscal &amp; Ambiental','a'),chip(2,3,'Caixa','f')];
  const J=janela([0,'Oi'],[3,'nada'],.6);
  return t=>{
    if(!trecho(g,t,J))return;
    const tEq=W(0,'equipe'), tMa=W(1,'Marcos'), tPe=W(1,'pesa'), tMt=W(1,'material'), tCx=W(1,'caixa'), tLu=W(1,'lucro'),
          tJu=W(2,'Juliana'), tCo=W(2,'contas'), tNo=W(2,'notas'), tC2=W(2,'caixa'), tDo=W(3,'dono'), tDe=W(3,'decide'), tVa=W(3,'valor'), tC3=W(3,'caixa');
    tituloJ(tit,t,J,tEq-.1);
    cards.forEach((e,i)=>vis(e,t,tEq+.45+i*.3,1e9,{dy:18}));
    foco(cards[1],t,tMa-.1,tJu-.1); foco(cards[2],t,tJu-.1,tDo-.1); foco(cards[0],t,tDo-.1);
    [tPe,tMt,tCx,tLu].forEach((a,i)=>vis(M[i],t,a-.1,1e9,{dx:-12,dy:0}));
    M[3].querySelector('.risco').style.transform=`scaleX(${eio(pr(t,tLu+.25,.45)).toFixed(4)})`;

  const SOMBRA='filter:drop-shadow(0 12px 22px rgba(16,24,40,.12))';
  // esquerda: o crachá desce para a caixa (guardado) e pode voltar
  const crE=el(`<div class="ab" style="left:225px;top:186px;${SOMBRA}">${cracha}</div>`,g);
  const caixa=el(`<div class="ab" style="left:180px;top:450px;width:300px;height:200px">

  // direita: o crachá se rasga em dois

};

     <rect class="ass" x="10" y="78" width="120" height="26" rx="10" fill="#B9C1C9"/><rect x="22" y="104" width="10" height="44" rx="4" fill="#9AA3AD"/><rect x="108" y="104" width="10" height="44" rx="4" fill="#9AA3AD"/></svg>`;
  const XC=[250,510,770,1030];
  const cadeiras=XC.slice(0,3).map(x=>el(`<div class="ab" style="left:${x-70}px;top:380px">${cad}</div>`,g));
  const extra=el(`<div class="ab" style="left:${XC[3]-70}px;top:380px;width:140px;height:150px;border-radius:18px;border:3px dashed #C9CED6;display:flex;align-items:center;justify-content:center">${ic('plus',46,'#9AA3AD')}</div>`,g);
  const NOMES=[['Rafael','#16A34A','#FFFFFF'],['Juliana','#4B5563','#FFFFFF'],['Marcos','#D97706','#FFFFFF']];
  const gente=NOMES.map(([n,bg,fg],i)=>el(`<div class="ab" style="left:${XC[i]-50}px;top:318px;width:100px;height:100px;border-radius:50%;background:${bg};border:4px solid #fff;
      box-shadow:0 8px 18px rgba(16,24,40,.12);display:flex;align-items:center;justify-content:center">${ic('user-round',52,fg)}</div>`,g));
  const nomes=NOMES.map(([n],i)=>el(`<div class="ab" style="left:${XC[i]-90}px;top:548px;width:180px;text-align:center"><div class="tag" style="font-size:17px;padding:6px 14px;${TAGC}">${n}</div></div>`,g));
  const cont=el(`<div class="ab" style="left:440px;top:632px;width:400px;height:48px;text-align:center">
      <div class="ab c3" style="left:0;top:0;width:400px"><div class="tag" style="${TAGC}">${ic('users',20)}3 / 3 usuários</div></div>
      <div class="ab c2" style="left:0;top:0;width:400px;opacity:0"><div class="tag a">${ic('users',20)}2 / 3 usuários</div></div></div>`,g);
  const J=janela([1,'Pensa'],[1,'dele'],.6);
  return t=>{
    if(!trecho(g,t,J))return;
    const tCd=W(1,'cadeiras'), tUs=W(1,'usuario'), tOc=W(1,'ocupa'), tDs=W(1,'desativado'), tLi=W(1,'libera'), tDl=W(1,'dele');
    tituloJ(tit,t,J,tCd-.55);
    cadeiras.forEach((e,i)=>vis(e,t,tCd-.1+i*.1,1e9,{dy:14}));
    // cada usuário ativo ocupa uma; o Marcos desativado sai e libera a dele (e volta em seguida)
    const sai=eo(pr(t,tDs,.45))*(1-eo(pr(t,tDl+.05,.45)));
    gente.forEach((e,i)=>{const op=vis(e,t,tUs-.15+i*.15,1e9,{dy:-20,sc:.8});if(i===2){e.style.opacity=(op*(1-sai)).toFixed(4);e.style.transform+=` translateY(${(-46*sai).toFixed(2)}px)`}});
    nomes.forEach((e,i)=>{const op=vis(e,t,tUs+i*.15,1e9,{dy:10});if(i===2)e.style.opacity=(op*(1-.7*sai)).toFixed(4)});
    const livre=eo(pr(t,tLi-.1,.4))*(1-eo(pr(t,tDl+.05,.4)));
    cadeiras[2].querySelector('.enc').setAttribute('fill',mix('#C9D1D9','#A9E9C6',livre)); cadeiras[2].querySelector('.ass').setAttribute('fill',mix('#B9C1C9','#50D088',livre));
    vis(cont,t,tOc,1e9,{dy:10}); const c2=eo(pr(t,tLi,.35))*(1-eo(pr(t,tDl+.15,.35)));
    cont.querySelector('.c3').style.opacity=(1-c2).toFixed(3); cont.querySelector('.c2').style.opacity=c2.toFixed(3);
    vis(extra,t,tDl+.25,1e9,{sc:.85,dy:0});
  };
};

// ------------------------------------------------------------------ CAPS[9] · cap09 · o que some e o que fica sem a permissão de valores
// fala: 1 "Sem essa permissão, esses números aparecem escondidos, com pontinhos no lugar."  2 "Agora imagina uma compra de
// mil quilos de ferro pesado, a noventa e cinco centavos o quilo. Quem compra precisa ver esse preço, senão não fecha o
// pedido."  3 "... O que some é o consolidado: o lucro, os totais do período, o saldo do caixa e o do banco."
CAPS[9]=()=>{
  const g=grupo(), tit=titulo(g,'Valores','Esconder o valor');
  const colS=el(`<div class="ab" style="left:80px;top:234px"><div class="tag a">${ic('eye-off',20)}Some</div></div>`,g);
  const colF=el(`<div class="ab" style="left:700px;top:234px"><div class="tag v">${ic('eye',20)}Fica</div></div>`,g);
  const quadro=(x,y,rot)=>el(`<div class="card" style="left:${x}px;top:${y}px;width:255px;height:130px;padding:20px 22px;border-width:2px">
      <div class="lbl" style="font-size:16px;white-space:nowrap">${rot}</div>
      <div style="position:relative;height:40px;margin-top:14px"><div class="ab bar" style="left:0;top:12px;width:150px;height:16px"></div>
        <div class="ab num pt" style="left:0;top:0;font-size:28px;color:#8A5A00;opacity:0;white-space:nowrap">R$ ••••••</div></div></div>`,g);
  const S=[quadro(80,298,'Lucro'),quadro(355,298,'Totais do período'),quadro(80,448,'Saldo do caixa'),quadro(355,448,'Saldo do banco')];
  const compra=el(`<div class="card" style="left:700px;top:298px;width:500px;height:280px;padding:26px 30px;border-width:2px">
      <div class="row" style="gap:14px"><div class="ico" style="width:50px;height:50px">${ic('arrow-down-to-line',26)}</div>
        <div><div style="font-weight:800;font-size:22px">Compra</div><div class="lbl" style="margin-top:2px">Ferro pesado</div></div></div>
      <div class="hl pc" style="display:inline-block;margin:22px 0 0 -10px;font-weight:700;font-size:24px;color:#374151;white-space:nowrap;opacity:0">1.000 kg × ${brl(.95)}</div>
      <div class="num tt" style="margin-top:10px;font-size:44px;color:#2E7D57;opacity:0">${brl(950)}</div></div>`,g);
  const J=janela([1,'Sem'],[3,'banco'],.6);
  return t=>{
    if(!trecho(g,t,J))return;
    const tSe=W(1,'Sem'), tNu=W(1,'numeros'), tPo=W(1,'pontinhos'), tCo=W(2,'compra'), tCe=W(2,'centavos'), tQu=W(2,'quilo'), tPr=W(2,'preco'),
          tCt=W(3,'continua'), tSo=W(3,'some'), tLu=W(3,'lucro'), tTo=W(3,'totais'), tCx=W(3,'caixa'), tBa=W(3,'banco');
    tituloJ(tit,t,J,tNu-.75);
    // some: o consolidado vira pontinhos
    vis(colS,t,tNu-.3,1e9,{dx:-12,dy:0}); S.forEach((e,i)=>vis(e,t,tNu-.2+i*.1,1e9,{dy:16}));
    S.forEach((e,i)=>{const p=eo(pr(t,tPo-.05+i*.1,.4));e.querySelector('.pt').style.opacity=p.toFixed(3);e.querySelector('.bar').style.opacity=(1-p).toFixed(3)});
    // fica: o preço da compra
    vis(colF,t,tCo-.2,1e9,{dx:-12,dy:0}); vis(compra,t,tCo-.1,1e9,{dx:24,dy:0});
    compra.querySelector('.pc').style.opacity=eo(pr(t,tCe-.1,.45)).toFixed(3); compra.querySelector('.tt').style.opacity=eo(pr(t,tQu+.1,.45)).toFixed(3);
    acende(compra.querySelector('.pc'),t,tPr,'#EAF8F0'); contorno(compra,t,tPr,'#E1E8E4','#A9E9C6'); pulsos(compra,t,[[tCt,.03,.8]]);
    // o que some: lucro, totais do período, saldo do caixa e do banco
    S.forEach((e,i)=>{contorno(e,t,tSo,'#E1E8E4','#F6D58E');pulsos(e,t,[[[tLu,tTo,tCx,tBa][i],.05,.7]])});
  };
};
