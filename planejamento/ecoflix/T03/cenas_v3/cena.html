<script type="module">
import { PI, cl, lerp, pr, eo, eio, eo5, eis, passa, golpe, W, el, ic, vis, foco, pulso, ondaEm, conta, titulo, posTitulo, selo,
  htmlChip, htmlCartao, htmlOp, htmlFluxo, fluxo, CENA, GL, mundo, mancha, piso, anel, destaque, U, camera, lugar, plano, clima, cena,
  estilo, enquadraRet, grupo }
  from '../../../../perfis/ecoflix/cenas_v3/motor.js';
import { ceuClaro, mundoEscuro } from '../../../../perfis/ecoflix/cenas_v3/fundo.js';
import { baia } from '../../../../perfis/ecoflix/cenas_v3/objetos/baia.js';

import { pasta } from '../../../../perfis/ecoflix/cenas_v3/objetos/pasta.js';

// =====================================================================================================================
// comuns
const NUNCA = 1e9, EE = .0112, AMB = '#F2B63D';
const arco = (a, b, p, alt) => [lerp(a[0], b[0], p), lerp(a[1], b[1], p) + alt * 4 * p * (1 - p), lerp(a[2], b[2], p)];
const chipAmbar = () => estilo('t03-am', `.chip.am{background:linear-gradient(150deg,#F7CB68,#E59A22);color:#3A2A06;border-color:rgba(255,255,255,.4);box-shadow:0 12px 22px -8px rgba(229,154,34,.6)}`);
// o lugar do número até a fala dizer o valor (tracejado), como na T08 e na T06
const vaga = (c, w = 236, cor = 'rgba(190,245,218,.34)') => el(`<div class="ab" style="left:22px;bottom:20px;width:${w}px;height:44px;border-radius:12px;border:2px dashed ${cor}"></div>`, c.e);
const chega = (c, v, t, a) => { const k = eo(pr(t, a, .3)); c.e.querySelector('.num').style.opacity = k.toFixed(3); v.style.opacity = (1 - k).toFixed(3); };
const some = (o, k) => { o.visible = k > .002; if (o.visible) o.scale.setScalar(k); };   // objeto 3D que entra crescendo (k passa de 1 e volta)
// degrau: cartão baixo de uma linha (selo + nome + legenda opcional), todos da mesma altura
const degrau = (icone, rot, sub, o = {}) => `<div class="cartao ${o.res ? 'res' : ''}" style="position:relative;width:${o.w ?? 360}px;height:${o.h ?? 84}px;padding:0 20px;display:flex;align-items:center;gap:13px;white-space:nowrap">
  ${selo(icone, o.cls ?? (o.res ? '' : 'n'), 46)}<div><div class="rot">${rot}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div>${o.res ? '<div class="onda"></div>' : ''}</div>`;
// um lugar do mundo escuro: posições em px do desenho (y para baixo), deslocadas de OY (cada cena do capítulo no seu canto)
function escuro(OY = 0) {
  const EIXO = lugar([0, 0, 0]), E = mundoEscuro(EIXO, 0, EE);
  return { EIXO, X: (html, x, y, o = {}) => E(html, x * EE, -(y + OY) * EE, 0, o), ret: (a, b, c, d) => [a * EE, -(d + OY) * EE, c * EE, -(b + OY) * EE],
    fundo: (cx, cy, o) => E.fundo(cx * EE, -(cy + OY) * EE, o) };
}
const seta = (g, d, cor = 'var(--vc)') => { g.insertAdjacentHTML('beforeend', `<path d="${d}" stroke="${cor}" stroke-width="2.8" opacity="0"/>`); return g.lastElementChild; };

// CENA "vinculada" · cap11, linha 3 · clima escuro (a regra que liga duas tabelas)
// 3 "Vinculada quer dizer que ela acompanha a principal sozinha: quando o preço muda lá, como a gente fez com o cobre,
//    muda aqui também."
// A Tabela Depósitos (a vinculada) entra primeiro; a câmera abre para a Principal e o fio de +4% as liga; o preço do
// Cobre mel muda na Principal (R$ 42,00 → R$ 42,50, cap. 6), a luz corre pelo fio e o preço chega na vinculada: R$ 44,20.
function vinculada() {
  const t0 = W(3, 'vinculada'), tac = W(3, 'acompanha'), tpr = W(3, 'principal'), tso = W(3, 'sozinha'), tmu = W(3, 'muda'), tla = W(3, 'la'), tco = W(3, 'cobre'),
    tm2 = W(3, 'muda', 2), taq = W(3, 'aqui'), tfim = W(3, 'tambem', 1, 'e');
  const { EIXO, X, ret, fundo } = escuro(0), CW = 330, DX = 330, XE = DX - CW / 2;   // XE = borda de dentro dos cartões
  const cP = X(htmlCartao('table', 'Principal', 'Cobre mel', reais(42), { w: CW }), -DX, 0), nP = cP.e.querySelector('.num');
  const cD = X(htmlCartao('link', 'Tabela Depósitos', 'Cobre mel', reais(44.2), { w: CW, res: true }), DX, 0), vD = vaga(cD, 200, 'rgba(108,240,168,.5)'), onD = cD.e.querySelector('.onda');

  const chV = X(htmlChip(`${ic('link', 18)}+4%`), 0, -18, { anc: [.5, 1], z: 40 }), chS = X(htmlChip('acompanha sozinha', 'n'), 0, 18, { anc: [.5, 0], z: 40 });

  const cam = [[t0 - 3, S0], [tac - .3, { ...S0, az: -.02, d: S0.d * .985 }, 'lin'], [tac + .9, S1], [tfim + 2.5, { ...S1, az: .03, d: S1.d * .975 }, 'lin']];
  return { cam, r: t => {
    posTitulo(tit, t, t0 - .9, t0 - .45, tfim + 1.6);
    vis(cD.e, t, t0 - .1, NUNCA, { dy: 22 }); chega(cD, vD, t, tm2 + .25);

    vis(chV.e, t, tpr + .45, NUNCA, { dy: 10, sc: .8 }); vis(chS.e, t, tso - .1, NUNCA, { dy: -10, sc: .8 });
    // muda lá: o preço da Principal sobe; muda aqui também: o da vinculada chega
    conta(nP, t, tmu - .05, .55, 42, 42.5, reais); pulso(cP.e, t, tmu + .05, .05, .8); pulso(cP.e, t, tco, .03, .7);
    pulso(chV.e, t, tm2 - .25, .08, .7); pulso(cD.e, t, taq, .045, .8); ondaEm(onD, t, taq);
  } };
}

// 9 "E quando um material tem mais de um preço possível, qual vale? Uma dica: essa é a dúvida clássica, então vale
//    guardar a ordem. Primeiro, o preço personalizado daquele cliente ou fornecedor. Depois, a tabela escolhida no
//    pedido. E por último, o preço do material."
// Um material e três lugares de preço ainda sem nome (a dúvida); a câmera abre para a ordem e cada lugar ganha o nome na
// palavra que o diz, com a luz correndo pelo fio.
function ordemPreco() {
  const t0 = W(9, 'quando'), tmat = W(9, 'material'), tmais = W(9, 'mais'), tqual = W(9, 'qual'), tvale = W(9, 'vale'), tord = W(9, 'ordem'),
    tpri = W(9, 'primeiro'), tper = W(9, 'personalizado'), tdep = W(9, 'depois'), ttab = W(9, 'tabela'), tult = W(9, 'ultimo'), tpm = W(9, 'preco', 3), tfim = W(9, 'material', 2, 'e');
  chipAmbar();
  const { EIXO, X, ret, fundo } = escuro(1500), MW = 236, XM = -372, CW = 372, XC = 151, DY = 122, XL = XM + MW / 2, XR = XC - CW / 2;   // XL = borda direita do material, XR = borda esquerda dos preços

.t03vg i{display:block;width:150px;height:12px;border-radius:6px;background:rgba(255,255,255,.14)}`);
  const cM = X(degrau('package', 'Um material', '', { w: MW }), XM, 0);
  const chQ = X(htmlChip(`${ic('circle-help', 18)}qual vale?`, 'am'), XM, 42 + 16, { anc: [.5, 0], z: 40 });   // z: sempre na frente do cartão de cima (a sombra dele não pode passar por cima do chip quando a câmera respira)
  // os três preços: primeiro só o lugar (contorno liso, com a etiqueta; tracejado cintila com a câmera em deriva e o piscadas.py acusa); o nome entra quando a fala o diz
  const preco = (i, icone, rot, sub, res) => { const p = X(`<div style="position:relative;width:${CW}px;height:84px">${degrau(icone, rot, sub, { w: CW, res })}<div class="t03vg">${selo('tag', 'n', 46)}<i></i></div></div>`, XC, (i - 1) * DY);
    p.c = p.e.firstElementChild; p.v = p.e.lastElementChild; p.od = p.c.querySelector('.onda'); return p; };
  const c = [preco(0, 'user-round', 'Preço personalizado', 'do cliente ou fornecedor', true), preco(1, 'table', 'Tabela escolhida', 'no pedido'), preco(2, 'package', 'Preço do material', '')];
  const nome = (p, t, a) => { const k = eo(pr(t, a, .35)); p.c.style.opacity = k.toFixed(3); p.v.style.opacity = (1 - k).toFixed(3); p.c.style.transform = `translateY(${((1 - eo5(pr(t, a, .6))) * 10).toFixed(2)}px)`; };
  // os fios: do material para cada preço (10 px de respiro nas duas pontas)
  const FW = XR - XL, OY = 170, xv = 104, r = 22, x1 = FW - 10;
  const garfo = s => s ? `M10 ${OY}H${xv - r}Q${xv} ${OY} ${xv} ${OY + s * r}V${OY + s * (DY - r)}Q${xv} ${OY + s * DY} ${xv + r} ${OY + s * DY}H${x1}` : `M10 ${OY}H${x1}`;
  const fios = X(htmlFluxo(FW, 2 * OY, [garfo(-1), garfo(0), garfo(1)]), XL, -OY, { anc: [0, 0], z: -40 }), G = [...fios.e.children];

  const XF = XO + Math.max(...ord.map(o => o.w));
  fundo((XL + XR) / 2, 0, { aneis: false });
  const tit = titulo('Preços', 'A ordem do preço', 'escuro');
  const S1 = enquadraRet(EIXO, ret(XM - MW / 2, -DY - 42, XC + CW / 2, DY + 42), { az: -.03, max: 1.36 / EE }), S2 = enquadraRet(EIXO, ret(XM - MW / 2, -DY - 42, XF, DY + 42), { az: .015, max: 1.36 / EE });
  const cam = [[t0 - 3, S1], [tord - .55, { ...S1, az: -.01, d: S1.d * .985 }, 'lin'], [tord + .55, S2], [tfim + 2.5, { ...S2, az: .035, d: S2.d * .98 }, 'lin']];
  const TF = [tpri - .1, tdep - .1, tult - .1], TN = [tper - .1, ttab - .1, tpm - .1];
  return { cam, r: t => {
    posTitulo(tit, t, t0 - .9, t0 - .45);
    vis(cM.e, t, tmat - .15, NUNCA, { dy: 22 });
    fios.e.style.opacity = eo(pr(t, tmais - .1, .3)).toFixed(3);
    c.forEach((p, i) => { vis(p.e, t, tmais - .05 + i * .14, NUNCA, { dy: 18 }); nome(p, t, TN[i]);
      G[i].style.opacity = eo(pr(t, tmais + i * .14, .3)).toFixed(3); fluxo(fios.e, i, t, TF[i], .7, { luz: [TF[i], .9], fica: .75 }); pS[i].setAttribute('opacity', eo(pr(t, TF[i] + .6, .2)).toFixed(3));
      vis(ord[i].e, t, TF[i], NUNCA, { dx: -10, dy: 0, sc: .8 }); pulso(p.e, t, TN[i] + .1, .04, .8); });
    ondaEm(c[0].od, t, tper + .15);
    vis(chQ.e, t, tqual - .1, NUNCA, { dy: -10, sc: .8 }); pulso(chQ.e, t, tvale, .07, .8); foco(chQ.e, t, -9, tpri - .2, { min: .6 });
  } };
}

function cap11() {
  const a = vinculada(), b = ordemPreco(); camera([...a.cam, ...b.cam]);
  return t => { clima(1); GL.style.visibility = 'hidden'; a.r(t); b.r(t); };

// CENA "ordemTabela" · cap12, linha 5 · clima escuro (a regra de qual tabela o pedido abre)
// 5 "A ordem é esta: se o cliente ou fornecedor tem tabela no cadastro, vale a dele. Senão, a que você fixou. E se não
//    fixou nenhuma, a principal."
// Uma cascata de cima para baixo: cada "senão" desce um degrau.
function ordemTabela() {
  const t0 = W(5, 'a'), tse = W(5, 'se'), tva = W(5, 'vale'), tsn = W(5, 'senao'), tqu = W(5, 'que'), tfx = W(5, 'fixou'), tnn = W(5, 'nao'), tpr = W(5, 'principal'), tfim = W(5, 'principal', 1, 'e');

  const fx = X(htmlFluxoCartoes({ cartoes: [['user-round', 'Tabela do cliente ou fornecedor', 'se tem tabela no cadastro', 'n'], ['pin', 'A tabela que você fixou', 'só pro seu usuário', 'n'], ['building-2', 'Principal da empresa', 'se não fixou nenhuma', 'n']],
    vertical: true, cw: 380, vao: 78 }), 0, 0);
  const C = [0, 1, 2].map(i => parte(fx.e, i)), yc = i => -fx.h / 2 + C[i].offsetTop + C[i].offsetHeight / 2, ym = i => (yc(i) + yc(i + 1)) / 2, XL = -fx.w / 2, XR = fx.w / 2;

  const S = enquadraRet(EIXO, ret(XL - 64, -fx.h / 2, XR + 16 + chV.w, fx.h / 2), { az: -.035, max: 1.4 / EE });
  camera([[t0 - 3, S], [tfim + 2.5, { ...S, az: .04, d: S.d * .97 }, 'lin']]);

    vis(chS.e, t, tsn - .1, NUNCA, { dx: -10, dy: 0, sc: .8 }); pulso(C[1], t, tfx, .035, .8);
    vis(chN.e, t, tnn - .2, NUNCA, { dx: -10, dy: 0, sc: .8 }); pulso(C[2], t, tpr + .1, .035, .8);
  };

// CENA "transferir" · cap13, linha 3 · clima claro (o pátio: as duas baias)
// 3 "Agora, transferir. Na desmontagem dos radiadores saíram oito quilos de ferro, das cintas e dos suportes. Esse peso
//    entrou como radiador, mas é ferro misto."
// A baia do Radiador de cobre; o ferro sobe do monte (8 kg, cintas e suportes); a câmera abre e o ferro vai para a baia
// do Ferro misto.
function transferir() {
  const t0 = W(3, 'transferir'), tdes = W(3, 'desmontagem'), tsai = W(3, 'sairam'), toi = W(3, 'oito'), tci = W(3, 'cintas'), tpe = W(3, 'peso'), ten = W(3, 'entrou'),
    tra = W(3, 'radiador'), tmas = W(3, 'mas'), tfm = W(3, 'ferro', 2), tmi = W(3, 'misto'), tfim = W(3, 'misto', 1, 'e');
  piso({ r: 32, x: 0, z: 0, passo: 1.3 }); U.uNevoa.value.set(.955, .975, .965, .8); ceuClaro({ halo: [.3, 3.8, -15] });
  const XA = -3.6, XB = 5.6, ROT = [-.12, .06, 0];
  const BA = baia(CENA, [XA, 0, 0], { c: 4, l: 3, h: 1.5 }); monte(BA, [0, 0, -.2], { tipo: 'cobre', n: 70, r: 1.4, h: .95, mancha: false });
  const BB = baia(CENA, [XB, 0, 0], { c: 4, l: 3, h: 1.5 }); monte(BB, [0, 0, -.2], { tipo: 'ferro', n: 80, r: 1.4, h: .9, mancha: false });
  // o ferro que saiu na desmontagem: um punhado de peças que sobe do monte e depois vai para a outra baia
  const FL = grupo(CENA, [XA, 0, 0]); pecas(FL, 'ferro', [[-.34, 0, .05], [.3, .05, -.1], [0, .16, .2], [-.12, .3, -.18], [.24, .34, .14], [-.3, .42, .1], [.05, .52, -.04], [.3, .6, .02]], { s: .82 });
  const P0 = [XA, .75, -.1], PH = [XA + .2, 2.8, .35], PB = [XB, 1.0, -.1];
  const CH = (html, pos, o = {}) => plano(html, { pos, rot: ROT, esc: .0125, anc: [.5, 1], ...o });
  const chA = CH(htmlChip(`${ic('package', 18)}Radiador de cobre`, 'n'), [XA, 2.0, -1.62]), chB = CH(htmlChip(`${ic('package', 18)}Ferro misto`, 'n'), [XB, 2.0, -1.62]);
  const ch8 = CH(htmlChip(`${ic('arrow-right-left', 18)}8 kg de ferro`), [XA, 4.25, .35]), chC = CH(htmlChip(`${ic('wrench', 18)}cintas e suportes`, 'n'), [XA + 1.25, 3.1, .35], { anc: [0, .5] });
  const an = anel(2.3, [XB, 0, .2]);
  const tit = titulo('Estoque', 'Transferir entre materiais');
  const P1 = { x: XA - .1, y: 2.3, z: 0, d: 15, az: .1, el: .13 }, P2 = { x: 1.0, y: 2.05, z: 0, d: 18.8, az: .04, el: .13 };
  camera([[t0 - 3, P1], [tmas - .9, { ...P1, d: 14.7, az: .08 }, 'lin'], [tmas + .45, P2], [tfim + 2.5, { ...P2, d: 18.5, az: .02 }, 'lin']]);
