<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- Cenas de conceito da T19 · Funcionários e ponto eletrônico (EcoFlix). Cópia do kit perfis/ecoflix/cenas/cenas_ecoflix.html
     (mesmo estilo e utilidades; os dois exemplos saíram) com as cenas [ILUSTRAÇÃO] do roteiro, um CAPS[n] por capítulo.
     Cada cena vale na janela do ilustracoes.json desta pasta (abre 0,3 s antes do início da palavra "de" e fecha "cauda" s
     depois do fim da palavra "ate"); o título já está inteiro no 1º quadro da janela. Tempos: tempos/capNN.json (estimados;
     com a voz, o capNN.json do proc.py, e as cenas se ajustam às palavras). Pessoas = bonequinhos sem rosto, nunca foto.
     Conferir: node render_cenas.cjs <n> tempos/capNN.json <pasta> --html cenas.html --stills t1,t2,...
     Renderizar uma cena: node render_cenas.cjs <n> capNN.json <saida.mp4> --html cenas.html --de <início> --ate <fim>. -->
<style>
@font-face{font-family:M;font-weight:500;src:url(../../../web/fonts/montserrat-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:600;src:url(../../../web/fonts/montserrat-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:700;src:url(../../../web/fonts/montserrat-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:800;src:url(../../../web/fonts/montserrat-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:500;src:url(../../../web/fonts/montserrat-latin-ext-500-normal.woff2) format('woff2');unicode-range:U+0100-024F}
@font-face{font-family:M;font-weight:700;src:url(../../../web/fonts/montserrat-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-024F}
/* ---------------------------------------------------------------- paleta EcoFlix (marca: acento #50D088, escuro #121212)
   --v  acento: preenchimentos, barras, contornos de destaque (nunca texto sobre branco: contraste baixo)
   --ve verde escuro: texto e ícone verde sobre branco (contraste 5,0)   --vc verde claro: fundo de ícone/resultado
   --a  âmbar: o SEGUNDO conceito da cena (ex.: competência x caixa)     --ae texto âmbar (5,9)   --ac âmbar claro
   --t  texto (o escuro da marca)   --c texto secundário (4,8)   --l linhas   --e painel escuro (mostrador) */
:root{--v:#50D088;--ve:#2E7D57;--vc:#EAF8F0;--vm:#A9E9C6;--a:#F2B63D;--ae:#8A5A00;--ac:#FFF5DF;
  --t:#121212;--c:#6B7280;--l:#E6E9EE;--e:#121212}
*{box-sizing:border-box;margin:0;padding:0;transition:none!important;animation:none!important}
html,body{width:1280px;height:800px;overflow:hidden;background:#fff}
body{font-family:M,sans-serif;color:var(--t);-webkit-font-smoothing:antialiased}
#st{position:absolute;inset:0;overflow:hidden;background:
  radial-gradient(1100px 650px at 92% -12%,rgba(80,208,136,.09),transparent 62%),
  radial-gradient(900px 600px at -12% 112%,rgba(80,208,136,.06),transparent 60%),#fff}
.g{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:640px 400px}
.ab{position:absolute}
.row{display:flex;align-items:center}
/* título da cena: área (kicker) + conceito; sozinho fica grande no centro e sobe quando o desenho entra */
.kick{font-weight:700;font-size:15px;letter-spacing:.3em;color:var(--ve);text-transform:uppercase}
.h{font-weight:800;font-size:46px;letter-spacing:-.01em;line-height:1.1}
/* cartão, chip, etiqueta, ícone */
.card{position:absolute;background:#fff;border:1px solid #E1E8E4;border-radius:18px;
  box-shadow:0 18px 40px rgba(16,24,40,.10),0 3px 8px rgba(16,24,40,.06)}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:100%;height:100%}
.ico{display:flex;align-items:center;justify-content:center;flex:none;border-radius:14px;background:var(--vc);color:var(--ve)}
.ico.a{background:var(--ac);color:var(--ae)}
.tag{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;font-weight:800;font-size:20px;white-space:nowrap}
.tag.v{background:var(--vc);color:var(--ve)} .tag.a{background:var(--ac);color:var(--ae)}
.lbl{font-weight:700;font-size:17px;color:var(--c)}
.num{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.op{position:absolute;width:60px;height:60px;border-radius:50%;background:#F2F4F7;color:var(--t);display:flex;
  align-items:center;justify-content:center;font-weight:800;font-size:34px;line-height:1}
/* mostrador da balança (painel escuro, número no acento) */
.most{background:var(--e);border-radius:16px;padding:16px 22px 18px;box-shadow:0 16px 34px rgba(16,24,40,.22)}
.most .ml{position:relative;height:20px;font-weight:700;font-size:15px;letter-spacing:.22em;color:#A9E9C6;text-transform:uppercase}
.most .ml span{position:absolute;left:0;top:0;white-space:nowrap}
.most .mn{margin-top:6px;font-weight:800;font-size:44px;color:var(--v);font-variant-numeric:tabular-nums;white-space:nowrap}
.rip{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:3px solid var(--v);opacity:0}
/* ---------------------------------------------------------------- T19: objetos genéricos e textos desta aula */
.nota{font-weight:600;font-style:italic;font-size:32px;color:#34466B;white-space:nowrap;letter-spacing:.01em}
.cel{position:relative;background:#262B33;border-radius:32px;padding:11px;box-shadow:0 18px 40px rgba(16,24,40,.14)}
.cel>.tl{position:relative;width:100%;height:100%;background:#fff;border-radius:22px;overflow:hidden}
.cel>.tl:before{content:'';position:absolute;left:50%;top:10px;width:46px;height:6px;margin-left:-23px;border-radius:3px;background:#DDE2E7}
.cel.tab{border-radius:26px;padding:15px}.cel.tab>.tl{border-radius:12px}.cel.tab>.tl:before{display:none}
.lf{display:flex;align-items:center;justify-content:space-between;height:50px;border-bottom:1px dashed #DCE1E7;font-weight:700;font-size:23px;white-space:nowrap}
.nm{font-weight:800;font-size:22px;white-space:nowrap}
.tag.c{background:#4B5563;color:#fff}
.cx{display:flex;align-items:center;justify-content:center;flex:none;border-radius:50%}
</style><style id="saturado">/* estilo saturado (Kaik, 11/11): selo, chip, etiqueta, quadrado de ícone e círculo de etapa
   com fundo cheio e ícone/texto branco; nunca fundo claro com conteúdo colorido, nunca ícone escuro sobre o verde */
:root{--vs:#50D088;--as:#F2B63D;--rs:#EF4444}
.ico{background:var(--vs);color:#fff}.ico.a{background:var(--as);color:#fff}
.tag.v{background:var(--vs);color:#fff}.tag.a{background:var(--as);color:#fff}
</style></head>
<body><div id="st"></div>
<script>
// ------------------------------------------------------------------ utilidades (as do cenas_modelo.html + as da EcoFlix)
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const pr=(t,a,d=.45)=>cl((t-a)/d);
const lerp=(a,b,p)=>a+(b-a)*p;
const $=s=>document.querySelector(s);
const ST=document.getElementById('st');
function el(html,parent=ST){const d=document.createElement('div');d.innerHTML=html.trim();let f=null;for(const n of [...d.childNodes]){parent.appendChild(n);if(!f&&n.nodeType===1)f=n}return f}
function grupo(){return el('<div class="g"></div>')}
function ic(n,px,cor){const s=(window.ICONS||{})[n]||'';return `<span class="ic" style="width:${px}px;height:${px}px;${cor?'color:'+cor:''}">${s}</span>`}
function hex(c){c=c.replace('#','');return[0,2,4].map(i=>parseInt(c.substr(i,2),16))}
function mix(a,b,p){const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*cl(p))).join(',')})`}
// aparece em a, some em b (opacidade + leve subida + escala): a entrada e a saída suaves de tudo
function vis(e,t,a,b=1e9,o={}){
  const din=o.din??.5,dout=o.dout??.4,dy=o.dy??16,dx=o.dx??0,sc=o.sc??.985;
  const p=eo(pr(t,a,din)),q=1-eo(pr(t,b,dout)),op=Math.min(p,q);
  e.style.opacity=op.toFixed(4);e.style.visibility=op<=.001?'hidden':'visible';
  const s=sc+(1-sc)*p - (1-q)*(1-sc);
  e.style.transform=`translate(${((1-p)*dx).toFixed(2)}px,${((1-p)*dy-(1-q)*dy*.5).toFixed(2)}px) scale(${s.toFixed(4)})`;
  return op;
}
function ripple(r,t,a){const p=pr(t,a,.7);r.style.opacity=(p>0&&p<1)?(.6*(1-p)).toFixed(3):0;r.style.transform=`scale(${(.4+2.0*eo(p)).toFixed(3)})`}
function pulse(e,t,a,amp=.045,dur=.9){const p=pr(t,a,dur);e.style.scale=(p>0&&p<1)?(1+amp*Math.sin(Math.PI*p)).toFixed(4):''}
function digita(e,txt,t,a,b){const p=cl((t-a)/Math.max(.05,b-a));const n=Math.round(p*txt.length);
  const car=(p>0&&p<1)||(Math.floor(t*2.2)%2===0&&p<1.2&&t>=a)?'<span style="color:var(--v);font-weight:500">|</span>':'';
  e.innerHTML=(txt.slice(0,n)||'')+(t>=a&&t<b+.8?car:'');}
// EcoFlix: números e dinheiro no jeito brasileiro; contagem suave de um número; traço que se desenha; arco; contorno
const NF=new Intl.NumberFormat('pt-BR');
const kg=v=>NF.format(Math.round(v))+' kg';
const brl=v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function conta(e,t,a,d,v0,v1,fmt=kg){const p=eo(pr(t,a,d));const s=fmt(lerp(v0,v1,p));if(e.textContent!==s)e.textContent=s;return p}
function traco(p,t,a,d=.8){if(!p._L){p._L=p.getTotalLength();p.style.strokeDasharray=p._L}const q=eio(pr(t,a,d));p.style.strokeDashoffset=(p._L*(1-q)).toFixed(2);p.style.opacity=q>0?1:0;return q}
function arco(e,t,a,d,x0,y0,x1,y1,h=-80,rot=0){const p=eio(pr(t,a,d));const x=lerp(x0,x1,p),y=lerp(y0,y1,p)+h*4*p*(1-p);
  e.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${(rot*p).toFixed(2)}deg)`;return p}
function contorno(e,t,a,de,para,d=.45){e.style.borderColor=mix(de,para,eo(pr(t,a,d)))}
// título padrão da cena: grande no centro enquanto está sozinho, sobe para o alto quando o desenho entra (em "sobe")
function titulo(g,kick,txt){return el(`<div class="ab" style="left:0;top:0;width:1280px;text-align:center">
  <div class="kick">${kick}</div><div class="h" style="margin-top:12px">${txt}</div></div>`,g)}
function posTitulo(e,t,a,sobe,sai=1e9){vis(e,t,a,sai,{dy:14});const p=eio(pr(t,sobe,.7));
  e.style.top=lerp(318,46,p).toFixed(2)+'px';e.style.scale=lerp(1.12,1,p).toFixed(4)}

// ------------------------------------------------------------------ tempos da fala (capNN.json do proc.py ou estimado)
let D=null;
const norm=w=>w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9%./-]+/g,'');
function W(linha,palavra,n=1,campo='s'){
  const alvo=norm(palavra);let k=0;
  for(const w of D.words){if(w.linha===linha&&norm(w.w).replace(/[.,]$/,'')===alvo){k++;if(k===n)return w[campo]}}
  for(const w of D.words){if(w.linha===linha&&norm(w.w).startsWith(alvo)){k++;if(k>=n)return w[campo]}}
  console.warn('palavra não achada',linha,palavra);return L(linha);
}
const L=i=>(D.linhas[i]||{s:0}).s, LE=i=>(D.linhas[i]||{e:D.dur}).e;

// ------------------------------------------------------------------ desenhos genéricos (sem marca)
// caminhão de lado (frente para a direita), com a carga de sucata em pedaços (.pd) que podem ser descarregados
function caminhao(){
  const pd=[ // [forma, cor, centro da peça, destino no monte atrás do caminhão (deslocamento do centro e giro)]
    ['<polygon points="28,90 44,52 88,42 100,90"/>','#8C5A3C',[64,66],[-224,148,6]],
    ['<polygon points="82,90 102,36 146,48 154,90"/>','#6F7983',[118,63],[-318,122,12]],
    ['<rect x="118" y="44" width="112" height="16" rx="8" transform="rotate(-8 174 52)"/>','#9AA3AD',[174,52],[-334,98,-18]],
    ['<polygon points="148,90 170,54 212,44 232,90"/>','#A0694A',[190,67],[-425,148,-8]],
    ['<polygon points="210,90 232,40 276,54 286,90"/>','#4F5861',[248,65],[-373,120,-10]],
    ['<polygon points="258,90 282,60 308,66 312,90"/>','#8A949E',[285,75],[-375,148,4]],
    ['<g><circle cx="192" cy="64" r="19"/><circle cx="192" cy="64" r="7" fill="#8A949E"/></g>','#5E6670',[192,64],[-242,155,200]],
    ['<polygon points="40,70 60,50 84,64 64,86"/>','#B07A55',[62,68],[-307,100,30]]];
  const pecas=pd.map(([f,c,[cx,cy],[dx,dy,r]])=>`<g class="pd" data-cx="${cx}" data-cy="${cy}" data-dx="${dx}" data-dy="${dy}" data-r="${r}" fill="${c}">${f}</g>`).join('');
  const roda=x=>`<g class="roda" data-x="${x}" transform="translate(${x},196)"><circle r="26" fill="#1B1F24"/><circle r="12" fill="#9AA3AD"/>
    <rect x="-2.5" y="-23" width="5" height="10" rx="2" fill="#5B636C"/><rect x="-2.5" y="13" width="5" height="10" rx="2" fill="#5B636C"/></g>`;
  return `<svg viewBox="0 0 500 230" width="500" height="230" style="overflow:visible">
    <g class="carga">${pecas}</g>
    <rect x="18" y="86" width="304" height="88" rx="6" fill="#7E8994"/>
    <rect x="16" y="82" width="308" height="11" rx="4" fill="#68727D"/>
    <g stroke="#707A85" stroke-width="3">${[78,138,198,258].map(x=>`<line x1="${x}" y1="98" x2="${x}" y2="168"/>`).join('')}</g>
    <path d="M334,176 L334,76 Q334,64 346,64 L412,64 L462,116 L472,121 Q480,124 480,134 L480,176 Z" fill="#2F3640"/>
    <path d="M348,78 L406,78 L444,116 L348,116 Z" fill="#D7E5ED"/>
    <rect x="470" y="142" width="10" height="11" rx="2" fill="#F2B63D"/>
    <rect x="12" y="170" width="472" height="15" rx="4" fill="#23282E"/>
    ${roda(92)}${roda(158)}${roda(416)}
  </svg>`;
}

// ------------------------------------------------------------------ utilidades desta aula (faltavam no kit)
// janela da cena = a do ilustracoes.json: abre 0,3 s antes do início da palavra "de" e fecha "cauda" s depois do fim da "ate"
const janela=(de,ate,cauda)=>({a:W(de[0],de[1],de[2]||1)-.3,b:W(ate[0],ate[1],ate[2]||1,'e')+cauda});
// a cena só existe perto da sua janela (várias cenas no mesmo CAPS[n] não se misturam)
function naJanela(g,t,J){const on=t>=J.a-.8&&t<=J.b+.05;g.style.opacity=on?1:0;return on}
// texto escrito à mão: a caneta revela da esquerda para a direita (sem cursor piscando)
function escreve(e,t,a,d=.8){const p=eio(pr(t,a,d));e.style.clipPath=`inset(-14px ${(100-100*p).toFixed(2)}% -14px -14px)`;
  e.style.visibility=p>0?'visible':'hidden';return p}
// pessoa = bonequinho simples (cabeça e ombros, sem rosto); nunca foto nem rosto de pessoa real
const boneco=(px,cor='#8A949E')=>`<svg viewBox="0 0 48 48" width="${px}" height="${px}" style="display:block"><circle cx="24" cy="16.5" r="9.5" fill="${cor}"/>
  <path d="M7 48 C7 34 14.5 28.5 24 28.5 C33.5 28.5 41 34 41 48 Z" fill="${cor}"/></svg>`;
const avatar=(px,cor='#8A949E',fundo='#EEF1F4')=>`<div class="cx av" style="width:${px}px;height:${px}px;background:${fundo};overflow:hidden;align-items:flex-end">${boneco(Math.round(px*.84),cor)}</div>`;
// relógio de ponteiros sem números; ponteiros(svg, 8.5) = 8h30
function relogio(px,cor='#2F3640'){
  let m='';for(let i=0;i<12;i++){const a=i*Math.PI/6,r0=i%3?35:31;
    m+=`<line x1="${(Math.sin(a)*r0).toFixed(1)}" y1="${(-Math.cos(a)*r0).toFixed(1)}" x2="${(Math.sin(a)*40).toFixed(1)}" y2="${(-Math.cos(a)*40).toFixed(1)}" stroke="#9AA3AD" stroke-width="${i%3?2.2:3.4}" stroke-linecap="round"/>`}
  return `<svg class="rel" viewBox="-50 -50 100 100" width="${px}" height="${px}" style="display:block;overflow:visible">
    <circle r="46" fill="#fff" stroke="${cor}" stroke-width="5"/>${m}
    <line class="hh" x1="0" y1="4" x2="0" y2="-21" stroke="${cor}" stroke-width="6" stroke-linecap="round"/>
    <line class="mh" x1="0" y1="5" x2="0" y2="-32" stroke="${cor}" stroke-width="3.8" stroke-linecap="round"/>
    <circle r="4.6" fill="${cor}"/></svg>`;
}
function ponteiros(sv,h){sv.querySelector('.hh').setAttribute('transform',`rotate(${(h*30).toFixed(2)})`);
  sv.querySelector('.mh').setAttribute('transform',`rotate(${((h%1)*360).toFixed(2)})`)}
// celular, tablet e monitor genéricos (sem marca nem aplicativo)
const celular=(w,h,dentro='')=>`<div class="cel" style="width:${w}px;height:${h}px"><div class="tl">${dentro}</div></div>`;
const tablet=(w,h,dentro='')=>`<div class="cel tab" style="width:${w}px;height:${h}px"><div class="tl">${dentro}</div></div>`;
const monitor=(w,h,dentro='')=>`<div style="position:relative;width:${w}px;height:${h+52}px">
  <div style="position:absolute;left:${w/2-24}px;top:${h-4}px;width:48px;height:40px;background:#AEB6BF"></div>
  <div style="position:absolute;left:${w/2-90}px;top:${h+34}px;width:180px;height:16px;border-radius:8px;background:#8A949E"></div>
  <div style="position:absolute;left:0;top:0;width:${w}px;height:${h}px;background:#262B33;border-radius:16px;padding:11px;box-shadow:0 18px 40px rgba(16,24,40,.14)">
    <div style="position:relative;width:100%;height:100%;background:#fff;border-radius:8px;overflow:hidden">${dentro}</div></div></div>`;
// caderno de espiral com pauta (o caderninho do pátio)
function caderno(w,h){
  let p='';for(let y=78;y<h-14;y+=44)p+=`<line x1="14" y1="${y}" x2="${w-14}" y2="${y}" stroke="#D3E2EF" stroke-width="2"/>`;
  let a='';for(let x=34;x<w-20;x+=40)a+=`<rect x="${x}" y="-16" width="11" height="36" rx="5.5" fill="#8A949E"/>`;
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="position:absolute;left:0;top:0;overflow:visible">
    <rect x="7" y="9" width="${w}" height="${h}" rx="12" fill="#ECE4CF"/>
    <rect x="0" y="0" width="${w}" height="${h}" rx="12" fill="#FFFDF5" stroke="#E2D9C2" stroke-width="2"/>
    ${p}<line x1="70" y1="0" x2="70" y2="${h}" stroke="#F1B4AA" stroke-width="2.5"/>${a}</svg>`;
}
// relógio de cartão de ponto (o do pátio, antes do sistema)
const relPonto=()=>`<div class="ab" style="left:0;top:0;width:220px;height:356px;border-radius:24px;background:#EEF1F4;border:2px solid #D3DAE1"></div>
  <div class="ab" style="left:30px;top:24px">${relogio(160)}</div>
  <div class="ab" style="left:60px;top:204px;width:100px;height:96px;border-radius:6px;background:#fff;border:2px solid #C9D2DB">
    <div style="margin:14px 14px 0;height:5px;border-radius:3px;background:#DCE1E7"></div>
    <div style="margin:9px 14px 0;height:5px;border-radius:3px;background:#DCE1E7"></div>
    <div style="margin:9px 34px 0 14px;height:5px;border-radius:3px;background:#DCE1E7"></div></div>
  <div class="ab" style="left:22px;top:258px;width:176px;height:76px;border-radius:14px;background:#D9DFE5"></div>
  <div class="ab" style="left:38px;top:252px;width:144px;height:12px;border-radius:6px;background:#5E6670"></div>`;
// caixa registradora: o caixa da empresa (Kaik, 11/11: no lugar da gaveta vista de cima). Visor escuro com o valor no verde,
// como o .most (sem o "R$", que o desenho põe), teclado, rolinho de papel e a gaveta: fechada ou aberta, com notas e moedas
// (vazia com cheia:false). Altura w*232/300 fechada, w*296/300 aberta; para abrir no meio da cena, desenhe aberta e chame
// abreGaveta(e,p) a cada quadro (p 0 fechada, 1 aberta). O número fica em .rv: para contar com conta(), desenhe com o valor
// final (ele dá o tamanho da letra). Fundo escuro: tema:'escuro'; cores:{...} troca qualquer cor do tema.
const CORES_REG={
  claro:{vis:'#121212',visL:'none',dig:'#50D088',rs:'#A9E9C6',pap:'#FFFFFF',papL:'#AEB8C2',pes:'#3F4750',fen:'#1F252C',
    cor:'#5E6670',lab:'#4F5861',lin:'none',tec:'#E3E8EC',tot:'#50D088',gav:'#7E8994',pux:'#4F5861',base:'#2F3640',
    ban:'#DDE3E8',com:'#F4F6F8',div:'#AEB8C2',notas:['#9ED9B5','#7CC69B','#B7E4C7','#8FCFA8'],notaL:'#2E7D57',
    moedas:[['#C9A44C','#A8862F'],['#AEB8C2','#8A949E']]},
  escuro:{vis:'#0A0A0C',visL:'#4A4A55',dig:'#50D088',rs:'#A9E9C6',pap:'#EFEFEF',papL:'#8B8B96',pes:'#1A1A1F',fen:'#0A0A0C',
    cor:'#2E2E36',lab:'#24242B',lin:'#4A4A55',tec:'#5A5A65',tot:'#50D088',gav:'#3A3A43',pux:'#16161A',base:'#0A0A0C',
    ban:'#24242B',com:'#33333B',div:'#4A4A55',notas:['#7CC69B','#50D088','#9ED9B5','#6FBF8F'],notaL:'#A9E9C6',
    moedas:[['#D4AF37','#9C7C1E'],['#A1A1AA','#71717A']]}};
function registradora({aberta=false,cheia=true,visor='0,00',w=300,tema='claro',cores={}}={}){
  const c={...CORES_REG[tema],...cores}, H=aberta?296:232, D=64, q=aberta?1:0;
  const L=c.lin==='none'?'':` stroke="${c.lin}" stroke-width="2.5"`;          // contorno só no fundo escuro
  // o valor cabe no visor (largura estimada por caractere, Montserrat 800 com algarismos tabulares)
  const v=String(visor).replace(/^R\$\s*/,''), em=[...v].reduce((s,ch)=>s+(/\d/.test(ch)?.66:/[.,: ]/.test(ch)?.3:.72),0)+1.0, fs=Math.min(30,142/em);
  const tec=[0,1,2].map(r=>[0,1,2,3,4].map(i=>`<rect x="${44-r*4+i*(31+r)}" y="${92+r*21}" width="${24+r}" height="14" rx="3.5"/>`).join('')).join('');
  const notas=[0,1,2,3].map(i=>`<rect x="${20+i*66}" y="5" width="62" height="26" rx="4" fill="${c.com}"/>`+(cheia?
    `<rect x="${24+i*66}" y="8" width="54" height="20" rx="3" fill="${c.notas[i]}" stroke="${c.notaL}" stroke-opacity=".4" stroke-width="1.5"/>
     <ellipse cx="${51+i*66}" cy="18" rx="7" ry="5.5" fill="#fff" opacity=".5"/>`:'')).join('');
  const moedas=[0,1,2,3,4].map(i=>{const x=36+i*57,[m,mE]=c.moedas[i%2];
    return `<ellipse cx="${x}" cy="47" rx="23" ry="10" fill="${c.com}" stroke="${c.div}" stroke-width="1.5"/>`+(cheia?
      `<ellipse cx="${x}" cy="50" rx="14" ry="6" fill="${mE}"/><ellipse cx="${x}" cy="46.5" rx="14" ry="6" fill="${m}"/>
       <ellipse cx="${x-3}" cy="45" rx="6" ry="2.4" fill="#fff" opacity=".4"/>`:'')}).join('');
  const zz=[...Array(11)].map((_,i)=>`${222+i*4},${i%2?15:20}`).join(' ');
  return `<svg class="rg" viewBox="0 0 300 ${H}" width="${w}" height="${(w*H/300).toFixed(1)}" style="display:block;margin:0 auto;overflow:visible">
    <g transform="rotate(4 242 76)"><polygon points="222,76 ${zz} 262,76" fill="${c.pap}" stroke="${c.papL}" stroke-width="1.5" stroke-linejoin="round"/>
      <g fill="${c.papL}">${[[27,28],[35,22],[43,28],[51,16]].map(([y,l])=>`<rect x="228" y="${y}" width="${l}" height="3" rx="1.5"/>`).join('')}
      <rect x="228" y="60" width="28" height="4.5" rx="2"/></g></g>
    <rect x="206" y="68" width="72" height="16" rx="6" fill="${c.pes}"${L}/><rect x="216" y="72" width="52" height="4" rx="2" fill="${c.fen}"/>
    <rect x="100" y="58" width="32" height="26" fill="${c.pes}"${L}/>
    <rect x="30" y="4" width="172" height="60" rx="11" fill="${c.vis}"${c.visL==='none'?'':` stroke="${c.visL}" stroke-width="2.5"`}/>
    <text x="190" y="${(34+fs*.36).toFixed(1)}" text-anchor="end" font-size="${fs.toFixed(1)}" fill="${c.dig}"
      style="font-family:M,sans-serif;font-weight:800;font-variant-numeric:tabular-nums"><tspan font-size="${(fs*.55).toFixed(1)}"
      fill="${c.rs}">R$ </tspan><tspan class="rv">${v}</tspan></text>
    <path d="M34 88 Q34 80 42 80 L258 80 Q266 80 267 88 L284 160 L16 160 Z" fill="${c.cor}"${L}/>
    <g fill="${c.tec}">${tec}<rect x="212" y="92" width="40" height="14" rx="3.5"/></g>
    <rect x="214" y="113" width="42" height="35" rx="5" fill="${c.tot}"/>
    <rect x="14" y="154" width="272" height="26" rx="6" fill="${c.lab}"${L}/>
    <svg x="0" y="180" width="300" height="62" overflow="hidden" style="overflow:hidden"><g class="rg-ba" transform="translate(0 ${D*(q-1)})">
      <path d="M12 0 L288 0 L294 62 L6 62 Z" fill="${c.ban}"/><rect x="12" y="0" width="276" height="5" fill="${c.div}" opacity=".5"/>
      ${notas}${moedas}</g></svg>
    <g class="rg-fr" transform="translate(0 ${D*q})"><rect x="12" y="219" width="276" height="9" rx="4.5" fill="${c.base}"/>
      <rect x="6" y="178" width="288" height="44" rx="8" fill="${c.gav}"${L}/>
      <rect x="118" y="194" width="64" height="10" rx="5" fill="${c.pux}"/><circle cx="264" cy="199" r="5" fill="${c.pux}"/></g>
  </svg>`;
}
// a gaveta da registradora (desenhada com aberta:true) de fechada (p=0) a aberta (p=1): a frente desce e a bandeja aparece

// ponto p (0 a 1) ao longo de um <path> (em coordenadas do quadro, se o svg cobre o quadro)
function noCaminho(path,p){if(!path._L)path._L=path.getTotalLength();return path.getPointAtLength(path._L*cl(p))}

const CAPS={};

// ------------------------------------------------------------------ CAPS[0] · O caderninho do pátio (linha 1)
// "Num ferro-velho, vale sai do caixa quase toda semana. Se fica só no caderno, no dia do pagamento alguém precisa lembrar
// de tudo. Aqui, cada coisa fica no lugar dela."  O caderno com as anotações e o relógio de cartão de ponto; em "lembrar" as
// anotações se embaralham; em "Aqui" o caderno vai para a esquerda e entram os cartões Saldo, Extrato e Ponto.
CAPS[0]=()=>{
  const g=grupo();
  const tit=titulo(g,'Funcionários','O caderninho do pátio');
  const antes=el('<div class="ab" style="left:0;top:0;width:1280px;height:800px;transform-origin:642px 440px"></div>',g);
  const cad=el(`<div class="ab" style="left:228px;top:246px;width:540px;height:392px">${caderno(540,392)}</div>`,antes);
  const notas=[['Vale Diego 200',122,-2],['Falta sexta',210,1.5],['Bônus Cláudio',298,-1.2]].map(([s,y,r])=>{
    const w=el(`<div class="ab" data-sobre="1" style="left:94px;top:${y-42}px;transform-origin:0 80%;transform:rotate(${r}deg)"></div>`,cad);
    return {w,n:el(`<div class="nota">${s}</div>`,w),r}});
  const rel=el(`<div class="ab" style="left:836px;top:264px;width:220px;height:356px">${relPonto()}</div>`,antes);
  ponteiros(rel.querySelector('.rel'),7);
  const seta=el(`<svg class="ab" style="left:596px;top:410px;overflow:visible" width="110" height="60"><path d="M8 30 L92 30 M76 15 L94 30 L76 45"
    fill="none" stroke="#50D088" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,g).querySelector('path');
  const carts=[['wallet','Saldo'],['receipt-text','Extrato'],['clock','Ponto']].map(([i,s],k)=>el(`<div class="card row" style="left:732px;top:${250+k*140}px;width:428px;height:112px;padding:0 26px;gap:20px">
      <div class="ico" style="width:64px;height:64px">${ic(i,34)}</div><div style="font-weight:800;font-size:30px">${s}</div>
      <div class="cx ok" style="position:absolute;right:26px;top:30px;width:52px;height:52px;background:var(--vs);color:#fff">${ic('check',30)}</div></div>`,g));
  return t=>{
    const J=janela([1,'num'],[1,'dela'],.6); if(!naJanela(g,t,J))return;
    const tv=W(1,'vale'),ts=W(1,'semana'),tc=W(1,'caderno'),tl=W(1,'lembrar'),ta=W(1,'aqui'),tca=W(1,'cada'),tco=W(1,'coisa'),
          tfi=W(1,'fica',2),tlu=W(1,'lugar');
    posTitulo(tit,t,J.a-.6,tv-.45);
    vis(cad,t,tv-.1,1e9,{dy:22}); vis(rel,t,tv+.15,1e9,{dy:22});
    escreve(notas[0].n,t,tv+.3,.9); escreve(notas[1].n,t,ts-.25,.7); escreve(notas[2].n,t,ts+.5,.8);
    pulse(cad,t,tc-.05,.03,.8);
    const pb=eio(pr(t,tl-.05,1.0));            // "lembrar": as anotações saem da pauta e se embaralham, devagar
    [[118,118,15],[150,-60,-17],[22,-150,12]].forEach(([dx,dy,dr],k)=>{const {w,r}=notas[k];
      w.style.transform=`translate(${(dx*pb).toFixed(2)}px,${(dy*pb).toFixed(2)}px) rotate(${(r+dr*pb).toFixed(2)}deg)`});
    const pa=eio(pr(t,ta-.1,.8));              // "Aqui": o caderno vai para a esquerda e entram os três cartões limpos
    antes.style.transform=`translate(${(-320*pa).toFixed(2)}px,0) scale(${lerp(1,.6,pa).toFixed(4)})`;
    antes.style.opacity=lerp(1,.78,pa).toFixed(3);
    traco(seta,t,ta+.25,.55);
    vis(carts[0],t,tca-.15,1e9,{dx:28,dy:0}); vis(carts[1],t,tco-.15,1e9,{dx:28,dy:0}); vis(carts[2],t,tfi-.15,1e9,{dx:28,dy:0});
    carts.forEach((c,k)=>vis(c.querySelector('.ok'),t,tlu-.1+k*.14,1e9,{sc:.6,dy:0}));
  };
};

    ls.forEach(s=>chips.push(el(`<div class="tag v" style="font-size:21px;padding:8px 16px">${s}</div>`,r)))});

// ------------------------------------------------------------------ CAPS[5] · A conta do saldo (linha 6)
// "Uma dica: o saldo é sempre o salário, mais os bônus, menos as faltas e os vales, contando só o que aconteceu depois do
// último pagamento. Pagou, ele recomeça do salário."  A fita da máquina de somar do Diego (números da linha 5); em "Pagou",

CAPS[5]=()=>{
  const g=grupo();
  const tit=titulo(g,'Movimentações','A conta do saldo');
  const zig=w=>{let p='0,0 ';for(let x=0;x<w;x+=20)p+=`${x+10},14 ${x+20},0 `;return p};
  const fita=(x,linhas,total)=>{
    const w=el(`<div class="ab" style="left:${x}px;top:158px;width:480px;height:500px"></div>`,g);
    const f=el('<div class="ab" style="left:0;top:0;width:480px;height:500px"></div>',w);

    el(`<div class="ab row" style="left:30px;top:24px;gap:12px">${avatar(52)}<div class="nm" style="font-size:25px">Diego</div></div>`,f);

    let tot=null,car=null;
    if(total){
      tot=el(`<div class="ab" style="left:30px;top:362px;width:420px">
          <div style="height:2px;background:#121212"></div><div style="height:2px;background:#121212;margin-top:4px"></div>
          <div class="lf" style="height:68px;border:0;color:var(--ve);font-size:28px"><span>= Saldo</span><span class="num">${total}</span></div></div>`,f);
      car=el(`<div class="ab" data-sobre="1" style="left:76px;top:196px;width:328px;height:132px"><div style="width:100%;height:100%;border:8px solid var(--ve);border-radius:20px;
          color:var(--ve);font-weight:800;font-size:72px;letter-spacing:.14em;display:flex;align-items:center;justify-content:center;
          background:rgba(255,255,255,.74);transform:rotate(-10deg)">PAGO</div></div>`,f);
    }
    return {w,f,chip,rs,tot,car};
  };
  const A=fita(400,[['Salário',brl(1980)],['+ Bônus',brl(0)],['− Faltas',brl(90)],['− Vales',brl(200)]],brl(1690));
  const B=fita(690,[['Salário',brl(1980)]],null);
  return t=>{
    const J=janela([6,'uma'],[6,'salario',2],.6); if(!naJanela(g,t,J))return;
    const tsd=W(6,'saldo'),tsa=W(6,'salario'),tbo=W(6,'bonus'),tfa=W(6,'faltas'),tva=W(6,'vales'),tct=W(6,'contando'),

    const tas=W(2,'assim'),tfa=W(2,'falta'),tli=W(2,'linha'),tju=W(2,'justificar');
    posTitulo(tit,t,J.a-.6,tas-.4);
    dias.forEach(({c,m},k)=>{vis(c,t,tas-.05+k*.07,1e9,{dy:22}); if(m) vis(m,t,tas+.3+k*.08,1e9,{sc:.6,dy:0})});
    const tsw=tju+.45, sw=eo(pr(t,tsw,.4));
    const of=vis(bF,t,tfa-.1,1e9,{sc:.7,dy:0}); bF.style.opacity=(of*(1-sw)).toFixed(3);
    bA.style.opacity=sw.toFixed(3); bA.style.visibility=sw>0?'visible':'hidden';
    const c1=eo(pr(t,tfa-.05,.45)); d5.style.borderColor=t<tsw?mix('#E1E8E4','#F2B63D',c1):mix('#F2B63D','#50D088',sw);
    pulse(d5,t,tli,.04,.7);
    const q=arco(pap,t,tju-.1,.7,1110,156,876,214,-60,-8);
    pap.style.opacity=(q>0?eo(cl(q/.25)):0).toFixed(3); pap.style.visibility=q>0?'visible':'hidden';
  };
};

// ------------------------------------------------------------------ CAPS[11] · Jornada individual (linha 5)
// "A jornada individual vence a da empresa só pra aquela pessoa. O resto da equipe segue no horário padrão."  Régua de horas:
// todos com a faixa da empresa (07:00 às 16:00); a faixa da Juliana (08:00 às 17:00) desce por cima só na linha dela.
CAPS[11]=()=>{
  const g=grupo();
  const tit=titulo(g,'Ponto eletrônico','Jornada individual');
  const X0=330,PX=68, xh=h=>X0+(h-6)*PX;                   // 6h a 18h
  const regua=el(`<div class="ab" style="left:0;top:0;width:1280px;height:800px">
      ${[6,8,10,12,14,16,18].map(h=>`<div class="ab lbl" style="left:${xh(h)-30}px;top:232px;width:60px;text-align:center;font-size:16px">${h}h</div>`).join('')}
      <svg class="ab" style="left:0;top:0;overflow:visible" width="1280" height="800">${[...Array(13)].map((_,i)=>`<line x1="${xh(6+i)}" y1="262" x2="${xh(6+i)}" y2="${i%2?272:278}" stroke="#B9C1C9" stroke-width="2"/>`).join('')}
      <line x1="${xh(6)}" y1="262" x2="${xh(18)}" y2="262" stroke="#D5DBE1" stroke-width="2"/></svg></div>`,g);
  const faixa=(h0,h1,top,cor,borda,txt,cortxt)=>`<div class="ab cx" style="left:${xh(h0)}px;top:${top}px;width:${(h1-h0)*PX}px;height:52px;border-radius:12px;background:${cor};border:2px solid ${borda};
      font-weight:700;font-size:18px;color:${cortxt}">${txt}</div>`;
  const rows=['Cláudio','Diego','Juliana','Marcos'].map((n,k)=>{
    const top=292+k*92;
    const nm=el(`<div class="ab row" style="left:96px;top:${top+3}px;gap:12px">${avatar(46)}<div class="nm">${n}</div></div>`,g);
    const trk=el(`<div class="ab" style="left:${xh(6)}px;top:${top}px;width:${12*PX}px;height:52px;border-radius:12px;background:#F2F4F7"></div>`,g);
    const emp=el(faixa(7,16,top,'#50D088','#fff','07:00 às 16:00','#fff'),g);
    return {nm,trk,emp,top};
  });
  const julW=el(`<div class="ab" style="left:0;top:0;width:1280px;height:800px"></div>`,g);
  const julI=el(`<div class="ab" style="left:0;top:0;width:1280px;height:800px">${faixa(8,17,rows[2].top,'#F2B63D','#fff','08:00 às 17:00','#fff')}</div>`,julW);
  const julB=julI.firstElementChild;
  const nmJ=rows[2].nm.querySelector('.nm'), avJ=rows[2].nm.querySelector('.av');
  const tagP=el(`<div class="ab" style="left:${xh(7)}px;top:668px;width:${9*PX}px;text-align:center"><div class="tag v">horário padrão</div></div>`,g);
  return t=>{
    const J=janela([5,'a'],[5,'padrão'],.6); if(!naJanela(g,t,J))return;
    const tjo=W(5,'jornada'),tin=W(5,'individual'),tve=W(5,'vence'),tpe=W(5,'pessoa'),tre=W(5,'resto'),tpa=W(5,'padrao');
    posTitulo(tit,t,J.a-.6,tjo-.4);
    vis(regua,t,tjo,1e9,{dy:10});
    const pd=eio(pr(t,tve-.05,.65));                       // "vence": a faixa da Juliana desce por cima da da empresa
    rows.forEach((r,k)=>{vis(r.nm,t,tjo+k*.08,1e9,{dx:-12,dy:0}); vis(r.trk,t,tjo+k*.08,1e9,{dy:0,sc:1});
      const o=vis(r.emp,t,tjo+.2+k*.1,1e9,{dx:-20,dy:0}); if(k===2) r.emp.style.opacity=(o*lerp(1,.25,pd)).toFixed(3)});
    vis(julW,t,tin-.1,1e9,{dy:-14});
    julI.style.transform=`translate(0,${lerp(-46,0,pd).toFixed(2)}px)`;
    julB.style.boxShadow=`0 ${lerp(14,2,pd).toFixed(1)}px ${lerp(26,6,pd).toFixed(1)}px rgba(138,90,0,${lerp(.22,.08,pd).toFixed(3)})`;
    const pj=eo(pr(t,tpe-.1,.45)); nmJ.style.color=mix('#121212','#8A5A00',pj); avJ.style.background=mix('#EEF1F4','#FFF1D6',pj);
    pulse(rows[2].nm,t,tpe,.05,.7);
    [0,1,3].forEach((k,i)=>pulse(rows[k].emp,t,tre+i*.15,.035,.7));
    vis(tagP,t,tpa-.1,1e9,{dy:10});
  };
};

// ------------------------------------------------------------------ CAPS[12] · Arquivar ou excluir (linha 5)
// "Pra quem saiu, o caminho é Arquivar: a ficha fica guardada e pode voltar."  A ficha do Rogério entre os dois caminhos:
// a caixa-arquivo (Arquivar) e a lixeira (Excluir definitivamente, sem volta); a ficha vai para a caixa e pode voltar.
CAPS[12]=()=>{
  const g=grupo();
  const tit=titulo(g,'Funcionários','Arquivar ou excluir');
  const setas=el(`<svg class="ab" style="left:0;top:0;overflow:visible" width="1280" height="800">
      <path class="sl" d="M560 286 C 470 330, 360 330, 330 404" fill="none" stroke="#C9D2DB" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 12"/>
      <path class="sr" d="M720 286 C 810 330, 930 330, 960 404" fill="none" stroke="#C9D2DB" stroke-width="4" stroke-linecap="round" stroke-dasharray="3 12"/>
      <path class="sg" d="M560 286 C 470 330, 360 330, 330 404" fill="none" stroke="#50D088" stroke-width="5" stroke-linecap="round"/>
      <path class="sv" d="M214 452 C 150 330, 300 210, 452 214 M436 198 L456 214 L436 232" fill="none" stroke="#50D088" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,g);
  const sl=setas.querySelector('.sl'),sr=setas.querySelector('.sr'),sg=setas.querySelector('.sg'),sv=setas.querySelector('.sv');
  [sl,sr].forEach(p=>p.style.opacity=0);
  const cxB=el(`<div class="ab" style="left:210px;top:404px;width:240px;height:190px">${caixaFundo()}</div>`,g);
  const vago=el('<div class="ab" style="left:470px;top:168px;width:340px;height:104px;border-radius:18px;border:3px dashed #CBD3DB"></div>',g);
  const fW=el('<div class="ab" style="left:470px;top:168px;width:340px;height:104px;transform-origin:170px 52px"></div>',g);
  const fC=el(`<div class="card row" style="left:0;top:0;width:340px;height:104px;padding:0 22px;gap:14px">${avatar(60)}<div class="nm" style="font-size:24px">Rogério Batista</div></div>`,fW);
  const cxF=el(`<div class="ab" style="left:210px;top:404px;width:240px;height:190px">${caixaFrente()}</div>`,g);
  const ok=el(`<div class="cx" style="position:absolute;left:418px;top:442px;width:52px;height:52px;background:var(--vs);color:#fff">${ic('check',30)}</div>`,g);
  const lA=el('<div class="ab" style="left:130px;top:610px;width:380px;text-align:center"><div class="tag v">Arquivar</div></div>',g);
  const dir=el('<div class="ab" style="left:0;top:0;width:1280px;height:800px"></div>',g);
  const lix=el(`<div class="ab" style="left:890px;top:420px;width:140px;height:170px">${lixeira()}</div>`,dir);
  const lE=el('<div class="ab" style="left:760px;top:610px;width:400px;text-align:center"><div class="tag c">Excluir definitivamente</div></div>',dir);
  const lS=el('<div class="ab" style="left:760px;top:664px;width:400px;text-align:center"><span class="lbl" style="font-size:19px">sem volta</span></div>',dir);
  const lR=el('<div class="ab" style="left:96px;top:250px;width:200px;text-align:center"><div class="tag v">Reativar</div></div>',g);
  return t=>{
    const J=janela([5,'pra'],[5,'voltar'],.6); if(!naJanela(g,t,J))return;
    const tsa=W(5,'saiu'),tca=W(5,'caminho'),tar=W(5,'arquivar'),tfi=W(5,'ficha'),tgu=W(5,'guardada'),tvo=W(5,'voltar');
    posTitulo(tit,t,J.a-.6,tsa-.5);
    vis(fC,t,tsa-.05,1e9,{dy:18});
    // os dois caminhos: Arquivar (esquerda) e Excluir definitivamente (direita)
    const pc=eo(pr(t,tca-.1,.5)); sl.style.opacity=sr.style.opacity=pc.toFixed(3);
    vis(cxB,t,tca-.1,1e9,{dy:18}); vis(cxF,t,tca-.1,1e9,{dy:18}); vis(lA,t,tca+.05,1e9,{dy:10});
    vis(lix,t,tca+.15,1e9,{dy:18}); vis(lE,t,tca+.25,1e9,{dy:10}); vis(lS,t,tca+.35,1e9,{dy:8});
    traco(sg,t,tar-.1,.5); dir.style.opacity=lerp(1,.42,eo(pr(t,tar,.5))).toFixed(3);
    // "ficha": a ficha desce para dentro da caixa (fica entre o fundo e a frente)
    const pf=eio(pr(t,tfi-.1,.85));
    fW.style.transform=`translate(${(-320*pf).toFixed(2)}px,${(232*pf).toFixed(2)}px) scale(${lerp(1,.6,pf).toFixed(4)})`;
    vis(ok,t,tgu-.05,1e9,{sc:.6,dy:0});
    traco(sv,t,tvo-.25,.6); vis(lR,t,tvo-.05,1e9,{dy:8}); vis(vago,t,tvo-.3,1e9,{dy:0,sc:.97});
  };
};

// ------------------------------------------------------------------ API para o renderizador
let RENDER=null;
window.setup=d=>{D=d;ST.innerHTML='';RENDER=CAPS[d.cap]();return true};
window.R=t=>{RENDER(t);return true};
</script></body></html>
