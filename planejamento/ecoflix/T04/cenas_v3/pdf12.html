<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- T04 "Clientes e fornecedores" · o papel REAL do extrato detalhado (PDF detalhado com produtos) na tela (kit v3, clima claro: papel é mundo físico).
     Molde: cenas_v3/pdf.html (Relatório de Saldos, cap16). A gravação final do cap12 devolveu a página que o app escreve na aba nova
     (passo "PDF DO EXTRATO DETALHADO", rec/t04/t04-cap12.actions.json); rec/t04/t04_papel.py imprime no Chromium, rasteriza a 300 dpi e grava
     $TUT_HOME/t04/edit/out/comprovantes/cap12-extrato.png (página 1, carta 612 x 792 pt, 2,4 px por pt) e o bbox do pdftotext.
       cap12 · linha 11 · ilu12_extrato_pdf · "O PDF detalhado mostra, em cada pedido, os materiais, o peso e o preço."
     Marca-texto verde nas colunas da primeira compra (#1749): Material, Quantidade (o peso) e Preço unit., na ordem da fala.
     Coordenadas: pontos do PDF. Render: render_cenas.cjs 12 <cap12.json> saida.mp4 --html .../pdf12.html --anexo $TUT_HOME/t04/edit/out/comprovantes
             --larg 1422 --dsf 1.35 --de <s> --ate <s>. -->
</head><body>
<script type="module">
import { pr, eo, W, vis, titulo, posTitulo, GL, mancha, piso, U, camera, plano, cena, estilo, enquadraRet }
  from '../../../../perfis/ecoflix/cenas_v3/motor.js';
import { ceuClaro } from '../../../../perfis/ecoflix/cenas_v3/fundo.js';

const NUNCA = 1e9;
// K px por pt: o papel é desenhado MAIOR que no quadro para o Chromium não ampliar a camada (texto pequeno saía mole com 1 px por pt)
const K = 2.4, LP = 612, HP = 792, WP = Math.round(LP * K), HPX = Math.round(HP * K), E = .008 / K, YC = HPX * E / 2 + .45;   // página (px) e metros por px

// marcas: [x0, y0, x1, y1, tipo]; tipo '' = marca-texto (cresce da esquerda), 'q' = moldura
function papel(src, marcas) {
  estilo('folha', `
.folha{position:relative;width:${WP}px;height:${HPX}px;background:#fff;border-radius:10px;box-shadow:0 80px 140px -42px rgba(30,80,60,.38),0 19px 38px -14px rgba(30,80,60,.14)}
.folha img{display:block;width:${WP}px;height:${HPX}px;border-radius:10px}
.folha .mk{position:absolute;border-radius:7px;background:rgba(80,208,136,.46);mix-blend-mode:multiply;transform-origin:0 50%;transform:scaleX(0)}
.folha .mk.q{background:none;mix-blend-mode:normal;border:5px solid #50D088;box-shadow:0 0 0 5px rgba(80,208,136,.28);border-radius:9px;transform:none;opacity:0}`);
  const mk = Object.entries(marcas).map(([id, [x0, y0, x1, y1, tp]]) =>
    `<i class="mk ${tp ?? ''}" data-m="${id}" style="left:${(x0 * K).toFixed(1)}px;top:${(y0 * K).toFixed(1)}px;width:${((x1 - x0) * K).toFixed(1)}px;height:${((y1 - y0) * K).toFixed(1)}px"></i>`).join('');
  return `<div class="folha"><img src="${src}" alt="">${mk}</div>`;
}
function marca(e, id, t, a, d = .45) {
  const m = (e._mk ??= {})[id] ??= e.querySelector(`[data-m="${id}"]`), k = eo(pr(t, a, d));
  if (m.classList.contains('q')) { m.style.opacity = k.toFixed(3); m.style.transform = `scale(${(1.06 - .06 * k).toFixed(4)},${(1.3 - .3 * k).toFixed(4)})`; }
  else m.style.transform = `scaleX(${k.toFixed(4)})`;
}
// faixa de linhas do papel (pt, de cima para baixo) em metros, na largura inteira: para enquadraRet
const faixa = (y0, y1) => [-WP / 2 * E, YC + (HPX / 2 - y1 * K) * E, WP / 2 * E, YC + (HPX / 2 - y0 * K) * E];

function extrato(d) {
  const t0 = W(11, 'detalhado'), tmat = W(11, 'materiais,'), tpeso = W(11, 'peso'), tpreco = W(11, 'preço.'), tfim = W(11, 'preço.', 1, 'e');
  piso({ r: 26, x: 0, z: -2, passo: 1.3 }); U.uNevoa.value.set(.955, .975, .965, .8); ceuClaro({ halo: [.2, 3.8, -13] });
  const p = plano(papel(`${d.anexo}/cap12-extrato.png`, {
    mat: [124, 512, 262, 628], preco: [330, 512, 392, 628], peso: [412, 512, 480, 628] }), { pos: [0, YC, 0], esc: E, sangra: true });
  const sp = mancha(6.4, 1.6, [0, 0, .1], { op: 0 });
  const tit = titulo('Extrato da conta-corrente', 'PDF detalhado');
  // de longe: a primeira parte do extrato até a compra #1749; de perto: a tabela de materiais da compra (o título já saiu)
  const F0 = enquadraRet(null, faixa(330, 640), { topo: 150, margem: 56, el: .02, az: .05 }), F1 = enquadraRet(null, faixa(480, 640), { topo: 60, margem: 50, el: .015, az: .02 });
  camera([[t0 - 3, F0], [tmat - .6, { ...F0, d: F0.d * .985, az: .045 }, 'lin'], [tmat + .35, F1], [tfim + 2, { ...F1, d: F1.d * .985, az: .0 }, 'lin']]);
  return t => {
    GL.style.opacity = eo(pr(t, t0 - .25, .35)).toFixed(3);
    posTitulo(tit, t, t0 - 1.7, t0 - 1.3, tmat - .6);
    vis(p.e, t, t0 - .6, NUNCA, { dy: 72 }); sp.material.uniforms.uOp.value = .55 * (+p.e.style.opacity || 0);
    marca(p.e, 'mat', t, tmat - .1, .4); marca(p.e, 'peso', t, tpeso - .1, .4); marca(p.e, 'preco', t, tpreco - .1, .4);
  };
}
const CAPS = { 12: extrato };
cena(d => CAPS[d.cap](d), { fov: 26 });
</script></body></html>
