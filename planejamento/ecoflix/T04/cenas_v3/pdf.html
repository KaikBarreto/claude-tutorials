<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- T04 "Clientes e fornecedores" · o papel REAL do Exportar Relatório na tela (kit v3, clima claro: papel é mundo físico).
     Molde: T03/cenas_v3/pdf.html e T08/cenas_v3/comprovante.html (pedido do Kaik, 19/11: toda fala de PDF mostra o papel real).
     O app abre o Relatório de Saldos numa aba nova (uma página HTML pronta para imprimir em A4); o robô devolveu a página no
     ensaio do cap16 (rec/t04/t04-cap16.actions.json, passo "PDF DO RELATÓRIO DE SALDOS"; arquivo em
     $TUT_HOME/rec/t04/arquivos/cap16-relatorio-saldos.html). A edição imprime essa página em PDF (Chromium, A4, mídia de
     impressão) e rasteriza em $TUT_HOME/t04/edit/out/comprovantes/cap16-relatorio.png (pdftoppm -r 300 -png -singlefile).
     Aqui o papel é a imagem real, sem redesenho: a câmera chega perto e o marca-texto verde acompanha a fala.
       cap16 · linha 8 · ilu16_relatorio_pdf · "No Exportar Relatório, a lista sai em PDF ou em planilha."  (janela: "lista" a "planilha")
     A janela é curta (3 s): a folha já está no quadro e a câmera só se aproxima do cabeçalho e das duas listas.
     O extrato detalhado do cap12 ("O PDF detalhado mostra, em cada pedido, os materiais, o peso e o preço.") NÃO tem cena:
     o ensaio devolveu a aba sem o corpo da página ("SEM HTML"); fica pendente até o robô gravar o papel.
     Coordenadas: pontos do PDF (pdftotext -bbox), página A4 de 594,96 x 841,92 pt, desenhada com 2,4 px por pt.
     Render: render_cenas.cjs 16 <cap16.json> saida.mp4 --html .../pdf.html --anexo $TUT_HOME/t04/edit/out/comprovantes
             --larg 1422 --dsf 1.35 --de <s> --ate <s>.  Auditoria: auditar.cjs --aula planejamento/ecoflix/T04 --larg 1422 -->
</head><body>
<script type="module">
import { pr, eo, W, vis, titulo, posTitulo, GL, mancha, piso, U, camera, plano, cena, estilo, enquadraRet }
  from '../../../../perfis/ecoflix/cenas_v3/motor.js';
import { ceuClaro } from '../../../../perfis/ecoflix/cenas_v3/fundo.js';

const NUNCA = 1e9;
// K px por pt: o papel é desenhado MAIOR que no quadro para o Chromium não ampliar a camada (texto pequeno saía mole com 1 px por pt)
const K = 2.4, LP = 594.96, HP = 841.92, WP = Math.round(LP * K), HPX = Math.round(HP * K), E = .008 / K, YC = HPX * E / 2 + .45;   // página (px) e metros por px

// marcas: [x0, y0, x1, y1, tipo]; tipo '' = marca-texto (cresce da esquerda), 'q' = moldura
function papel(src, marcas) {
  estilo('folha', `
.folha{position:relative;width:${WP}px;height:${HPX}px;background:#fff;border-radius:10px;box-shadow:0 80px 140px -42px rgba(30,80,60,.38),0 19px 38px -14px rgba(30,80,60,.14)}
.folha img{display:block;width:${WP}px;height:${HPX}px;border-radius:10px}
.folha .mk{position:absolute;border-radius:7px;background:rgba(80,208,136,.46);mix-blend-mode:multiply;transform-origin:0 50%;transform:scaleX(0)}
.folha .mk.q{background:none;mix-blend-mode:normal;border:5px solid #50D088;box-shadow:0 0 0 5px rgba(80,208,136,.28);border-radius:9px;transform:none;opacity:0}`);
  const mk = Object.entries(marcas).map(([id, [x0, y0, x1, y1, tp]]) =>
    `<i class="mk ${tp ?? ''}" data-m="${id}" style="left:${(x0 * K).toFixed(1)}px;top:${(y0 * K).toFixed(1)}px;width:${((x1 - x0) * K).toFixed(1)}px;height:${((y1 - y0) * K).toFixed(1)}px"></i>`).join('');
  return `<div class="folha"><img src="${src}" alt="">${mk}</div>`;
}
function marca(e, id, t, a, d = .45) {
  const m = (e._mk ??= {})[id] ??= e.querySelector(`[data-m="${id}"]`), k = eo(pr(t, a, d));
  if (m.classList.contains('q')) { m.style.opacity = k.toFixed(3); m.style.transform = `scale(${(1.06 - .06 * k).toFixed(4)},${(1.3 - .3 * k).toFixed(4)})`; }
  else m.style.transform = `scaleX(${k.toFixed(4)})`;
}
// faixa de linhas do papel (pt, de cima para baixo) em metros, na largura inteira: para enquadraRet
const faixa = (y0, y1) => [-WP / 2 * E, YC + (HPX / 2 - y1 * K) * E, WP / 2 * E, YC + (HPX / 2 - y0 * K) * E];

function relatorio(d) {
  const t0 = W(8, 'lista'), tsai = W(8, 'sai'), tpdf = W(8, 'pdf'), tou = W(8, 'ou'), tfim = W(8, 'planilha', 1, 'e');
  piso({ r: 26, x: 0, z: -2, passo: 1.3 }); U.uNevoa.value.set(.955, .975, .965, .8); ceuClaro({ halo: [.2, 3.8, -13] });
  const p = plano(papel(`${d.anexo}/cap16-relatorio.png`, {
    tit: [224, 133, 372, 156], rec: [39, 185, 125, 210], pag: [39, 364, 111, 389] }), { pos: [0, YC, 0], esc: E, sangra: true });
  const sp = mancha(6.4, 1.6, [0, 0, .1], { op: 0 });
  const tit = titulo('Exportar Relatório', 'A lista em PDF');
  // de longe: o cabeçalho e a lista A Receber, com o título no alto; de perto: até o fim da lista A Pagar (o título já saiu)
  const F0 = enquadraRet(null, faixa(20, 350), { topo: 150, margem: 56, el: .02, az: .05 }), F1 = enquadraRet(null, faixa(112, 530), { topo: 60, margem: 50, el: .015, az: .02 });
  camera([[t0 - 3, F0], [tsai - .1, { ...F0, d: F0.d * .985, az: .045 }, 'lin'], [tpdf + .55, F1], [tfim + 2, { ...F1, d: F1.d * .985, az: .0 }, 'lin']]);
  return t => {
    GL.style.opacity = eo(pr(t, t0 - .25, .35)).toFixed(3);
    posTitulo(tit, t, t0 - 1.7, t0 - 1.3, tsai + .05);   // a janela abre com o título já no alto; sai antes da aproximação
    vis(p.e, t, t0 - .6, NUNCA, { dy: 72 }); sp.material.uniforms.uOp.value = .55 * (+p.e.style.opacity || 0);
    marca(p.e, 'tit', t, tpdf - .15); marca(p.e, 'rec', t, tou - .05, .4); marca(p.e, 'pag', t, tou + .3, .4);
  };
}
const CAPS = { 16: relatorio };
cena(d => CAPS[d.cap](d), { fov: 26 });
</script></body></html>
