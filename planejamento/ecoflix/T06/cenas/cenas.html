<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- Cenas de conceito do T6 "Caixa: abrir, fechar e o cofre" (EcoFlix), feitas do kit perfis/ecoflix/cenas/
     cenas_ecoflix.html (docs/09-aula-ilustrada.md): 1280x800 CSS, quadro a quadro por render_cenas.cjs (window.setup(dados) +
     window.R(t)); tudo é função do tempo t; cada mudança presa a uma palavra da fala com W(linha, 'palavra'[, ocorrência]).
     Uma cena por capítulo: CAPS[0] o dinheiro do dia, [3] dia só de Pix, [4] cofre x caixa, [9] suprimento e sangria,
     [10] esperado x contado. Janelas e o que cada uma mostra: ilustracoes.json; tempos estimados (antes da voz):
     tempos/capNN.json. Os dois exemplos do kit saíram (o caminhao() do kit fica: o cap03 usa).
     Valores dos caixas em constantes no topo de cada cena (a junção do mundo pode mudar os números; as âncoras não são número).
     A aula acrescenta ao kit: --r/--re/--rc e .tag.r (despesa), .tag.n/.ico.n, seta com ponta, ficha que viaja, viagem(),
     e os desenhos da gaveta do caixa, do cofre, do banco, da carroça, do pátio, da pilha de notas e do maço. -->
<style>
@font-face{font-family:M;font-weight:500;src:url(../../../web/fonts/montserrat-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:600;src:url(../../../web/fonts/montserrat-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:700;src:url(../../../web/fonts/montserrat-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:800;src:url(../../../web/fonts/montserrat-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:M;font-weight:500;src:url(../../../web/fonts/montserrat-latin-ext-500-normal.woff2) format('woff2');unicode-range:U+0100-024F}
@font-face{font-family:M;font-weight:700;src:url(../../../web/fonts/montserrat-latin-ext-700-normal.woff2) format('woff2');unicode-range:U+0100-024F}
/* ---------------------------------------------------------------- paleta EcoFlix (marca: acento #50D088, escuro #121212)
   --v  acento: preenchimentos, barras, contornos de destaque (nunca texto sobre branco: contraste baixo)
   --ve verde escuro: texto e ícone verde sobre branco (contraste 5,0)   --vc verde claro: fundo de ícone/resultado
   --a  âmbar: o SEGUNDO conceito da cena (ex.: competência x caixa)     --ae texto âmbar (5,9)   --ac âmbar claro
   --t  texto (o escuro da marca)   --c texto secundário (4,8)   --l linhas   --e painel escuro (mostrador) */
:root{--v:#50D088;--ve:#2E7D57;--vc:#EAF8F0;--vm:#A9E9C6;--a:#F2B63D;--ae:#8A5A00;--ac:#FFF5DF;
  --t:#121212;--c:#6B7280;--l:#E6E9EE;--e:#121212}
*{box-sizing:border-box;margin:0;padding:0;transition:none!important;animation:none!important}
html,body{width:1280px;height:800px;overflow:hidden;background:#fff}
body{font-family:M,sans-serif;color:var(--t);-webkit-font-smoothing:antialiased}
#st{position:absolute;inset:0;overflow:hidden;background:
  radial-gradient(1100px 650px at 92% -12%,rgba(80,208,136,.09),transparent 62%),
  radial-gradient(900px 600px at -12% 112%,rgba(80,208,136,.06),transparent 60%),#fff}
.g{position:absolute;left:0;top:0;width:1280px;height:800px;transform-origin:640px 400px}
.ab{position:absolute}
.row{display:flex;align-items:center}
/* título da cena: área (kicker) + conceito; sozinho fica grande no centro e sobe quando o desenho entra */
.kick{font-weight:700;font-size:15px;letter-spacing:.3em;color:var(--ve);text-transform:uppercase}
.h{font-weight:800;font-size:46px;letter-spacing:-.01em;line-height:1.1}
/* cartão, chip, etiqueta, ícone */
.card{position:absolute;background:#fff;border:1px solid #E1E8E4;border-radius:18px;
  box-shadow:0 18px 40px rgba(16,24,40,.10),0 3px 8px rgba(16,24,40,.06)}
.ic{display:inline-flex;align-items:center;justify-content:center;flex:none}
.ic svg{width:100%;height:100%}
.ico{display:flex;align-items:center;justify-content:center;flex:none;border-radius:14px;background:var(--vc);color:var(--ve)}
.ico.a{background:var(--ac);color:var(--ae)}
.tag{display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:999px;font-weight:800;font-size:20px;white-space:nowrap}
.tag.v{background:var(--vc);color:var(--ve)} .tag.a{background:var(--ac);color:var(--ae)}
.lbl{font-weight:700;font-size:17px;color:var(--c)}
.num{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.op{position:absolute;width:60px;height:60px;border-radius:50%;background:#F2F4F7;color:var(--t);display:flex;
  align-items:center;justify-content:center;font-weight:800;font-size:34px;line-height:1}
/* mostrador da balança (painel escuro, número no acento) */
.most{background:var(--e);border-radius:16px;padding:16px 22px 18px;box-shadow:0 16px 34px rgba(16,24,40,.22)}
.most .ml{position:relative;height:20px;font-weight:700;font-size:15px;letter-spacing:.22em;color:#A9E9C6;text-transform:uppercase}
.most .ml span{position:absolute;left:0;top:0;white-space:nowrap}
.most .mn{margin-top:6px;font-weight:800;font-size:44px;color:var(--v);font-variant-numeric:tabular-nums;white-space:nowrap}
.rip{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;border:3px solid var(--v);opacity:0}
/* ---------------------------------------------------------------- T6: o que a aula acrescenta ao kit (o mesmo do T4)
   --r vermelho (despesa de verdade, a tarifa): preenchimento e contorno
   --re texto vermelho sobre branco (6,6) e sobre --rc (6,0)   --rc vermelho claro: fundo de etiqueta e de célula */
:root{--r:#E5484D;--re:#B42318;--rc:#FEF1F0}
.tag.r{background:var(--rc);color:var(--re)} .tag.n{background:#F2F4F7;color:#374151}
.ico.r{background:var(--rc);color:var(--re)} .ico.n{background:#EEF1F4;color:#4B5563}
.tok{position:absolute;left:0;top:0;width:48px;height:48px;border-radius:50%;background:#fff;border:2px solid #D5DCE2;
  display:flex;align-items:center;justify-content:center;color:#374151;box-shadow:0 6px 14px rgba(16,24,40,.12)}
</style></head>
<body><div id="st"></div>
<script>
// ------------------------------------------------------------------ utilidades (as do cenas_modelo.html + as da EcoFlix)
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const pr=(t,a,d=.45)=>cl((t-a)/d);
const lerp=(a,b,p)=>a+(b-a)*p;
const $=s=>document.querySelector(s);
const ST=document.getElementById('st');
function el(html,parent=ST){const d=document.createElement('div');d.innerHTML=html.trim();let f=null;for(const n of [...d.childNodes]){parent.appendChild(n);if(!f&&n.nodeType===1)f=n}return f}
function grupo(){return el('<div class="g"></div>')}
function ic(n,px,cor){const s=(window.ICONS||{})[n]||'';return `<span class="ic" style="width:${px}px;height:${px}px;${cor?'color:'+cor:''}">${s}</span>`}
function hex(c){c=c.replace('#','');return[0,2,4].map(i=>parseInt(c.substr(i,2),16))}
function mix(a,b,p){const A=hex(a),B=hex(b);return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*cl(p))).join(',')})`}
// aparece em a, some em b (opacidade + leve subida + escala): a entrada e a saída suaves de tudo
function vis(e,t,a,b=1e9,o={}){
  const din=o.din??.5,dout=o.dout??.4,dy=o.dy??16,dx=o.dx??0,sc=o.sc??.985;
  const p=eo(pr(t,a,din)),q=1-eo(pr(t,b,dout)),op=Math.min(p,q);
  e.style.opacity=op.toFixed(4);e.style.visibility=op<=.001?'hidden':'visible';
  const s=sc+(1-sc)*p - (1-q)*(1-sc);
  e.style.transform=`translate(${((1-p)*dx).toFixed(2)}px,${((1-p)*dy-(1-q)*dy*.5).toFixed(2)}px) scale(${s.toFixed(4)})`;
  return op;
}
function ripple(r,t,a){const p=pr(t,a,.7);r.style.opacity=(p>0&&p<1)?(.6*(1-p)).toFixed(3):0;r.style.transform=`scale(${(.4+2.0*eo(p)).toFixed(3)})`}
function pulse(e,t,a,amp=.045,dur=.9){const p=pr(t,a,dur);e.style.scale=(p>0&&p<1)?(1+amp*Math.sin(Math.PI*p)).toFixed(4):''}
function digita(e,txt,t,a,b){const p=cl((t-a)/Math.max(.05,b-a));const n=Math.round(p*txt.length);
  const car=(p>0&&p<1)||(Math.floor(t*2.2)%2===0&&p<1.2&&t>=a)?'<span style="color:var(--v);font-weight:500">|</span>':'';
  e.innerHTML=(txt.slice(0,n)||'')+(t>=a&&t<b+.8?car:'');}
// EcoFlix: números e dinheiro no jeito brasileiro; contagem suave de um número; traço que se desenha; arco; contorno
const NF=new Intl.NumberFormat('pt-BR');
const kg=v=>NF.format(Math.round(v))+' kg';
const brl=v=>'R$ '+v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
function conta(e,t,a,d,v0,v1,fmt=kg){const p=eo(pr(t,a,d));const s=fmt(lerp(v0,v1,p));if(e.textContent!==s)e.textContent=s;return p}
function traco(p,t,a,d=.8){if(!p._L){p._L=p.getTotalLength();p.style.strokeDasharray=p._L}const q=eio(pr(t,a,d));p.style.strokeDashoffset=(p._L*(1-q)).toFixed(2);p.style.opacity=q>0?1:0;return q}
function arco(e,t,a,d,x0,y0,x1,y1,h=-80,rot=0){const p=eio(pr(t,a,d));const x=lerp(x0,x1,p),y=lerp(y0,y1,p)+h*4*p*(1-p);
  e.style.transform=`translate(${x.toFixed(2)}px,${y.toFixed(2)}px) rotate(${(rot*p).toFixed(2)}deg)`;return p}
function contorno(e,t,a,de,para,d=.45){e.style.borderColor=mix(de,para,eo(pr(t,a,d)))}
// título padrão da cena: grande no centro enquanto está sozinho, sobe para o alto quando o desenho entra (em "sobe")
function titulo(g,kick,txt){return el(`<div class="ab" style="left:0;top:0;width:1280px;text-align:center">
  <div class="kick">${kick}</div><div class="h" style="margin-top:12px">${txt}</div></div>`,g)}
function posTitulo(e,t,a,sobe,sai=1e9){vis(e,t,a,sai,{dy:14});const p=eio(pr(t,sobe,.7));
  e.style.top=lerp(318,46,p).toFixed(2)+'px';e.style.scale=lerp(1.12,1,p).toFixed(4)}

// ------------------------------------------------------------------ tempos da fala (capNN.json do proc.py ou estimado)
let D=null;
const norm=w=>w.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9%./-]+/g,'');
function W(linha,palavra,n=1,campo='s'){
  const alvo=norm(palavra);let k=0;
  for(const w of D.words){if(w.linha===linha&&norm(w.w).replace(/[.,]$/,'')===alvo){k++;if(k===n)return w[campo]}}
  for(const w of D.words){if(w.linha===linha&&norm(w.w).startsWith(alvo)){k++;if(k>=n)return w[campo]}}
  console.warn('palavra não achada',linha,palavra);return L(linha);
}
const L=i=>(D.linhas[i]||{s:0}).s, LE=i=>(D.linhas[i]||{e:D.dur}).e;

// ------------------------------------------------------------------ desenhos genéricos (sem marca)
// caminhão de lado (frente para a direita), com a carga de sucata em pedaços (.pd) que podem ser descarregados
function caminhao(){
  const pd=[ // [forma, cor, centro da peça, destino no monte atrás do caminhão (deslocamento do centro e giro)]
    ['<polygon points="28,90 44,52 88,42 100,90"/>','#8C5A3C',[64,66],[-224,148,6]],
    ['<polygon points="82,90 102,36 146,48 154,90"/>','#6F7983',[118,63],[-318,122,12]],
    ['<rect x="118" y="44" width="112" height="16" rx="8" transform="rotate(-8 174 52)"/>','#9AA3AD',[174,52],[-334,98,-18]],
    ['<polygon points="148,90 170,54 212,44 232,90"/>','#A0694A',[190,67],[-425,148,-8]],
    ['<polygon points="210,90 232,40 276,54 286,90"/>','#4F5861',[248,65],[-373,120,-10]],
    ['<polygon points="258,90 282,60 308,66 312,90"/>','#8A949E',[285,75],[-375,148,4]],
    ['<g><circle cx="192" cy="64" r="19"/><circle cx="192" cy="64" r="7" fill="#8A949E"/></g>','#5E6670',[192,64],[-242,155,200]],
    ['<polygon points="40,70 60,50 84,64 64,86"/>','#B07A55',[62,68],[-307,100,30]]];
  const pecas=pd.map(([f,c,[cx,cy],[dx,dy,r]])=>`<g class="pd" data-cx="${cx}" data-cy="${cy}" data-dx="${dx}" data-dy="${dy}" data-r="${r}" fill="${c}">${f}</g>`).join('');
  const roda=x=>`<g class="roda" data-x="${x}" transform="translate(${x},196)"><circle r="26" fill="#1B1F24"/><circle r="12" fill="#9AA3AD"/>
    <rect x="-2.5" y="-23" width="5" height="10" rx="2" fill="#5B636C"/><rect x="-2.5" y="13" width="5" height="10" rx="2" fill="#5B636C"/></g>`;
  return `<svg viewBox="0 0 500 230" width="500" height="230" style="overflow:visible">
    <g class="carga">${pecas}</g>
    <rect x="18" y="86" width="304" height="88" rx="6" fill="#7E8994"/>
    <rect x="16" y="82" width="308" height="11" rx="4" fill="#68727D"/>
    <g stroke="#707A85" stroke-width="3">${[78,138,198,258].map(x=>`<line x1="${x}" y1="98" x2="${x}" y2="168"/>`).join('')}</g>
    <path d="M334,176 L334,76 Q334,64 346,64 L412,64 L462,116 L472,121 Q480,124 480,134 L480,176 Z" fill="#2F3640"/>
    <path d="M348,78 L406,78 L444,116 L348,116 Z" fill="#D7E5ED"/>
    <rect x="470" y="142" width="10" height="11" rx="2" fill="#F2B63D"/>
    <rect x="12" y="170" width="472" height="15" rx="4" fill="#23282E"/>
    ${roda(92)}${roda(158)}${roda(416)}
  </svg>`;
}

// ------------------------------------------------------------------ T6 · utilidades desta aula (faltavam no kit; as mesmas do T4)
// A janela de cada cena abre 0,3 s antes da palavra "de" (ilustracoes.json); o título entra 0,6 s antes disso, então já
// está inteiro no 1º quadro, grande no centro, e sobe em "sobe".
const ABRE=.3;
function tituloCena(tit,t,de,sobe){posTitulo(tit,t,de-ABRE-.6,sobe)}
// seta com ponta: o traço se desenha (traco) e a ponta aparece no fim
function seta(pai,d,cor='var(--v)',w=4){
  const s=el(`<svg class="ab" style="left:0;top:0;overflow:visible" width="1280" height="800"><path d="${d}" fill="none" stroke="${cor}"
    stroke-width="${w}" stroke-linecap="round"/><path d="" fill="none" stroke="${cor}" stroke-width="${w}" stroke-linecap="round"
    stroke-linejoin="round" opacity="0"/></svg>`,pai);
  const [p,pt]=s.querySelectorAll('path'), L=p.getTotalLength(), A=p.getPointAtLength(L), B=p.getPointAtLength(Math.max(0,L-8));
  const an=Math.atan2(A.y-B.y,A.x-B.x), k=13, P=a=>`${(A.x-k*Math.cos(an+a)).toFixed(1)},${(A.y-k*Math.sin(an+a)).toFixed(1)}`;
  pt.setAttribute('d',`M${P(.55)} L${A.x.toFixed(1)},${A.y.toFixed(1)} L${P(-.55)}`);
  return {p,pt,draw(t,a,d=.7){const q=traco(p,t,a,d);pt.style.opacity=cl((q-.8)/.2).toFixed(3);return q}};
}
// ficha que viaja por uma seta (círculo branco com o ícone por cima do traço)
function ficha(pai,icone,px=24,flip=false){return el(`<div class="tok"><span class="ic" style="width:${px}px;height:${px}px;
  ${flip?'transform:scaleX(-1)':''}">${(window.ICONS||{})[icone]||''}</span></div>`,pai)}
// a ficha percorre de (x0,y0) a (x1,y1) a partir de a; antes disso não aparece; se "some", desaparece ao chegar (entra no destino)
function viagem(f,t,a,d,x0,y0,x1,y1,h=0,some=false){const q=arco(f,t,a,d,x0,y0,x1,y1,h,0);
  const op=t<a?0:(some?Math.min(1,q*6,(1-q)*6):Math.min(1,q*6+.0001)); f.style.opacity=op.toFixed(3); f.style.visibility=op>0?'visible':'hidden'; return q}

// ------------------------------------------------------------------ T6 · desenhos genéricos desta aula (sem marca)
// notas genéricas (verdes, sem valor impresso)
const NOTA=['#9ED9B5','#7CC69B','#B7E4C7','#8FCFA8'];
// gaveta do caixa vista de cima: 4 compartimentos de nota atrás, 5 copinhos de moeda na frente e o puxador
function gaveta(cheia=true,w=300){
  const nota=(x,y,c)=>`<g><rect x="${x}" y="${y}" width="51" height="56" rx="4" fill="${c}" stroke="#2E7D57" stroke-opacity=".35" stroke-width="1.5"/>
    <ellipse cx="${x+25.5}" cy="${y+28}" rx="11" ry="13" fill="#fff" opacity=".55"/></g>`;
  const comp=[0,1,2,3].map(i=>`<rect x="${22+i*65}" y="20" width="61" height="66" rx="6" fill="#F4F6F8"/>`+(cheia?nota(27+i*65,25,NOTA[i]):'')).join('');
  const moe=[0,1,2,3,4].map(i=>`<circle cx="${42+i*54}" cy="116" r="20" fill="#F4F6F8" stroke="#C9D1D8" stroke-width="2"/>`+
    (cheia?`<circle cx="${42+i*54}" cy="116" r="12" fill="${i%2?'#C9A44C':'#AEB8C2'}"/><circle cx="${42+i*54}" cy="116" r="6" fill="#fff" opacity=".35"/>`:'')).join('');
  return `<svg viewBox="0 0 300 172" width="${w}" height="${w*172/300}" style="overflow:visible">
    <rect x="6" y="6" width="288" height="146" rx="14" fill="#DDE3E8" stroke="#AEB8C2" stroke-width="3"/>
    <rect x="16" y="14" width="268" height="78" rx="9" fill="#C9D1D8"/>${comp}${moe}
    <rect x="0" y="148" width="300" height="24" rx="7" fill="#4F5861"/><rect x="118" y="155" width="64" height="8" rx="4" fill="#2F3640"/></svg>`;
}
// cofre (porta com segredo redondo, puxador e dobradiças)
function cofre(w=200){
  const marcas=[...Array(12)].map((_,i)=>{const a=i*Math.PI/6, r1=25, r2=30;
    return `<line x1="${(100+r1*Math.cos(a)).toFixed(1)}" y1="${(88+r1*Math.sin(a)).toFixed(1)}" x2="${(100+r2*Math.cos(a)).toFixed(1)}" y2="${(88+r2*Math.sin(a)).toFixed(1)}"/>`}).join('');
  return `<svg viewBox="0 0 200 200" width="${w}" height="${w}">
    <rect x="26" y="176" width="26" height="14" rx="4" fill="#2F3640"/><rect x="148" y="176" width="26" height="14" rx="4" fill="#2F3640"/>
    <rect x="8" y="8" width="184" height="172" rx="18" fill="#4F5861"/>
    <rect x="24" y="24" width="152" height="140" rx="10" fill="#5E6670" stroke="#3F4750" stroke-width="3"/>
    <rect x="14" y="46" width="12" height="26" rx="4" fill="#2F3640"/><rect x="14" y="118" width="12" height="26" rx="4" fill="#2F3640"/>
    <circle cx="100" cy="88" r="36" fill="#E3E8EC" stroke="#3F4750" stroke-width="4"/>
    <g stroke="#7E8994" stroke-width="2.5" stroke-linecap="round">${marcas}</g>
    <circle cx="100" cy="88" r="12" fill="#9AA3AD"/><rect x="97" y="62" width="6" height="16" rx="3" fill="#4F5861"/>
    <rect x="72" y="136" width="56" height="12" rx="6" fill="#C9D1D8"/></svg>`;
}
// banco (prédio genérico com frontão e colunas)
function banco(w=220){
  return `<svg viewBox="0 0 220 190" width="${w}" height="${w*190/220}">
    <polygon points="110,6 212,58 8,58" fill="#5E6670"/><circle cx="110" cy="38" r="10" fill="#D7DEE4"/>
    <rect x="12" y="56" width="196" height="12" rx="3" fill="#4F5861"/>
    ${[0,1,2,3,4].map(i=>`<rect x="${24+i*38}" y="72" width="20" height="86" rx="3" fill="#D7DEE4"/>`).join('')}
    <rect x="8" y="158" width="204" height="12" rx="3" fill="#9AA3AD"/><rect x="0" y="170" width="220" height="16" rx="4" fill="#7E8994"/></svg>`;
}
// carroça de carroceiro (caixa com sucata, roda e varais)
function carroca(w=220){
  return `<svg viewBox="0 0 240 150" width="${w}" height="${w*150/240}" style="overflow:visible">
    <line x1="168" y1="74" x2="236" y2="44" stroke="#5B4632" stroke-width="7" stroke-linecap="round"/>
    <polygon points="34,52 62,26 98,34 112,52" fill="#8C5A3C"/><polygon points="92,52 112,20 150,30 160,52" fill="#6F7983"/>
    <rect x="56" y="26" width="92" height="12" rx="6" transform="rotate(-10 102 32)" fill="#9AA3AD"/>
    <rect x="18" y="50" width="156" height="50" rx="5" fill="#A0694A"/>
    <g stroke="#8A5A3C" stroke-width="2.5">${[64,74,84].map(y=>`<line x1="22" y1="${y}" x2="170" y2="${y}"/>`).join('')}</g>

  const sSup=seta(g,'M302 268 L478 268'), sSan=seta(g,'M478 348 L302 348','var(--a)');
  const sCof=seta(g,'M1100 448 C 1100 640, 210 650, 186 476','var(--a)');
  const fSup=ficha(g,'banknote',24);
  const rSup=el('<div class="ab" style="left:316px;top:208px;width:150px;text-align:center"><span class="tag v" style="font-size:17px;padding:6px 14px">suprimento</span></div>',g);
  const rSaq=el(`<div class="ab row" style="left:306px;top:282px;width:170px;justify-content:center;gap:6px">
      <span class="lbl" style="font-size:15px">no sistema:</span><span style="font-weight:800;font-size:17px;color:var(--ve)">Saque</span></div>`,g);
  const rSan=el('<div class="ab" style="left:316px;top:364px;width:150px;text-align:center"><span class="tag a" style="font-size:17px;padding:6px 14px">Sangria</span></div>',g);
  // nos dois casos: o dinheiro só muda de lugar; a tarifa é despesa
  const selo=el(`<div class="card" style="left:500px;top:636px;width:280px;height:88px;padding:0 18px;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:2px">
      <div class="s1" style="font-weight:800;font-size:20px">não é receita</div><div class="s2" style="font-weight:800;font-size:20px">nem despesa</div></div>`,g);
  const tar=el(`<div class="ab" style="left:0;top:0"><div class="row" style="gap:8px">
      <div style="width:40px;height:40px;border-radius:50%;background:#C9A44C;border:3px solid #A8862F;display:flex;align-items:center;justify-content:center;
        color:#fff;font-weight:800;font-size:18px">$</div><span style="font-weight:700;font-size:17px;color:#374151">tarifa</span></div></div>`,g);
  const desp=el('<div class="ab" style="left:40px;top:600px"><span class="tag r" style="font-size:17px;padding:6px 14px">despesa</span></div>',g);

  return t=>{
    const t0=W(0,'lembra'), tma=W(0,'marcos'), tqu=W(0,'queria'), tab=W(0,'abriu'), tfa=W(0,'faltam'), tbc=W(0,'banco');
    const tga=W(1,'gaveta'), tsu=W(1,'suprimento'), tsq=W(1,'saque');
    const tsg=W(2,'sangria'), tco=W(2,'contrario'), tcx=W(2,'caixa'), tcf=W(2,'cofre');
    const tre=W(3,'receita'), tde=W(3,'despesa',1), tlu=W(3,'lugar'), tta=W(3,'tarifa'), td2=W(3,'despesa',2);
    tituloCena(tit,t,t0,tma-.55);
    // o caixa do Marcos: abriu com menos do que queria
    vis(gav,t,tma-.15,1e9,{dy:18,sc:.95}); vis(gav.querySelector('.g9q'),t,tqu-.1,1e9,{dy:6}); vis(gav.querySelector('.g9a'),t,tab-.15,1e9,{dy:6});
    vis(gav.querySelector('.g9f'),t,tfa-.15,1e9,{dy:6,sc:.9});
    vis(ban,t,tbc-.3,1e9,{dx:-20,dy:0});
    // suprimento: pôr dinheiro na gaveta; vindo do banco, no sistema é um Saque
    sSup.draw(t,tga-.25,.6); viagem(fSup,t,tga+.1,.9,318,244,420,244);
    vis(rSup,t,tsu-.15,1e9,{dy:8,sc:.9}); vis(rSaq,t,tsq-.3,1e9,{dy:6});
    // sangria: o caminho contrário, de um caixa ou do cofre para o banco
    vis(rSan,t,tsg-.1,1e9,{dy:8,sc:.9}); sSan.draw(t,tco-.1,.6); pulse(gav,t,tcx,.03,.6);
    vis(cof,t,tcf-.3,1e9,{dx:20,dy:0}); sCof.draw(t,tcf+.05,1.1);
    // não é receita nem despesa; só a tarifa é despesa de verdade
    vis(selo,t,tre-.15,1e9,{dy:12}); vis(selo.querySelector('.s1'),t,tre-.15,1e9,{dy:4}); vis(selo.querySelector('.s2'),t,tde-.15,1e9,{dy:4});
    pulse(selo,t,tlu-.1,.04,.7);
    viagem(tar,t,tta-.2,.8,96,470,58,540,0); vis(desp,t,td2-.15,1e9,{dy:8,sc:.9});
  };
};

// ------------------------------------------------------------------ CAPS[10] · Esperado × contado
// fala 6 "Agora vem a conferência. De um lado, o que o sistema espera. Do outro, o que você conta na gaveta."  7 "Se os dois
// batem, o caixa fecha sem diferença. Se não batem, a diferença fica registrada, pra mais ou pra menos."
// (no app: "Valor esperado pelo sistema: R$ X"; a pilha "contada" não tem número: a versão que não bate não inventa valor)
CAPS[10]=()=>{
  const ESPERADO=1007.10;                                   // R$ (MUNDO: o #85 fecha sem diferença com R$ 1.007,10)
  const g=grupo();
  const tit=titulo(g,'Fechamento','Esperado × contado');
  const H=202;                                              // altura da pilha cheia
  const lado=(x,chip,cls)=>el(`<div class="ab" style="left:${x}px;top:196px;width:300px;display:flex;flex-direction:column;align-items:center">
      <div class="ch"><span class="tag ${cls}" style="font-size:18px;padding:7px 16px">${chip}</span></div>
      <div class="pl" style="position:relative;margin-top:22px;width:220px;height:${H}px">
        <div class="fant" style="position:absolute;left:0;right:0;bottom:0;height:${H}px;border:2px dashed var(--a);border-radius:6px;opacity:0"></div>
        <div class="corte" style="position:absolute;left:0;right:0;bottom:0;height:${H}px;overflow:hidden">${pilhaNotas(220)}</div></div>
      <div style="width:250px;height:4px;border-radius:2px;background:#DDE2E7"></div></div>`,g);
  const E=lado(170,'esperado','n'), C=lado(810,'contado','n');
  const valE=el(`<div class="ab" style="left:170px;top:476px;width:300px;text-align:center">
      <div class="num" style="font-size:36px">${brl(ESPERADO)}</div><div class="lbl" style="margin-top:2px">pelo sistema</div></div>`,g);
  const mao=el(`<div class="ab" style="left:810px;top:476px;width:300px;display:flex;flex-direction:column;align-items:center">
      <div class="ico" style="width:52px;height:52px;border-radius:50%">${ic('hand-coins',28)}</div><div class="lbl" style="margin-top:6px">na gaveta</div></div>`,g);
  // o meio: igual (bate) ou diferente (não bate)
  const ind=el(`<div class="ab" style="left:592px;top:296px;width:96px;height:96px">
      <div class="iv" style="position:absolute;inset:0;border-radius:50%;background:var(--vc);border:3px solid var(--v);display:flex;align-items:center;
        justify-content:center;color:var(--ve)">${ic('equal',46)}</div>
      <div class="ia" style="position:absolute;inset:0;border-radius:50%;background:var(--ac);border:3px solid var(--a);display:flex;align-items:center;
        justify-content:center;color:var(--ae);opacity:0">${ic('equal-not',46)}</div></div>`,g);
  const ok=el(`<div class="ab" style="left:0;top:590px;width:1280px;text-align:center"><span class="tag v" style="font-size:20px;padding:9px 20px">
      ${ic('circle-check',22)}sem diferença</span></div>`,g);
  const dif=el(`<div class="ab row" style="left:0;top:590px;width:1280px;justify-content:center;gap:12px">
      <span class="d1 tag a" style="font-size:20px;padding:9px 20px">diferença</span>
      <span class="d2 tag n" style="font-size:18px;padding:8px 16px">${ic('clipboard-check',20)}registrada</span>
      <span class="d3 tag n" style="font-size:18px;padding:8px 16px">+ ou −</span></div>`,g);
  const corteC=C.querySelector('.corte'), fant=C.querySelector('.fant');

  return t=>{
    const t0=W(6,'agora'), tla=W(6,'lado'), tes=W(6,'espera'), tou=W(6,'outro'), tct=W(6,'conta'), tga=W(6,'gaveta');
    const tb1=W(7,'batem',1), tsd=W(7,'diferenca',1), tna=W(7,'nao'), td2=W(7,'diferenca',2), trg=W(7,'registrada'), tma=W(7,'mais');
    tituloCena(tit,t,t0,tla-.6);
    // de um lado, o que o sistema espera
    vis(E,t,tla-.15,1e9,{dy:18,sc:.96}); vis(E.querySelector('.ch'),t,tes-.25,1e9,{dy:6,sc:.9}); vis(valE,t,tes-.1,1e9,{dy:8});
    // do outro, o que você conta na gaveta: a pilha cresce enquanto conta
    vis(C,t,tou-.15,1e9,{dy:18,sc:.96}); vis(mao,t,tou,1e9,{dy:8});
    const cresce=eio(pr(t,tct-.1,Math.max(1,tga-tct+.4)));
    // se não batem: a pilha contada fica menor e o pedaço que falta aparece tracejado
    const enc=eio(pr(t,tna-.05,.7));
    corteC.style.height=(H*cresce*(1-.28*enc)).toFixed(1)+'px';
    vis(C.querySelector('.ch'),t,tga-.3,1e9,{dy:6,sc:.9});
    fant.style.opacity=(eo(pr(t,td2-.2,.5))*.9).toFixed(3);
    // o meio: bate (igual, verde) e depois a versão que não bate (diferente, âmbar)
    vis(ind,t,tb1-.2,1e9,{sc:.7,dy:0}); const tr=eo(pr(t,tna-.05,.5));
    ind.querySelector('.ia').style.opacity=tr.toFixed(3); ind.querySelector('.iv').style.opacity=(1-tr).toFixed(3);
    vis(ok,t,tsd-.2,tna-.05,{dy:8}); vis(dif.querySelector('.d1'),t,td2-.2,1e9,{dy:8,sc:.9});
    vis(dif.querySelector('.d2'),t,trg-.2,1e9,{dy:8,sc:.9}); vis(dif.querySelector('.d3'),t,tma-.2,1e9,{dy:8,sc:.9});
  };
};

// ------------------------------------------------------------------ API para o renderizador
let RENDER=null;
window.setup=d=>{D=d;ST.innerHTML='';RENDER=CAPS[d.cap]();return true};
window.R=t=>{RENDER(t);return true};
</script></body></html>
